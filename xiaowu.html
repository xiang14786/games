.btn small{display:block;font-weight:400;font-size:12px;opacity:.8}

.cgb{height:110px;border-radius:12px;border:1px solid #ff9ec866;background-size:cover;background-position:center;background-color:#2a1024;color:#fff;display:flex;align-items:flex-end;padding:6px;font-size:12.5px;text-shadow:0 1px 4px #000}
.cgview{width:100%;aspect-ratio:9/16;max-height:70vh;background-size:contain;background-repeat:no-repeat;background-position:center;background-color:#000;border-radius:12px}

@keyframes fadein{from{opacity:0}}
.endc .ek{letter-spacing:8px;color:#ff9ec8;font-size:14px}.endc.true .ek{color:#ffd257}.endc.sad .ek{color:#8ab0ff}
.endc h1{font-family:'LXGW WenKai TC',serif;font-size:32px;letter-spacing:6px;margin:10px 0 16px;text-shadow:0 0 24px rgba(255,140,190,.6)}
.endc p{font-size:16px;line-height:1.9;max-width:380px;color:#f0e0ea}
.endc .ecount{font-size:13px;color:#c8a8ba;margin:14px 0 6px}.endc .btn{max-width:260px}
#title{position:fixed;inset:0;z-index:20;overflow:hidden}
.tbg{position:absolute;inset:-3%;background:url(assets/douluo/bg/starCore.webp) center/cover;filter:brightness(.55) saturate(1.2);animation:drift 26s ease-in-out infinite alternate}
.tbg::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,transparent,rgba(10,2,14,.85) 75%)}
.tfx{position:absolute;inset:0;pointer-events:none}
.tfx i{position:absolute;top:-5%;width:12px;height:9px;border-radius:12px 0;background:linear-gradient(135deg,#ffe0ec,#ff8ab8);opacity:.8;animation:fall linear infinite;--x:60px}
.tin{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;max-width:420px;margin:0 auto;text-align:center}
.tsub{letter-spacing:6px;color:#ffb8d6;font-size:14px}
#title h1{font-family:'LXGW WenKai TC',serif;font-size:52px;letter-spacing:10px;margin:6px 0 10px;color:#fff;text-shadow:0 0 20px #ff6aa8,0 0 50px #ff3a8a}
.tline{font-family:'LXGW WenKai TC',serif;color:#ffe0ee;line-height:1.9;font-size:16px;margin-bottom:26px}
.tbtn{width:100%}

<body>
<div id="game" class="hide"><div id="stage"><div class="bg" id="bgA"></div><div class="bg" id="bgB"></div><div id="chars"></div><div class="cg" id="cg"></div><div id="fx"></div></div>
<div class="tools"><button id="bLog">紀錄</button><button id="bAuto">自動</button><button id="bSkip">快進</button><button id="bHide">隱藏</button><button id="bMenu">選單</button></div>

<script>'use strict';
// ======================================================================
//  劇本（依原著情節改寫，文字為原創）  第一～三章
// ======================================================================
const CHAP = [
  { id: 'c1', t: '第一章', sub: '月光下的兔子', base: {} },
  { id: 'c2', t: '第二章', sub: '七舍的老大', base: { kin: 2, courage: 1 } },
  { id: 'c3', t: '第三章', sub: '只收怪物的學院', base: { kin: 2, courage: 1, bond: 15 } },
  { id: 'c4', t: '第四章', sub: '回家的路', base: { kin: 2, courage: 2, bond: 25, team: 2 } },
  { id: 'c5', t: '第五章', sub: '月下之約', base: { kin: 3, courage: 2, bond: 35, team: 3 } },
  { id: 'c6', t: '第六章', sub: '武魂城', base: { kin: 3, courage: 3, bond: 45, team: 4, secret: 2 } },
  { id: 'c7', t: '第七章', sub: '十萬年的獻祭', base: { kin: 3, courage: 3, bond: 55, team: 4, secret: 2 } },
  { id: 'c8', t: '第八章', sub: '香囊裡的守候', base: { kin: 3, courage: 3, bond: 60, team: 4 } },
  { id: 'c9', t: '第九章', sub: '海神歸來', base: { kin: 4, courage: 3, bond: 70, team: 4 } },
  { id: 'c10', t: '終章', sub: '結髮', base: { kin: 4, courage: 3, bond: 80, team: 5 } },
];
const SCRIPT = {};

SCRIPT.c1 = `
@title 第一章|月光下的兔子
@bg starCore
@fx firefly
星斗大森林的最深處，終年不見人跡。
參天古樹把天空切成碎片，月光從縫隙裡漏下來，落在一片柔軟的草地上。
草地中央，有一隻雪白的兔子。
（我又夢見娘親了。）
（夢裡她的毛和我一樣白，耳朵比我還長。她總是用鼻子蹭我的額頭，說我是她最驕傲的孩子。）
（然後，夢的最後，總是一片紫金色的光。）
@fx flash
@fx shake
（一個穿著紫金長袍的女人，站在娘親倒下的地方。她的眼睛冷得像冬天的湖。）
（娘親的十萬年修為，化成一道光環，落在了她的手上。）
@fx off
@fx firefly
我猛地驚醒。四周很安靜，只有遠處溪水的聲音。
@show dm c
大明：小舞，又作惡夢了？
低沉的聲音從頭頂傳來。一隻比古樹還高的巨猿，小心翼翼地把手掌放在我身邊，像怕把我壓碎似的。
他是大明，泰坦巨猿，星斗大森林的守護者之一。
@show em r
二明：嘶……大哥，你嗓門那麼大，會把她吵得更睡不著。
另一個聲音從樹後蜿蜒而出。一條青色的巨蟒，鱗片在月光下像寶石一樣閃。那是二明，天青牛蟒。
自從娘親不在了，就是他們兩個把我養大的。
?小舞要怎麼回應他們呢？
- 撲進大明的手掌裡撒嬌 => c1a | @set kin +1
- 「我沒事，我只是……又想起娘親了。」 => c1b | @set kin +1
- 「我決定了。我要去人類的世界。」 => c1c | @set courage +1
#c1a
xw：大明哥哥——！
我一頭鑽進他毛茸茸的掌心，蹭了又蹭。
大明：哈哈，好好好，都十萬歲了還像個小娃娃。
二明：她在我們眼裡，永遠都是小娃娃。
（是啊。在這片森林裡，我可以永遠當一個被寵著的孩子。）
（可是……）
@goto c1d
#c1b
xw：我沒事。我只是又想起娘親了。
二明的大頭垂了下來，輕輕貼著我的背。冰涼的鱗片，卻讓人覺得好溫暖。
二明：你娘親最大的心願，就是你能平平安安地活下去。
大明：誰敢動你，我就把他捏成粉。
（我知道他們做得到。可是我也知道，他們不可能永遠守在我身邊。）
@goto c1d
#c1c
xw：大明、二明，我決定了。我要去人類的世界。
四周一下子安靜下來，連蟲鳴都停了。
大明：……你說什麼？
xw：我已經修煉到十萬年了。再這樣下去，天劫遲早會來；或者，那些人類總有一天會找到這裡。
xw：可是只要我化成人形，重新從人類魂師開始修煉，就能避開天劫，也沒有人會認出我。
@goto c1d
#c1d
@show em r
二明：……你真的想清楚了？
二明的聲音很輕。他們都知道，我遲早會提起這件事。
二明：十萬年魂獸化形，等於把一身修為全部重來。你會變得很弱，弱到一個普通的人類魂師都能傷到你。
大明：人類很狡猾。殺了你娘親的，也是人類。
（我知道。我比誰都清楚。）
（可是娘親以前常說，人類的世界裡有好多我們沒見過的東西。會唱歌的燈，甜得像蜜的糖，還有……一種叫做「朋友」的東西。）
?小舞握緊了小小的爪子。
- 「我想親眼看看娘親說過的世界。」 => c1e | @set courage +1
- 「我不想一輩子躲在這裡，等著別人來獵殺我。」 => c1e | @set courage +1
- 「等我變強了，我會回來保護你們。」 => c1e | @set kin +1
#c1e
大明沉默了很久很久，久到月亮都往西邊移了一點。
最後，他抬起手，用指尖從自己的胸口拔下一撮金色的毛。
@show dm c
大明：拿著。
二明也低下頭，從頸邊咬下一片最亮的青色鱗片，輕輕放在我面前。
二明：這片鱗片裡有我的一縷魂力。如果有一天，你遇到真正過不去的難關……
大明：就捏碎它。不管你在大陸的哪個角落，我們都會趕過去。
?看著那片鱗片和那撮金毛……
- 「嗯！我答應你們，真的撐不住的時候，一定會叫你們。」 => c1f | @set kin +1 | @set $token 1
- 「我收下。但我不會讓你們為我冒險的。」 => c1g | @set courage +1

  logArr.push({ n: name, t: text, k: kind }); if (logArr.length > 300) logArr.shift();
  const el = $('tx'); const full = text;
  if (typing) clearInterval(typing);
  const readKey = S.ch + ':' + S.i, wasRead = (P.read[S.ch] || -1) >= S.i;
  if (skip && !wasRead && !P.skipAll) { skip = false; updBtns(); }
  if (skip || P.speed >= 3) { el.innerHTML = full; typing = null; return afterType(); }
  let n = 0; el.innerHTML = '';
  const chars = [...full]; const step = P.speed === 2 ? 2 : 1;
  typing = setInterval(() => { n += step; el.innerHTML = chars.slice(0, n).join('') + `<span class="ghost">${chars.slice(n).join('')}</span>`; if (n >= chars.length) { clearInterval(typing); typing = null; afterType(); } }, 32);
}
let autoT = null;
function afterType() {
  $('box').classList.add('done');
  clearTimeout(autoT);
  if (skip) autoT = setTimeout(next, 60);
  else if (auto) autoT = setTimeout(next, 1100 + $('tx').textContent.length * 55);
}
function finishType() { if (!typing) return false; clearInterval(typing); typing = null; const el = $('tx'); el.innerHTML = el.textContent; afterType(); return true; }

// ---------------- 劇本執行 ----------------
function lines() { return SCRIPT[S.ch]; }
function findLabel(lb) {
  let ch = S.ch, l = lb; if (lb.includes(':')) [ch, l] = lb.split(':');
  const i = SCRIPT[ch].findIndex(x => x.trim() === '#' + l); if (i < 0) throw new Error('找不到標籤 ' + lb);
  return [ch, i];
}
function jump(lb) { const [ch, i] = findLabel(lb); S.ch = ch; S.i = i; }
function evalCond(c) {
  const f = new Function('v', 'f', 'return (' + c.replace(/\b(bond|courage|kin|secret|team)\b/g, 'v.$1').replace(/\$(\w+)/g, 'f.$1') + ');');
  return !!f(S.v, S.f);
}
function doSet(expr) {
  // @set bond +5 / @set $flag 1
  const [k, v] = expr.trim().split(/\s+/);
  if (k[0] === '$') { S.f[k.slice(1)] = v === undefined ? 1 : +v; return; }
  if (!VARS.includes(k)) return;
  const old = S.v[k];
  if (v[0] === '+' || v[0] === '-') S.v[k] += +v; else S.v[k] = +v;
  if (k === 'bond' && S.v[k] > old && !skip) heart('♥ 和唐三更親近了');
  if (k === 'kin' && S.v[k] > old && !skip) heart('🌲 森林的羈絆');
  if (k === 'courage' && S.v[k] > old && !skip) heart('✦ 勇氣');
}
function next() {
  if (busy) return;
  clearTimeout(autoT);
  if (finishType()) return;
  for (let guard = 0; guard < 400; guard++) {
    const L = lines(); if (S.i >= L.length) { const idx = CHAP.findIndex(c => c.id === S.ch); if (idx + 1 < CHAP.length) { S.ch = CHAP[idx + 1].id; S.i = 0; continue; } return; }
    const raw = L[S.i]; const line = raw.trim();
    P.read[S.ch] = Math.max(P.read[S.ch] ?? -1, S.i);
    S.i++;
    if (!line || line[0] === '#' || line.startsWith('//')) continue;
    if (line[0] === '@') { const r = cmd(line); if (r === 'stop') return; continue; }
    if (line[0] === '?') { choice(line.slice(1).trim()); return; }
    // 對白
    const m = line.match(/^([^\s：（]{1,4})：(.*)$/);
    const sk = m && (CH[m[1]] ? m[1] : Object.keys(CH).find(k => CH[k].n === m[1]));
    if (sk) { renderChars(sk); say(CH[sk].n, m[2], 'talk', sk); }
    else if (line[0] === '（') { renderChars('xw'); say('小舞', line, 'inner', 'xw'); }
    else { renderChars(null); say('', line, 'narr'); }
    if (P.seen % 15 === 0) saveSlot(0);
    P.seen++; if (P.seen % 10 === 0) saveP();
    return;
  }
}
function cmd(line) {
  const [c, ...rest] = line.slice(1).split(/\s+/); const arg = rest.join(' ');
  switch (c) {
    case 'bg': setBg(rest[0]); break;
    case 'show': S.show[rest[1] || 'c'] = rest[0]; renderChars(); break;
    case 'hide': if (rest[0] === 'all') { S.show = {}; S.face = {}; } else for (const p in S.show) if (S.show[p] === rest[0]) delete S.show[p]; renderChars(); break;
    case 'face': { S.face = S.face || {}; const k = rest[0]; if (rest[1] && rest[1] !== 'off') S.face[k] = rest[1]; else delete S.face[k];
      if (!Object.values(S.show).includes(k)) { if (rest[2]) S.show[rest[2]] = k; else if (!S.show.c) S.show.c = k; else if (!S.show.l && !S.show.r) { S.show.r = S.show.c; delete S.show.c; S.show.l = k; } else S.show[S.show.l ? 'r' : 'l'] = k; }
      renderChars(); break; }
    case 'form': S.form = S.form || {}; if (rest[1] && rest[1] !== 'off') S.form[rest[0]] = rest[1]; else delete S.form[rest[0]]; renderChars(); break;
    case 'cg': showCG(rest[0], rest.slice(1).join(' ')); break;
    case 'cgoff': hideCG(); break;
    case 'fx': fx(rest[0]); break;
    case 'set': doSet(arg); break;
    case 'goto': jump(rest[0]); break;
    case 'next': S.ch = rest[0]; S.i = 0; break;
    case 'if': { const lb = rest.pop(); if (evalCond(rest.join(' '))) jump(lb); break; }
    case 'title': titleCard(arg); return 'stop';
    case 'end': ending(rest[0]); return 'stop';
    case 'wait': busy = true; setTimeout(() => { busy = false; next(); }, +rest[0] || 800); return 'stop';
  }
}
function titleCard(arg) {
  const [a, b] = arg.split('|'); P.chap[S.ch] = 1; saveP(); saveSlot(0);
  hideCG(); fx('off'); S.show = {}; renderChars();
  const d = $('card'); d.innerHTML = `<b>${a}</b><span>${b || ''}</span>`; d.className = 'card on'; busy = true;
  $('box').classList.add('hide');
  setTimeout(() => { d.className = 'card'; busy = false; $('box').classList.remove('hide'); next(); }, skip ? 300 : 2600);
}
function choice(prompt) {
  const L = lines(), opts = [];
  while (S.i < L.length && L[S.i].trim().startsWith('- ')) { opts.push(L[S.i].trim().slice(2)); S.i++; }
  if (skip) { skip = false; updBtns(); }
  clearTimeout(autoT);
  saveSlot(0);
  const box = $('choices');
  if (prompt) say('', prompt, 'narr');
  box.innerHTML = opts.map((o, k) => {
    const [txt, rest = ''] = o.split('=>');
    const cond = (rest.match(/\[(.*?)\]/) || [])[1];
    if (cond && !evalCond(cond)) return '';
    return `<button data-o="${k}">${txt.trim()}</button>`;
  }).join('');
  box.classList.add('on');
  box.querySelectorAll('[data-o]').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const [txt, rest = ''] = opts[+b.dataset.o].split('=>');
    box.classList.remove('on'); box.innerHTML = '';
    logArr.push({ n: '▶', t: txt.trim(), k: 'pick' });
    const parts = rest.replace(/\[.*?\]/, '').split('|').map(x => x.trim()).filter(Boolean);
    let lb = null;
    for (const p of parts) { if (p.startsWith('@set')) doSet(p.slice(4)); else lb = p; }
    if (lb) jump(lb);
    next();
  });
}
function ending(k) {
  const E = ENDS[k]; P.end[k] = Date.now(); saveP(); localStorage.removeItem('xw_save_0');
  hideCG(); S.show = {}; renderChars(); auto = false; skip = false; updBtns();
  $('box').classList.add('hide');
  const d = $('endc'); d.className = 'endc on ' + (E.kind || '');
  d.innerHTML = `<div class="ek">${E.kind === 'true' ? '真結局' : E.kind === 'sad' ? '悲傷結局' : E.kind === 'bad' ? '壞結局' : '結局'}</div><h1>${E.n}</h1><p>${E.d}</p><div class="ecount">已收集結局 ${Object.keys(P.end).length} / ${Object.keys(ENDS).length}</div><button class="btn" id="eBack">回到標題</button>`;
  $('eBack').onclick = () => { d.className = 'endc'; title(); };
}

// ---------------- 選單 ----------------
function updBtns() { $('bAuto').classList.toggle('on', auto); $('bSkip').classList.toggle('on', skip); }
function modal(h) { const o = document.createElement('div'); o.className = 'ov'; o.innerHTML = `<div class="panel">${h}</div>`; o.onclick = e => { if (e.target === o) o.remove(); }; document.body.appendChild(o); return o; }
const fmtT = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
function slotsUI(mode) {
  const o = modal(`<h2>${mode === 'save' ? '存檔' : '讀檔'}</h2><div class="slots">${[0, 1, 2, 3].map(n => { const s = loadSlot(n); if (n === 0 && mode === 'save') return ''; return `<button class="slot" data-s="${n}" ${!s && mode === 'load' ? 'disabled' : ''}><b>${n === 0 ? '自動存檔' : '存檔 ' + n}</b><small>${s ? `${chapOf(s.ch).t}・${fmtT(s.t)}` : '空'}</small></button>`; }).join('')}</div><button class="btn ghost" id="sX">關閉</button>`);
  $('sX').onclick = () => o.remove();
  o.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { const n = +b.dataset.s; if (mode === 'save') { saveSlot(n); toast('已存檔'); o.remove(); } else { const s = loadSlot(n); if (s) { o.remove(); resume(s); } } });
}
function logUI() {
  const o = modal(`<h2>對話紀錄</h2><div class="log">${logArr.slice(-120).map(l => `<p class="${l.k || ''}">${l.n ? `<b>${l.n}</b>` : ''}${l.t}</p>`).join('')}</div><button class="btn ghost" id="lX">關閉</button>`);
  $('lX').onclick = () => o.remove(); const lg = o.querySelector('.log'); lg.scrollTop = lg.scrollHeight;
}
function menuUI() {
  const o = modal(`<h2>選單</h2><div class="mgrid"><button class="btn" data-m="save">存檔</button><button class="btn" data-m="load">讀檔</button><button class="btn" data-m="log">對話紀錄</button><button class="btn" data-m="speed">文字速度：${['', '一般', '快', '瞬間'][P.speed]}</button><button class="btn" data-m="skipall">快進：${P.skipAll ? '全部' : '只跳已讀'}</button><button class="btn ghost" data-m="title">回到標題</button></div><button class="btn ghost" id="mX">繼續故事</button>`);
  $('mX').onclick = () => o.remove();
  o.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    const m = b.dataset.m; if (m === 'save' || m === 'load') { o.remove(); slotsUI(m); } else if (m === 'log') { o.remove(); logUI(); }
    else if (m === 'speed') { P.speed = P.speed % 3 + 1; saveP(); o.remove(); menuUI(); }
    else if (m === 'skipall') { P.skipAll = !P.skipAll; saveP(); o.remove(); menuUI(); }
    else if (m === 'title') { saveSlot(0); o.remove(); title(); }
  });
}

// ---------------- 標題 ----------------
function title() {
  auto = skip = false; updBtns(); clearTimeout(autoT); if (typing) clearInterval(typing);
  $('game').classList.add('hide'); const t = $('title'); t.classList.remove('hide');
  const cont = loadSlot(0), ne = Object.keys(P.end).length;
  t.innerHTML = `<div class="tbg"></div><div class="tfx" id="tfx"></div><div class="tin"><div class="tsub">斗羅大陸・小舞篇</div><h1>舞・十萬年</h1><div class="tline">我是一隻兔子。<br>我用十萬年，等到了一個人。</div>
  <div class="tbtn">${cont ? `<button class="btn" id="tC">繼續故事<small>${chapOf(cont.ch).t}</small></button>` : ''}<button class="btn ${cont ? 'ghost' : ''}" id="tN">新的故事</button><button class="btn ghost" id="tL">讀取存檔</button><button class="btn ghost" id="tCh">章節回顧</button><button class="btn ghost" id="tE">結局與回憶（${ne}/${Object.keys(ENDS).length}）</button></div></div>`;
  const tf = $('tfx'); for (let i = 0; i < 24; i++) { const p = document.createElement('i'); p.style.left = Math.random() * 100 + '%'; p.style.animationDelay = (-Math.random() * 10) + 's'; p.style.animationDuration = (7 + Math.random() * 6) + 's'; tf.appendChild(p); }
  if ($('tC')) $('tC').onclick = () => resume(cont);
  $('tN').onclick = () => { if (cont && !confirm('開始新的故事？自動存檔會被覆蓋（手動存檔不受影響）')) return; start(newState()); };
  $('tL').onclick = () => slotsUI('load');
  $('tCh').onclick = () => {
    const o = modal(`<h2>章節回顧</h2><div class="slots">${CHAP.map((c, i) => `<button class="slot" data-c="${c.id}" ${P.chap[c.id] || i === 0 ? '' : 'disabled'}><b>${c.t}</b><small>${P.chap[c.id] || i === 0 ? c.sub : '？？？'}</small></button>`).join('')}</div><p class="note">從章節開頭重看時，心意數值會用「一般」的狀態開始。</p><button class="btn ghost" id="cX">關閉</button>`);
    $('cX').onclick = () => o.remove();
    o.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { o.remove(); const s = newState(b.dataset.c); Object.assign(s.v, chapOf(b.dataset.c).base || {}); start(s); });
  };
  $('tE').onclick = () => {
    const cgs = Object.entries(P.cg);
    const o = modal(`<h2>結局</h2><div class="ends">${Object.entries(ENDS).map(([k, E]) => `<div class="endi ${P.end[k] ? 'got ' + (E.kind || '') : ''}"><b>${P.end[k] ? E.n : '？？？'}</b><small>${P.end[k] ? E.d.replace(/<br>/g, ' ').slice(0, 46) + '…' : E.hint}</small></div>`).join('')}</div><h2 style="margin-top:14px">回憶畫面</h2><div class="cgs">${cgs.length ? cgs.map(([k, t]) => `<button class="cgb" data-cg="${k}" style="background-image:url(${CGD + k}.webp)"><span>${t}</span></button>`).join('') : '<p class="note">劇情中的重要畫面會收集在這裡。</p>'}</div><button class="btn ghost" id="eX">關閉</button>`);
    $('eX').onclick = () => o.remove();
    o.querySelectorAll('[data-cg]').forEach(b => b.onclick = () => { const v = modal(`<div class="cgview" style="background-image:url(${CGD + b.dataset.cg}.webp)"></div><p>${P.cg[b.dataset.cg]}</p>`); v.onclick = () => v.remove(); });
  };
}
function start(s) {
  S = s; logArr = []; $('title').classList.add('hide'); $('game').classList.remove('hide');
  $('chars').innerHTML = ''; hideCG(); fx('off'); $('choices').classList.remove('on');
  $('bgA').classList.remove('on'); $('bgB').classList.remove('on');
  if (S.bg) setBg(S.bg, true);
  next();
}
function resume(s) {
  // 回到存檔那一行（往回找上一句可顯示的台詞重新播放）
  S = s; logArr = []; $('title').classList.add('hide'); $('game').classList.remove('hide');
  $('chars').innerHTML = ''; fx('off'); $('choices').classList.remove('on'); $('bgA').classList.remove('on'); $('bgB').classList.remove('on');
  if (S.bg) setBg(S.bg, true);
  if (S.cg) showCG(S.cg.k, S.cg.title); else hideCG();
  renderChars();
  // 往回退到最近一句台詞或選項
  const L = lines(); let i = Math.max(0, S.i - 1);
  while (i > 0) { const t = L[i].trim(); if (t && t[0] !== '@' && t[0] !== '#' && !t.startsWith('- ') && !t.startsWith('//')) break; i--; }
  if (L[i] && L[i].trim().startsWith('- ')) { while (i > 0 && !L[i].trim().startsWith('?')) i--; }
  S.i = i; next();
}

// ---------------- 綁定 ----------------
window.addEventListener('load', () => {
  loadP();
  $('stage').onclick = () => { if ($('choices').classList.contains('on')) return; if (skip) { skip = false; updBtns(); return; } next(); };
  $('box').onclick = $('stage').onclick;
  $('bMenu').onclick = e => { e.stopPropagation(); menuUI(); };
  $('bLog').onclick = e => { e.stopPropagation(); logUI(); };
  $('bAuto').onclick = e => { e.stopPropagation(); auto = !auto; skip = false; updBtns(); if (auto && !typing && !$('choices').classList.contains('on')) next(); };
  $('bSkip').onclick = e => { e.stopPropagation(); skip = !skip; auto = false; updBtns(); if (skip && !$('choices').classList.contains('on')) next(); };
  $('bHide').onclick = e => { e.stopPropagation(); $('game').classList.add('nobox'); setTimeout(() => { const f = () => { $('game').classList.remove('nobox'); document.removeEventListener('click', f, true); }; document.addEventListener('click', f, true); }, 50); };
  title();
});
