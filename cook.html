  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  #counterTop { position:relative; z-index:3; height:20px; flex:0 0 auto; background:linear-gradient(180deg,var(--ctr1),var(--ctr2)); box-shadow:0 4px 0 var(--ctr3), 0 8px 12px rgba(0,0,0,.35); }
  /* 廚房 */
  #kitchen { position:relative; flex:1; min-height:0; padding:8px 7px calc(env(safe-area-inset-bottom) + 6px); display:flex; flex-direction:column; gap:7px;
    background:linear-gradient(45deg, rgba(0,0,0,.05) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.05) 75%), linear-gradient(45deg, rgba(0,0,0,.05) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.05) 75%), #ece4d6;
    background-size:36px 36px; background-position:0 0, 18px 18px; }
  .krow { display:flex; gap:7px; min-height:0; }

  .slot .cnt { position:absolute; right:-4px; top:-4px; background:#e8402a; border-radius:10px; padding:0 6px; font-size:13px; font-weight:900; }

  .fryer { background:linear-gradient(180deg,#9aa2ae,#6d7480); box-shadow:0 4px 0 #444; }

  .pot { background:linear-gradient(180deg,#b8c0cc,#7d8592); box-shadow:0 4px 0 #4a4f58; }
  .pot .slot { border-radius:50%; background:radial-gradient(circle,#9fd8ff,#4a9ad0); box-shadow:inset 0 0 0 4px #5a6270; }
  .oven { background:linear-gradient(180deg,#c0644a,#7a3524); box-shadow:0 4px 0 #4a1a10; }
  .oven .slot { border-radius:40% 40% 10px 10px; background:radial-gradient(circle at 50% 70%,#ffb347,#a83a10 70%,#3a1408); }
  .griddle { background:linear-gradient(180deg,#5a5a62,#303036); box-shadow:0 4px 0 #18181c; }
  .griddle .slot { border-radius:50%; background:radial-gradient(circle,#2a2a30,#1a1a1e); box-shadow:inset 0 0 0 3px #555; }
  .steamer { background:linear-gradient(180deg,#c89a5a,#8a6030); box-shadow:0 4px 0 #5a3a18; }
  .src { flex:0 0 auto; width:min(15vw,62px); border-radius:12px; background:linear-gradient(180deg,#fff3d6,#e8c88a); box-shadow:0 4px 0 #a8804a, inset 0 2px 0 #fff; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; font-weight:900; color:#5a3a12; padding:3px 2px; }
  .src img { width:72%; height:auto; aspect-ratio:1; }
  .srcs { display:grid; gap:6px; }
  #plates { flex:1; display:flex; gap:5px; justify-content:space-around; align-items:center; }
  .plate { position:relative; flex:1; max-width:84px; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle,#fff 50%,#e4e8ee 52%,#fff 63%,#cfd5de 66%); box-shadow:0 4px 0 #9aa2ae; display:flex; align-items:center; justify-content:center; }

  .plate .base { width:70%; height:70%; position:relative; }

  .plate .parts { position:absolute; left:-12%; right:-12%; bottom:-10%; display:flex; justify-content:center; }
  .plate .parts img { width:40%; margin:0 -5%; filter:drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .plate.ready { box-shadow:0 4px 0 #9aa2ae, 0 0 0 3px #4cd964, 0 0 14px #4cd964; }
  .disp { background:linear-gradient(180deg,#d6dbe3,#9aa2ae); box-shadow:0 4px 0 #6d7480; flex:1; }
  .disp .lbl { color:#2a3040; text-shadow:none; }
  .disp .slot { background:rgba(0,0,0,.12); max-width:52px; }
  .lockp { filter:grayscale(1) brightness(.85); opacity:.5; }
  .lockt { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:900; color:#222; font-size:12px; text-align:center; text-shadow:0 0 4px #fff; pointer-events:none; }
  #trash { flex:0 0 auto; width:min(13vw,54px); border-radius:14px; background:linear-gradient(180deg,#9aa2ae,#6d7480); box-shadow:0 4px 0 #444; display:flex; align-items:center; justify-content:center; }

  @keyframes shk { 25% { transform:translateX(-5px); } 75% { transform:translateX(5px); } }
  .fly { position:fixed; z-index:50; pointer-events:none; width:46px; height:46px; transition:transform .35s cubic-bezier(.3,.7,.4,1), opacity .35s; }

  #combo { position:absolute; top:36%; left:0; right:0; text-align:center; font-size:28px; font-weight:900; color:#ffd34d; text-shadow:0 3px 0 #7a3b00, 0 0 12px rgba(0,0,0,.4); pointer-events:none; opacity:0; transition:opacity .2s; z-index:8; }

  .card { background:rgba(255,255,255,.08); border:2px solid rgba(255,220,150,.2); border-radius:18px; padding:12px 14px; width:100%; max-width:390px; text-align:left; font-size:14px; line-height:1.75; color:#ffeedd; }

  $('eT').textContent = win ? '🎉 打烊囉！' : '😵 今天生意不太好…';
  $('eStars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
  $('eCoin').innerHTML = `${im('moneybag')}+${G.coins}${G.gems ? `　<span class="gem">💎+${G.gems}</span>` : ''}`;
  const nx = G.R.unlock.find(([l]) => l === G.l + 1), newRest = win && G.l === 10 && G.r + 1 < RESTS.length;
  $('eInfo').innerHTML = `服務 <b>${G.served}</b> 位客人${G.lost ? `，<b style="color:#ff8a80">氣走 ${G.lost} 位</b>` : '，一位都沒氣走！'}${G.burnt ? `<br>燒焦了 ${G.burnt} 份` : ''}<br>目標：⭐ ${g[0]}　⭐⭐ ${g[1]}　⭐⭐⭐ ${g[2]}` +
    (win && nx && G.l < maxL(G.r) ? `<br><b style="color:#9cff7a">下一關新菜色：</b><div class="newdish">${nx[1].map(d => `<div>${dishHTML(G.R, d)}${G.R.dishes[d].n}</div>`).join('')}</div>` : '') +
    (newRest ? `<br><b style="color:#ffe14d">🎊 解鎖新餐廳：${RESTS[G.r + 1].name}！</b>` : '') + (daily ? '<br><b style="color:#7ae0ff">📅 每日挑戰完成！金幣 ×2、💎+3</b>' : '') + (first3 ? '<br><span class="gem">首次三星 💎+1</span>' : '') + achGot.map(a => `<br><b style="color:#ffcf3a">🏆 成就：${a[1]}（💎+${a[4]}）</b>`).join('') + (win ? '' : '<br>升級一下廚房，或做快一點再來挑戰！');
  $('eNext').textContent = win ? (G.l < maxL(G.r) ? '下一關' : '回主選單') : '再挑戰';
  setTimeout(() => show('end'), 500);
}

// ===================== 選單 =====================
function show(id) { ['menu', 'how', 'levels', 'upsOv', 'intro', 'pauseOv', 'end', 'ingOv', 'achOv'].forEach(x => $(x).classList.toggle('hide', x !== id)); $('hud').classList.toggle('hide', id !== null && id !== 'pauseOv'); }
function goMenu() {
  running = false; show('menu'); $('mCoin').innerHTML = `${im('coin')} ${SV.coins}　<span class="gem">💎 ${SV.gems}</span>`;
  const td = new Date().toDateString(); if (!SV.daily || SV.daily.d !== td) { const open = SV.prog.map((p, i) => p ? i : -1).filter(i => i >= 0); const r = open[Math.floor(Math.random() * open.length)]; const top = Math.max(1, Math.min(maxL(r), (SV.prog[r] || 1))); SV.daily = { d: td, r, l: Math.max(1, Math.min(top, Math.round(top * 0.8) + 2)), done: 0 }; persist(); }
  $('mDaily').innerHTML = SV.daily.done ? '📅 今日挑戰已完成 ✓' : `📅 每日挑戰：${RESTS[SV.daily.r].name} 第 ${SV.daily.l} 關<br><small style="font-size:13px">過關金幣 ×2、💎+3</small>`;
  $('mDaily').disabled = !!SV.daily.done;
  $('rests').innerHTML = RESTS.map((R, r) => { const pr = SV.prog[r] || 0, stars = Object.keys(SV.best).filter(k => k.startsWith(r + '-')).reduce((s, k) => s + SV.best[k], 0);
    return `<button class="rest" data-r="${r}" style="background:linear-gradient(135deg,${R.col[0]},${R.col[1]})" ${pr ? '' : 'disabled'}><div class="pics">${R.pics.map(p => im(p)).join('')}</div><div style="margin-left:10px"><b>${R.name}</b><small>${pr ? R.sub : `🔒 上一間餐廳過第 10 關解鎖`}</small></div><div class="pr">${pr ? `${Math.min(pr - 1, maxL(r))}/${maxL(r)}<br>⭐ ${stars}` : ''}</div></button>`; }).join('');
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => openRest(+b.dataset.r));
}
function renderIng(r) {
  const R = RESTS[r]; show('ingOv'); $('ingT').textContent = R.name + '・食材升級'; $('ingCoin').innerHTML = `${im('coin')} ${SV.coins}`;
  const menu = menuAt(R, Math.min(maxL(r), Math.max(1, SV.prog[r] || 1)));
  $('ingList').innerHTML = menu.map(d => { const l = ingLv(r, d), mx = l >= 5, c = ingCost(r, d, l); return `<button class="up" data-ing="${d}" ${mx || SV.coins < c ? 'disabled' : ''}><div class="ic">${dishHTML(R, d)}</div><div class="n">${R.dishes[d].n} <small>Lv${l}</small></div><div class="d">售價 ${priceOf(r, d)}${mx ? '' : ` → ${Math.round(R.dishes[d].p * (1 + 0.25 * (l + 1)))}`}</div><div class="c">${mx ? '已滿' : '🪙 ' + c}</div></button>`; }).join('');
  document.querySelectorAll('[data-ing]').forEach(b => b.onclick = () => { const d = b.dataset.ing, c = ingCost(r, d, ingLv(r, d)); if (SV.coins < c) return; SV.coins -= c; SV.ing[r + ':' + d] = ingLv(r, d) + 1; checkAch(); persist(); renderIng(r); });
  $('ingBack').onclick = () => openRest(r);
}
function renderAch() { show('achOv'); $('achG').innerHTML = `<span class="gem">💎 ${SV.gems}</span>　已完成 ${ACHS.filter(a => SV.ach[a[0]]).length}/${ACHS.length}`; $('achList').innerHTML = ACHS.map(a => `<div class="ach ${SV.ach[a[0]] ? 'ok' : ''}"><b>${SV.ach[a[0]] ? '🏆' : '🔒'} ${a[1]}</b><br>${a[2]}<br><span class="gem">💎 ${a[4]}</span></div>`).join(''); }
function openRest(r) { $('lvIng').onclick = () => renderIng(r);
  show('levels'); $('lvTitle').textContent = RESTS[r].name;
  const pr = SV.prog[r];
  $('lvGrid').innerHTML = Array.from({ length: maxL(r) }, (_, i) => { const l = i + 1, s = SV.best[r + '-' + l] || 0; return `<button class="lv ${l === pr ? 'cur' : ''}" data-l="${l}" ${l > pr ? 'disabled' : ''}>${l > pr ? '🔒' : l}<small>${l <= pr ? '⭐'.repeat(s) || '　' : ''}</small></button>`; }).join('');
  document.querySelectorAll('[data-l]').forEach(b => b.onclick = () => intro(r, +b.dataset.l));
  const cur = $('lvGrid').querySelector('.cur'); if (cur) setTimeout(() => cur.scrollIntoView({ block: 'center' }), 30);
}
function intro(r, l, daily) {
  newLevel(r, l); G.daily = !!daily; show('intro');
  const c = G.cfg, R = G.R, nw = R.unlock.find(([x]) => x === l);
  $('iT').textContent = `${R.name} 第 ${l} 關`;
  $('iGoal').innerHTML = `<h3>🎯 今日目標</h3>賺到 ${im('coin', 'i')} <b style="color:#ffe14d">${c.goal[0]}</b>（三顆星要 ${c.goal[2]}）・今天來 <b>${c.n}</b> 位客人<div class="newdish">${c.menu.map(d => `<div>${dishHTML(R, d)}${R.dishes[d].n}</div>`).join('')}</div>` +
    (l > LPR && upSum() < recUp(l, r) ? `<br><b style="color:#ffb3b3">💡 這關很硬！建議先去升級（目前升級 ${upSum()} 級，建議 ${recUp(l, r)} 級以上）</b>` : '') +
    `<div style="margin-top:8px;font-weight:900">道具 <span class="gem">💎 ${SV.gems}</span></div><div class="boost">${BOOSTS.map(b => `<button data-bst="${b.k}">${b.ic} ${b.n}<br>💎${b.g}</button>`).join('')}</div>` + (G.daily ? '<br><b style="color:#7ae0ff">📅 每日挑戰：過關金幣 ×2、💎+3</b>' : '') + (nw ? `<br><b style="color:#9cff7a">✨ 新菜色：${nw[1].map(d => R.dishes[d].n).join('、')}</b><br>${nw[1].map(d => recipeText(R, d)).join('<br>')}` : '');
  bindBoost();
}
function bindBoost() { document.querySelectorAll('[data-bst]').forEach(b => b.onclick = () => { const B = BOOSTS.find(x => x.k === b.dataset.bst); if (G.bst[B.k]) { G.bst[B.k] = 0; SV.gems += B.g; } else { if (SV.gems < B.g) return; SV.gems -= B.g; G.bst[B.k] = 1; } b.classList.toggle('on', !!G.bst[B.k]); persist(); }); }
const upSum = () => Object.values(SV.up).reduce((a, b) => a + b, 0);
const recUp = (l, r) => Math.min(50, 12 + Math.floor(37 * Math.min(1, (l - LPR) / (maxL(r) - LPR))));
function recipeText(R, d) {
  const D = R.dishes[d], nm = x => { const c = R.cookers.find(c => c.out === x); if (c) return `${c.n}做好的料`; const t = R.tops.find(t => t.id === x); if (t) return t.n; const b = R.bases.find(b => b.id === x); return b ? b.n : x; };
  if (D.base) { const bc = R.cookers.find(c => c.out === D.base); return `${D.n}＝${bc ? bc.n + '烤好的餅皮' : nm(D.base)}＋${D.parts.map(nm).join('＋')}`; }
  const c = R.cookers.find(c => c.direct && c.out === d); if (c) return `${D.n}：在${c.n}煮好直接點它上菜`;
  if (R.disp.find(x => x.id === d)) return `${D.n}：點機器的空格開始做`;
  if (R.batch.find(x => x.id === d)) return `${D.n}：點一下開始做，一次好幾份`;
  return '';
}
function play() { show(null); hud(); running = true; paused = false; last = performance.now(); requestAnimationFrame(loop); }
function renderUps() {
  $('uCoin').innerHTML = `${im('coin')} ${SV.coins}`;
  $('upList').innerHTML = UPS.map(u => { const l = SV.up[u.k], max = l >= u.max, c = upCost(u, l); return `<button class="up" data-u="${u.k}" ${max || SV.coins < c ? 'disabled' : ''}><div class="ic">${u.ic}</div><div class="n">${u.n} <small>Lv${l}</small></div><div class="d">${u.d(l)}${max ? '' : `<br>→ ${u.d(l + 1)}`}</div><div class="c">${max ? '已滿' : '🪙 ' + c}</div></button>`; }).join('');
  document.querySelectorAll('[data-u]').forEach(b => b.onclick = () => { const u = UPS.find(x => x.k === b.dataset.u), c = upCost(u, SV.up[u.k]); if (SV.coins < c) return; SV.coins -= c; SV.up[u.k]++; persist(); renderUps(); });
}
$('howCard').innerHTML = `<h3>👨‍🍳 基本操作</h3>① 點爐台的<b>空格</b>放生料，外圈轉滿變<b style="color:#6f6">綠色</b>就點它（變<b style="color:#f66">紅色</b>就燒焦了）<br>
② 有底料的（麵包、白飯、湯碗）先點底料放到盤子；披薩和鬆餅的餅皮從爐子出來會自己上盤<br>
③ 再點配料疊上去，盤子<b style="color:#6f6">亮綠框</b>就是做好了，點它上菜<br>
④ 飲料機、蛋糕櫃：點空格開始做；薯條這類：點一下做好幾份<br>
⑤ 做錯就按 ${im('trash', 'i')}，再點那份丟掉<br>
⑥ 特殊客人：👑VIP 付雙倍但沒耐心、📝評論家滿意送💎（氣走會扣錢）、🧒小朋友點得少又有耐心、⏱趕時間的小費 ×2.5<br>⑦ 💎 鑽石：首次三星、每日挑戰、成就都能拿，開場前可買道具<br>⑧ 每間餐廳可以升級食材，菜價最多變 2.25 倍<br>⑨ 客人等越久越生氣 ${im('neutral', 'i')}→${im('angry', 'i')}，越快上菜小費越多，連續上菜有加成！<br><br>
<h3>🏪 五間餐廳</h3>漢堡小館 200 關、其他每間 100 關，過第 10 關就能開下一間：<br>${RESTS.map(R => `${R.pics.map(p => im(p, 'i')).join('')} ${R.name}`).join('<br>')}`;
$('mHow').onclick = () => show('how'); $('howBack').onclick = () => { SV.seenHow = true; persist(); goMenu(); };
$('mUps').onclick = () => { renderUps(); show('upsOv'); };
$('mAch').onclick = renderAch; $('achBack').onclick = goMenu;
$('mDaily').onclick = () => { if (!SV.daily.done) intro(SV.daily.r, SV.daily.l, true); };
$('lvBack').onclick = goMenu; $('upBack').onclick = goMenu; $('iBack').onclick = () => { for (const B of BOOSTS) if (G.bst[B.k]) SV.gems += B.g; G.bst = {}; persist(); G.daily ? goMenu() : openRest(G.r); };
$('iGo').onclick = play;
$('pauseB').onclick = () => { if (!running) return; paused = true; show('pauseOv'); };
$('pResume').onclick = () => { paused = false; show(null); last = performance.now(); };
$('pQuit').onclick = () => openRest(G.r);
$('eNext').onclick = () => { if (G.daily) return goMenu(); const win = SV.best[G.r + '-' + G.l]; if (win && G.l >= maxL(G.r)) return goMenu(); intro(G.r, win ? G.l + 1 : G.l); };
$('eRetry').onclick = () => intro(G.r, G.l);
$('eUps').onclick = () => { renderUps(); show('upsOv'); };
$('eMenu').onclick = goMenu;
document.addEventListener('visibilitychange', () => { if (document.hidden && running && !paused) { paused = true; show('pauseOv'); } });
newLevel(0, 1);
if (!SV.seenHow) show('how'); else goMenu();
</script>
