<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="遊戲盒">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>瘋狂小餐館</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#2b1a12; color:#fff;
    font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:manipulation; overscroll-behavior:none; }
  .hide { display:none !important; }
  #app { position:relative; max-width:520px; height:100%; margin:0 auto; overflow:hidden; display:flex; flex-direction:column; }
  /* ---------- HUD ---------- */
  #hud { position:relative; z-index:5; display:flex; align-items:center; gap:8px; padding:calc(env(safe-area-inset-top) + 8px) 10px 8px; background:linear-gradient(180deg,#5a2d14,#3e1e0c); box-shadow:0 3px 8px rgba(0,0,0,.4); }
  .chip { background:rgba(0,0,0,.35); border:2px solid rgba(255,220,150,.35); border-radius:999px; padding:4px 12px; font-weight:900; font-size:16px; white-space:nowrap; }
  #goal { flex:1; position:relative; height:24px; background:rgba(0,0,0,.4); border-radius:999px; border:2px solid rgba(255,220,150,.35); overflow:hidden; }
  #goal i { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,#ffd34d,#ff9a2e); transition:width .3s; }
  #goal span { position:absolute; inset:0 0 3px 0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; text-shadow:0 1px 2px #000; }
  #goal u { position:absolute; bottom:-1px; font-size:10px; text-decoration:none; transform:translateX(-50%); filter:grayscale(1) brightness(.7); }
  #goal u.on { filter:none; }
  #pauseB { width:38px; height:38px; border-radius:50%; border:2px solid rgba(255,220,150,.4); background:rgba(0,0,0,.35); color:#fff; font-size:16px; padding:0; }
  /* ---------- 用餐區 ---------- */
  #dining { position:relative; flex:0 0 34%; background:
      linear-gradient(180deg, rgba(0,0,0,0) 70%, rgba(0,0,0,.25) 100%),
      repeating-linear-gradient(90deg,#f6d7a7 0 26px,#f1cb94 26px 52px); overflow:hidden; }
  #dining .win { position:absolute; top:10%; height:42%; width:26%; border-radius:12px 12px 4px 4px; background:linear-gradient(180deg,#8fd3ff,#d9f1ff 70%,#bfe3a0 70%); border:5px solid #8a5228; box-shadow:inset 0 0 0 3px #b8763d; }
  #dining .win::after { content:''; position:absolute; left:50%; top:0; bottom:0; width:4px; margin-left:-2px; background:#8a5228; }
  #dining .lamp { position:absolute; top:0; width:4px; height:18%; background:#5a3a20; }
  #dining .lamp::after { content:''; position:absolute; bottom:-14px; left:-14px; width:32px; height:16px; border-radius:16px 16px 4px 4px; background:#ffcf5a; box-shadow:0 8px 24px rgba(255,210,100,.8); }
  #seats { position:absolute; left:0; right:0; bottom:0; height:78%; display:flex; justify-content:space-around; align-items:flex-end; padding:0 4px; }
  .seat { position:relative; width:24%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; }
  .cust { font-size:min(13vw,62px); line-height:1; transform-origin:50% 100%; transition:transform .25s; margin-bottom:-6px; filter:drop-shadow(0 4px 3px rgba(0,0,0,.25)); }
  .cust.in { animation:walkin .5s ease-out; }
  .cust.angry { animation:angry .4s infinite; }
  @keyframes walkin { from { transform:translateX(120px); opacity:0; } }
  @keyframes angry { 50% { transform:rotate(-6deg); } }
  .bubble { position:absolute; bottom:calc(min(13vw,62px) + 4px); background:#fff; border-radius:14px; padding:4px 5px; display:flex; flex-wrap:wrap; gap:2px; justify-content:center; max-width:100%; box-shadow:0 3px 0 rgba(0,0,0,.18); }
  .bubble::after { content:''; position:absolute; bottom:-7px; left:50%; margin-left:-7px; border:7px solid transparent; border-top-color:#fff; border-bottom:0; }
  .bubble .it { width:min(9vw,40px); height:min(9vw,40px); position:relative; }
  .bubble .it.done { opacity:.35; }
  .bubble .it.done::after { content:'✔'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#2a9d3a; font-weight:900; font-size:22px; }
  .pat { width:80%; height:7px; background:rgba(0,0,0,.25); border-radius:4px; overflow:hidden; margin-top:2px; position:relative; z-index:2; }
  .pat i { display:block; height:100%; border-radius:4px; }
  .seat .heart { position:absolute; bottom:60%; font-size:30px; animation:up 1s forwards; pointer-events:none; z-index:6; }
  .seat .coin { position:absolute; bottom:70%; font-weight:900; color:#ffd34d; font-size:20px; text-shadow:0 2px 0 #7a3b00; animation:up 1.1s forwards; pointer-events:none; z-index:6; white-space:nowrap; }
  @keyframes up { to { transform:translateY(-50px); opacity:0; } }
  #counterTop { position:relative; z-index:3; height:22px; flex:0 0 auto; background:linear-gradient(180deg,#d98a4a,#a85a26); box-shadow:0 4px 0 #6b3412, 0 8px 12px rgba(0,0,0,.35); }
  /* ---------- 廚房 ---------- */
  #kitchen { position:relative; flex:1; background:
      linear-gradient(45deg, rgba(0,0,0,.04) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.04) 75%),
      linear-gradient(45deg, rgba(0,0,0,.04) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.04) 75%), #e9e2d6;
    background-size:40px 40px; background-position:0 0, 20px 20px; padding:10px 8px calc(env(safe-area-inset-bottom) + 8px); display:flex; flex-direction:column; gap:8px; }
  .krow { display:flex; gap:8px; align-items:stretch; }
  .st { position:relative; background:linear-gradient(180deg,#c8cdd6,#9aa2ae); border-radius:14px; box-shadow:0 4px 0 #6d7480, inset 0 2px 0 rgba(255,255,255,.5); display:flex; align-items:center; justify-content:center; }
  .st:active, .tap:active { transform:translateY(2px); }
  .bin { width:min(16vw,70px); flex:0 0 auto; flex-direction:column; font-size:11px; font-weight:900; color:#3a2a1a; padding:4px 2px; background:linear-gradient(180deg,#f0d8a8,#d8b070); box-shadow:0 4px 0 #9a7034, inset 0 2px 0 rgba(255,255,255,.5); }
  .bin svg { width:90%; height:auto; }
  .bin.lock { filter:grayscale(1); opacity:.4; }
  #grill { flex:1; background:linear-gradient(180deg,#4a4a52,#2a2a30); box-shadow:0 4px 0 #111, inset 0 0 0 3px #666; padding:6px; gap:6px; justify-content:space-around; }
  .gslot { position:relative; flex:1; max-width:76px; aspect-ratio:1; border-radius:10px; background:repeating-linear-gradient(0deg,#1a1a1e 0 6px,#3a3a40 6px 8px); display:flex; align-items:center; justify-content:center; }
  .gslot.hot { box-shadow:0 0 14px rgba(255,120,40,.6) inset; }
  .gslot svg { width:86%; }
  .ring { position:absolute; inset:-3px; border-radius:12px; pointer-events:none; }
  .smoke { position:absolute; top:-6px; font-size:16px; animation:smoke 1s infinite; }
  @keyframes smoke { from { transform:translateY(0); opacity:.9; } to { transform:translateY(-18px); opacity:0; } }
  #plates { flex:1; background:transparent; box-shadow:none; gap:6px; justify-content:space-around; }
  .plate { position:relative; flex:1; max-width:84px; aspect-ratio:1.1; border-radius:50%; background:radial-gradient(circle,#ffffff 52%,#e4e8ee 53%,#ffffff 64%,#cfd5de 66%); box-shadow:0 4px 0 #9aa2ae; display:flex; align-items:center; justify-content:center; }
  .plate svg { width:80%; margin-top:-8%; }
  .plate.ready { box-shadow:0 4px 0 #9aa2ae, 0 0 0 3px #4cd964; }
  #trash { width:min(14vw,58px); flex:0 0 auto; font-size:26px; background:linear-gradient(180deg,#9aa2ae,#6d7480); }
  #trash.on { background:linear-gradient(180deg,#ff8a8a,#d94040); box-shadow:0 4px 0 #8a1a1a; animation:pulse .6s infinite alternate; }
  @keyframes pulse { to { transform:scale(1.08); } }
  .mach { flex:1; flex-direction:column; padding:6px 4px; gap:4px; min-height:92px; }
  .mach .lbl { font-size:11px; font-weight:900; color:#2a3040; }
  .mach .slots { display:flex; gap:5px; justify-content:center; width:100%; }
  .cup { position:relative; width:min(11vw,46px); height:min(13vw,56px); border-radius:8px; background:rgba(0,0,0,.12); display:flex; align-items:flex-end; justify-content:center; }
  .cup svg { width:100%; height:100%; }
  .cup .bar { position:absolute; left:4px; right:4px; bottom:-6px; height:4px; background:rgba(0,0,0,.25); border-radius:2px; overflow:hidden; }
  .cup .bar i { display:block; height:100%; background:#4cd964; }
  .mach.lock { filter:grayscale(1); opacity:.4; }
  .mach .lockt { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:900; color:#222; font-size:13px; text-align:center; }
  .fly { position:fixed; z-index:50; pointer-events:none; transition:transform .35s cubic-bezier(.3,.7,.4,1), opacity .35s; }
  .shake { animation:shk .3s; }
  @keyframes shk { 25% { transform:translateX(-5px); } 75% { transform:translateX(5px); } }
  #combo { position:absolute; top:40%; left:0; right:0; text-align:center; font-size:30px; font-weight:900; color:#ffd34d; text-shadow:0 3px 0 #7a3b00, 0 0 12px rgba(0,0,0,.4); pointer-events:none; opacity:0; transition:opacity .2s; z-index:8; }
  /* ---------- 選單 ---------- */
  .ov { position:absolute; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:20px; text-align:center;
    background:radial-gradient(circle at 50% 30%, rgba(90,45,20,.85), rgba(30,15,8,.96)); overflow-y:auto; touch-action:pan-y; }
  .logo { font-size:48px; font-weight:900; line-height:1.05; color:#ffe14d; text-shadow:0 4px 0 #c0392b, 0 8px 0 #6b1a10, 0 12px 20px rgba(0,0,0,.5); }
  .logo small { display:block; font-size:18px; color:#ffd9b0; text-shadow:none; letter-spacing:4px; margin-top:8px; }
  .card { background:rgba(255,255,255,.08); border:2px solid rgba(255,220,150,.2); border-radius:18px; padding:12px 14px; width:100%; max-width:380px; text-align:left; font-size:14px; line-height:1.7; color:#ffeedd; }
  .card h3 { margin:0 0 6px; font-size:17px; color:#ffe14d; }
  button.big { background:linear-gradient(180deg,#ffd34d,#ff9a2e); color:#4a1e00; border:0; border-radius:20px; padding:14px 46px; font-size:24px; font-weight:900; font-family:inherit; box-shadow:0 6px 0 #a8501a, 0 10px 18px rgba(0,0,0,.35); }
  button.big:active { transform:translateY(4px); box-shadow:0 2px 0 #a8501a; }
  button.alt { background:rgba(255,255,255,.12); color:#fff; border:2px solid rgba(255,220,150,.35); border-radius:16px; padding:10px 22px; font-size:17px; font-weight:800; font-family:inherit; }
  .lvgrid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; width:100%; max-width:380px; }
  .lv { aspect-ratio:1; border-radius:14px; border:0; background:linear-gradient(180deg,#ffe8b0,#f0b860); color:#5a2a00; font-weight:900; font-size:20px; box-shadow:0 4px 0 #a8701a; font-family:inherit; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0; }
  .lv small { font-size:10px; letter-spacing:-1px; }
  .lv:disabled { background:#5a4a3a; color:#8a7a6a; box-shadow:0 4px 0 #2a1a0a; }
  .lv.cur { background:linear-gradient(180deg,#9cff7a,#3fbf3a); color:#0f3a08; box-shadow:0 4px 0 #22661a; }
  .ups { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:380px; }
  .up { background:linear-gradient(180deg,#fff7e0,#f3d79a); color:#4a2a08; border-radius:16px; padding:10px 6px; text-align:center; box-shadow:0 4px 0 #b88a3a; border:0; font-family:inherit; }
  .up .ic { font-size:30px; }
  .up .n { font-weight:900; font-size:15px; }
  .up .d { font-size:11px; opacity:.85; margin:2px 0 6px; min-height:28px; }
  .up .c { background:#3fae2a; color:#fff; border-radius:10px; padding:5px; font-weight:900; font-size:14px; }
  .up:disabled .c { background:#9a9a9a; }
  .stars { font-size:46px; letter-spacing:6px; }
  .bignum { font-size:38px; font-weight:900; color:#ffe14d; text-shadow:0 3px 0 #a0521d; }
  .tabs { display:flex; gap:8px; }
</style>
</head>
<body>
<div id="app">
  <div id="hud" class="hide">
    <div class="chip" id="hLv">第 1 關</div>
    <div id="goal"><i></i><span id="gTxt"></span><u style="left:33%">⭐</u><u style="left:66%">⭐</u><u style="left:98%">⭐</u></div>
    <div class="chip" id="hCust">👥 0</div>
    <button id="pauseB">⏸</button>
  </div>
  <div id="dining">
    <div class="lamp" style="left:22%"></div><div class="lamp" style="left:76%"></div>
    <div class="win" style="left:6%"></div><div class="win" style="left:37%"></div><div class="win" style="left:68%"></div>
    <div id="seats"></div>
  </div>
  <div id="counterTop"></div>
  <div id="kitchen">
    <div class="krow" style="flex:1.1">
      <div class="st bin tap" id="bPatty"></div>
      <div class="st" id="grill"></div>
      <div class="st tap" id="trash">🗑️</div>
    </div>
    <div class="krow" style="flex:1.1">
      <div class="st bin tap" id="bBun"></div>
      <div class="st" id="plates"></div>
      <div style="display:flex;flex-direction:column;gap:6px"><div class="st bin tap" id="bCheese" style="flex:1"></div><div class="st bin tap" id="bLettuce" style="flex:1"></div></div>
    </div>
    <div class="krow" style="flex:1">
      <div class="st mach tap" id="mSoda"><div class="lbl">🥤 汽水機（點機器裝杯）</div><div class="slots" id="sSoda"></div></div>
      <div class="st mach tap" id="mFry"><div class="lbl">🍟 炸鍋</div><div class="slots" id="sFry"></div></div>
      <div class="st mach tap" id="mIce"><div class="lbl">🍦 冰淇淋</div><div class="slots" id="sIce"></div></div>
    </div>
  </div>
  <div id="combo"></div>

  <div class="ov" id="menu">
    <div class="logo">瘋狂<br>小餐館<small>COOKING RUSH</small></div>
    <div class="card"><h3>👨‍🍳 怎麼玩</h3>
      ① 點<b>生肉</b>放上烤盤，烤成褐色就點它（別烤焦！）<br>
      ② 點<b>麵包</b>放到盤子，烤好的肉會自動疊上去，再加<b>起司、生菜</b><br>
      ③ 點做好的<b>餐點</b>，就會送給點這道菜的客人<br>
      ④ 客人等太久會生氣走掉，越快上菜小費越多！<br>
      ⑤ 做錯了就按 🗑️ 再點那份餐丟掉
    </div>
    <div class="chip" id="mCoin" style="font-size:18px"></div>
    <button class="big" id="mPlay">開店！</button>
    <div class="tabs"><button class="alt" id="mLevels">📋 選關卡</button><button class="alt" id="mUps">🔧 升級廚房</button></div>
  </div>
  <div class="ov hide" id="levels"><div style="font-size:28px;font-weight:900">📋 關卡</div><div class="lvgrid" id="lvGrid"></div><button class="alt" id="lvBack">返回</button></div>
  <div class="ov hide" id="upsOv"><div style="font-size:28px;font-weight:900">🔧 升級廚房</div><div class="chip" id="uCoin" style="font-size:18px"></div><div class="ups" id="upList"></div><button class="alt" id="upBack">返回</button></div>
  <div class="ov hide" id="intro"><div class="logo" style="font-size:38px" id="iT"></div><div class="card" id="iGoal"></div><button class="big" id="iGo">開始營業</button><button class="alt" id="iBack">返回</button></div>
  <div class="ov hide" id="pauseOv"><div style="font-size:32px;font-weight:900">休息一下</div><button class="big" id="pResume">繼續</button><button class="alt" id="pQuit">離開關卡</button></div>
  <div class="ov hide" id="end"><div style="font-size:34px;font-weight:900" id="eT"></div><div class="stars" id="eStars"></div><div class="bignum" id="eCoin"></div><div class="card" id="eInfo"></div><button class="big" id="eNext">下一關</button><div class="tabs"><button class="alt" id="eRetry">再玩一次</button><button class="alt" id="eUps">🔧 升級</button><button class="alt" id="eMenu">主選單</button></div></div>
</div>
<script>
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), pick = a => a[Math.floor(Math.random() * a.length)], clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ===================== 圖 =====================
function burgerSVG(L, top) {
  // L: 盤上的料 ['bun','patty','cheese','lettuce']
  let s = '<svg viewBox="0 0 60 52">';
  if (L.includes('bun')) s += '<path d="M8 40 Q8 48 16 48 L44 48 Q52 48 52 40 Z" fill="#e0a050"/><rect x="8" y="38" width="44" height="4" rx="2" fill="#f2c27a"/>';
  if (L.includes('patty')) s += '<rect x="6" y="29" width="48" height="10" rx="5" fill="#6b3a1e"/><path d="M10 33 h6 M22 34 h7 M35 33 h8" stroke="#4a2410" stroke-width="2"/>';
  if (L.includes('cheese')) s += '<path d="M6 28 L54 28 L50 33 L42 31 L36 36 L28 31 L18 35 L12 31 Z" fill="#ffcf2e"/>';
  if (L.includes('lettuce')) s += '<path d="M5 27 Q10 22 15 27 Q20 22 25 27 Q30 22 35 27 Q40 22 45 27 Q50 22 55 27 L55 29 L5 29 Z" fill="#5cc94a"/>';
  if (top) s += '<path d="M7 26 Q7 6 30 6 Q53 6 53 26 Z" fill="#e8a24a"/><path d="M12 22 Q14 12 26 10" stroke="#f6c47c" stroke-width="3" fill="none" stroke-linecap="round"/><g fill="#fff6dc"><ellipse cx="22" cy="14" rx="2" ry="1.2"/><ellipse cx="32" cy="11" rx="2" ry="1.2"/><ellipse cx="40" cy="16" rx="2" ry="1.2"/><ellipse cx="28" cy="18" rx="2" ry="1.2"/></g>';
  return s + '</svg>';
}
function pattySVG(state, t) {
  // state raw→cook(0..1)→done→burnt
  const col = state === 'burnt' ? '#22140c' : state === 'done' ? '#7a4220' : lerpCol('#e88a8a', '#8a4a24', t);
  return `<svg viewBox="0 0 60 40"><ellipse cx="30" cy="22" rx="26" ry="14" fill="${col}"/><path d="M14 18 h8 M28 24 h9 M38 16 h7" stroke="rgba(0,0,0,.25)" stroke-width="2.5" stroke-linecap="round"/>${state === 'done' ? '<path d="M12 14 L48 14 M12 22 L48 22 M12 30 L48 30" stroke="#3a1a08" stroke-width="2" opacity=".5"/>' : ''}</svg>`;
}
function lerpCol(a, b, t) { const p = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16)); const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; }
function sodaSVG(fill) { const h = 30 * fill; return `<svg viewBox="0 0 40 50"><path d="M30 2 L24 14" stroke="#fff" stroke-width="3"/><path d="M6 12 L34 12 L30 48 L10 48 Z" fill="#fff" stroke="#ccc"/><clipPath id="cc"><path d="M6 12 L34 12 L30 48 L10 48 Z"/></clipPath><rect x="0" y="${48 - h}" width="40" height="${h}" fill="#e8402a" clip-path="url(#cc)"/><rect x="4" y="9" width="32" height="5" rx="2" fill="#e8402a"/><path d="M14 22 v20" stroke="rgba(255,255,255,.4)" stroke-width="3"/></svg>`; }
function friesSVG() { return '<svg viewBox="0 0 40 50"><g fill="#ffd34d" stroke="#e8a020" stroke-width="1"><rect x="10" y="4" width="5" height="26" rx="1"/><rect x="16" y="2" width="5" height="28" rx="1"/><rect x="22" y="5" width="5" height="25" rx="1"/><rect x="27" y="7" width="5" height="23" rx="1"/></g><path d="M6 20 L34 20 L30 48 L10 48 Z" fill="#e8402a"/><path d="M14 30 Q20 36 26 30" stroke="#ffd34d" stroke-width="3" fill="none"/></svg>'; }
function iceSVG(fill = 1) { return `<svg viewBox="0 0 40 50"><path d="M10 22 L30 22 L20 48 Z" fill="#e8b060"/><path d="M12 26 L27 26 M14 32 L25 32 M16 38 L23 38" stroke="#b8803a" stroke-width="1.5"/>${fill > 0 ? `<g transform="translate(20 22) scale(${fill}) translate(-20 -22)"><circle cx="20" cy="16" r="11" fill="#ff9ec4"/><circle cx="14" cy="20" r="6" fill="#ff9ec4"/><circle cx="26" cy="20" r="6" fill="#ff9ec4"/><circle cx="20" cy="5" r="3" fill="#e8402a"/><ellipse cx="16" cy="12" rx="3" ry="2" fill="#fff" opacity=".6"/></g>` : ''}</svg>`; }
const BIN_ART = {
  patty: `<svg viewBox="0 0 60 44"><rect x="2" y="16" width="56" height="26" rx="6" fill="#9ad0ff" opacity=".6"/><ellipse cx="22" cy="22" rx="16" ry="9" fill="#e88a8a"/><ellipse cx="38" cy="26" rx="16" ry="9" fill="#f09a9a"/></svg>`,

// 上菜：送給等最久（耐心最少）且需要這道菜的客人

// ===================== 主迴圈 =====================

  $('eCoin').textContent = '+🪙 ' + G.coins;
  const nx = MENU_UNLOCK.find(([l]) => l === G.L + 1);
  $('eInfo').innerHTML = `服務 <b>${G.served}</b> 位客人${G.lost ? `，<b style="color:#ff8a80">氣走 ${G.lost} 位</b>` : '，一位都沒氣走！'}${G.burnt ? `<br>烤焦 ${G.burnt} 塊肉` : ''}<br>目標：⭐ ${g[0]}　⭐⭐ ${g[1]}　⭐⭐⭐ ${g[2]}${win && nx ? `<br><b style="color:#ffe14d">下一關新菜色：${nx[1].map(k => NAME[k]).join('、')}！</b>` : ''}${win ? '' : '<br>升級一下廚房，或做快一點再來挑戰！'}`;
  $('eNext').textContent = win ? (G.L < MAXL ? '下一關' : '全部通關！') : '再挑戰';
  $('eNext').disabled = win && G.L >= MAXL;
  setTimeout(() => show('end'), 500);
}

// ===================== 選單 =====================
function show(id) { ['menu', 'levels', 'upsOv', 'intro', 'pauseOv', 'end'].forEach(x => $(x).classList.toggle('hide', x !== id)); $('hud').classList.toggle('hide', id !== null && id !== 'pauseOv'); }
function goMenu() { running = false; show('menu'); $('mCoin').textContent = '🪙 ' + SV.coins + '　・　第 ' + SV.unlocked + ' 關'; }
function intro(L) {
  newLevel(L); show('intro');
  const c = G.cfg, newItems = MENU_UNLOCK.find(([l]) => l === L);
  $('iT').textContent = `第 ${L} 關`;
  $('iGoal').innerHTML = `<h3>🎯 今日目標</h3>賺到 <b style="color:#ffe14d">🪙 ${c.goal[0]}</b>（⭐⭐⭐ 需要 ${c.goal[2]}）<br>今天會來 <b>${c.n}</b> 位客人<br>菜單：${c.menu.map(k => NAME[k]).join('、')}` +
    (newItems ? `<br><br><b style="color:#9cff7a">✨ 新菜色：${newItems[1].map(k => NAME[k]).join('、')}</b><br>${newItems[1].includes('C') ? '肉放上麵包後，點「起司」疊上去。' : newItems[1].includes('fries') ? '點炸鍋開始炸，炸好一次可以出好幾份。' : newItems[1].includes('L') ? '點「生菜」疊上去。豪華堡要起司＋生菜都有！' : newItems[1].includes('ice') ? '點冰淇淋機裝甜筒，等它裝滿。' : ''}` : '');
}
function play() { show(null); hud(); running = true; paused = false; last = performance.now(); requestAnimationFrame(loop); }
function renderLevels() {
  $('lvGrid').innerHTML = Array.from({ length: MAXL }, (_, i) => { const L = i + 1, s = SV.best[L] || 0; return `<button class="lv ${L === SV.unlocked ? 'cur' : ''}" data-l="${L}" ${L > SV.unlocked ? 'disabled' : ''}>${L > SV.unlocked ? '🔒' : L}<small>${L <= SV.unlocked ? '⭐'.repeat(s) || '　' : ''}</small></button>`; }).join('');
  document.querySelectorAll('[data-l]').forEach(b => b.onclick = () => intro(+b.dataset.l));
}
function renderUps() {
  $('uCoin').textContent = '🪙 ' + SV.coins;
  $('upList').innerHTML = UPS.map(u => { const l = SV.up[u.k], max = l >= u.max, c = upCost(u, l); return `<button class="up" data-u="${u.k}" ${max || SV.coins < c ? 'disabled' : ''}><div class="ic">${u.ic}</div><div class="n">${u.n} <small>Lv${l}</small></div><div class="d">${u.d(l)}${max ? '' : `<br>→ ${u.d(l + 1)}`}</div><div class="c">${max ? '已滿' : '🪙 ' + c}</div></button>`; }).join('');
  document.querySelectorAll('[data-u]').forEach(b => b.onclick = () => { const u = UPS.find(x => x.k === b.dataset.u), c = upCost(u, SV.up[u.k]); if (SV.coins < c) return; SV.coins -= c; SV.up[u.k]++; persist(); renderUps(); });
}
$('mPlay').onclick = () => intro(SV.unlocked);
$('mLevels').onclick = () => { renderLevels(); show('levels'); };
$('mUps').onclick = () => { renderUps(); show('upsOv'); };
$('lvBack').onclick = goMenu; $('upBack').onclick = goMenu; $('iBack').onclick = goMenu;
$('iGo').onclick = play;
$('pauseB').onclick = () => { if (!running) return; paused = true; show('pauseOv'); };
$('pResume').onclick = () => { paused = false; show(null); last = performance.now(); };
$('pQuit').onclick = goMenu;
$('eNext').onclick = () => intro(SV.best[G.L] ? Math.min(MAXL, G.L + 1) : G.L);
$('eRetry').onclick = () => intro(G.L);
$('eUps').onclick = () => { renderUps(); show('upsOv'); };
$('eMenu').onclick = goMenu;
document.addEventListener('visibilitychange', () => { if (document.hidden && running && !paused) { paused = true; show('pauseOv'); } });
newLevel(1); goMenu();
</script>
