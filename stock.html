button{font-family:inherit;color:inherit;border:0;cursor:pointer}
.up{color:#ff4d5e}.dn{color:#1ec98b}.fl{color:#9aa6b8}

#start{position:absolute;inset:0;overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 40px;background:radial-gradient(120% 60% at 50% 0%,#1d2a48 0%,#0b0f17 70%);z-index:20}

.logo img{width:62px;height:62px;filter:drop-shadow(0 6px 12px #0008)}

.logo small{display:block;color:#8a96a9;font-size:14px;letter-spacing:0}
.sc{display:flex;gap:12px;align-items:center;background:#151c2b;border:1px solid #232d42;border-radius:18px;padding:12px 14px;margin:10px 0;position:relative}
.sc:active{transform:scale(.98)}
.sc img{width:48px;height:48px;flex:none}
.sc b{font-size:18px;display:block}
.sc small{display:block;color:#9aa6b8;font-size:13.5px;line-height:1.45;margin-top:2px}

.setrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}

.bigbtn{display:block;width:100%;padding:15px;border-radius:16px;background:linear-gradient(135deg,#ffcc5c,#ff8f3a);color:#221300;font-size:18px;font-weight:800;margin-top:12px;box-shadow:0 6px 18px #ff8f3a44}
.bigbtn.sec{background:#1f2940;color:#e8edf5;box-shadow:none}
.home{color:#8a96a9;text-decoration:none;font-size:14px}

.trow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.date{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.date img{width:22px;height:22px}
.asset{text-align:right}
.asset b{font-size:20px;font-variant-numeric:tabular-nums}
.asset small{display:block;font-size:12.5px}
.strip{display:flex;gap:6px;margin-top:7px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.ix{flex:none;background:#0b111c;border-radius:10px;padding:4px 9px;font-size:12px;white-space:nowrap}
.ix b{font-variant-numeric:tabular-nums;font-size:13px}
.prog{height:3px;background:#1e2738;border-radius:3px;margin-top:7px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#ffcc5c,#ff8f3a);width:0}
#main{flex:1;overflow:auto;padding:8px 10px 12px}
#ctrl{display:flex;gap:6px;padding:8px 10px;background:#0f1522;border-top:1px solid #1f283b}
#ctrl button{flex:1;background:#1c2539;border-radius:12px;padding:10px 0;font-size:14px;font-weight:700}
#ctrl button.play{background:linear-gradient(135deg,#ffcc5c,#ff8f3a);color:#221300}
#ctrl button.play.on{background:#ff4d5e;color:#fff}
#nav{display:flex;background:#0d121d;border-top:1px solid #1a2233;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:none;padding:7px 0 6px;font-size:11.5px;color:#7c879a;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button img{width:24px;height:24px;opacity:.55;filter:grayscale(.6)}
#nav button.on{color:#ffcc5c}
#nav button.on img{opacity:1;filter:none}
.grp{font-size:13px;color:#8a96a9;margin:12px 4px 6px;font-weight:700;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:10px;background:#131a28;border-radius:14px;padding:9px 10px;margin-bottom:6px}

.nm{flex:1;min-width:0}
.nm b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:#7f8ba0;font-size:12px}
.spk{width:64px;height:28px;flex:none}
.px{text-align:right;min-width:78px;font-variant-numeric:tabular-nums}
.px b{display:block;font-size:15.5px}
.px span{font-size:12px;display:inline-block;border-radius:6px;padding:1px 5px;margin-top:2px}
.px span.up{background:#ff4d5e22}.px span.dn{background:#1ec98b22}
.card{background:#131a28;border-radius:16px;padding:12px 14px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:13.5px}
.kv div{display:flex;justify-content:space-between;gap:6px}
.kv span{color:#8a96a9;white-space:nowrap}
.kv b{font-variant-numeric:tabular-nums;font-weight:600}
.hd{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;margin:4px 2px 10px}
.hd img{width:26px;height:26px}
.big{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.news{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid #1b2333}
.news img{width:28px;height:28px;flex:none}
.news small{color:#7f8ba0;font-size:12px;display:block}
.news div{font-size:14.5px;line-height:1.5}
.empty{text-align:center;color:#6c7890;padding:40px 10px;font-size:14px;line-height:1.7}
.empty img{width:64px;height:64px;display:block;margin:0 auto 8px;opacity:.8}

.ov{position:fixed;inset:0;background:#0009;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:94%;overflow:auto;background:#111827;border-radius:22px 22px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom));animation:su .22s ease-out}
.full{position:fixed;inset:0;z-index:30;background:#0b0f17;display:flex;justify-content:center}
.full>div{width:100%;max-width:560px;overflow:auto;padding:calc(8px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom))}
@keyframes su{from{transform:translateY(40%);opacity:.3}}
.x{background:#1f2940;border-radius:50%;width:34px;height:34px;font-size:18px;flex:none}
.tabs{display:flex;gap:4px;background:#0b111c;border-radius:12px;padding:3px;margin:8px 0}
.tabs button{flex:1;background:none;border-radius:9px;padding:6px 0;font-size:13px;color:#8a96a9}
.tabs button.on{background:#25304a;color:#fff;font-weight:700}
canvas{display:block;width:100%;touch-action:pan-y}
.bs{display:flex;gap:8px;margin-top:10px}
.bs button{flex:1;padding:14px;border-radius:14px;font-size:17px;font-weight:800;color:#fff}

.qk{display:flex;gap:5px;flex-wrap:wrap}
.qk button{background:#1b2336;border-radius:10px;padding:7px 10px;font-size:13px}
.lbl{font-size:13px;color:#8a96a9;margin-top:10px}

.sum div{display:flex;justify-content:space-between}

.toast div{background:#1d2740ee;border:1px solid #33415f;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.5;display:flex;gap:8px;align-items:center;animation:su .25s;box-shadow:0 8px 24px #0008;backdrop-filter:blur(6px)}
.toast img{width:26px;height:26px;flex:none}

.tr{display:flex;justify-content:space-between;font-size:13px;padding:7px 2px;border-bottom:1px solid #1b2333;gap:6px}

.tag.b{background:#ff4d5e33;color:#ff7884}.tag.s{background:#1ec98b33;color:#4fe0ab}
.ld{position:fixed;inset:0;z-index:80;background:#0b0f17;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#9aa6b8}
.ld img{width:80px;animation:bob 1s infinite alternate}
@keyframes bob{to{transform:translateY(-10px)}}
.bar{width:220px;height:6px;background:#1e2738;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:#ffb84d;width:0}
.alloc{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:8px 0 4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:#9aa6b8}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.note{font-size:12px;color:#6f7b90;line-height:1.6;margin-top:8px}

.evt{text-align:center;padding:6px 4px}.evt img{width:84px;height:84px;filter:drop-shadow(0 6px 14px #0008);animation:pop .4s}.evt .et{font-size:22px;font-weight:800;margin:6px 0 4px;color:#ffd877}.evt .eb{font-size:15.5px;line-height:1.75;color:#d8deea;margin:6px 4px 14px;text-align:left}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.qk button.on{background:#ffcc5c;color:#1a1300}
.sum div.note{display:block}
#gbHome{display:none}
body:has(.ov) .toast{display:none}
</style>
</head>

// ====================== 工具 ======================
function dayOf(s){const[a,b,c]=s.split('-').map(Number);return Date.UTC(a,b-1,c)/864e5-D0}
function dstr(d,fmt){const t=new Date((d+D0)*864e5);const y=t.getUTCFullYear(),m=t.getUTCMonth()+1,dd=t.getUTCDate();if(fmt==='m')return y+'/'+m;if(fmt==='md')return m+'/'+dd;return y+'/'+String(m).padStart(2,'0')+'/'+String(dd).padStart(2,'0')}
function wk(d){return '日一二三四五六'[new Date((d+D0)*864e5).getUTCDay()]}
function yr(d){return new Date((d+D0)*864e5).getUTCFullYear()}
function mo(d){const t=new Date((d+D0)*864e5);return t.getUTCFullYear()*12+t.getUTCMonth()}
const $=id=>document.getElementById(id);
function fmt(n,dp=0){if(!isFinite(n))return '-';return n.toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp})}
function ntd(n){const a=Math.abs(n);let s;if(a>=1e8)s=(n/1e8).toFixed(2)+' 億';else if(a>=1e6)s=(n/1e4).toFixed(0)+' 萬';else s=fmt(n);return 'NT$'+s}
function ntdF(n){return 'NT$'+fmt(Math.round(n))}
function pfmt(p){if(p>=10000)return fmt(p,0);if(p>=100)return fmt(p,1);if(p>=1)return fmt(p,2);if(p>=.1)return p.toFixed(3);return p.toFixed(4)}
function pdp(p){return p>=10000?0:p>=100?1:p>=1?2:p>=.1?3:4}
function pct(x,dp=2){return (x>0?'+':'')+(x*100).toFixed(dp)+'%'}
function cls(x){return x>1e-9?'up':x<-1e-9?'dn':'fl'}
function vfmt(v,f){if(f&&SYM[f].mk==='TW')return vf(v)+' 張';if(f)return vf(v*1000)+' 股';return vf(v)}
function vf(v){if(v>=1e8)return (v/1e8).toFixed(2)+'億';if(v>=1e4)return (v/1e4).toFixed(0)+'萬';return fmt(v)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

const DAT = {};
function decode(f,j){
  const n=j.d.length, days=new Int32Array(n), o=new Float64Array(n),h=new Float64Array(n),l=new Float64Array(n),c=new Float64Array(n),v=new Float64Array(n);
  let dd=0,cc=0;const m=j.mul||100;
  for(let i=0;i<n;i++){dd+=j.d[i];cc+=j.c[i];days[i]=dd;const cl=cc/m;c[i]=cl;o[i]=cl+j.o[i]/m;h[i]=cl+j.h[i]/m;l[i]=cl+j.l[i]/m;v[i]=j.v[i]||0;if(j.cur==='TWD'&&v[i]>1e6)v[i]/=1000}
  // 還原分割前的真實價格（資料為分割調整後收盤價）
  const spl=(j.spl||[]).map(s=>({day:s[0],r:s[1]/s[2]})).filter(s=>s.r>0&&isFinite(s.r)).sort((a,b)=>a.day-b.day);
  const fac=d=>{let f=1;for(const s of spl)if(s.day>d)f*=s.r;return f};
  if(spl.length){let si=0,f=fac(-1e9);for(let i=0;i<n;i++){while(si<spl.length&&spl[si].day<=days[i]){f/=spl[si].r;si++}o[i]*=f;h[i]*=f;l[i]*=f;c[i]*=f;v[i]/=f}}
  for(let i=0;i<n;i++){if(h[i]<Math.max(o[i],c[i]))h[i]=Math.max(o[i],c[i]);if(l[i]>Math.min(o[i],c[i]))l[i]=Math.min(o[i],c[i]);if(l[i]<=0)l[i]=Math.min(o[i],c[i])}
  const div=(j.div||[]).map(x=>({day:x[0],a:x[1]*fac(x[0])})).sort((a,b)=>a.day-b.day);
  DAT[f]={days,o,h,l,c,v,n,div,spl,cur:j.cur,ptr:-1,first:days[0]};
}

let S=null;
function lowerIdx(arr,d){let lo=0,hi=arr.length-1,r=-1;while(lo<=hi){const m=(lo+hi)>>1;if(arr[m]<=d){r=m;lo=m+1}else hi=m-1}return r}
function syncPtrs(){const d=CAL[S.i];for(const f of FILES){DAT[f].ptr=lowerIdx(DAT[f].days,d)}}
function today(){return CAL[S.i]}
function P(f){const D=DAT[f];return D.ptr<0?NaN:D.c[D.ptr]}
function adjF(f,d){const D=DAT[f];if(!D.spl.length)return 1;const t=today();let r=1;for(const s of D.spl)if(s.day>d&&s.day<=t)r*=s.r;return r}
function prevC(f){const D=DAT[f];if(D.ptr<0)return NaN;if(D.ptr<1)return D.o[0];return D.c[D.ptr-1]/adjF(f,D.days[D.ptr-1])}
function traded(f){const D=DAT[f];return D.ptr>=0&&D.days[D.ptr]===today()}
function listed(f){return DAT[f].ptr>=0}
function fx(){const D=DAT.TWD_X;if(D.ptr<0){return FXOLD[yr(today())]||32}return D.c[D.ptr]}
function rate(f){return SYM[f]&&SYM[f].mk==='TW'?1:fx()}
function avgPx(f){const p=S.pos[f];return p.lc?p.lc/p.q:p.cost/p.q/rate(f)}
function posVal(f){const p=S.pos[f];return p?p.q*P(f)*rate(f):0}
function mktVal(){let v=0;for(const f in S.pos)v+=posVal(f);return v}
function total(){if(!S.mpos)return S.cash+mktVal();const c=crSum();return S.cash+mktVal()+c.mv-c.ln+c.co-c.sv+futMg()}

function qfmt(f,q){if(SYM[f].mk==='CR')return q.toFixed(4)+' 顆';if(SYM[f].mk==='TW'){const z=Math.floor(q/1000),r=Math.round(q%1000);return (z?z+' 張':'')+(r?(z?' ':'')+r+' 股':'')||'0 股'}return fmt(q)+' 股'}

  S={v:1,sc:sc.id,name:sc.name,i:si,s0:si,end:ei,cap0:cap,cash:cap,sal,blind,pos:{},orders:[],trades:[],news:[],hist:[],bTW:[],bUS:[],
     dep:cap,divIn:0,fees:0,tax:0,real:0,oid:1,mile:{},lastMo:0,bench:{tw:0,us:0,usC:0},peak:cap,started:Date.now()};

function benchVal(){return {tw:S.bench.tw*P('IDX_TWII'),us:S.bench.us*P('SPY')*fx()+S.bench.usC}}
function recHist(){const b=benchVal();S.hist.push(Math.round(total()));S.bTW.push(Math.round(b.tw));S.bUS.push(Math.round(b.us))}
function pushNews(d,t,ic,k){S.news.push({d,t,ic:ic||'air_news',k:k||0});if(S.news.length>400)S.news.splice(0,S.news.length-400)}

// ====================== 交易規則 ======================
// 台股：手續費 0.1425% × 6 折（電子下單），最低 20 元；證交稅 股票 0.3%、ETF 0.1%（賣出時）
// 美股（複委託）：手續費 0.1%，最低 US$3；換匯價差 0.1%；股利預扣 30% 稅
// 比特幣：手續費 0.1%
function costs(f,side,q,px){
  const s=SYM[f],amt=q*px;let fee=0,tax=0;
  if(s.mk==='TW'){fee=Math.max(20,Math.floor(amt*0.001425*0.6));if(side==='S')tax=Math.floor(amt*(s.etf?0.001:0.003))}
  else if(s.mk==='US'){fee=Math.max(3,amt*0.001)}
  else fee=amt*0.001;
  return {amt,fee,tax};
}
// 回傳以台幣計的總花費（買）或總入帳（賣）
function settle(f,side,q,px){
  const c=costs(f,side,q,px);
  if(SYM[f].mk==='TW')return {ntd:side==='B'?c.amt+c.fee:c.amt-c.fee-c.tax,fee:c.fee,tax:c.tax};
  const r=fx()*(side==='B'?1.001:0.999);
  return {ntd:side==='B'?(c.amt+c.fee)*r:(c.amt-c.fee)*r,fee:c.fee*fx(),tax:0};
}
function execTrade(f,side,q,px,why){
  q=SYM[f].mk==='CR'?Math.round(q*1e4)/1e4:Math.round(q);
  if(q<=0)return 'qty';
  const st=settle(f,side,q,px);
  if(side==='B'){
    if(st.ntd>S.cash+0.5)return 'cash';
    S.cash-=st.ntd;const p=S.pos[f]||(S.pos[f]={q:0,cost:0,lc:0});p.q+=q;p.cost+=st.ntd;p.lc=(p.lc||0)+q*px+costs(f,'B',q,px).fee;
    S.trades.push({d:today(),f,sd:'B',q,px,amt:st.ntd,fee:st.fee,tax:0,why});
  }else{
    const p=S.pos[f];if(!p||p.q<q-1e-9)return 'pos';
    const c0=p.cost*q/p.q;p.cost-=c0;p.lc=(p.lc||0)*(1-q/p.q);p.q-=q;S.cash+=st.ntd;
    const pnl=st.ntd-c0;S.real+=pnl;if(p.q<1e-9)delete S.pos[f];
    S.trades.push({d:today(),f,sd:'S',q,px,amt:st.ntd,fee:st.fee,tax:st.tax,pnl,why});
  }
  S.fees+=st.fee;S.tax+=st.tax;
  if(S.trades.length>600)S.trades.splice(0,S.trades.length-600);
  return 'ok';
}

// ====================== 信用交易・當沖・期貨・定期定額 ======================
const CRR={TW:{mr:0.6,sd:0.9,ir:0.065,bf:0.0008,sf:0},US:{mr:0.5,sd:0.5,ir:0.075,bf:0,sf:0.03}};
const FUT={TX:{n:'小型台指期',f:'IDX_TWII',mult:50,mk:'TW',mr:0.075,fee:50,unit:'口',desc:'每點 NT$50'},ES:{n:'微型 S&P 500 期貨',f:'IDX_GSPC',mult:5,mk:'US',mr:0.065,fee:1.5,unit:'口',desc:'每點 US$5'}};
function initX(){
  S.mpos=S.mpos||{};S.spos=S.spos||{};S.fut=S.fut||[];S.dt=S.dt||[];S.dca=S.dca||{};S.evq=S.evq||[];S.intPaid=S.intPaid||0;
  S.life=S.life||{ins:0,kids:0,married:0,ban:-1,jobless:0,salBase:S.sal,divYr:{},loans:[],group:0,lastEv:0,dcaMo:0};
}
const canCredit=f=>SYM[f].mk!=='CR';
function creditLock(){
  if(S.life.ban>S.i)return '曾經違約交割，信用帳戶被停權中（約 '+Math.ceil((S.life.ban-S.i)/250*12)+' 個月後恢復）';
  if(S.i-S.s0<40)return '開立信用帳戶需要開戶滿 2 個月（還要 '+(40-(S.i-S.s0))+' 個交易日）';
  if(S.trades.length<5)return '開立信用帳戶需要至少 5 筆成交紀錄（目前 '+S.trades.length+' 筆）';
  return '';
}
const mval=f=>S.mpos[f].q*P(f)*rate(f), sval=f=>S.spos[f].q*P(f)*rate(f);
function crSum(){let mv=0,ln=0,co=0,sv=0;for(const f in S.mpos){mv+=mval(f);ln+=S.mpos[f].loan}for(const f in S.spos){co+=S.spos[f].coll;sv+=sval(f)}return {mv,ln,co,sv}}
function maintRatio(){const c=crSum();const d=c.ln+c.sv;return d>0?(c.mv+c.co)/d:Infinity}
function futMg(){return S.fut.reduce((s,x)=>s+x.mg,0)}
function hasCredit(){return Object.keys(S.mpos).length||Object.keys(S.spos).length}
function rec(f,sd,q,px,amt,fee,tax,why,pnl){S.trades.push({d:today(),f,sd,q,px,amt,fee,tax,why,pnl});S.fees+=fee;S.tax+=tax;if(pnl!=null)S.real+=pnl;if(S.trades.length>600)S.trades.splice(0,S.trades.length-600)}
function marginBuy(f,q){
  const px=P(f),r=CRR[SYM[f].mk];const st=settle(f,'B',q,px);const loan=Math.floor(q*px*rate(f)*r.mr/1000)*1000;const own=st.ntd-loan;
  if(own>S.cash+0.5)return 'cash';
  S.cash-=own;const m=S.mpos[f]||(S.mpos[f]={q:0,loan:0,cost:0});m.q+=q;m.loan+=loan;m.cost+=st.ntd;
  rec(f,'B',q,px,st.ntd,st.fee,0,'融資買進');return 'ok';
}
function marginSell(f,q,why){
  const m=S.mpos[f];if(!m||q>m.q+1e-9)return 'pos';const px=P(f);const st=settle(f,'S',q,px);const k=q/m.q;const rp=m.loan*k,c0=m.cost*k;
  S.cash+=st.ntd-rp;m.loan-=rp;m.cost-=c0;m.q-=q;if(m.q<1e-9)delete S.mpos[f];
  rec(f,'S',q,px,st.ntd,st.fee,st.tax,why||'融資賣出',st.ntd-c0);return 'ok';
}
function shortSell(f,q){
  const px=P(f),r=CRR[SYM[f].mk];const st=settle(f,'S',q,px);const amt=q*px*rate(f);const dep=Math.ceil(amt*r.sd/100)*100,bf=Math.round(amt*r.bf);
  if(dep+bf>S.cash+0.5)return 'cash';
  S.cash-=dep+bf;const s=S.spos[f]||(S.spos[f]={q:0,coll:0,ent:0});s.q+=q;s.coll+=st.ntd+dep;s.ent+=st.ntd;
  rec(f,'S',q,px,st.ntd,st.fee+bf,st.tax,'融券賣出');return 'ok';
}
function shortCover(f,q,why){

}

// 當沖：隔一個交易日開盤進場，觸價停損停利，否則收盤平倉
function runDayTrades(){
  const keep=[];
  for(const o of S.dt){
    if(!traded(o.f)){keep.push(o);continue}
    const D=DAT[o.f],k=D.ptr,op=D.o[k],hi=D.h[k],lo=D.l[k],cl=D.c[k];let ex=cl,how='收盤平倉';
    const stop=o.dir>0?op*(1-o.sl):op*(1+o.sl),tgt=o.dir>0?op*(1+o.tp):op*(1-o.tp);
    if(o.sl>0&&(o.dir>0?lo<=stop:hi>=stop)){ex=stop;how='觸發停損'}else if(o.tp>0&&(o.dir>0?hi>=tgt:lo<=tgt)){ex=tgt;how='達到停利'}
    const mk=SYM[o.f].mk,rt=rate(o.f);const bpx=o.dir>0?op:ex,spx=o.dir>0?ex:op;
    let fee,tax=0;if(mk==='TW'){fee=Math.max(20,Math.floor(o.q*bpx*0.001425*0.6))+Math.max(20,Math.floor(o.q*spx*0.001425*0.6));tax=Math.floor(o.q*spx*(yr(today())>=2017?0.0015:0.003))}else fee=(Math.max(3,o.q*bpx*0.001)+Math.max(3,o.q*spx*0.001))*rt;
    const pnl=(spx-bpx)*o.q*rt-fee-tax;S.cash+=pnl;S.fees+=fee;S.tax+=tax;S.real+=pnl;
    S.trades.push({d:today(),f:o.f,sd:o.dir>0?'B':'S',q:o.q,px:op,amt:Math.abs(o.q*op*rt),fee,tax,why:'當沖'+(o.dir>0?'多':'空')+'・'+how,pnl});
    pushNews(today(),'【當沖'+(o.dir>0?'做多':'做空')+'】'+SYM[o.f].name+' '+qfmt(o.f,o.q)+'：開盤 '+pfmt(op)+' → '+how+' '+pfmt(ex)+'，損益 '+(pnl>=0?'+':'')+fmt(pnl)+'。',pnl>=0?'air_up':'air_down',1);
  }
  S.dt=keep;
}

function creditDaily(pd,d){
  const days=Math.max(1,d-pd);let it=0;
  for(const f in S.mpos)it+=S.mpos[f].loan*CRR[SYM[f].mk].ir/365*days;
  for(const f in S.spos)if(CRR[SYM[f].mk].sf)it+=sval(f)*CRR[SYM[f].mk].sf/365*days;
  if(S.cash<0)it+=-S.cash*0.15/365*days;
  if(it){S.cash-=it;S.intPaid+=it}
  // 融券遇除權息：強制回補（台股）、補償股利（美股）
  for(const f in S.spos){const D=DAT[f];
    for(const v of D.div){if(SYM[f].mk==='TW'&&v.day>d&&v.day<=d+6&&traded(f)){shortCover(f,S.spos[f].q,'除權息強制回補');pushNews(d,'【強制回補】'+SYM[f].name+' 即將除權息，融券部位依規定強制回補。','st_police',1);break}
      if(SYM[f].mk==='US'&&v.day>pd&&v.day<=d&&S.spos[f]){const pay=S.spos[f].q*v.a*fx();S.cash-=pay;pushNews(d,'【放空補償股利】'+SYM[f].name+' 除息，放空者需支付股利 '+ntdF(pay)+'。','air_cash',1)}}
  }
  // 期貨每日結算
  for(const x of S.fut.slice()){const F=FUT[x.k];if(!traded(F.f))continue;const px=P(F.f),rt=F.mk==='TW'?1:fx();x.mg+=x.dir*x.n*F.mult*(px-x.last)*rt;x.last=px;
    if(x.mg<futMaint(x)/0.75*0.25){futClose(x.id,'砍倉');pushNews(d,'【期貨斷頭】保證金跌破風險指標 25%，'+F.n+' 被期貨商強制平倉！','st_skull',2);S._big=1}
    else if(x.mg<futMaint(x)&&!x.call){x.call=1;S.evq.push({k:'futcall',id:x.id})}else if(x.mg>=futMaint(x))x.call=0}
  // 信用帳戶維持率
  if(hasCredit()){const r=maintRatio();
    if(r<1.2||(S.call&&S.i>=S.call.dl&&r<1.3)){const n=liquidateCredit('斷頭');if(n){pushNews(d,'【斷頭】整戶維持率只剩 '+(r*100).toFixed(0)+'%，券商強制賣出你的信用部位！','st_skull',2);S._big=1;S.call=null}}
    else if(r<1.3){if(!S.call){S.call={dl:S.i+2};S.evq.push({k:'call'})}}else S.call=null}
  else S.call=null;
  // 違約交割
  if(S.cash<-1000&&S.i-(S.life.defAt||-999)>20&&!S.evq.some(e=>e.k==='default')){S.life.defAt=S.i;S.evq.push({k:'default'})}
}

function doCr(){

  else if(X.kind==='dt'){if(P(f)*q*rate(f)*0.2>S.cash){toast('現金不足','air_warn');return}S.dt.push({id:S.oid++,f,dir:X.dir,q,sl:X.sl,tp:X.tp});toast('已預約當沖，下個交易日執行','air_cal')}
  if(r!=='ok'){toast(r==='cash'?'現金不足':'部位不足','air_warn');return}
  if(X.kind!=='dt')toast(({mb:'融資買進 ',ms:'融資賣出 ',ss:'融券放空 ',sc:'融券回補 '})[X.kind]+SYM[f].name+' '+qfmt(f,q),'air_hand');
  closeSheet();save();render();

function stepDay(){
  if(S.i>=S.end)return false;
  const pd=today();S.i++;const d=today();
  for(const f of FILES){const D=DAT[f];while(D.ptr+1<D.n&&D.days[D.ptr+1]<=d)D.ptr++}
  // 分割／配股
  for(const f in SYM){const D=DAT[f];
    for(const s of D.spl)if(s.day>pd&&s.day<=d){
      const p=S.pos[f];
      if(p){const nq=SYM[f].mk==='CR'?p.q*s.r:Math.floor(p.q*s.r+1e-6);const add=nq-p.q;p.q=nq;
        pushNews(d,(SYM[f].mk==='TW'?'【配股】':'【股票分割】')+SYM[f].name+' 每股配發／分割比例 '+s.r.toFixed(3).replace(/\.?0+$/,'')+'，你的持股增加 '+qfmt(f,add)+'。','air_party',1)}
      for(const o of S.orders)if(o.f===f){o.q=Math.floor(o.q*s.r);o.px/=s.r}
      if(S.mpos[f])S.mpos[f].q=Math.floor(S.mpos[f].q*s.r+1e-6);if(S.spos[f])S.spos[f].q=Math.floor(S.spos[f].q*s.r+1e-6);
    }
    // 除息
    for(const v of D.div)if(v.day>pd&&v.day<=d){
      if(S.mpos[f]){const gm=S.mpos[f].q*v.a*(SYM[f].mk==='TW'?1:0.7*fx());S.cash+=gm;S.divIn+=gm}
      const p=S.pos[f];if(!p||p.q<=0)continue;
      let g=p.q*v.a,net,note='';
      if(SYM[f].mk==='TW'){net=g;if(g>=20000&&yr(d)>=2013){net=g*(1-0.0211);note='（扣二代健保補充保費 2.11%）'}}
      else{net=g*0.7*fx();note='（美股預扣 30% 股利稅）'}
      if(SYM[f].mk==='TW'){const yy=yr(d);S.life.divYr[yy]=(S.life.divYr[yy]||0)+g}
      S.cash+=net;S.divIn+=net;
      pushNews(d,'【除息】'+SYM[f].name+' 每股配息 '+curSym(f)+pfmt(v.a)+'，入帳 '+ntdF(net)+note+'。','air_cash',1);
    }
  }
  // 委託單撮合
  const keep=[];
  for(const o of S.orders){
    if(!traded(o.f)){keep.push(o);continue}
    const D=DAT[o.f],k=D.ptr,op=D.o[k],hi=D.h[k],lo=D.l[k];let fill=null;
    if(o.t==='L'&&o.sd==='B'){if(op<=o.px)fill=op;else if(lo<=o.px)fill=o.px}
    else if(o.t==='L'&&o.sd==='S'){if(op>=o.px)fill=op;else if(hi>=o.px)fill=o.px}
    else if(o.t==='T'){if(op<=o.px)fill=op;else if(lo<=o.px)fill=o.px} // 停損賣出
    if(fill==null){keep.push(o);continue}
    const r=execTrade(o.f,o.sd,o.q,fill,o.t==='T'?'停損':'限價');
    const nm=SYM[o.f].name;
    if(r==='ok')pushNews(d,'【成交】'+(o.t==='T'?'停損單觸發，':'')+(o.sd==='B'?'買進 ':'賣出 ')+nm+' '+qfmt(o.f,o.q)+' @ '+pfmt(fill),o.sd==='B'?'air_up':'air_down',1);
    else pushNews(d,'【委託取消】'+nm+' '+(r==='cash'?'現金不足':'庫存不足')+'，委託已刪除。','air_warn',1);
  }
  S.orders=keep;
  runDayTrades();dcaRun();creditDaily(pd,d);tipCheck();
  // 薪水
  const m=mo(d);
  if(S.sal&&m!==S.lastMo){S.cash+=S.sal;S.dep+=S.sal;S.bench.tw+=S.sal/P('IDX_TWII');S.bench.us+=S.sal/(P('SPY')*fx());pushNews(d,'【薪水入帳】'+ntdF(S.sal)+' 已存入交割帳戶。','air_cash')}
  if(m!==S.lastMo){if(S.life.rent)S.cash-=S.life.rent;lifeMonthly(d)}
  S.lastMo=m;
  // 基準 SPY 股利再投入
  for(const v of DAT.SPY.div)if(v.day>pd&&v.day<=d){S.bench.us+=S.bench.us*v.a*0.7/P('SPY')}
  // 新聞事件
  if(!S.blind){
    for(const e of EV)if(e.day>pd&&e.day<=d){pushNews(e.day,e.t,EVI[e.k],2);S._big=e}
    for(const f of ['IDX_TWII','IDX_GSPC']){
      if(!traded(f))continue;const ch=P(f)/prevC(f)-1,nm=f==='IDX_TWII'?'台股加權指數':'美股 S&P 500';
      if(Math.abs(ch)>=0.03)pushNews(d,nm+(ch>0?' 大漲 ':' 重挫 ')+pct(ch)+'，收在 '+fmt(P(f),0)+' 點。',ch>0?'air_up':'air_down');
      const ml=Math.floor(P(f)/1000);
      if(ml>S.mile[f]){S.mile[f]=ml;const lv=ml*1000;pushNews(d,nm+' 站上 '+fmt(lv)+' 點大關！','air_trophy')}
    }
    const b=P('BTC-USD');if(b>0){const l2=Math.floor(Math.log2(b));if(l2>S.mile.BTC&&b>=100){S.mile.BTC=l2;pushNews(d,'比特幣漲破 '+fmt(Math.pow(2,l2),0)+' 美元，再創新高！','air_rocket')}}
  }
  for(const f in S.pos){if(!traded(f))continue;const ch=P(f)/prevC(f)-1;if(Math.abs(ch)>=0.095&&SYM[f].mk==='TW')pushNews(d,'你持有的 '+SYM[f].name+(ch>0?' 漲停！':' 跌停！')+'（'+pct(ch)+'）',ch>0?'air_up':'air_down',1);else if(Math.abs(ch)>=0.08)pushNews(d,'你持有的 '+SYM[f].name+(ch>0?' 大漲 ':' 重挫 ')+pct(ch)+'。',ch>0?'air_up':'air_down',1)}
  recHist();
  const t=total();if(t>S.peak)S.peak=t;
  return true;
}

function adv(n){
  if(!S)return;const n0=S.news.length;let st=0;S._big=null;
  for(let k=0;k<n;k++){if(!stepDay())break;st++;if(S._big&&playT)break;if(S.evq&&S.evq.length)break}
  const fresh=S.news.slice(n0).filter(x=>x.k);
  fresh.slice(-3).forEach(x=>toast(x.t,x.ic));
  if(S._big&&playT){togglePlay()}
  if(S.evq&&S.evq.length&&playT)togglePlay();
  save();render();if(S.evq&&S.evq.length)setTimeout(nextLife,150);
  if(S.i>=S.end){if(playT)togglePlay();setTimeout(finish,300)}
}

function bars(){
  const f=detailF,D=DAT[f],k=D.ptr,[,cnt,agg]=RNG[rng];const out=[];const A=i=>adjF(f,D.days[i]);
  if(agg===1){const a=Math.max(0,k-cnt+1-60);for(let i=a;i<=k;i++){const a=A(i);out.push({d:D.days[i],o:D.o[i]/a,h:D.h[i]/a,l:D.l[i]/a,c:D.c[i]/a,v:D.v[i]*a})}}
  else{let cur=null,key=null;for(let i=0;i<=k;i++){const d=D.days[i];const kk=agg===5?Math.floor((d+5)/7):mo(d),a=A(i);if(kk!==key){if(cur)out.push(cur);cur={d,o:D.o[i]/a,h:D.h[i]/a,l:D.l[i]/a,c:D.c[i]/a,v:D.v[i]*a};key=kk}else{cur.h=Math.max(cur.h,D.h[i]/a);cur.l=Math.min(cur.l,D.l[i]/a);cur.c=D.c[i]/a;cur.v+=D.v[i]*a}}if(cur)out.push(cur)}
  return out;
}
function drawK(){
  const cv=$('kc');if(!cv)return;const W=cv.clientWidth,H=260,dpr=devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
  const all=bars();const cnt=RNG[rng][1];
  const ma=n=>all.map((b,i)=>{if(i<n-1)return null;let s=0;for(let j=i-n+1;j<=i;j++)s+=all[j].c;return s/n});
  const M=[ma(5),ma(20),ma(60)];
  const st=cnt?Math.max(0,all.length-cnt):0;const B=all.slice(st);const n=B.length;
  if(!n)return;
  const R=W-46,PH=190,VT=200,VH=52;
  let mx=-1e18,mn=1e18,vm=0;B.forEach((b,i)=>{mx=Math.max(mx,b.h);mn=Math.min(mn,b.l);vm=Math.max(vm,b.v);M.forEach(m=>{const v=m[st+i];if(v!=null){mx=Math.max(mx,v);mn=Math.min(mn,v)}})});
  const logS=(mx/mn>4);const tf=v=>logS?Math.log(v):v;const tmx=tf(mx),tmn=tf(mn),rg=(tmx-tmn)||1;
  const Y=v=>6+(PH-12)*(tmx-tf(v))/rg,bw=R/n,X=i=>i*bw+bw/2;
  c.font='10.5px sans-serif';c.lineWidth=1;
  for(let g=0;g<=4;g++){const y=6+(PH-12)*g/4;c.strokeStyle='#1a2233';c.beginPath();c.moveTo(0,y);c.lineTo(R,y);c.stroke();const tv=tmx-rg*g/4;c.fillStyle='#6c7890';c.fillText(pfmt(logS?Math.exp(tv):tv),R+3,y+4)}
  for(let i=0;i<n;i++){const b=B[i],up=b.c>=b.o,col=up?'#ff4d5e':'#1ec98b';c.strokeStyle=col;c.fillStyle=col;const x=X(i);
    c.beginPath();c.moveTo(x,Y(b.h));c.lineTo(x,Y(b.l));c.stroke();
    const y1=Y(Math.max(b.o,b.c)),y2=Y(Math.min(b.o,b.c)),w=Math.max(1,bw*0.7);c.fillRect(x-w/2,y1,w,Math.max(1,y2-y1));
    const vh=b.v/(vm||1)*VH;c.globalAlpha=.55;c.fillRect(x-w/2,VT+VH-vh,w,vh);c.globalAlpha=1}
  ['#ffcc5c','#c77dff','#4dabf7'].forEach((col,j)=>{c.strokeStyle=col;c.lineWidth=1.2;c.beginPath();let s=0;for(let i=0;i<n;i++){const v=M[j][st+i];if(v==null)continue;s++?c.lineTo(X(i),Y(v)):c.moveTo(X(i),Y(v))}c.stroke()});
  c.strokeStyle='#1a2233';c.beginPath();c.moveTo(0,VT-2);c.lineTo(R,VT-2);c.stroke();
  if(!S.blind){c.fillStyle='#6c7890';const fm=RNG[rng][2]>1||cnt>200?'m':'md';c.fillText(dstr(B[0].d,fm),2,H-1);const e=dstr(B[n-1].d,fm);c.fillText(e,R-c.measureText(e).width,H-1)}
  const ci=$('cinfo');
  const show=i=>{const b=B[i];ci.innerHTML=(S.blind?'':dstr(b.d)+'　')+'開 '+pfmt(b.o)+'　高 <span class="up">'+pfmt(b.h)+'</span>　低 <span class="dn">'+pfmt(b.l)+'</span>　收 '+pfmt(b.c)};
  if(cross!=null&&cross<n){const x=X(cross);c.strokeStyle='#ffffff70';c.setLineDash([3,3]);c.beginPath();c.moveTo(x,0);c.lineTo(x,VT+VH);c.stroke();c.beginPath();c.moveTo(0,Y(B[cross].c));c.lineTo(R,Y(B[cross].c));c.stroke();c.setLineDash([]);show(cross)}
  else show(n-1);
  const hit=e=>{const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;cross=Math.max(0,Math.min(n-1,Math.floor((t.clientX-r.left)/bw)));drawK()};
  cv.ontouchstart=hit;cv.ontouchmove=e=>{hit(e)};cv.ontouchend=()=>{cross=null;drawK()};cv.onmousemove=hit;cv.onmouseleave=()=>{cross=null;drawK()};
}

  h+='</div>';
  const cst=costs(f,O.sd,O.q,px);
  h+='<div class="sum"><div><span>成交金額</span><b>'+curSym(f)+fmt(cst.amt,mk==='TW'?0:2)+'</b></div><div><span>手續費</span><b>'+curSym(f)+fmt(cst.fee,mk==='TW'?0:2)+'</b></div>'+(cst.tax?'<div><span>證交稅</span><b>NT$'+fmt(cst.tax)+'</b></div>':'')+(mk!=='TW'?'<div><span>匯率（含 0.1% 價差）</span><b>'+(fx()*(O.sd==='B'?1.001:0.999)).toFixed(3)+'</b></div>':'')+
     '<div style="border-top:1px solid #222c40;margin-top:4px;padding-top:4px"><span>'+(O.sd==='B'?'預估扣款':'預估入帳')+'</span><b class="'+(O.sd==='B'?'up':'dn')+'" style="font-size:16px">'+ntdF(st.ntd)+'</b></div><div><span>可用現金</span><b>'+ntdF(S.cash)+'</b></div>';
  if(O.sd==='S'&&p){const pl=st.ntd-p.cost*Math.min(O.q,p.q)/p.q;h+='<div><span>預估損益</span><b class="'+cls(pl)+'">'+(pl>=0?'+':'')+fmt(pl)+'</b></div>'}
  h+='</div>';
  let err='';if(O.q<=0)err='請輸入數量';else if(O.sd==='B'&&O.t==='M'&&st.ntd>S.cash)err='現金不足';else if(O.sd==='S'&&O.q>maxS+1e-9)err='庫存不足';else if(O.t==='M'&&!open)err='今日休市';
  h+='<button class="bigbtn" style="'+(O.sd==='B'?'background:linear-gradient(135deg,#ff5f6d,#e0303f);color:#fff':'background:linear-gradient(135deg,#25d49a,#11a173);color:#fff')+(err?';opacity:.45':'')+'" onclick="placeOrder()">'+(err||(O.t==='M'?'確認'+(O.sd==='B'?'買進':'賣出'):'送出委託'))+'</button>';
  sheet(h,1);
}
function maxBuy(fr){const f=O.f,mk=SYM[f].mk,px=O.t==='M'?P(f):O.px;const budget=S.cash*fr;let q=budget/settle(f,'B',1,px).ntd;
  if(mk==='CR'){q=Math.floor(q*0.995*1e4)/1e4}else q=Math.floor(q);
  while(q>0&&settle(f,'B',q,px).ntd>budget)q-=mk==='CR'?0.0001:1;return Math.max(0,mk==='CR'?+q.toFixed(4):q)}
function placeOrder(){
  const f=O.f;if(O.q<=0)return;
  if(O.t==='M'){if(!traded(f))return;const r=execTrade(f,O.sd,O.q,P(f),'市價');
    if(r!=='ok'){toast(r==='cash'?'現金不足':'庫存不足','air_warn');return}
    toast((O.sd==='B'?'買進 ':'賣出 ')+SYM[f].name+' '+qfmt(f,O.q)+' @ '+pfmt(P(f)),O.sd==='B'?'air_up':'air_down');}
  else{
    if(O.sd==='S'&&O.q>(S.pos[f]?S.pos[f].q:0)+1e-9)return;
    // 限價買高於現價／限價賣低於現價 → 立即以收盤價成交
    if(traded(f)&&O.t==='L'&&((O.sd==='B'&&O.px>=P(f))||(O.sd==='S'&&O.px<=P(f)))){const r=execTrade(f,O.sd,O.q,P(f),'限價');if(r!=='ok'){toast('委託失敗：'+(r==='cash'?'現金不足':'庫存不足'),'air_warn');return}toast('已立即成交 @ '+pfmt(P(f)),'air_hand')}
    else{S.orders.push({id:S.oid++,f,sd:O.sd,t:O.t,px:O.px,q:SYM[f].mk==='CR'?+O.q.toFixed(4):Math.round(O.q),day:today()});toast('委託已送出：'+(O.t==='T'?'停損 ':'')+SYM[f].name+' @ '+pfmt(O.px),'air_brief')}
  }
  closeSheet();save();render();
}

// ====================== 結算 ======================
function finish(){
  if(!S)return;if(playT)togglePlay();closeDetail();
  const s=stats();const best=Math.max(s.rTW,s.rUS),ex=s.r-best;
  let g='D';if(s.r>0)g='C';if(s.r>Math.min(s.rTW,s.rUS))g='B';if(s.r>best)g='A';if(s.r>best+0.25*Math.max(1,Math.abs(best)+0.2)&&s.r>0.3)g='S';
  const B=bests();const o=B[S.sc];if(!o||s.r>o.r){B[S.sc]={g,r:s.r};localStorage.setItem('stockBest',JSON.stringify(B))}
  const msg={S:'傳奇操盤手！你大幅打敗了市場。',A:'厲害！你的績效贏過大盤。',B:'不錯，至少贏過其中一個大盤。',C:'有賺錢，但輸給了單純買大盤。',D:'這次虧損了…市場是最好的老師。'}[g];
  let h='<div style="text-align:center"><img src="'+ico(g<'C'?'air_trophy':g==='C'?'air_medal':'air_down')+'" style="width:72px"><div class="mut">'+esc(S.name)+'</div><div class="grade">'+g+'</div><div style="font-size:15px">'+msg+'</div></div>';
  if(S.blind)h+='<div class="card" style="margin-top:12px;text-align:center">這段歷史是：<b>'+dstr(CAL[S.s0])+' ～ '+dstr(today())+'</b></div>';
  h+='<div class="card" style="margin-top:12px"><div class="kv"><div><span>最終資產</span><b>'+ntd(total())+'</b></div><div><span>投入本金</span><b>'+ntd(S.dep)+'</b></div><div><span>你的報酬</span><b class="'+cls(s.r)+'">'+pct(s.r,1)+'</b></div><div><span>年化</span><b>'+(isNaN(s.cagr)?'-':pct(s.cagr,1))+'</b></div><div><span>台股大盤</span><b class="'+cls(s.rTW)+'">'+pct(s.rTW,1)+'</b></div><div><span>S&P 500</span><b class="'+cls(s.rUS)+'">'+pct(s.rUS,1)+'</b></div><div><span>最大回撤</span><b class="dn">-'+(s.mdd*100).toFixed(1)+'%</b></div><div><span>股利收入</span><b>'+ntd(S.divIn)+'</b></div></div></div>';
  h+='<button class="bigbtn" onclick="closeSheet();localStorage.removeItem(\'stockSim\');S=null;showStart()">回主選單</button>';
  S.i=S.end;save();localStorage.removeItem('stockSim');
  sheet(h,0,1);
}

// ====================== sheet ======================
function sheet(h,keep,lock){let o=$('ov');if(!o){o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML='<div class="sheet" id="sh"></div>';document.body.appendChild(o)}
  o.onclick=lock?null:(e=>{if(e.target===o)closeSheet()});const sh=$('sh'),st=sh.scrollTop;sh.innerHTML=h;if(keep)sh.scrollTop=st}
function closeSheet(){const o=$('ov');if(o)o.remove()}

  showStart();
})();
