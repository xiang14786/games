<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="遊戲盒">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>修仙家族模擬器</title>
<style>@font-face{font-family:'LXGW WenKai TC';font-weight:400;font-display:swap;src:url('assets/xian/wk-regular.woff2') format('woff2')}
@font-face{font-family:'LXGW WenKai TC';font-weight:700;font-display:swap;src:url('assets/xian/wk-bold.woff2') format('woff2')}
@font-face{font-family:'WK';src:local('LXGW WenKai TC')}
:root{--paper:#f2ead8;--paper2:#e9dec6;--ink:#231e18;--ink2:#4a4136;--dim:#8a7d6a;--red:#a8322a;--red2:#c8452c;--jade:#2f6b5e;--blue:#2f5d7b;--gold:#a87f2f;--line:rgba(60,45,30,.18);--card:rgba(255,252,244,.72)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#d9ccb0;color:var(--ink);font-family:'LXGW WenKai TC','WK','Kaiti TC','STKaiti','BiauKai','Noto Serif TC',serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{max-width:540px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;background:var(--paper) var(--tex);box-shadow:0 0 40px rgba(0,0,0,.25);overflow:hidden}
.ic{display:inline-block;width:1em;height:1em;vertical-align:-.14em;fill:currentColor}
.dim{color:var(--dim)} .red{color:var(--red)} .jade{color:var(--jade)} .gold{color:var(--gold)}
/* header */
#hd{position:relative;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background-size:cover;background-position:center bottom;border-bottom:1px solid var(--line);flex:none}
#hd .r1{display:flex;align-items:center;gap:10px}
.seal{width:46px;height:46px;flex:none;background:var(--red);color:#fbeee0;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;box-shadow:inset 0 0 0 2px rgba(255,240,220,.35),0 2px 6px rgba(120,20,10,.35);letter-spacing:-2px}
.fam b{font-size:21px;letter-spacing:2px;display:block;line-height:1.1}
.fam small{font-size:13.5px;color:var(--ink2)}
.res{margin-left:auto;text-align:right;font-size:15px;line-height:1.35}
.res b{font-size:17px}
#hd .r2{display:flex;gap:6px;margin-top:8px}
.btn{background:var(--ink);color:#f5ecd8;border-radius:10px;padding:9px 12px;font-size:16px;font-weight:700;letter-spacing:1px;box-shadow:0 2px 0 rgba(0,0,0,.25);display:inline-flex;align-items:center;justify-content:center;gap:5px}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.red{background:var(--red);color:#fff4e8}.btn.jade{background:var(--jade);color:#f2fff8}.btn.ghost{background:rgba(255,250,238,.7);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}.btn.gold{background:var(--gold);color:#fff8e6}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:8px}
.btn.on{background:var(--red)}
#hd .r2 .btn{flex:1}
/* body */
#bd{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 10px 16px;-webkit-overflow-scrolling:touch}
#nav{flex:none;display:flex;border-top:1px solid var(--line);background:linear-gradient(#efe5cf,#e6d9bd);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;padding:7px 0 6px;font-size:13.5px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:1px}
#nav button .ic{font-size:25px}
#nav button.on{color:var(--red)}
h2{font-size:20px;margin:6px 4px 10px;display:flex;align-items:center;gap:6px;letter-spacing:2px}
h2 .ic{color:var(--red)}
h2 small{font-size:14px;color:var(--dim);letter-spacing:0;margin-left:auto;font-weight:400}
h3{font-size:16.5px;margin:14px 4px 6px;color:var(--ink2);letter-spacing:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(80,60,30,.08)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
/* members */
.mem{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:7px;position:relative}
.mem:active{background:#fffaf0}
.mem.dead{opacity:.55;filter:grayscale(.8)}
.por{width:58px;height:58px;border-radius:50%;flex:none;background:#fbf6ea;border:3px solid var(--rc,#8a8173);overflow:hidden;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.por img{width:118%;height:118%;margin:-4% 0 0 -9%;display:block}
.por.big{width:96px;height:96px;border-width:4px}
.por.sm{width:40px;height:40px;border-width:2px}
.mem .nm{font-size:18px;font-weight:700;letter-spacing:1px}
.mem .nm small{font-size:13px;font-weight:400;color:var(--dim);margin-left:4px;letter-spacing:0}
.tagr{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tag{font-size:12.5px;padding:1px 7px;border-radius:20px;background:rgba(60,45,30,.08);color:var(--ink2);white-space:nowrap}
.root{font-size:12.5px;padding:1px 6px;border-radius:5px;color:#fff;font-weight:700}
.bar{height:6px;background:rgba(60,45,30,.12);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--jade),#5aa38e);border-radius:4px}
.bar.red i{background:linear-gradient(90deg,var(--red),#d86a4a)}
.realm{font-size:14.5px;font-weight:700}
.badge{position:absolute;right:8px;top:6px;font-size:12px;padding:1px 6px;border-radius:6px;background:var(--red);color:#fff}
.badge.b2{background:var(--blue)}.badge.b3{background:var(--gold)}
.filters{display:flex;gap:5px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 11px;border-radius:20px;font-size:14.5px;background:rgba(255,250,238,.7);box-shadow:inset 0 0 0 1px var(--line)}
.chip.on{background:var(--ink);color:#f5ecd8}
/* sheet & modal */
.ov{position:fixed;inset:0;background:rgba(30,22,14,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fd .18s}
@keyframes fd{from{opacity:0}}
.sheet{width:100%;max-width:540px;max-height:92%;overflow-y:auto;background:var(--paper) var(--tex);border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));animation:su .22s ease-out;position:relative}
@keyframes su{from{transform:translateY(30%);opacity:.4}}
.ov.center{align-items:center;padding:16px}
.ov.center .sheet{border-radius:16px;max-height:88%;border:1px solid rgba(80,60,30,.3)}
.x{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:rgba(60,45,30,.1);font-size:18px}
.sheet h2{margin-top:2px;padding-right:40px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;font-size:15px}
.kv div{display:flex;justify-content:space-between;gap:6px}
.kv span{color:var(--dim)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.acts .btn{flex:1 1 30%}
.evt .eic{width:72px;height:72px;margin:4px auto 6px;display:block;color:var(--red)}
.evt .tit{text-align:center;font-size:23px;font-weight:700;letter-spacing:3px}
.evt .body{font-size:16.5px;line-height:1.75;margin:10px 2px 12px}
.evt .opts{display:flex;flex-direction:column;gap:7px}
.evt .opts .btn{padding:11px;font-size:16.5px}
/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));width:min(94%,520px);z-index:70;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.tst{pointer-events:auto;background:rgba(252,246,232,.97);border:1px solid rgba(80,60,30,.3);border-left:5px solid var(--ink);border-radius:10px;padding:9px 12px;font-size:15px;line-height:1.55;box-shadow:0 6px 18px rgba(40,25,10,.25);display:flex;gap:9px;align-items:flex-start;animation:su .25s}
.tst.g{border-left-color:var(--jade)}.tst.d{border-left-color:#555}.tst.b{border-left-color:var(--red)}
.tst .ic{font-size:26px;flex:none;color:var(--red);margin-top:2px}
/* grid buildings */
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px 8px;text-align:center;position:relative;min-height:104px}
.bt .ic{font-size:38px;color:var(--ink)}
.bt b{display:block;font-size:16px;margin-top:2px}
.bt small{font-size:12.5px;color:var(--dim)}
.bt .lv{position:absolute;right:6px;top:5px;font-size:12px;background:var(--red);color:#fff;border-radius:6px;padding:0 5px}
.bt.empty{border-style:dashed;opacity:.8}
.bt.empty .ic{color:var(--dim)}
.land{border-radius:14px;overflow:hidden;position:relative;height:150px;margin-bottom:10px;border:1px solid var(--line);background-size:cover;background-position:center}
.land .info{position:absolute;left:12px;bottom:10px;color:#fbf3e2;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.land .info b{font-size:26px;letter-spacing:4px}
.land .qi{position:absolute;right:10px;top:10px;background:rgba(20,15,10,.55);color:#f3e6c8;border-radius:10px;padding:4px 10px;font-size:14px;line-height:1.4;text-align:right}
/* inventory */
.inv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.it{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 2px 5px;text-align:center;position:relative}
.it .ic{font-size:30px}
.it b{display:block;font-size:13px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it i{position:absolute;right:4px;top:2px;font-style:normal;font-size:13px;font-weight:700;color:var(--red)}
.g1{color:#6c7a5c}.g2{color:#2f6b8b}.g3{color:#7a4aa8}.g4{color:#c0762a}.g5{color:#c8352a}.g6{color:#d4a017}
.rec{display:flex;gap:10px;align-items:center}
.rec .ic{font-size:34px;flex:none}
.need{font-size:13.5px;color:var(--ink2)}
.need .no{color:var(--red)}
/* map */
#mapw{position:relative;overflow:auto;height:calc(100vh - 260px);min-height:360px;border-radius:12px;border:1px solid var(--line);background:#e8dcc0}
#mapw svg{display:block}
.mloc{cursor:pointer}
/* battle */
#bat{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;background:#1a1612}
#bat .in{width:100%;max-width:540px;height:100%;display:flex;flex-direction:column;background-size:cover;background-position:center;position:relative}
.side{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px}
.u{width:92px;text-align:center;color:#f3e8d2;position:relative;transition:transform .15s}
.u .por{margin:0 auto;width:62px;height:62px;border-color:#d8c49a}
.u .bic{width:62px;height:62px;margin:0 auto;border-radius:50%;background:rgba(40,30,20,.6);border:3px solid #8a3a2a;display:flex;align-items:center;justify-content:center;font-size:38px;color:#f0d8b0}
.u b{display:block;font-size:13.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #000}
.u small{font-size:11.5px;color:#d8c8a8}
.u .hp{height:6px;background:rgba(0,0,0,.5);border-radius:4px;overflow:hidden;margin-top:2px}
.u .hp i{display:block;height:100%;background:linear-gradient(90deg,#c83a2a,#e8763a);transition:width .25s}
.u.dead{opacity:.3;filter:grayscale(1)}
.u.hit{animation:shake .3s}
.u.act{transform:scale(1.12)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.dmg{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-size:22px;font-weight:700;color:#ffd38a;text-shadow:0 2px 4px #000;animation:up .8s forwards;pointer-events:none;white-space:nowrap}
.dmg.crit{color:#ff6a4a;font-size:28px}
@keyframes up{to{transform:translate(-50%,-40px);opacity:0}}
.blog{flex:1;display:flex;align-items:center;justify-content:center;color:#f3e3c0;font-size:20px;text-align:center;padding:0 16px;text-shadow:0 2px 6px #000;letter-spacing:2px}
.skillfx{font-size:30px;color:#ffe2a8;font-weight:700;letter-spacing:6px;animation:pop .5s}
@keyframes pop{from{transform:scale(1.6);opacity:0}}
.bres{position:absolute;inset:0;background:rgba(10,8,6,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#f4e8cf;padding:20px;text-align:center;animation:fd .3s}
.bres .big{font-size:58px;font-weight:700;letter-spacing:12px}
.vs{text-align:center;color:#d8c49a;font-size:15px;padding:2px}
/* title */
#title{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;background-size:cover;background-position:center;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) 16px 30px}
#title h1{font-size:54px;letter-spacing:10px;margin:40px 0 0;writing-mode:horizontal-tb;text-shadow:0 2px 8px rgba(255,250,235,.9)}
#title .sub{font-size:16px;letter-spacing:6px;color:var(--ink2);margin-bottom:24px}
#title .btn{width:240px;padding:13px;font-size:19px;margin:6px 0}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.pick button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;font-size:13.5px;line-height:1.45;color:var(--ink2)}
.pick button b{display:flex;align-items:center;gap:6px;font-size:18px;color:var(--ink)}
.pick button .ic{font-size:30px}
.pick button.on{background:#fff8e8;box-shadow:inset 0 0 0 2px var(--red)}
input.txt{font-family:inherit;font-size:20px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#fffaf0;width:100%;color:var(--ink);text-align:center}
.lbl{font-size:16px;font-weight:700;margin:14px 0 6px;align-self:flex-start;letter-spacing:2px}
.tree{font-size:15px;line-height:1.9}
.tree .tn{display:inline-flex;align-items:center;gap:4px}
.tree ul{list-style:none;margin:0;padding-left:16px;border-left:1px dashed rgba(60,45,30,.3)}
.tree>ul{border:0;padding-left:0}
.logl{font-size:14.5px;line-height:1.6;padding:5px 2px;border-bottom:1px dashed var(--line)}
.logl.g{color:var(--jade)}.logl.d{color:#6a5a4a}.logl.b{color:var(--red)}
.goal{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.goal .ic{font-size:28px;flex:none}
.goal.done .ic{color:var(--gold)}
.goal:not(.done){opacity:.7}
.pbar{display:flex;align-items:center;gap:6px;font-size:13.5px}
.sel{box-shadow:inset 0 0 0 2px var(--red);background:#fff6e6}
.empty{text-align:center;color:var(--dim);padding:24px 8px;font-size:15px;line-height:1.7}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:16px}
.sw{width:50px;height:28px;border-radius:20px;background:#c8bca2;position:relative;flex:none}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--jade)}.sw.on::after{left:25px}
#gbHome{display:none}
</style></head>

// ======================================================================
const R = (a, b) => a + Math.random() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const chance = p => Math.random() < p;
const gauss = (m, s) => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return m + s * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const wpick = (arr, wf) => { const t = arr.reduce((s, x) => s + wf(x), 0); let r = Math.random() * t; for (const x of arr) { r -= wf(x); if (r <= 0) return x; } return arr[arr.length - 1]; };
const fmt = n => { n = Math.round(n); if (Math.abs(n) >= 1e8) return (n / 1e8).toFixed(1) + '億'; if (Math.abs(n) >= 1e4) return (n / 1e4).toFixed(n >= 1e5 ? 0 : 1) + '萬'; return n.toLocaleString(); };

function rootMult(root) { if (!root || !root.length) return 0; if (root.length === 1 && VARS.includes(root[0])) return 3.6; return [0, 3.0, 2.0, 1.25, 0.72, 0.42][root.length]; }
function rootName(root) { if (!root || !root.length) return '無靈根'; if (root.length === 1) return (VARS.includes(root[0]) ? '異' : '天') + '靈根'; return ['', '', '雙', '三', '偽', '廢'][root.length] + '靈根'; }
function rootGrade(root) { if (!root || !root.length) return 0; if (root.length === 1) return 5; return [0, 5, 4, 3, 2, 1][root.length]; }
function genRoot(bonus = 0, prefer = []) {
  // bonus: 父母優秀程度 -1~+2
  if (chance(Math.max(0.03, 0.22 - bonus * 0.06))) return [];
  const w = [0, 0.025 + bonus * 0.02, 0.1 + bonus * 0.04, 0.3, 0.33 - bonus * 0.05, 0.245 - bonus * 0.05].map(x => Math.max(0.01, x));
  let n = 1, r = Math.random() * w.reduce((a, b) => a + b, 0); for (let i = 1; i <= 5; i++) { r -= w[i]; if (r <= 0) { n = i; break; } }
  if (n === 1 && chance(0.18 + bonus * 0.04)) return [pick(VARS)];
  const pool = ELS.slice(), out = [];
  for (const p of prefer) if (ELS.includes(p) && out.length < n && chance(0.55)) { out.push(p); pool.splice(pool.indexOf(p), 1); }
  while (out.length < n) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  return out;
}

    m.r = nr; m.s = 0; m.exp = 0;
    if (nr === 10) { log(`${fullName(m)} 突破至渡劫期，天劫將至！`, 'g', m.id); }
    else log(`${fullName(m)} 突破成功，晉入${REALMS[nr].n}期！`, 'g', m.id);
    S.prestige += Math.round(Math.pow(3, nr - 1) * 5);
    checkFirst(nr, m);
    return { ok: true, msg: `突破成功！晉入${REALMS[nr].n}期，壽元增至 ${lifespan(m)} 年。` };
  }
  // 失敗
  m.exp *= 0.65; m.inj = Math.max(m.inj, RI(4, 10));
  const trib = REALMS[nr].trib || 0;
  if (trib && chance(trib)) {
    if (m.blood && m.blood.k === 'fenghuang' && m.blood.pur > 0.5 && !m.reborn) { m.reborn = 1; m.inj = 24; log(`${fullName(m)} 渡劫失敗，鳳凰血脈燃燒，浴火重生！`, 'g', m.id); return { ok: false, msg: '天劫降下，肉身盡毀……但鳳凰血脈讓他浴火重生！' }; }
    die(m, '渡雷劫失敗，身死道消'); return { ok: false, dead: true, msg: '雷劫轟然落下，身死道消……' };
  }
  log(`${fullName(m)} 衝擊${REALMS[nr].n}失敗，修為受損。`, 'b', m.id);
  return { ok: false, msg: `突破失敗，修為受損，需要休養 ${m.inj} 個月。` };
}
function checkFirst(r, m) { const k = 'first' + r; if (!S.goals[k] && r >= 2) { S.goals[k] = S.t; const rew = Math.round(100 * Math.pow(3.2, r - 2)); S.stones += rew; S.prestige += rew / 4; pushNews(`家族史上第一位${REALMS[r].n}修士誕生：${fullName(m)}！家族威望大增，族中賞賜 ${fmt(rew)} 靈石。`, 'meditation'); } }

function die(m, cause) {
  m.dead = true; m.deathT = S.t; m.cause = cause; m.job = 'cult';
  if (m.gear) { const g = gearOf(m); if (g) g.owner = null; m.gear = null; }
  log(`${fullName(m)}（${realmName(m.r, m.s)}，享年 ${Math.floor(age(m))}）${cause}。`, 'd', m.id);
  if (S.leader === m.id) { const nx = famMembers().filter(x => !x.out).sort((a, b) => b.r - a.r || b.s - a.s || age(b) - age(a))[0]; if (nx) { S.leader = nx.id; log(`${fullName(nx)} 接任家主。`, 'g', nx.id); pushNews(`家主 ${fullName(m)} 逝世，${fullName(nx)} 繼任為新一代家主。`, 'tombstone'); } }
}

// ---------------- 物品 ----------------
function addMat(id, n) { S.inv[id] = (S.inv[id] || 0) + n; }
function hasMats(need, k = 1) { return Object.entries(need).every(([id, n]) => (S.inv[id] || 0) >= n * k); }
function useMats(need, k = 1) { for (const [id, n] of Object.entries(need)) S.inv[id] -= n * k; }
function rollGrade(max) { const w = []; for (let g = 1; g <= max; g++) w.push([g, Math.pow(2.6, -g)]); return wpick(w, x => x[1])[0]; }
function genGear(g, t) {
  const T = t ? GEAR_T.find(x => x.t === t) : pick(GEAR_T);
  const base = [0, 0.18, 0.4, 0.7, 1.1, 1.7, 2.6][g];
  return { id: S.nextId++, n: pick(GEAR_PRE) + T.n, t: T.t, ic: T.ic, g, atk: +(base * T.atk * R(0.85, 1.15)).toFixed(2), def: +(base * (T.def || 0.05) * R(0.85, 1.15) + 0.03 * g).toFixed(2), owner: null };
}
const FORGE_NEED = [null, { o1: 6 }, { o2: 6, o1: 6 }, { o3: 6, o2: 8 }, { o4: 6, o3: 10 }, { o5: 5, o4: 10 }];
const FORGE_SK = [0, 0, 18, 38, 60, 82];

// 煉製：本月爐次
function craftCap(job) { return home().filter(m => m.job === job && age(m) >= 14).reduce((s, m) => s + 1 + Math.floor(m.sk[job === 'talis' ? 'talis' : job] / 40), 0); }
function bestCrafter(job) { return home().filter(m => m.job === job && age(m) >= 14).sort((a, b) => b.sk[job] - a.sk[job])[0]; }
function craftRate(kind, rec, m) {
  const sk = m ? m.sk[kind] : 0, lv = blv(kind === 'alchemy' ? 'alchemy' : kind === 'forge' ? 'forge' : 'talisman');
  return clamp(0.4 + (sk - rec.sk) / 70 + (lv - rec.lv) * 0.08, 0.04, 0.96);
}
function doCraft(kind, key) {
  const job = kind; const m = bestCrafter(job);
  if (!m) return { ok: false, msg: '沒有族人在' + JOBS[job].n + '，先去族人頁面指派工作。' };
  S.used[job] = S.used[job] || 0; if (S.used[job] >= craftCap(job)) return { ok: false, msg: '本月的爐次已經用完了，下個月再來。' };
  let rec, need, bl;
  if (kind === 'alchemy') { rec = PILLS[key]; need = rec.need; bl = blv('alchemy'); }
  else if (kind === 'talis') { rec = TALIS[key]; need = rec.need; bl = blv('talisman'); }
  else { const g = +key; rec = { lv: g, sk: FORGE_SK[g], n: GEAR_G[g - 1] + '法器' }; need = FORGE_NEED[g]; bl = blv('forge'); }
  if (bl < rec.lv) return { ok: false, msg: '建築等級不足' };
  if (!hasMats(need)) return { ok: false, msg: '材料不足' };
  useMats(need); S.used[job]++;
  const p = craftRate(kind, rec, m);
  m.sk[kind] = Math.min(100, m.sk[kind] + R(0.4, 1.4) * (rec.sk >= m.sk[kind] - 15 ? 1.4 : 0.6) * (1 + wit(m) / 200));
  if (!chance(p)) { return { ok: false, fail: 1, msg: `${fullName(m)} 煉製失敗，材料化為灰燼。（成功率 ${Math.round(p * 100)}%）` }; }
  if (kind === 'alchemy') { const n = 1 + (chance(m.sk.alchemy / 160) ? 1 : 0) + (chance(m.sk.alchemy / 400) ? 1 : 0); S.pills[key] = (S.pills[key] || 0) + n; S.stat.pills += n; return { ok: true, msg: `${fullName(m)} 成功煉出 ${rec.n} ×${n}！` }; }
  if (kind === 'talis') { const n = 2 + Math.floor(m.sk.talis / 35); S.talis[key] = (S.talis[key] || 0) + n; return { ok: true, msg: `${fullName(m)} 繪成 ${rec.n} ×${n}！` }; }
  const g = genGear(+key); S.gears.push(g); S.stat.gears++; return { ok: true, msg: `${fullName(m)} 鍛造出${GEAR_G[g.g - 1]}法器「${g.n}」！`, gear: g };
}

// ---------------- 建築 ----------------
function slots() { return 4 + homeLoc().L; }
function usedSlots() { return Object.values(S.build).filter(x => x > 0).length; }
function buildCost(k) { const lv = blv(k); const c = BUILDS[k].cost[lv]; return c ? { st: c[0], mats: c[1] } : null; }
function canBuild(k) {
  const c = buildCost(k); if (!c) return '已達最高等級';
  if (BUILDS[k].vein && !homeLoc().vein) return '族地沒有靈礦脈';
  if (blv(k) === 0 && usedSlots() >= slots()) return '靈山空地不足（靈脈等級越高空地越多）';
  const maxLv = Math.max(1, ...living().map(m => m.r)) + 1; if (blv(k) + 1 > maxLv) return `需要家族出現更高境界的修士（目前最多 ${maxLv} 級）`;
  if (S.stones < c.st) return '靈石不足'; if (!hasMats(c.mats)) return '材料不足';
  return null;
}
function doBuild(k) { const e = canBuild(k); if (e) return e; const c = buildCost(k); S.stones -= c.st; useMats(c.mats); S.build[k] = blv(k) + 1; log(`${BUILDS[k].n}${S.build[k] > 1 ? '升級至 ' + S.build[k] + ' 級' : '落成'}。`, 'n'); return null; }

// ---------------- 經濟 ----------------
function workForce(job) { return home().filter(m => m.job === job && age(m) >= 12).reduce((s, m) => s + 0.6 * (1 + m.sk[job] / 80), 0); }
function income() {
  const out = { stones: 0, herbs: 0, ores: 0, tax: 0, market: 0, mine: 0, lands: 0, salary: 0, upkeep: 0 };
  const f = blv('field'), mi = blv('mine'), mk = blv('market');
  out.herbs = f ? f * 2.6 * (0.35 + workForce('farm')) : 0;
  out.mine = mi && homeLoc().vein ? mi * mi * 7 * (0.35 + workForce('mine')) : 0; out.ores = mi && homeLoc().vein ? mi * 1.8 * (0.35 + workForce('mine')) : 0;
  const greedy = home().some(m => m.job === 'trade' && m.traits.includes('tancai'));
  out.market = mk ? mk * mk * 9 * (0.4 + workForce('trade')) * (greedy ? 1.2 : 1) * (1 + Math.min(0.5, S.prestige / 200000)) : 0;
  for (const l of S.locs.filter(l => l.owner === 'me')) { out.tax += l.pop * 0.03; if (l.id !== S.home) out.lands += l.L * l.L * 3; }
  out.salary = famMembers().reduce((s, m) => s + SALARY[m.r], 0);
  out.upkeep = blv('defense') ? BUILDS.defense.upkeep[blv('defense') - 1] : 0;
  out.stones = out.mine + out.market + out.tax + out.lands - out.salary - out.upkeep;
  return out;
}

// ---------------- 每月推進 ----------------
const NEWS = [];
function pushNews(txt, ic = 'scroll-unfurled', k = 'n') { NEWS.push({ txt, ic, k }); log(txt, k); }

function monthTick() {
  S.t++; S.used = {};
  const inc = income();
  S.stones += inc.stones;
  for (let i = 0; i < Math.floor(inc.herbs + Math.random()); i++) addMat('h' + rollGrade(Math.min(5, blv('field'))), 1);
  for (let i = 0; i < Math.floor(inc.ores + Math.random()); i++) addMat('o' + rollGrade(Math.min(5, blv('mine'))), 1);
  if (S.bumper && S.bumper > S.t) for (let i = 0; i < Math.floor(inc.herbs); i++) addMat('h' + rollGrade(Math.min(5, blv('field'))), 1);
  if (S.stones < 0) { let sold = 0; for (const k of ['h1', 'o1', 'h2', 'o2', 'yao', 'h3', 'o3']) while (S.stones < 0 && (S.inv[k] || 0) > 0) { S.inv[k]--; S.stones += MATS[k].v * 0.8; sold++; } if (sold && month(S.t) === 1) log(`靈石不足，管事變賣了 ${sold} 份材料抵債。`, 'b'); }
  if (S.stones < 0) { for (const m of famMembers()) m.loyal -= 2; if (month(S.t) === 1) pushNews('家族靈石入不敷出，發不出俸祿，族人怨聲載道（忠誠下降）。', 'coins', 'b'); }
  // 族人
  for (const m of S.members) {
    if (m.dead || m.left) continue;
    if (age(m) >= lifespan(m)) {
      if (m.blood && m.blood.k === 'fenghuang' && m.blood.pur > 0.6 && !m.reborn && m.r >= 3) { m.reborn = 1; m.lifeBonus += Math.round(lifespan(m) * 0.3); log(`${fullName(m)} 大限將至，鳳凰血脈涅槃，延壽 ${Math.round(lifespan(m) * 0.23)} 年！`, 'g', m.id); }
      else { die(m, '壽元耗盡，坐化而去'); continue; }
    }
    if (m.inj > 0) { m.inj -= 1 + (blv('arena') >= 2 ? 0.5 : 0) + bfx(m, 'heal'); if (m.inj <= 0) { m.inj = 0; if (m.job === 'rest') m.job = 'cult'; } }
    // 開靈根
    if (m.r === 0 && m.root.length && age(m) >= 8) { m.r = 1; m.s = 0; m.exp = 0; if (!m.out) log(`${fullName(m)} 引氣入體，踏上仙途。`, 'n', m.id); }
    if (m.r >= 1 && !m.away || m.away && m.away.type === 'travel') {
      const rate = cultRate(m);
      if (rate > 0 && !(m.r >= manualCap(m) + 1 && m.s === REALMS[m.r].sub - 1)) m.exp += rate;
      while (m.s < REALMS[m.r].sub - 1 && m.exp >= needExp(m.r, m.s)) { m.exp -= needExp(m.r, m.s); m.s++; }
      if (m.r === 1 && m.s === 8 && m.exp >= needExp(1, 8) && !m.readyN) { m.readyN = 1; }
      if (isReady(m)) {
        m.exp = Math.min(m.exp, needExp(m.r, m.s) * 1.5);
        if (S.auto.br && !m.away && !m.inj && m.r < 10) {
          const p = breakChance(m, S.auto.pill);
          if (p >= S.auto.brMin || (m.r + 1 <= 2 && p >= 0.3) || age(m) > lifespan(m) - 15) { const r = tryBreak(m, S.auto.pill); if (r.ok || r.dead) NEWS.push({ txt: `${fullName(m)}：${r.msg}`, ic: r.ok ? 'meditation' : 'tombstone', k: r.ok ? 'g' : 'd' }); }
        }
      }
    }
    if (m.r === 10 && m.exp >= needExp(10, 0) && !m.away) ascendCheck(m);
    // 技藝自然成長
    if (JOBS[m.job] && ['farm', 'mine', 'trade'].includes(m.job)) m.sk[m.job] = Math.min(100, m.sk[m.job] + R(0.1, 0.4) * (1 + wit(m) / 100));
    if (m.loyal < 100 && S.stones >= 0) m.loyal += 0.15;
    // 遊歷/外出
    if (m.away) awayTick(m);
  }
  // 生育
  for (const m of S.members) {
    if (m.dead || m.left || m.sex !== 0 || !m.spouse) continue;
    const h = M(m.spouse); if (!h || h.dead || h.left || m.away || h.away) continue;
    const a = age(m); if (a < 18 || a > Math.min(lifespan(m) * 0.62, 45 + m.r * 60)) continue;
    const fert = [1, 1, 0.55, 0.35, 0.2, 0.1, 0.05, 0.03, 0.02, 0.015, 0.01][Math.max(m.r, h.r)];
    const fmN = famMembers().length, crowd = fmN >= popCap() ? 0 : fmN >= popCap() * 0.85 ? 0.35 : 1;
    if (chance(0.028 * fert * crowd * (m.kidsN >= 3 ? 0.6 : 1))) birth(m, h);
  }
  // 遊歷事件等
  if (month(S.t) === 1) yearTick();
  worldMonth();
  monthEvents();
  checkGoals();
  if (S.leader && M(S.leader).dead) { const nx = famMembers().filter(x => !x.out)[0]; S.leader = nx ? nx.id : null; }
  if (!famMembers().length) S.over = 1;
}

function birth(mom, dad) {
  const famSide = mom.sur === S.fam.sur && !mom.out ? mom : dad;
  const gen = Math.max(mom.gen, dad.gen) + 1;
  const pg = (rootGrade(mom.root) + rootGrade(dad.root)) / 2; // 0~5
  let bonus = (pg - 2.2) / 2 + bfx(mom, 'root') * 0.5 + bfx(dad, 'root') * 0.5 + (S.flags.jade ? 0.6 : 0);
  const pur = ((mom.blood ? mom.blood.pur : 0) + (dad.blood ? dad.blood.pur : 0)) / 2 * R(0.9, 1.05);
  const bk = (mom.blood || dad.blood || {}).k;
  const kid = newMember({
    sur: famSide.sur === S.fam.sur ? S.fam.sur : dad.sur, gen, father: dad.id, mother: mom.id, born: S.t,
    root: genRoot(bonus, [...mom.root, ...dad.root, bk ? BLOODS[bk].el : null].filter(Boolean)),
    wit: (mom.wit + dad.wit) / 2 + gauss(0, 12), bone: (mom.bone + dad.bone) / 2 + gauss(0, 12), luck: gauss(50, 15), charm: (mom.charm + dad.charm) / 2 + gauss(0, 12),
    blood: bk ? { k: bk, pur: clamp(pur, 0, 1) } : null, out: false,
  });
  mom.kids.push(kid.id); dad.kids.push(kid.id); mom.kidsN = (mom.kidsN || 0) + 1;
  S.stat.born++;
  log(`${fullName(dad)} 與 ${fullName(mom)} 喜獲${kid.sex ? '麟兒' : '千金'}，取名 ${fullName(kid)}。`, 'g', kid.id);
  if (kid.root.length && rootGrade(kid.root) >= 4) pushNews(`${fullName(kid)} 出生時異象紛呈——${kid.root.join('')}${rootName(kid.root)}！家族上下歡騰。`, 'sparkles', 'g');
  return kid;
}

function yearTick() {
  // 年度：人口、靈脈、AI 勢力
  for (const l of S.locs) { if (l.owner) l.pop = Math.round(l.pop * (1 + R(0.005, 0.03))); }
  for (const f of S.forces) forceYear(f);
  S.prestige += living().filter(m => !m.out).reduce((s, m) => s + m.r * m.r * 0.3, 0);
}

// ---------------- 外出：遊歷 / 秘境 / 拜師 ----------------
function sendTravel(m, months) { m.away = { type: 'travel', until: S.t + months, start: S.t, gain: { stones: 0, mats: {}, exp: 0, items: [] }, notes: [] }; m.job = 'cult'; log(`${fullName(m)} 出門遊歷，預計 ${months} 個月。`, 'n', m.id); }
function awayTick(m) {
  const a = m.away;
  if (a.type === 'travel' && (S.t - a.start) % 3 === 0) travelEvent(m);
  if (m.dead) return;
  if (S.t >= a.until) {
    if (a.type === 'travel') {
      const g = a.gain; S.stones += g.stones; for (const [k, v] of Object.entries(g.mats)) addMat(k, v);
      const lines = a.notes.slice(-6).join('<br>');
      NEWS.push({ txt: `${fullName(m)} 遊歷歸來。<br>${lines || '一路平安，略有所得。'}<br><span class="dim">帶回：靈石 ${fmt(g.stones)}${Object.entries(g.mats).map(([k, v]) => `、${MATS[k].n}×${v}`).join('')}</span>`, ic: 'mountain-road', k: 'g', who: m.id });
      log(`${fullName(m)} 遊歷歸來。`, 'n', m.id); S.stat.travel++;
    } else if (a.type === 'sect') {
      const f = S.forces.find(x => x.id === a.f); m.away = null;
      const gain = RI(1, 2); for (let i = 0; i < gain; i++) { if (m.s < REALMS[m.r].sub - 1) m.s++; else if (m.r < 5) { m.r++; m.s = 0; } }
      if (f) f.rel = Math.min(100, f.rel + 15);
      if (chance(0.6)) { const mn = genManual(clamp(Math.floor(m.r / 2), 0, 3), m.root[0]); S.manuals.push(mn); }
      NEWS.push({ txt: `${fullName(m)} 在${f ? f.n : '宗門'}學藝期滿歸來，已是${realmName(m.r, m.s)}！${chance(0.6) ? '還帶回了宗門賜下的功法。' : ''}`, ic: 'pagoda', k: 'g', who: m.id });
      return;
    }
    m.away = null;
  }
}
function travelEvent(m) {
  const a = m.away, L = luck(m), P = realmPower(m.r, m.s);
  const roll = Math.random() * 100 + (L - 50) * 0.4;
  if (roll < 12) { // 遇敵
    const br = clamp(m.r + (chance(0.35) ? 1 : 0) - (chance(0.3) ? 1 : 0), 1, 9), bs = RI(0, REALMS[br].sub - 1); const b = pick(BEASTS);
    const res = battle([unitFrom(m)], [mkEnemy(b[0], br, bs, b[1], 'beast')], { quick: 1 });
    if (res.win) { a.gain.mats[br >= 4 ? 'yao2' : 'yao'] = (a.gain.mats[br >= 4 ? 'yao2' : 'yao'] || 0) + 1; a.notes.push(`擊殺${realmName(br, bs)}妖獸「${b[0]}」，取得妖丹。`); m.exp += P * 2; }
    else {
      if (S.talis.escape > 0) { S.talis.escape--; a.notes.push(`被${b[0]}重創，靠遁地符逃過一劫。`); m.inj = Math.max(m.inj, 6); }
      else if (chance(br > m.r ? 0.4 : 0.12) && !m.traits.includes('jimin')) { die(m, `遊歷途中遭${b[0]}襲擊，殞落他鄉`); NEWS.push({ txt: `噩耗：${fullName(m)} 遊歷途中遭妖獸「${b[0]}」襲擊，殞落他鄉……`, ic: 'tombstone', k: 'd', who: m.id }); return; }
      else { a.notes.push(`與${b[0]}激戰落敗，負傷逃走。`); m.inj = Math.max(m.inj, RI(4, 10)); }
    }
  } else if (roll < 30) { const v = Math.round(R(20, 60) * Math.pow(2.4, m.r)); a.gain.stones += v; a.notes.push(`替人除妖，得靈石 ${fmt(v)}。`); }
  else if (roll < 48) { const g = clamp(rollGrade(Math.min(5, m.r + 1)), 1, 5); const k = (chance(0.6) ? 'h' : 'o') + g; a.gain.mats[k] = (a.gain.mats[k] || 0) + RI(1, 4); a.notes.push(`在深山採得${MATS[k].n}。`); }
  else if (roll < 58) { const e = needExp(m.r, m.s) * R(0.3, 0.8); m.exp += e; a.notes.push('觀山河日月，心有所悟，修為精進。'); }
  else if (roll < 64) { m.wit = Math.min(100, m.wit + RI(2, 5)); a.notes.push('與高人論道，悟性提升。'); }
  else if (roll < 71 && !m.spouse && age(m) >= 18 && !m.traits.includes('guyi')) { // 遇見良緣
    const c = mkOutsider(m.sex ? 0 : 1, m.r, { met: m.id }); S.cands.push(c);
    a.notes.push(`結識了散修 ${c.sur}${c.given}（${realmName(c.r, c.s)}），彼此情投意合。`);

}
function playBattle(res, title, done) {

  o.innerHTML = `<div class="in" style="background-image:linear-gradient(rgba(20,15,10,.45),rgba(20,15,10,.65)),url(${inkScape(540, 900, 41, { layers: 6, dark: true, sunCol: 'rgba(200,60,40,.85)', sky: '#a99c84', ground: '#5a5040' })})">
    <div class="vs" style="padding-top:calc(10px + env(safe-area-inset-top))">${esc(title)}</div>
    <div class="side">${all.map((u, i) => u.side === 1 ? unitHTML(u, i) : '').join('')}</div>
    <div class="blog" id="blog">⚔</div>
    <div class="side">${all.map((u, i) => u.side === 0 ? unitHTML(u, i) : '').join('')}</div>
    <div style="display:flex;gap:8px;padding:10px 14px calc(14px + env(safe-area-inset-bottom))"><button class="btn ghost" id="bFast" style="flex:1">加速</button><button class="btn ghost" id="bSkip" style="flex:1">跳過</button></div></div>`;
  document.body.appendChild(o);
  let i = 0, speed = 520, stop = false;
  const fin = () => {
    if (stop) return; stop = true; $('blog').innerHTML = '';
    all.forEach((u, k) => { const el = $('u' + k); if (el) { el.querySelector('.hp i').style.width = Math.max(0, u.hp / u.mhp * 100) + '%'; if (u.hp <= 0) el.classList.add('dead'); } });
    const r = document.createElement('div'); r.className = 'bres'; r.innerHTML = `<div class="big" style="color:${res.win ? '#ffd27a' : '#c8c0b0'}">${res.win ? '大捷' : '敗北'}</div><button class="btn red" id="bEnd" style="width:200px">繼續</button>`;
    o.querySelector('.in').appendChild(r); $('bEnd').onclick = () => { o.remove(); done && done(); };
  };
  const step = () => {
    if (stop || !$('blog')) return; if (i >= res.frames.length) return fin();
    const f = res.frames[i++];

    return evPop('crossed-swords', '上門挑戰', `${f.n}的天才弟子 ${esc(foe.n)}（${realmName(foe.r, foe.s)}）上門，指名要與 ${esc(fullName(m))}（${realmName(m.r, m.s)}）切磋。點到為止，不傷性命。`, [{ t: '應戰', f: () => {
      const res = battle([unitFrom(m)], [foe], { lethal: 0 }); m.inj = Math.min(m.inj, 4);
      playBattle(res, `切磋・${foe.n}`, () => { if (res.win) { S.prestige += 60 * r; m.exp += needExp(m.r, m.s) * 0.15; f.rel = Math.max(-100, f.rel - 3); } else { S.prestige = Math.max(0, S.prestige - 30 * r); } battleSummary(res, res.win ? `${esc(fullName(m))} 勝出，${S.fam.sur}氏威名遠播，切磋中也有所領悟。` : `${esc(fullName(m))} 技不如人，略輸一籌。`); });
      return 'keep';
    } }, { t: '閉門謝客', f: () => { S.prestige = Math.max(0, S.prestige - 20); } }]);
  }
  if (T === 'lecture') {
    const f = pick(liveF().filter(x => x.mem[0] && x.mem[0].r >= 3)); if (!f) return nextEvent(); const el = f.mem[0];
    const cost = Math.round(60 * Math.pow(2.3, el.r - 1)); const n = famMembers().filter(m => !m.away && m.r >= 1 && m.r < el.r).length;
    return evPop('open-book', '長老開壇講道', `${f.n}的${realmName(el.r, el.s)}長老 ${esc(el.n)} 開壇講道三日，各家都可派人聆聽，只需奉上 ${fmt(cost)} 靈石。<br><span class="dim">族中境界低於長老的 ${n} 人都能受益，修為大進。</span>`, [{ t: `前往聽道（${fmt(cost)}）`, dis: S.stones < cost || !n, f: () => { S.stones -= cost; for (const m of famMembers()) if (!m.away && m.r >= 1 && m.r < el.r) m.exp += needExp(m.r, m.s) * R(0.15, 0.35); f.rel = Math.min(100, f.rel + 5); } }, { t: '不去' }]);
  }
  if (T === 'allyHelp') {
    const f = pick(liveF().filter(x => x.rel >= 30)); const foeF = pick(liveF().filter(x => x !== f && x.rel < 20)); if (!f || !foeF) return nextEvent();
    const reward = Math.round(Math.max(300, f.wealth * 0.08));
    return evPop('shaking-hands', `${f.n}求援`, `${foeF.n}大舉進攻${f.n}，${f.n}派人前來求援，答應事成後重謝 ${fmt(reward)} 靈石。<br><span class="dim">出手會得罪${foeF.n}。</span>`, [{ t: '派人支援', f: () => {
      teamSheet(4, `支援${f.n}`, team => { const foes = foeF.mem.slice(RI(1, 3), RI(4, 6)).map(x => mkEnemy(x.n, x.r, x.s, x.el, 'man')); const res = battle(team.map(m => unitFrom(m)), foes.length ? foes : [mkEnemy(foeF.n + '弟子', 2, 1, '金')], { talis: 1 }); S.stat.battle++;
        playBattle(res, `援助${f.n}`, () => { if (res.win) { S.stat.win++; S.stones += reward; f.rel = Math.min(100, f.rel + 25); foeF.rel -= 25; foeF.mem.splice(-1, 1); battleSummary(res, `擊退${foeF.n}！${f.n}感激不盡，奉上 ${fmt(reward)} 靈石。`); } else { f.rel += 8; foeF.rel -= 20; battleSummary(res, '援軍不敵，只能撤回。'); } }); });
      return 'keep';
    } }, { t: '婉拒', f: () => { f.rel -= 15; } }]);
  }
  if (T === 'allyOffer') {
    const f = pick(liveF().filter(x => x.rel >= 45 && !x.ally)); if (!f) return nextEvent();
    return evPop('shaking-hands', '結盟之邀', `${f.n}派使者前來，希望與${S.fam.sur}氏結為同盟，共進退。<br><span class="dim">盟友不會攻打你，關係也會更穩定。</span>`, [{ t: '結盟', f: () => { f.ally = true; f.rel = Math.min(100, f.rel + 15); log(`與${f.n}結盟。`, 'g'); } }, { t: '婉拒', f: () => { f.rel -= 5; } }]);
  }
  if (T === 'barter') {
    const f = pick(liveF()); if (!f) return nextEvent(); const g = clamp(Math.ceil(Math.max(1, maxR()) / 2) + (chance(0.3) ? 1 : 0), 2, 5);
    const k = (chance(0.5) ? 'h' : 'o') + g, n = RI(2, 5), price = Math.round(MATS[k].v * n * R(0.9, 1.2));
    return evPop('swap-bag', '以物易物', `${f.n}的管事帶來 ${MATS[k].n} ×${n}，想換 ${fmt(price)} 靈石。（市價約 ${fmt(MATS[k].v * n * 1.6)}）`, [{ t: '成交', dis: S.stones < price, f: () => { S.stones -= price; addMat(k, n); f.rel = Math.min(100, f.rel + 3); } }, { t: '不需要' }]);
  }
  if (T === 'raid') {
    const f = S.forces.find(x => x.id === e.f); if (!f || f.dead) return nextEvent();
    return evPop(ic('crossed-swords', 'eic'), `${f.n}來犯！`, `${f.n}大舉進攻${S.fam.sur}氏！為首的是${f.mem[0] ? realmName(f.mem[0].r, f.mem[0].s) + '的' + f.mem[0].n : '一眾修士'}。`, [{ t: '迎戰', f: () => {
      const res = defendRaid(f); S.stat.battle++;
      const after = () => {
        if (res.win) { S.stat.win++; f.mem.splice(-2, 2); f.rel -= 5; S.prestige += 100; battleSummary(res, `擊退${f.n}！家族聲威大振。`); }
        else { const loss = Math.round(S.stones * 0.35); S.stones -= loss; const other = S.locs.filter(l => l.owner === 'me' && l.id !== S.home && l.adj.some(id => S.locs[id].owner === f.id)); let lost = ''; if (other.length) { const l = pick(other); l.owner = f.id; lost = `，還被奪走了${l.n}`; S.lands = S.locs.filter(l => l.owner === 'me').map(l => l.id); } f.rel += 20; battleSummary(res, `${f.n}攻破防線，搶走 ${fmt(loss)} 靈石${lost}。`); }
      };
      if (res.empty) { after(); } else playBattle(res, `抵禦 ${f.n}`, after); return 'keep';
    } }, { t: `求和（${fmt(Math.round(S.stones * 0.25))} 靈石）`, f: () => { S.stones = Math.round(S.stones * 0.75); f.rel = Math.max(f.rel, -10); } }]);
  }
  if (T === 'tribute') { const f = S.forces.find(x => x.id === e.f); if (!f) return nextEvent(); const c = Math.round(Math.max(200, S.stones * 0.2)); return evPop('skull-crossed-bones', '魔道勒索', `${f.n}的使者趾高氣揚地上門，要${S.fam.sur}氏每年進貢 ${fmt(c)} 靈石，否則血洗族地。`, [{ t: '忍辱進貢', dis: S.stones < c, f: () => { S.stones -= c; f.rel = Math.max(f.rel, 10); } }, { t: '斷然拒絕', f: () => { f.rel = -80; } }]); }
  if (T === 'tribulation') {
    const m = M(e.m); if (!m || m.dead) return nextEvent();
    const p = clamp(0.3 + (luck(m) - 50) / 300 + ((S.pills.dujie || 0) ? 0.15 : 0) + (m.traits.includes('wuxing') ? 0.05 : 0), 0.05, 0.85);
    return evPop(ic('lightning-branches', 'eic'), '飛升天劫', `${esc(fullName(m))} 渡劫圓滿，九天之上劫雲翻湧。渡過天劫便可飛升仙界！<br>成功率 <b>${Math.round(p * 100)}%</b>${S.pills.dujie ? '（含渡劫丹）' : ''}。失敗則身死道消。`, [{ t: '渡劫飛升', f: () => { if (S.pills.dujie) S.pills.dujie--; if (chance(p)) { m.left = 1; m.ascended = 1; S.stat.ascend++; S.prestige += 1e6; log(`${fullName(m)} 渡過九九天劫，白日飛升！`, 'g'); result('sun', '白日飛升', `霞光萬道，仙樂飄飄。${esc(fullName(m))} 渡過九九天劫，飛升仙界！<br>${S.fam.sur}氏從此名動天下，成為傳說中的仙族。`); } else { die(m, '渡九九天劫失敗，灰飛煙滅'); result('tombstone', '身死道消', `${esc(fullName(m))} 未能渡過天劫……`); } return 'keep'; } }, { t: '再積累一段時間', f: () => { m.exp = needExp(10, 0) * 0.9; } }]);
  }
  return nextEvent();
}

// ======================================================================
//  標題、建立家族
// ======================================================================
function showTitle() {
  const sv = load();
  $('title').style.display = 'flex';
  $('title').style.backgroundImage = `url(${inkScape(540, 960, 12, { layers: 7, sun: true })})`;
  $('title').innerHTML = `<h1>修仙家族</h1><div class="sub">一族興衰・萬古長生</div>
    ${sv ? `<button class="btn red" id="tCont">${ic('scroll-unfurled')} 繼續：${esc(sv.fam.sur)}氏（第 ${year(sv.t)} 年）</button>` : ''}
    <button class="btn ${sv ? '' : 'red'}" id="tNew">${ic('family-tree')} 開創新家族</button>
    <a href="./" class="btn ghost" style="text-decoration:none">${ic('exit-door')} 回遊戲盒</a>
    <div class="dim" style="margin-top:auto;padding-top:30px;font-size:13px;text-align:center;line-height:1.7">開宗立族、培養族人、結親生子、煉丹鑄器<br>開疆拓土、探索秘境，帶領家族千秋萬代、白日飛升</div>`;
  if ($('tCont')) $('tCont').onclick = () => { S = sv; $('title').style.display = 'none'; render(); };
  $('tNew').onclick = createScreen;
}
function createScreen() {
  let blood = 'zhuque', poem = 0, sex = 1;
  const draw = () => {
    $('title').innerHTML = `<h1 style="font-size:36px;margin-top:6px">開宗立族</h1>
      <div class="lbl">家族姓氏</div><input class="txt" id="cSur" maxlength="2" value="${esc(($('cSur') || {}).value || pick(['林', '蘇', '葉', '顧', '沈', '秦', '陸', '韓']))}">
      <div class="lbl">老祖名諱</div><div class="row" style="width:100%"><input class="txt" id="cGiv" maxlength="2" value="${esc(($('cGiv') || {}).value || pick(['長青', '玄機', '問道', '清虛', '守拙', '若水']))}"><button class="btn ${sex ? 'red' : 'ghost'}" id="cM">男</button><button class="btn ${sex ? 'ghost' : 'red'}" id="cF">女</button></div>
      <div class="lbl">祖傳血脈</div><div class="pick">${Object.entries(BLOODS).map(([k, b]) => `<button class="${k === blood ? 'on' : ''}" data-b="${k}"><b style="color:${b.col}">${ic(b.ic)}${b.n}</b>${b.d}</button>`).join('')}</div>
      <div class="lbl">字輩詩</div><div class="pick">${POEMS.map((p, i) => `<button class="${i === poem ? 'on' : ''}" data-p="${i}"><b>${p.n}</b>${p.t.slice(0, 14)}……</button>`).join('')}</div>
      <div class="dim" style="font-size:13.5px;margin:8px 0;line-height:1.6;align-self:flex-start">族人名字的第二個字會依字輩詩，一代一個字傳下去。</div>
      <button class="btn red" id="cGo" style="margin-top:10px">${ic('family-tree')} 開宗立族</button><button class="btn ghost" id="cBack">返回</button>`;
    $('title').querySelectorAll('[data-b]').forEach(b => b.onclick = () => { blood = b.dataset.b; draw(); });
    $('title').querySelectorAll('[data-p]').forEach(b => b.onclick = () => { poem = +b.dataset.p; draw(); });
    $('cM').onclick = () => { sex = 1; draw(); }; $('cF').onclick = () => { sex = 0; draw(); };
    $('cBack').onclick = showTitle;
    $('cGo').onclick = () => { const sur = $('cSur').value.trim() || '林', giv = $('cGiv').value.trim() || '長青'; newGame({ sur, given: giv, blood, poem, sex }); save(); $('title').style.display = 'none'; tab = 'mem'; render(); intro(); };
  };
  draw();
}
function intro() {
  const f = M(S.leader);
  evPop(ic('mountaintop', 'eic'), '開宗立族', `${esc(fullName(f))} 歷經百年苦修，終於築基有成，攜家人在<b>${homeLoc().n}</b>開闢族地，${esc(S.fam.sur)}氏一族自此立足修仙界。<br><br>
    <span style="font-size:15px">・按「過一個月」推進時間，族人會自己修煉<br>・在「靈山」蓋建築：靈田產靈草、丹房煉丹、聚靈陣加速修煉<br>・為族人結道侶生兒育女，好的靈根會遺傳<br>・在「天下」攻佔靈山、探索秘境、結交或討伐其他勢力<br>・目標：讓家族出現元嬰、化神，直到有人白日飛升</span>`, [{ t: '開始' }]);
}
function gameOver() { evPop(ic('tombstone', 'eic'), '家族斷絕', `${esc(S.fam.sur)}氏最後一位族人也離開了人世……<br>家族傳承 ${Math.max(...S.members.map(m => m.gen))} 代，歷時 ${year(S.t)} 年。`, [{ t: '重新開始', f: () => { localStorage.removeItem(SAVE_KEY); S = null; showTitle(); return 'keep'; } }]); }

// ---------------- 啟動 ----------------
window.addEventListener('load', () => {
  document.documentElement.style.setProperty('--tex', paperTex());
  showTitle();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && S) save(); });
