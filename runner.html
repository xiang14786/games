<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="遊戲盒">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>夜城跑酷</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#07060f; overflow:hidden; color:#fff;
    font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none; overscroll-behavior:none; }
  #wrap { position:relative; width:100%; height:100%; max-width:520px; margin:0 auto; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
  .hide { display:none !important; }
  #hud { position:absolute; top:calc(env(safe-area-inset-top) + 10px); left:12px; right:12px; display:flex; gap:8px; align-items:center; pointer-events:none; }
  .pill { background:rgba(10,8,30,.6); border:1px solid rgba(120,200,255,.35); border-radius:999px; padding:6px 14px; font-weight:900; font-size:20px; box-shadow:0 0 12px rgba(80,180,255,.25); }
  .pill small { font-size:12px; opacity:.7; margin-left:3px; }
  .gold { color:#ffd34d; }
  #pause { pointer-events:auto; margin-left:auto; width:42px; height:42px; border-radius:50%; border:1px solid rgba(255,255,255,.25); background:rgba(10,8,30,.6); color:#fff; font-size:18px; }
  #pows { position:absolute; top:calc(env(safe-area-inset-top) + 60px); left:12px; display:flex; flex-direction:column; gap:6px; pointer-events:none; }
  .pw { background:rgba(10,8,30,.6); border-radius:12px; padding:4px 10px; font-size:14px; font-weight:800; display:flex; align-items:center; gap:6px; }
  .pw .bar { width:64px; height:6px; background:rgba(255,255,255,.2); border-radius:4px; overflow:hidden; }
  .pw .bar i { display:block; height:100%; background:#5fe0ff; }
  #toast { position:absolute; top:24%; left:0; right:0; text-align:center; font-size:30px; font-weight:900; color:#ffd34d; text-shadow:0 0 14px rgba(255,180,0,.7), 0 3px 0 #7a3b00; opacity:0; transition:opacity .3s; pointer-events:none; }
  #hint { position:absolute; bottom:calc(env(safe-area-inset-bottom) + 18px); left:0; right:0; text-align:center; font-size:15px; color:rgba(255,255,255,.75); pointer-events:none; transition:opacity 1s; }
  .ov { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:22px; text-align:center;
    background:linear-gradient(180deg, rgba(10,5,30,.35), rgba(5,3,15,.88)); overflow-y:auto; touch-action:pan-y; }
  .logo { font-size:54px; font-weight:900; letter-spacing:3px; line-height:1.05; color:#fff; text-shadow:0 0 8px #ff3df0, 0 0 22px #ff3df0, 0 0 40px #7a2cff; }
  .logo span { color:#5fe0ff; text-shadow:0 0 8px #5fe0ff, 0 0 22px #2c8bff; }
  .sub { font-size:16px; color:#d6d8f0; line-height:1.8; }
  .sub b { color:#5fe0ff; }
  .card { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); border-radius:18px; padding:12px 14px; width:100%; max-width:360px; text-align:left; }
  .card h3 { margin:0 0 6px; font-size:17px; }
  .ctl { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; font-size:15px; color:#dfe3f5; align-items:center; }
  .ctl b { font-size:22px; text-align:center; }
  button.big { background:linear-gradient(180deg,#6af0ff,#2c8bff); color:#04121f; border:0; border-radius:999px; padding:15px 50px; font-size:24px; font-weight:900; font-family:inherit; box-shadow:0 0 20px rgba(80,200,255,.6), 0 6px 0 #164a8a; }
  button.big:active { transform:translateY(4px); box-shadow:0 0 20px rgba(80,200,255,.6), 0 2px 0 #164a8a; }
  button.alt { background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:11px 24px; font-size:17px; font-weight:800; font-family:inherit; }
  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .shopitem { display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid rgba(255,255,255,.08); }
  .shopitem:first-of-type { border-top:0; }
  .shopitem .ic { font-size:28px; width:36px; text-align:center; }
  .shopitem .t { flex:1; font-size:15px; font-weight:800; }
  .shopitem .t small { display:block; font-size:12px; color:#aab0c8; font-weight:500; margin-top:2px; }
  .shopitem button { background:#ffd34d; color:#3a2a00; border:0; border-radius:12px; padding:8px 12px; font-weight:900; font-size:14px; min-width:74px; font-family:inherit; }
  .shopitem button:disabled { background:#4a4f63; color:#999; }
  .lv { display:inline-flex; gap:2px; margin-left:4px; vertical-align:middle; }
  .lv u { width:8px; height:8px; border-radius:2px; background:rgba(255,255,255,.2); }
  .lv u.f { background:#5fe0ff; }
  .big-num { font-size:54px; font-weight:900; text-shadow:0 0 16px #2c8bff; line-height:1; }
  .newrec { color:#ffd34d; font-weight:900; font-size:18px; animation:pop .6s infinite alternate; }
  @keyframes pop { from { transform:scale(1); } to { transform:scale(1.12); } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud" class="hide"><div class="pill" id="hDist">0<small>m</small></div><div class="pill gold" id="hCoin">🪙 0</div><div class="pill" id="hMul" style="color:#ff7be5">×1</div><button id="pause">⏸</button></div>
  <div id="pows"></div>
  <div id="toast"></div>
  <div id="hint" class="hide">← → 滑動換車道　↑ 跳　↓ 滑鏟</div>

  <div class="ov" id="menu">
    <div class="logo">夜城<br><span>跑酷</span></div>
    <div class="card"><h3>🎮 操作（在螢幕上滑動）</h3><div class="ctl">
      <b>⬅️➡️</b><span>左右滑：換車道，躲開電車</span>
      <b>⬆️</b><span>往上滑：跳過路障</span>
      <b>⬇️</b><span>往下滑：滑鏟鑽過橫桿（空中往下滑會急降）</span>
    </div></div>
    <div class="card"><h3>✨ 道具</h3><div class="ctl">
      <b>🧲</b><span>磁鐵：自動吸金幣</span><b>✖️2</b><span>金幣加倍</span>
      <b>🛹</b><span>滑板：撞到一次不會倒</span><b>🎒</b><span>噴射背包：飛上天收金幣</span>
    </div></div>
    <div class="sub" id="mInfo"></div>
    <button class="big" id="mStart">開跑</button>
    <button class="alt" id="mShop">🛍️ 商店升級</button>
  </div>

  <div class="ov hide" id="shop">
    <div style="font-size:30px;font-weight:900">🛍️ 商店</div>
    <div class="gold" style="font-size:22px;font-weight:900" id="sCoin"></div>
    <div class="card" id="sList"></div>
    <button class="alt" id="sBack">返回</button>
  </div>

  <div class="ov hide" id="pauseOv"><div style="font-size:34px;font-weight:900">暫停</div><button class="big" id="resume">繼續</button><button class="alt" id="quit">回主選單</button></div>

  <div class="ov hide" id="over">
    <div style="font-size:28px;font-weight:900;color:#ff8fd8">撞到了！</div>
    <div class="big-num" id="oDist">0</div>
    <div id="oRec"></div>
    <div class="sub" id="oRes"></div>
    <button class="alt" id="oRevive" style="border-color:#ffd34d;color:#ffd34d">🪙 150 繼續跑</button>
    <button class="big" id="oAgain">再跑一次</button>
    <div class="row"><button class="alt" id="oShop">🛍️ 商店</button><button class="alt" id="oMenu">主選單</button></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rand(a, b + 1)), pick = a => a[Math.floor(Math.random() * a.length)], clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ====== 存檔 ======
let SV = { coins: 0, best: 0, up: { magnet: 0, x2: 0, board: 0, jet: 0, value: 0, start: 0 } };
try { const o = JSON.parse(localStorage.getItem('nightRun2')); if (o) { SV.coins = o.coins || 0; SV.best = o.best || 0; Object.assign(SV.up, o.up || {}); } else { const old = JSON.parse(localStorage.getItem('nightRunSave')); if (old) SV.coins = old.coins || 0; } } catch (e) {}
const persist = () => { try { localStorage.setItem('nightRun2', JSON.stringify(SV)); } catch (e) {} };
const UPS = [
  { k: 'magnet', ic: '🧲', n: '磁鐵', max: 5, cost: [60, 140, 260, 420, 650], d: l => `持續 ${8 + l * 2} 秒` },
  { k: 'x2', ic: '✖️', n: '雙倍金幣', max: 5, cost: [60, 140, 260, 420, 650], d: l => `持續 ${8 + l * 2} 秒` },
  { k: 'jet', ic: '🎒', n: '噴射背包', max: 5, cost: [80, 180, 320, 500, 750], d: l => `飛行 ${6 + l * 1.5} 秒` },
  { k: 'board', ic: '🛹', n: '滑板', max: 3, cost: [120, 300, 600], d: l => `撞到後還能滑 ${10 + l * 5} 秒` },
  { k: 'value', ic: '💰', n: '金幣價值', max: 4, cost: [150, 400, 800, 1400], d: l => `每枚金幣 = ${l + 1}` },
  { k: 'start', ic: '🚀', n: '開局衝刺', max: 3, cost: [200, 500, 1000], d: l => l ? `開局用噴射背包飛 ${l * 4} 秒` : '開局用噴射背包起飛' },
];

// ====== 畫布與投影 ======
const cv = $('c'); let ctx = cv.getContext('2d');
const W = 360; let H = 720, HOR = 240, F = 330, CAMH = 3.4, scale = 1;
function resize() { const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; scale = r.width / W; H = r.height / scale; cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0); HOR = H * 0.34; CAMH = (H * 0.86 - HOR) * 2.8 / F; }
window.addEventListener('resize', resize); resize();
const ZP = 2.8;       // 玩家所在深度
const LANE = 1.15;    // 車道寬
function proj(x, y, z) { const s = F / z; return { x: W / 2 + (x - camX) * s, y: HOR + (CAMH - y) * s, s }; }

// ====== 遊戲狀態 ======
let running = false, paused = false, st;
function newState() {
  return { t: 0, dist: 0, speed: 11, coins: 0, lane: 0, x: 0, y: 0, vy: 0, slide: 0, objs: [], nextZ: 26, mag: 0, x2: 0, jet: 0, board: 0, hit: 0, combo: 0, mul: 1, revived: false, runPhase: 0, lastCoinT: 0, tutorial: SV.best < 200 ? 0 : 99 };
}
let camX = 0;
// 物件：{k:'block'|'bar'|'train'|'coin'|'pow', lane, z, len, y, p}
function spawnRow(z) {
  const s = st, lv = clamp(s.dist / 2500, 0, 1);
  // 教學：前幾排依序教
  if (s.tutorial < 3) {
    const k = ['block', 'bar', 'train'][s.tutorial]; s.tutorial++;
    for (const l of [-1, 0, 1]) if (k !== 'train' || l !== 1) s.objs.push(mk(k, l, z));
    coinLine(1, z - 6, 6);
    toastLater(['往上滑跳過路障！', '往下滑鑽過橫桿！', '左右滑換車道！'][s.tutorial - 1], z);
    return 16;
  }
  const r = Math.random();
  let lanes = [-1, 0, 1].sort(() => Math.random() - 0.5);
  const free = lanes[0];
  if (r < 0.28) {
    // 兩條車道有電車，一條空著（放金幣）
    const tl = rand(8, 16);
    s.objs.push(mk('train', lanes[1], z, tl)); if (Math.random() < 0.65 + lv * 0.3) { const z2 = z + rand(-3, 0); s.objs.push(mk('train', lanes[2], z2, rand(6, tl - (z2 - z) - 1))); }
    coinLine(free, z, Math.floor(tl / 1.6));
    return tl + rand(4, 9) - lv * 3;
  } else if (r < 0.55) {
    // 整排路障或橫桿（要跳／滑）
    const k = Math.random() < 0.5 ? 'block' : 'bar';
    for (const l of lanes) if (Math.random() < 0.85 || l !== free) s.objs.push(mk(k, l, z));
    if (k === 'block') coinArc(pick([-1, 0, 1]), z); else coinLine(pick([-1, 0, 1]), z - 1, 3);
    return rand(9, 14) - lv * 3;
  } else if (r < 0.8) {
    // 混合：一道路障、一道橫桿、一條空
    s.objs.push(mk('block', lanes[1], z)); s.objs.push(mk('bar', lanes[2], z));
    let ret = rand(10, 15) - lv * 3;
    if (Math.random() < 0.5) { const tl = rand(6, 10); s.objs.push(mk('train', free, z + 8, tl)); ret = 8 + tl + rand(3, 6); }
    coinLine(free, z - 4, 5);
    return ret;
  } else {
    // 金幣大道 + 道具
    const l = pick([-1, 0, 1]); coinLine(l, z, 10);
    if (Math.random() < 0.55) s.objs.push({ k: 'pow', lane: pick([-1, 0, 1]), z: z + 8, len: 0, p: pick(['mag', 'x2', 'jet', 'board', 'mag', 'x2']) });
    let ret = rand(14, 20) - lv * 4;
    if (Math.random() < 0.5) { const tl = rand(10, 18); s.objs.push(mk('train', pick([-1, 0, 1].filter(x => x !== l)), z + 2, tl)); ret = Math.max(ret, 2 + tl + 4); }
    return ret;
  }
}
function mk(k, lane, z, len = 0) { return { k, lane, z, len: k === 'train' ? len : k === 'block' ? 0.6 : 0.3 }; }
function coinLine(lane, z, n) { for (let i = 0; i < n; i++) st.objs.push({ k: 'coin', lane, z: z + i * 1.6, len: 0, y: 0.5 }); }
function coinArc(lane, z) { for (let i = 0; i < 7; i++) { const t = i / 6; st.objs.push({ k: 'coin', lane, z: z - 3.6 + i * 1.2, len: 0, y: 0.5 + Math.sin(t * Math.PI) * 1.6 }); } }
let toastQ = [];
function toastLater(t, z) { toastQ.push({ t, z }); }
let toastT = null;
function toast(t) { const el = $('toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => el.style.opacity = 0, 1400); }

// ====== 輸入 ======
let touch = null;
function act(a) {
  if (!running || paused) return;
  const s = st;
  if (a === 'L' && s.lane > -1) s.lane--;
  else if (a === 'R' && s.lane < 1) s.lane++;
  else if (a === 'U') { if (s.y <= 0.01 && !(s.jet > 0)) { s.vy = 9.2; s.slide = 0; } }
  else if (a === 'D') { if (s.y > 0.01 && !(s.jet > 0)) s.vy = -16; s.slide = 0.62; }
  $('hint').style.opacity = 0;
}
cv.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; touch = { x: t.clientX, y: t.clientY, done: false }; }, { passive: false });
cv.addEventListener('touchmove', e => { e.preventDefault(); if (!touch || touch.done) return; const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y; if (Math.hypot(dx, dy) > 28) { touch.done = true; act(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'L' : 'R') : (dy < 0 ? 'U' : 'D')); } }, { passive: false });
cv.addEventListener('touchend', e => { e.preventDefault(); if (touch && !touch.done) act('U'); touch = null; }, { passive: false });
let mouse = null;
cv.addEventListener('mousedown', e => mouse = { x: e.clientX, y: e.clientY });
window.addEventListener('mouseup', e => { if (!mouse) return; const dx = e.clientX - mouse.x, dy = e.clientY - mouse.y; act(Math.hypot(dx, dy) < 20 ? 'U' : Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'L' : 'R') : (dy < 0 ? 'U' : 'D')); mouse = null; });
window.addEventListener('keydown', e => { const m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', a: 'L', d: 'R', w: 'U', s: 'D', ' ': 'U' }[e.key]; if (m) { e.preventDefault(); act(m); } });

// ====== 更新 ======
const DUR = { mag: () => 8 + SV.up.magnet * 2, x2: () => 8 + SV.up.x2 * 2, jet: () => 6 + SV.up.jet * 1.5, board: () => 10 + SV.up.board * 5 };
function update(dt) {
  const s = st; s.t += dt;
  s.speed = Math.min(26, 11 + s.dist / 160);
  const mv = s.speed * dt; s.dist += mv;
  // 車道移動
  const tx = s.lane * LANE; s.x += (tx - s.x) * Math.min(1, dt * 16);
  camX += (s.x * 0.55 - camX) * Math.min(1, dt * 6);
  // 跳躍
  if (s.jet > 0) { s.jet -= dt; s.y += (3.2 - s.y) * Math.min(1, dt * 4); s.vy = 0; if (s.jet <= 0) { s.jet = 0; s.vy = 2; s.hit = 1; toast('著陸！'); } }
  else { s.vy -= 26 * dt; s.y += s.vy * dt; if (s.y < 0) { s.y = 0; s.vy = 0; } }
  if (s.slide > 0) s.slide -= dt;
  for (const k of ['mag', 'x2', 'board']) if (s[k] > 0) s[k] = Math.max(0, s[k] - dt);
  if (s.hit > 0) s.hit -= dt;
  s.runPhase += dt * (6 + s.speed * 0.25);
  // 物件前進
  for (const o of s.objs) o.z -= mv;
  s.nextZ -= mv;
  while (s.nextZ < 70) s.nextZ += spawnRow(s.nextZ + 0) + 0;
  toastQ = toastQ.filter(q => { q.z -= mv; if (q.z < 14) { toast(q.t); return false; } return true; });
  // 碰撞
  const pz0 = ZP - 0.35, pz1 = ZP + 0.35, laneNow = Math.round(s.x / LANE), near = Math.abs(s.x - laneNow * LANE) < 0.45;
  for (const o of s.objs) {
    if (o.dead) continue;
    const z1 = o.z + (o.len || 0);
    if (z1 < pz0 || o.z > pz1) continue;
    if (o.k === 'coin' || o.k === 'pow') continue;
    if (o.lane !== laneNow || !near) continue;
    let bad = false;
    if (o.k === 'block') bad = s.y < 0.62;
    else if (o.k === 'bar') bad = !(s.slide > 0) && s.y < 1.9;
    else if (o.k === 'train') bad = s.y < 1.75;
    if (bad && !(s.jet > 0) && s.hit <= 0) {
      if (s.board > 0) { s.board = 0; s.hit = 1.2; o.dead = true; toast('滑板擋下了！'); shake = 10; }
      else return crash();
    }
  }
  // 金幣與道具
  for (const o of s.objs) {
    if (o.dead || (o.k !== 'coin' && o.k !== 'pow')) continue;
    const ox = o.lane * LANE, oy = o.y || 0.5;
    if (s.mag > 0 && o.k === 'coin' && o.z < 18 && o.z > 0) { o.lane = o.lane + (s.x / LANE - o.lane) * Math.min(1, dt * 8); o.y = oy + (s.y + 0.6 - oy) * Math.min(1, dt * 8); }
    const dz = Math.abs(o.z - ZP), dx = Math.abs(o.lane * LANE - s.x), dy = Math.abs((o.y || 0.5) - (s.y + 0.6));
    if (dz < 0.6 && dx < 0.6 && dy < 1.1) {
      o.dead = true;
      if (o.k === 'coin') { const v = (SV.up.value + 1) * (s.x2 > 0 ? 2 : 1); s.coins += v; s.combo++; if (s.t - s.lastCoinT > 1.2) s.combo = 1; s.lastCoinT = s.t; sparks.push({ x: ox, y: oy, z: o.z, life: 0.4 }); }
      else { const p = o.p; s[p] = DUR[p](); toast({ mag: '🧲 磁鐵！', x2: '✖️2 雙倍金幣！', jet: '🎒 噴射背包！', board: '🛹 滑板！' }[p]); if (p === 'jet') { s.slide = 0; for (let i = 0; i < 26; i++) st.objs.push({ k: 'coin', lane: pick([-1, 0, 1]) , z: 10 + i * 2.2, len: 0, y: 3.4 }); } }
    }
  }
  s.objs = s.objs.filter(o => o.z + (o.len || 0) > -2 && !(o.dead && o.k !== 'train'));
  s.mul = 1 + Math.floor(s.dist / 500) * 0.5;
  for (const p of sparks) p.life -= dt; sparks = sparks.filter(p => p.life > 0);
  if (shake > 0) shake *= 0.86;
}
let sparks = [], shake = 0;

// ====== 繪圖 ======
const BLD = Array.from({ length: 24 }, (_, i) => ({ x: i * 34 - 60 + rand(-8, 8), w: rand(26, 44), h: rand(60, 190), c: pick(['#1a1440', '#211a52', '#160f36', '#2a1a5a']), win: Math.random() }));
function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, HOR); g.addColorStop(0, '#07051a'); g.addColorStop(0.6, '#2a0f4f'); g.addColorStop(1, '#ff3d9a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HOR + 2);
  // 月亮

function box(x, w, y0, y1, z0, z1, front, top, side) {

function drawPlayer() {

// ====== 流程 ======
let last = 0;
function loop(t) {

function show(id) { ['menu', 'shop', 'over', 'pauseOv'].forEach(x => $(x).classList.toggle('hide', x !== id)); $('hud').classList.toggle('hide', !(id === null || id === 'pauseOv')); }
