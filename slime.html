<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050a18"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="遊戲盒">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>轉生史萊姆・魔國物語</title>
<style>@font-face{font-family:'Huninn';font-display:swap;src:url('assets/slime/huninn.woff2') format('woff2')}@font-face{font-family:'LXGW WenKai TC';font-weight:700;font-display:swap;src:url('assets/slime/wk-bold.woff2') format('woff2')}
:root{--bg:#050a18;--pan:rgba(16,30,60,.74);--pan2:rgba(30,50,96,.55);--line:rgba(140,200,255,.2);--tx:#e9f4ff;--dim:#8ea6c8;--gold:#f2c46b;--gold2:#ffdf9a;--vio:#5ad0ff;--pink:#ff7aae;--red:#ff5a6a;--ok:#5ae0a8;--hd:"LXGW WenKai TC","Huninn",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#03030c;color:var(--tx);font-family:'Huninn','PingFang TC','Noto Sans TC',sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% -10%,#2a1a5a 0%,#0a0a24 45%,#03030c 100%)}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{max-width:540px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;z-index:1;overflow:hidden;background:linear-gradient(180deg,rgba(8,8,30,.35),rgba(8,8,30,.6))}
#app.titled>#hd,#app.titled>#bd,#app.titled>#nav{visibility:hidden}
.ic{display:inline-block;width:1em;height:1em;vertical-align:-.14em;fill:currentColor}
.dim{color:var(--dim)}.red{color:var(--red)}.gold{color:var(--gold)}.ok{color:var(--ok)}.pink{color:var(--pink)}.small{font-size:13.5px}
b,h1,h2,h3,.tit{font-family:var(--hd)}
/* header */
#hd{flex:none;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:linear-gradient(180deg,rgba(30,20,80,.92),rgba(14,12,44,.92));border-bottom:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.4);position:relative}
#hd.tick::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(242,196,107,.22),transparent);animation:sweep .6s ease-out forwards;pointer-events:none}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
#hd .r1{display:flex;align-items:center;gap:10px}
.mav{width:52px;height:52px;border-radius:50%;flex:none;background:radial-gradient(circle,#2a2a6a,#101030);border:2px solid var(--c);box-shadow:0 0 14px var(--c);overflow:hidden}
.mav img{width:120%;margin:-6% 0 0 -10%}
.who{flex:1;min-width:0}
.who b{font-size:19px;display:flex;align-items:center;gap:6px;white-space:nowrap;letter-spacing:1px}
.ttl{font-size:12px;padding:1px 7px;border-radius:10px;background:linear-gradient(90deg,#c89a3a,#f2c46b);color:#2a1a00;font-weight:700;letter-spacing:0}
.who small{font-size:12px;color:var(--dim)}
.lvbar{position:relative;height:16px;border-radius:9px;background:rgba(0,0,0,.45);margin-top:3px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.lvbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2a8aff,#5ad0ff,#a8f0ff);border-radius:9px;transition:width .4s}
.lvbar span{position:relative;display:block;text-align:center;font-size:11.5px;line-height:16px;font-weight:700;text-shadow:0 1px 2px #000}
.lvbar.cap i{background:linear-gradient(90deg,#ff5a3a,#ffc04a);animation:capg 1.2s infinite alternate}
@keyframes capg{to{filter:brightness(1.4)}}
.money{text-align:right;flex:none;font-size:13px;line-height:1.3}
.money .ic{color:var(--gold);font-size:18px}
.money b{font-size:17px;color:var(--gold2);margin-left:2px}
.money small{display:block;color:var(--dim);font-size:11.5px}
#hd .r2{display:flex;gap:6px;margin-top:8px}
#hd .r2 .btn{flex:1}
#hd .r2 .btn.sq{flex:0 0 46px}
.btn{background:linear-gradient(180deg,#3a3a8a,#262660);color:var(--tx);border-radius:12px;padding:10px 12px;font-size:16px;font-weight:700;letter-spacing:1px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 3px 10px rgba(0,0,0,.35);display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid rgba(170,180,255,.25)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.gold{background:linear-gradient(180deg,#ffe3a0,#e0a840 60%,#b8802a);color:#2a1800;border-color:#ffe9b0;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 16px rgba(242,196,107,.35),0 3px 10px rgba(0,0,0,.4)}
.btn.ghost{background:rgba(255,255,255,.06);box-shadow:none}
.btn.red{background:linear-gradient(180deg,#ff6a7a,#b8203a);border-color:#ff9aa8}
.btn.pink{background:linear-gradient(180deg,#ff9ac8,#d84a8a);border-color:#ffc0dc}
.btn.on{background:linear-gradient(180deg,#a678ff,#6a3ad8)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:9px}
.btn.big{padding:13px;font-size:19px;width:100%}
.btn.sq{padding:9px 0;width:44px;flex:none}
.btn[disabled]{opacity:.35;pointer-events:none;filter:grayscale(.6)}
.col{display:flex;flex-direction:column;gap:7px}
/* body & nav */
#bd{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 10px 18px;-webkit-overflow-scrolling:touch}
#nav{flex:none;display:flex;background:linear-gradient(180deg,rgba(18,16,50,.95),rgba(10,10,30,.98));border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;padding:7px 0 6px;font-size:12.5px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
#nav button .ic{font-size:24px;transition:transform .2s}
#nav button.on{color:var(--gold2)}
#nav button.on .ic{transform:translateY(-2px);filter:drop-shadow(0 0 6px rgba(242,196,107,.8))}
#nav button.on::before{content:'';position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--gold);box-shadow:0 0 8px var(--gold)}
h2{font-size:19px;margin:14px 4px 8px;display:flex;align-items:center;gap:6px;letter-spacing:2px;color:var(--gold2)}
h2 small{font-size:12.5px;color:var(--dim);margin-left:auto;font-weight:400;letter-spacing:0;font-family:'Huninn'}
h3{font-size:16px;margin:16px 4px 7px;color:#cfd4ff;letter-spacing:1px;display:flex;align-items:center;gap:6px}
h3 .ic{color:var(--vio)}
h3 small{margin-left:auto;color:var(--dim);font-weight:400}
.card{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px;box-shadow:0 4px 16px rgba(0,0,0,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card.warn{border-color:rgba(255,140,80,.5);background:linear-gradient(90deg,rgba(120,40,20,.5),rgba(40,20,60,.5));font-size:14px}
.card.warn .ic{color:#ff9a5a}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.tagr{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;align-items:center}
.tag{font-size:12px;padding:2px 8px;border-radius:20px;background:rgba(160,170,255,.12);color:#cfd4ff;white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.tag.ok{background:rgba(90,224,168,.18);color:var(--ok)}
.q1{color:#a0a0a8}.q2{color:#8ad0ff}.q3{color:#7af0a8}.q4{color:#c89aff}.q5{color:#ff9a5a}.q6{color:#ffd86a}.q7{color:#fff3b0;text-shadow:0 0 6px #ffd86a}
.tag.q4{background:rgba(166,120,255,.18)}.tag.q5{background:rgba(255,120,80,.18)}.tag.q6{background:rgba(255,210,90,.18)}.tag.q7{background:rgba(255,240,180,.22)}
.rchip{font-size:11.5px;padding:1px 7px;border-radius:10px;border:1.5px solid var(--c);color:var(--c);box-shadow:0 0 6px var(--c),inset 0 0 4px var(--c);background:rgba(0,0,0,.35);font-weight:700;white-space:nowrap}
.rdots{display:inline-flex;gap:3px;vertical-align:middle}
.rdots i{border-radius:50%;background:var(--c);box-shadow:0 0 5px var(--c);display:block;border:1px solid rgba(255,255,255,.3)}
.empty{text-align:center;color:var(--dim);padding:20px 8px;font-size:14px;line-height:1.7}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;font-size:14px;margin-top:6px}
.kv2 div{display:flex;justify-content:space-between;gap:6px;align-items:center}
.kv2 span{color:var(--dim)}
.bar{height:7px;background:rgba(0,0,0,.4);border-radius:5px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;border-radius:5px}
/* hero */
.hero{position:relative;border-radius:18px;overflow:hidden;background-size:cover;background-position:center;border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.5),inset 0 0 60px rgba(0,0,0,.5);margin-bottom:10px;perspective:600px}
.hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:14%;background:linear-gradient(transparent,rgba(5,5,20,.75));pointer-events:none;z-index:4}
.spirit{position:absolute;left:50%;top:44%;width:230px;height:230px;margin:-115px 0 0 -115px;opacity:.28;filter:drop-shadow(0 0 22px currentColor) blur(.5px);animation:spi 5s ease-in-out infinite;z-index:1}
.spirit .ic{width:100%;height:100%}
.spirit.s2{left:28%;opacity:.18;width:150px;height:150px;margin:-75px 0 0 -75px;animation-delay:-2s}
@keyframes spi{50%{transform:scale(1.06);opacity:.38}}
.avw{position:absolute;left:50%;z-index:2;filter:drop-shadow(0 6px 16px rgba(0,0,0,.6))}
.avw img{width:100%;height:100%;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-4px)}}
.hsvg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.hsvg.b{z-index:1}.hsvg.f{z-index:3}
.hr{animation:rbob 3.4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes rbob{50%{transform:translateY(-5px);filter:brightness(1.4)}}
.spark{animation:spark 2.6s linear infinite}
@keyframes spark{from{stroke-dashoffset:0}to{stroke-dashoffset:-318}}
.htag{position:absolute;left:12px;top:12px;z-index:5;display:flex;flex-direction:column;align-items:flex-start}
.htag b{font-size:22px;letter-spacing:3px;background:linear-gradient(180deg,#fff6d8,#f2c46b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 4px rgba(0,0,0,.7))}
.htag span{font-size:13px;color:#fff;background:rgba(0,0,0,.45);padding:1px 8px;border-radius:8px}
.hinfo{position:absolute;right:12px;top:12px;z-index:5;text-align:right;max-width:45%}
.hinfo b{font-size:22px;letter-spacing:2px;display:block;text-shadow:0 2px 6px #000}
.hinfo small{font-size:13px;color:#cfd4ff}
.hpow{position:absolute;right:12px;top:74px;z-index:5;font-size:14px;font-weight:700;color:var(--gold2);background:rgba(0,0,0,.5);padding:3px 10px;border-radius:10px;border:1px solid rgba(242,196,107,.4)}
.soulc .sic{width:54px;height:54px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--c);background:radial-gradient(circle,rgba(255,255,255,.08),rgba(0,0,0,.3));border:1px solid var(--c);box-shadow:0 0 14px -2px var(--c)}
.soulc b.big{font-size:21px;letter-spacing:2px}
.ringrow{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px dashed var(--line)}
.ringrow:last-child{border:0}
.ringrow b{font-size:16px;display:block}
.ringrow small{font-size:12px;color:var(--dim)}
.rn{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;border:2.5px solid var(--c);box-shadow:0 0 10px var(--c),inset 0 0 8px var(--c);font-size:14px}
.ringrow .rn{border-color:var(--c)}
.rn.sm{width:22px;height:22px;font-size:11px;border-width:2px}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.st{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.st span{color:var(--dim);display:flex;align-items:center;gap:5px}
.st span .ic{color:var(--vio);font-size:17px}
.st b{font-size:16px}
.bones{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bone{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:8px 2px 6px;text-align:center;opacity:.55}
.bone .ic{font-size:28px;color:#667}
.bone b{display:block;font-size:12px;font-weight:400}
.bone small{font-size:11px;color:var(--dim)}
.bone.on{opacity:1;border-color:var(--c);box-shadow:0 0 12px -3px var(--c)}
.bone.on .ic{color:var(--c);filter:drop-shadow(0 0 5px var(--c))}
/* plan */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.slot{background:linear-gradient(180deg,rgba(60,50,140,.6),rgba(25,22,70,.7));border:1px solid rgba(170,160,255,.35);border-radius:16px;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 14px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.1)}
.slot small{font-size:12px;color:var(--dim)}
.slot .ic{font-size:44px;color:var(--gold2);filter:drop-shadow(0 0 8px rgba(242,196,107,.5))}
.slot b{font-size:16px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.presets button{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14.5px;display:flex;align-items:center;gap:7px}
.presets .ic{font-size:22px;color:var(--vio)}
.actg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.actg button{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;position:relative}
.actg button.on{border-color:var(--gold);box-shadow:0 0 12px -2px var(--gold)}
.actg .ic{font-size:30px;color:var(--gold2)}
.actg b{display:block;font-size:16px;margin-top:2px}
.actg small{display:block;font-size:12px;color:var(--dim);line-height:1.4;margin-top:2px}
.actg i{position:absolute;right:8px;top:8px;font-style:normal;font-size:11px;color:var(--dim)}
/* adv */
.forest{display:flex;align-items:center;gap:10px;border-radius:14px;padding:13px 12px;margin-bottom:8px;background-size:cover;background-position:center;border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.35)}
.forest b{font-size:17px;letter-spacing:1px;display:block}
.forest small{font-size:12.5px;color:#c8cce8;display:block;margin-top:1px}
.quest .qic,.card .qic{width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px;background:rgba(166,120,255,.15);color:var(--vio)}
.card b{font-size:15.5px}
.card small{display:block;font-size:12.5px;color:var(--dim)}
.quest.done{opacity:.5}
.beast{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(30,30,70,.5));border:1px solid var(--line);margin-bottom:7px}
.beast .bic{width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;background:radial-gradient(circle,rgba(255,255,255,.1),rgba(0,0,0,.6));border:2.5px solid var(--c);box-shadow:0 0 14px var(--c)}
.beast b{font-size:16.5px}
.chk{font-size:14px;display:flex;align-items:center;gap:5px;color:var(--dim)}
.chk input{width:18px;height:18px;accent-color:#f2c46b}
/* comps */
.comp{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:14px;background:var(--pan);border:1px solid var(--line);margin-bottom:7px}
.comp.dead{opacity:.45;filter:grayscale(.9)}
.comp b{font-size:17px;display:block}
.comp b small{font-size:12px;color:var(--dim);font-weight:400;margin-left:6px;font-family:'Huninn'}
.lvt{font-size:13px;color:var(--gold2)}
.cav{width:58px;height:58px;border-radius:50%;flex:none;background:radial-gradient(circle,#2a2a6a,#101030);border:2.5px solid var(--c);box-shadow:0 0 10px -2px var(--c);overflow:visible;position:relative}
.cav img{width:100%;height:100%;border-radius:50%}
.cav.big{width:92px;height:92px}
.cav .hrt{position:absolute;right:-4px;bottom:-2px;color:var(--pink);font-size:20px;filter:drop-shadow(0 0 4px var(--pink))}
.aff{height:5px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden;margin-top:5px}
.aff i{display:block;height:100%;background:linear-gradient(90deg,#ff7aae,#ffb0d0)}
.cbig{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.cbig b{font-size:22px;letter-spacing:2px}
/* bag */
.inv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.it{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:8px 2px 6px;text-align:center;position:relative}
.it .ic{font-size:30px;color:var(--gold2)}
.it b{display:block;font-size:12px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it i{position:absolute;right:5px;top:3px;font-style:normal;font-size:12px;font-weight:700;color:var(--gold)}
/* log */
.chips{display:flex;gap:6px;margin-bottom:8px}
.chip{padding:6px 14px;border-radius:20px;font-size:14px;background:var(--pan);border:1px solid var(--line)}
.chip.on{background:linear-gradient(180deg,#a678ff,#6a3ad8);border-color:#c8a8ff}
.logl{display:flex;gap:8px;font-size:14px;line-height:1.6;padding:7px 4px;border-bottom:1px dashed var(--line)}
.logl .ic{flex:none;font-size:20px;margin-top:2px;color:var(--dim)}
.logl small{display:block;font-size:11.5px;color:var(--dim)}
.logl.g .ic{color:var(--gold)}.logl.g{color:#fff2d0}
.logl.b .ic{color:var(--vio)}
.achg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ach{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;opacity:.35;filter:grayscale(1)}
.ach .ic{font-size:28px}
.ach b{display:block;font-size:11.5px;font-weight:400;margin-top:2px}
.ach.on{opacity:1;filter:none;border-color:rgba(242,196,107,.6)}
.ach.on .ic{color:var(--gold);filter:drop-shadow(0 0 6px rgba(242,196,107,.7))}
.guide{line-height:1.8}
.guide b{display:block;margin-top:6px;color:var(--gold2)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(2,2,12,.68);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
@keyframes fd{from{opacity:0}}
.sheet{width:100%;max-width:540px;max-height:92%;overflow-y:auto;background:linear-gradient(180deg,#1c1a4a,#0e0e2c);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));animation:su .25s ease-out;position:relative;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
@keyframes su{from{transform:translateY(30%);opacity:.3}}
.ov.center{align-items:center;padding:16px}
.ov.center .sheet{border-radius:20px;border:1px solid rgba(242,196,107,.35);box-shadow:0 0 40px rgba(166,120,255,.25),0 20px 60px rgba(0,0,0,.6)}
.x{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);font-size:17px}
.sheet h2{margin-top:2px;padding-right:40px}
.evt .eic{width:84px;height:84px;margin:4px auto 6px;display:flex;align-items:center;justify-content:center;font-size:52px;color:var(--gold2);border-radius:50%;background:radial-gradient(circle,rgba(242,196,107,.25),transparent 70%);filter:drop-shadow(0 0 10px rgba(242,196,107,.6))}
.evt .tit{text-align:center;font-size:23px;font-weight:700;letter-spacing:3px;color:var(--gold2)}
.evt .body{font-size:15.5px;line-height:1.8;margin:10px 2px 14px;color:#dfe2ff}
.evt .opts{display:flex;flex-direction:column;gap:7px}
.evt .opts .btn{padding:12px;font-size:15.5px;line-height:1.4}
/* toast */

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const chance = p => Math.random() < p;
const wpick = (arr, wf) => { const t = arr.reduce((s, x) => s + wf(x), 0); let r = Math.random() * t; for (const x of arr) { r -= wf(x); if (r <= 0) return x; } return arr[arr.length - 1]; };
const fmt = n => { n = Math.round(n); if (Math.abs(n) >= 1e8) return (n / 1e8).toFixed(n >= 1e9 ? 0 : 1) + '億'; if (Math.abs(n) >= 1e4) return (n / 1e4).toFixed(n >= 1e5 ? 0 : 1) + '萬'; return n.toLocaleString(); };

function simBattle(A, B) {
  const all = [...A, ...B]; const steps = []; let round = 0;
  const alive = side => all.filter(u => u.side === side && u.hp > 0);
  const P = o => steps.push(o);
  if (A.length > 1 && has('shion')) A.forEach(u => u.buf += 0.1);
  if (has('veldora') && A.some(u => u.nm === '維爾德拉')) { A.forEach(u => u.buf += 0.2); P({ a: all.indexOf(A.find(u => u.nm === '維爾德拉')), t: [], n: '暴風龍的威壓', kind: 'buff', tier: 4, txt: '我方全體攻擊提升' }); }
  if (has('souei') || has('diablo')) { const w = (has('souei') ? 0.1 : 0) + (has('diablo') ? 0.1 : 0); B.forEach(u => { u.atk = Math.round(u.atk * (1 - w)); u.def = Math.round(u.def * (1 - w)); }); }
  while (round < 30 && alive(0).length && alive(1).length) {
    round++;
    const order = all.filter(u => u.hp > 0).sort((x, y) => y.spd - x.spd + R(-3, 3));
    for (const u of order) {
      if (u.hp <= 0) continue; if (!alive(0).length || !alive(1).length) break;
      if (u.regen && u.hp < u.hpM) u.hp = Math.min(u.hpM, u.hp + Math.round(u.hpM * u.regen));
      if (u.stun > 0) { u.stun--; P({ a: all.indexOf(u), t: [], n: '被束縛', kind: 'stun' }); continue; }
      const foes = alive(1 - u.side), friends = alive(u.side);
      const ready = u.sk.filter(s => !(u.cd[s.n] > 0)); for (const k in u.cd) u.cd[k]--;
      let s = ready.length && Math.random() < 0.8 ? ready.slice().sort((a, b) => b.mult - a.mult)[0] : null;
      if (s) u.cd[s.n] = s.cd;
      const kind = s ? s.kind : 'atk', mult = s ? s.mult : 1, tier = s ? Math.min(5, Math.floor(mult)) : -1;
      if (s && kind === 'heal') { const ts = friends.filter(f => f.hp < f.hpM * 0.8); if (ts.length) { const hs = ts.map(f => { const h = Math.round(u.atk * mult * 1.2); f.hp = Math.min(f.hpM, f.hp + h); return -h; }); P({ a: all.indexOf(u), t: ts.map(f => all.indexOf(f)), d: hs, n: s.n, kind: 'heal', tier }); continue; } }
      if (s && kind === 'shield') { const sh = Math.round(u.def * mult * 2.2); friends.forEach(f => f.shield += sh); P({ a: all.indexOf(u), t: friends.map(f => all.indexOf(f)), n: s.n, kind: 'shield', tier, txt: `全體護盾 +${fmt(sh)}` }); continue; }
      if (s && kind === 'buff') { friends.forEach(f => f.buf = Math.min(2.5, f.buf + 0.15)); P({ a: all.indexOf(u), t: friends.map(f => all.indexOf(f)), n: s.n, kind: 'buff', tier, txt: '全體強化' }); continue; }
      const targets = kind === 'aoe' ? foes : [foes.slice().sort((a, b) => a.hp / a.hpM - b.hp / b.hpM + R(-0.3, 0.3))[0]];
      const crit = Math.random() < u.crit;
      if (!s && targets.length === 1 && Math.random() < Math.min(0.2, (targets[0].spd - u.spd) / 100)) { P({ a: all.indexOf(u), t: [all.indexOf(targets[0])], d: [0], n: '閃避', kind: 'miss' }); continue; }
      const ds = targets.map(t => {
        const ew = s && EL_WEAK[s.el] && EL_WEAK[s.el].includes(t.el) ? 1.5 : 1;
        let d = Math.max(1, u.atk * u.buf * mult * (kind === 'aoe' ? 0.7 : 1) * ew * (crit ? 1.8 : 1) - t.def * 0.5) * R(0.88, 1.12) * (1 - t.red);
        d = Math.round(d); if (t.shield > 0) { const ab = Math.min(t.shield, d); t.shield -= ab; d -= ab; }
        t.hp -= d; if (kind === 'ctrl' && Math.random() < 0.45) t.stun = 1;
        if (t.hp <= 0 && t.revive) { t.revive = 0; t.hp = Math.round(t.hpM * 0.5); }
        return d;
      });
      P({ a: all.indexOf(u), t: targets.map(t => all.indexOf(t)), d: ds, n: s ? s.n : (u.mon ? '撲擊' : '攻擊'), kind: s ? (kind === 'ctrl' ? 'ctrl' : 'skill') : 'atk', tier, crit });
    }
  }
  const win = alive(0).length > 0 && alive(1).length === 0;
  return { win, steps, units: all, round, hpLeft: A.reduce((s, u) => s + Math.max(0, u.hp), 0) / A.reduce((s, u) => s + u.hpM, 0) };
}

  veldora: () => ({ t: '暴風龍維爾德拉', ic: 'dragon-head', body: '「聽得見嗎，小不點？」<br>被封印了三百年的<b>暴風龍維爾德拉</b>，是個超級話嘮又怕寂寞的龍。聊著聊著，你們成了朋友。<br>他說要幫你取名字，你也幫他取一個「姓」。', ch: [{ t: '一起取名「坦派斯特」', f: () => { S.flags.named = 1; S.ep += 120; learn('waterBlade', '水壓實驗'); log('與暴風龍維爾德拉結為朋友，互相取名。從此你叫「利姆路・坦派斯特」。', 'dragon-head', 2); return '「從今天起，你就是<b>利姆路・坦派斯特</b>！」<br>被暴風龍取名，你的魔素大幅增加。<br>你用吞進去的水做實驗，學會了【水刃】。<br><br><span class="dim">先在洞窟裡捕食魔物、變強吧（魔素 700 以上、三個月後可以離開洞窟）。</span>'; } }] }),
  leaveCave: () => ({ t: '告別洞窟', ic: 'cave-entrance', body: '維爾德拉的封印很難從外面解開。<br>「把我吃進你肚子裡吧！你在外面解析封印，我在裡面破解，兩邊一起來！」', ch: [{ t: '把維爾德拉吞進胃袋', f: () => { S.flags.veldIn = 1; log('把暴風龍維爾德拉連同封印一起吞進胃袋，離開了封印洞窟。', 'dragon-head', 2); S.evq.push({ k: 'goblins' }); return '你張開身體，把巨龍連同封印一起吞了進去。<br>「等你出來，我們再一起玩！」<br>洞窟外，是一片陌生的大森林——'; } }] }),
  goblins: () => ({ t: '哥布林村', ic: 'goblin-head', body: '森林裡，一群哥布林跪在你面前：「強大的大人！求求您救救我們！」<br>他們的村子每晚都被<b>牙狼族</b>襲擊，戰士們幾乎都死光了……', ch: [{ t: '交給我吧', f: () => battleEvent([monUnit(MONS.find(m => m.id === 'wolf'), 1300, { nm: '牙狼族長', hpX: 1.4, boss: 1 }), monUnit(MONS.find(m => m.id === 'wolf'), 380), monUnit(MONS.find(m => m.id === 'wolf'), 350)], w => w ? ({ next: STORY.naming() }) : (S.flags.retryGob = S.t + 1, '牙狼太多了，你帶著哥布林退回村子，用鋼絲設下陷阱……<br><span class="dim">（下個月再戰）</span>'), { team: [playerUnit(), foeUnit('哥布林戰士', 150, { side: 0, ic: 'goblin-head', col: '#7ac87a' }), foeUnit('哥布林戰士', 140, { side: 0, ic: 'goblin-head', col: '#7ac87a' })], title: '哥布林村防衛戰' }) }] }),
  naming: () => ({ t: '取名', ic: 'scroll-unfurled', body: '牙狼族長倒下後，剩下的狼群向你臣服。<br>你決定幫大家取名字——<b>在這個世界，被取名的魔物會進化</b>。<br>村長叫<b>利格魯德</b>、頑皮的小哥布林叫<b>哥布達</b>、新的牙狼族長叫<b>蘭加</b>……', ch: [{ t: '全部取名！', f: () => {
    chapter(1); S.flags.c1 = S.t;
    addOff('rigurd', 1200); addOff('gobta', 800); addOff('ranga', 9000);
    S.pop = 160; S.bld = { house: 1, farm: 1, lumber: 1 }; S.res = { food: 300, wood: 200, stone: 0, ore: 0, gold: 50 };
    learn('shadow', '解析牙狼族長'); S.ep *= 0.9;
    log('幫哥布林和牙狼族全員取名。哥布林進化為大哥布林，牙狼族進化為嵐牙狼。坦派斯特村誕生！', 'house', 2);
    return '取名消耗了大量魔素，你陷入「低位活動狀態」睡了三天。<br>醒來時，哥布林們都長高了，牙狼變成了<b>嵐牙狼</b>！<br><br><b>坦派斯特村</b>誕生了。<br><span class="dim">「魔國」分頁已開放：蓋房子、開農田，讓村子成長吧。</span>'; } }] }),
  dwarf: () => ({ t: '武裝國家德瓦岡', ic: 'anvil', body: '村子需要懂技術的工匠。你帶著利格魯德前往矮人王國<b>德瓦岡</b>。<br>在酒館裡，傲慢的大臣<b>貝斯塔</b>當眾羞辱魔物，還把酒潑在你身上……', ch: [
    { t: '忍下來', f: () => { S.rel.dwarf += 10; return { next: STORY.dwarf2(1) }; } },
    { t: '讓凱金揍他', f: () => ({ next: STORY.dwarf2(0) }) }] }),
  dwarf2: calm => ({ t: '矮人王的裁決', ic: 'crown', body: `${calm ? '你沒有生氣，矮人鍛冶師<b>凱金</b>卻看不下去，一拳把貝斯塔打飛了。' : '凱金一拳把貝斯塔打飛了。'}<br>英雄王<b>加傑魯</b>親自裁決：凱金被流放。<br>國王私下看著你：「……魔物啊，你想做什麼？」`, ch: [{ t: '「建一個人類與魔物共存的國家」', f: () => {
    chapter(2); addOff('kaijin', 1500, 1); S.res.ore += 60; S.rel.dwarf = Math.max(S.rel.dwarf, 40);
    log('凱金與三兄弟成為村子的一員。矮人王國的技術流入坦派斯特。', 'anvil', 2);
    return '凱金與三兄弟決定跟你回村子。<br><span class="dim">解鎖：採石場、礦坑、鍛冶場；研究「製陶」。</span>'; } }] }),
  shizu: () => ({ t: '靜小姐', ic: 'flame', body: '回村途中，你遇到一支人類冒險者隊伍。其中戴著面具的黑髮女性<b>井澤靜</b>，和你一樣來自日本。<br>那天晚上，她體內的炎之精靈<b>伊弗利特</b>突然暴走！', ch: [{ t: '阻止伊弗利特', f: () => battleEvent([foeUnit('伊弗利特', 5200, { ic: 'fire-ray', el: '火', hpX: 1.8, boss: 1, sk: [{ n: '火焰之環', kind: 'aoe', mult: 1.6, el: '火', cd: 1 }, { n: '火焰化身', kind: 'atk', mult: 2, el: '火', cd: 2 }] }), foeUnit('火焰蜥蜴', 900, { ic: 'fire-breath', el: '火' }), foeUnit('火焰蜥蜴', 900, { ic: 'fire-breath', el: '火' })], w => w ? ({ next: STORY.shizu2() }) : retry(1, '伊弗利特的火焰太猛烈，你們暫時撤退。冒險者們用冰魔法壓制著她……<br><span class="dim">（下個月再挑戰。水屬性技能剋火！）</span>'), Object.assign(T(1), { title: '炎之巨人伊弗利特' })) }] }),
  shizu2: () => ({ t: '遺願', ic: 'heart-wings', body: '伊弗利特被你吞噬了。<br>但靜小姐的生命也走到盡頭。她說起自己被召喚到這個世界的過去、在空襲中失去的母親，還有她在英格拉西亞教過的孩子們。<br>「……可以讓我，在你的身體裡沉睡嗎？」', ch: [{ t: '「好。」', f: () => {
    chapter(3); S.race = 1; S.ep *= 1.3; learn('blackFlame', '吞噬伊弗利特');
    log('井澤靜在懷中安詳離世。你吞噬了她，繼承了她的外形與遺志，學會人型擬態。', 'heart-wings', 2);
    return '你吞噬了靜小姐。<br>從此，你可以變成<b>人類的樣子</b>——一個長得很像少女時代的靜小姐、銀藍色頭髮的孩子。<br>也從伊弗利特那裡得到了【黑炎】。<br><span class="dim">種族進化：史萊姆（人型擬態）</span>'; } }] }),
  ogres: () => ({ t: '大鬼族', ic: 'oni', body: '六個<b>大鬼族</b>突然攻擊了你和哥布林巡邏隊！<br>他們的村子被一支穿著盔甲的豬頭族大軍消滅，誤以為你是那個幕後黑手。<br>為首的紅髮少主拔出了刀——', ch: [{ t: '迎戰（手下留情）', f: () => battleEvent(weaken([foeUnit('大鬼族少主', 7500, { ic: 'oni', el: '火', sk: [{ n: '鬼火', kind: 'aoe', mult: 1.5, el: '火', cd: 1 }] }), foeUnit('大鬼族武者', 5800, { ic: 'katana', sk: [{ n: '剛力斬', kind: 'atk', mult: 1.8, el: '無', cd: 1 }] }), foeUnit('大鬼族劍客', 6500, { ic: 'broadsword', spdB: 10, sk: [{ n: '朧斬', kind: 'atk', mult: 2, el: '無', cd: 1 }] }), foeUnit('大鬼族忍者', 5000, { ic: 'ninja-head', spdB: 12, sk: [{ n: '鋼絲', kind: 'ctrl', mult: 1.2, el: '暗', cd: 1 }] })], 0.75), w => w ? ({ next: STORY.ogres2() }) : retry(1, '大鬼們實在太強，你們先撤退。朱菜說：「哥哥，那個史萊姆……好像不是壞人。」<br><span class="dim">（下個月再戰）</span>'), Object.assign(T(2), { title: '大鬼族之戰' })) }] }),
  ogres2: () => ({ t: '六位鬼人', ic: 'oni', body: '誤會解開了。大鬼族的少主跪下：「請讓我們成為您的部下，向豬頭族報仇！」<br>你為六人取名：<b>紅丸、朱菜、紫苑、蒼影、白老、黑兵衛</b>。', ch: [{ t: '取名', f: () => {
    chapter(4); addOff('benimaru', 26000); addOff('shuna', 9000); addOff('shion', 20000); addOff('souei', 18000); addOff('hakurou', 22000); addOff('kurobe', 7000);
    learn('blackThunder', '解析嵐牙狼'); S.ep *= 0.92;
    log('為六位大鬼取名，他們進化成「鬼人」。紅丸成為武士大將，朱菜成為巫女。', 'oni', 2);
    return '六位大鬼進化成了<b>鬼人</b>——力量暴增，連你都嚇了一跳。<br>你又睡了三天。<br>醒來後，大賢者解析了蘭加的力量，你學會了【黑雷】。<br><span class="dim">解鎖：紡織工房、訓練場、城牆、森林深處。</span>'; } }] }),
  gabiru: () => ({ t: '嘉比爾大人駕到', ic: 'lizardman', body: '一個騎著蜥蜴、很自戀的<b>蜥蜴人</b>跑來村子：「吾乃嘉比爾！爾等哥布林，速速臣服於吾！」<br>他說豬頭族大軍二十萬正朝濕地進攻……', ch: [{ t: '讓哥布達跟他單挑', f: () => { if (has('gobta')) S.offs.gobta.ep *= 1.1; return '哥布達一腳把嘉比爾踢飛了。<br>嘉比爾：「這、這次算你運氣好！」<br>你知道——<b>豬頭族大軍</b>就快來了。好好整備軍隊吧。'; } }, { t: '叫他回去', f: () => '嘉比爾氣呼呼地走了。豬頭族的大軍正在逼近……' }] }),
  orcWar: () => ({ t: '豬頭帝', ic: 'orc-head', body: `二十萬豬頭族大軍包圍了蜥蜴人的濕地。<br>樹妖<b>特雷妮</b>現身：「森林的守護者請求您——討伐誕生於大軍之中的<b>豬頭帝</b>。」<br>我方軍力 <b>${fmt(milPower())}</b>（軍力越強，敵軍被削弱越多）`, ch: [{ t: '全軍出擊', f: () => {
    const cut = armyCut(4000);
    return battleEvent(weaken([foeUnit('豬頭將軍', 16000, { ic: 'orc-head', el: '暗', sk: [{ n: '飢餓', kind: 'atk', mult: 1.6, el: '暗', cd: 1 }] }), foeUnit('豬頭將軍', 15000, { ic: 'orc-head', el: '暗' }), foeUnit('豬頭騎士團', 22000, { ic: 'knight-banner', el: '暗', hpX: 1.5 })], cut), w => w ? battleEvent(weaken([foeUnit('豬頭帝・蓋爾德', 70000, { ic: 'orc-head', el: '暗', hpX: 3, boss: 1, regen: 0.05, sk: [{ n: '飢餓者', kind: 'aoe', mult: 1.8, el: '暗', cd: 1 }, { n: '肉切包丁', kind: 'atk', mult: 2.4, el: '暗', cd: 2 }] })], cut), w2 => w2 ? ({ next: STORY.orc2() }) : retry(2, '豬頭帝吞噬了倒下的同伴，不斷再生……你們被迫撤退。<br><span class="dim">（兩個月後再戰。提升魔素、讓幹部成長、增強軍力吧）</span>'), Object.assign(T(3), { title: '決戰・豬頭帝' })) : retry(2, '豬頭族的數量太多了……你們退回防線。<br><span class="dim">（兩個月後再戰）</span>'), Object.assign(T(3), { title: '濕地會戰' }));
  } }] }),
  orc2: () => ({ t: '吞噬豬頭帝', ic: 'fangs', body: '倒下的豬頭帝<b>蓋爾德</b>說：「我的同胞們……都在挨餓……」<br>你決定把他的罪連同他的身體，一起吞下。', ch: [{ t: '「你的罪，我全部吃掉」', f: () => {
    chapter(5); S.race = 2; S.ep += 70000 * 0.6; S.uniq = S.uniq.filter(x => x !== 'predator').concat('glutton'); learn('hunger', '吞噬豬頭帝');
    addOff('geld', 30000); addOff('gabiru', 12000); S.orcs = 150000; S.flags.treyni = 1; S.fame += 30;
    log('吞噬豬頭帝，捕食者與飢餓者合成為「暴食者」。十五萬豬頭族歸順，朱拉大森林大同盟成立。', 'fangs', 2);
    return '捕食者與飢餓者合而為一——獨有技能【<b>暴食者</b>】！<br>十五萬倖存的豬頭族向你效忠，新的族長被取名為<b>蓋爾德</b>，進化為豬人族。<br>蜥蜴人的<b>嘉比爾</b>也成了你的部下。<br><br>森林各族簽下盟約——<b>朱拉・坦派斯特聯邦國（魔國聯邦）</b>誕生了！<br><span class="dim">解鎖：研究所、市場、研究項目、東部荒野。豬頭族開拓團會幫忙建設。</span>'; } }] }),
  milim: () => ({ t: '魔王米莉姆', ic: 'dragon-spiral', body: '天空中劃過一道光。一個雙馬尾的少女落在你面前：「你就是新的魔王候補嗎？我是<b>米莉姆・拿渥</b>！」<br>最古老的魔王之一，「破壞的暴君」。她說要跟你打一場。', ch: [
    { t: '拿出蜂蜜收買她', f: () => { chapter(6); S.flags.milimF = 1; S.ep *= 1.05; log('魔王米莉姆成了你的「摯友」。', 'honey-jar', 2); return '米莉姆吃了一口蜂蜜，眼睛閃閃發亮：「……我們是<b>摯友</b>了！」<br>她在魔國住了下來，偶爾陪你「修行」（被揍）。<br><span class="dim">米莉姆成為你的摯友。之後的某場大戰會派上用場。</span>'; } },
    { t: '認真打一場', f: () => battleEvent([foeUnit('米莉姆・拿渥', 3e7, { ic: 'dragon-spiral', boss: 1, hpX: 2, sk: [{ n: '龍星爆炎', kind: 'aoe', mult: 3, el: '龍', cd: 1 }] })], () => { chapter(6); S.flags.milimF = 1; S.ep *= 1.08; log('被魔王米莉姆揍了一頓，但她很開心，成了你的「摯友」。', 'honey-jar', 2); return '你被一拳打飛到山的另一邊。<br>米莉姆哈哈大笑：「你很有意思！我們做<b>摯友</b>吧！」<br>（被魔王揍過，魔素 +8%）'; }, Object.assign(T(2), { title: 'vs 魔王米莉姆' })) }] }),
  blumund: () => ({ t: '布魯蒙德王國', ic: 'tower-flag', body: '布魯蒙德王國的公會長<b>佛茲</b>派人來談：「我們想和魔國簽訂互不侵犯與通商條約。」<br>這是魔國第一次被人類國家承認。', ch: [{ t: '簽約', f: () => { S.flags.blumund = 1; S.rel.blumund = 55; S.rel.eura = 40; S.fame += 15; addOff('vester', 4000); log('與布魯蒙德王國簽訂通商條約。矮人王派貝斯塔前來贖罪，加入研究所。', 'tower-flag', 2); return '條約簽訂！冒險者可以自由來訪魔國了。<br>同時，矮人王派了當年的大臣<b>貝斯塔</b>前來——他想贖罪，成為你的研究員。<br><span class="dim">解鎖：溫泉旅館。貝斯塔加入（研究 +50%）。</span>'; } }] }),
  teacher: () => ({ t: '靜小姐的學生', ic: 'school-bag', body: '你想起了靜小姐的遺願——英格拉西亞的五個孩子。<br>他們是被召喚來的「不完全召喚者」，體內的魔素正一點一點燒毀他們的身體，只剩下幾年可活。', ch: [{ t: '去英格拉西亞當老師', f: () => {
    chapter(7); S.flags.teacher = 1; S.fame += 25; S.rel.ingra = 45; S.ep *= 1.05;
    log('以老師的身分前往英格拉西亞，用精靈的力量救下靜小姐的五個學生。', 'school-bag', 2);
    return '你在自由學園當了一陣子的老師。<br>和孩子們一起闖進精靈的棲息地，讓上位精靈與他們融合——<b>五個孩子都得救了</b>。<br>你終於完成了靜小姐的心願。<br><span class="dim">解鎖：學校。與英格拉西亞關係提升。</span>'; } }] }),
  charybdis: () => ({ t: '暴風大妖渦', ic: 'shark-fin', body: '天空被烏雲覆蓋——傳說中的魔物<b>暴風大妖渦（卡律布狄斯）</b>復活了！<br>它帶著一群飛鯊，直直朝魔國飛來。', ch: [
    { t: '全力迎擊', f: () => battleEvent([foeUnit('暴風大妖渦', 260000, { ic: 'shark-fin', el: '飛', hpX: 3, boss: 1, regen: 0.04, sk: [{ n: '魔力妨害', kind: 'ctrl', mult: 1.4, el: '暗', cd: 2 }, { n: '暴風', kind: 'aoe', mult: 1.8, el: '風', cd: 1 }] }), foeUnit('飛鯊', 30000, { ic: 'shark-fin', el: '飛' }), foeUnit('飛鯊', 30000, { ic: 'shark-fin', el: '飛' })], w => w ? ({ next: STORY.charyb2(0) }) : (S.flags.milimF ? ({ next: STORY.charyb2(1) }) : retry(2, '大妖渦太強了……')), Object.assign(T(3), { title: '暴風大妖渦' })) },
    { t: '「米莉姆，交給妳了」', c: () => S.flags.milimF, f: () => ({ next: STORY.charyb2(1) }) }] }),

// ---------------- 星空（全域動態背景） ----------------
(function sky() {
  const c = document.createElement('canvas'); c.id = 'sky'; document.body.prepend(c); const g = c.getContext('2d');
  let W, H, stars = [], motes = [];
  const rs = () => { W = c.width = innerWidth; H = c.height = innerHeight; stars = Array.from({ length: Math.round(W * H / 5000) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + 0.2, p: Math.random() * 6, s: 0.5 + Math.random() * 1.5 })); motes = Array.from({ length: 26 }, () => ({ x: Math.random() * W, y: Math.random() * H, v: 0.15 + Math.random() * 0.4, r: 1 + Math.random() * 2.2, h: pick([45, 270, 200, 330]) })); };
  rs(); addEventListener('resize', rs);
  let last = 0;
  const f = t => {
    requestAnimationFrame(f); if (t - last < 40) return; last = t;
    g.clearRect(0, 0, W, H);
    for (const s of stars) { const a = 0.35 + 0.65 * Math.abs(Math.sin(t / 1000 * s.s + s.p)); g.fillStyle = `rgba(220,230,255,${a * 0.8})`; g.fillRect(s.x, s.y, s.r, s.r); }
    for (const m of motes) { m.y -= m.v; m.x += Math.sin(t / 1400 + m.y / 60) * 0.25; if (m.y < -10) { m.y = H + 10; m.x = Math.random() * W; } const gr = g.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r * 4); gr.addColorStop(0, `hsla(${m.h},90%,75%,.8)`); gr.addColorStop(1, `hsla(${m.h},90%,60%,0)`); g.fillStyle = gr; g.beginPath(); g.arc(m.x, m.y, m.r * 4, 0, 7); g.fill(); }
  };
  requestAnimationFrame(f);
})();

  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');

  const bg = g.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, c1); bg.addColorStop(0.6, c2); bg.addColorStop(1, c3); g.fillStyle = bg; g.fillRect(0, 0, w, h);
  for (let i = 0; i < w * h / 900; i++) { g.fillStyle = `rgba(255,255,255,${rnd() * 0.8})`; const r = rnd() * 1.4; g.fillRect(rnd() * w, rnd() * h * 0.7, r, r); }
  // 銀河
  g.save(); g.globalCompositeOperation = 'lighter'; for (let i = 0; i < 70; i++) { const x = rnd() * w, y = h * 0.1 + x * 0.25 * (o.tilt || 0.6) + (rnd() - 0.5) * h * 0.18; const gr = g.createRadialGradient(x, y, 0, x, y, 30 + rnd() * 40); gr.addColorStop(0, `hsla(${250 + rnd() * 60},70%,60%,.07)`); gr.addColorStop(1, 'transparent'); g.fillStyle = gr; g.fillRect(x - 70, y - 70, 140, 140); } g.restore();
  // 月亮

  // 山與森林剪影

    const t = L / (layers - 1), base = h * (0.55 + t * 0.32), amp = h * (0.22 - t * 0.12);
    const col = o.land ? o.land[L] : `rgba(${10 + t * 6},${8 + t * 4},${30 - t * 14},${0.55 + t * 0.45})`;
    g.fillStyle = col; g.beginPath(); g.moveTo(0, h);
    let y = base; for (let x = 0; x <= w; x += 6) { y = base - amp * (0.5 + 0.5 * Math.sin(x / (60 + L * 30) + seed + L * 2)) * (0.6 + 0.4 * Math.sin(x / 23 + L)); g.lineTo(x, y); }
    g.lineTo(w, h); g.fill();
    if (o.trees !== false && L >= layers - 2) { for (let x = -10; x < w + 10; x += 9 + rnd() * 14) { const th = (18 + rnd() * 38) * (1 + t); const by = base - amp * 0.2 + rnd() * 10; g.beginPath(); g.moveTo(x, by - th); g.lineTo(x - th * 0.28, by); g.lineTo(x + th * 0.28, by); g.fill(); } }
    // 霧
    const fog = g.createLinearGradient(0, base - amp, 0, base + 20); fog.addColorStop(0, 'transparent'); fog.addColorStop(1, o.fog || 'rgba(150,120,220,.12)'); g.fillStyle = fog; g.fillRect(0, base - amp, w, amp + 20);
  }
  const uri = c.toDataURL('image/jpeg', 0.86); SCN[key] = uri; return uri;
}

function vHunt(bd) {

  <div style="margin-top:6px">同行：<b>${esc(myName())}</b>${tm.map(k => `、${OFFS[k].n}<span class="dim">(${rankOf(S.offs[k].ep).n})</span>`).join('')}${tm.length ? '' : '<span class="dim">（有了幹部後會同行）</span>'}</div></div>
  ${ZONES.filter(z => z.need()).map(z => `<div class="forest" style="background-image:linear-gradient(90deg,rgba(4,8,20,.88),rgba(4,8,20,.3)),url(${bgFor(z.id, 540, 120, z.min % 97)})"><div class="grow"><b>${ic(z.ic)} ${z.n}</b><small>${z.d}</small><div class="tagr">${rankChip(z.min)}<span class="dim">→</span>${rankChip(z.max)}<span class="tag">魔素 ${fmt(z.min)}～${fmt(z.max)}</span></div></div><button class="btn gold sm" data-z="${z.id}">出發</button></div>`).join('')}
  ${ZONES.filter(z => !z.need()).slice(0, 1).map(z => `<div class="forest locked"><div class="grow"><b>${ic('padlock')} ？？？</b><small>隨著劇情推進開放</small></div></div>`).join('')}`;
  bd.querySelectorAll('[data-z]').forEach(b => b.onclick = () => goHunt(b.dataset.z));
}
function goHunt(zid) {
  if (S.inj >= 2) return toast('身體還在再生中，先休息吧', 'slime', 'b');
  const z = ZONES.find(x => x.id === zid);
  monthTick(['hunt']); flushNews(); save(); render();
  const enc = encounters(zid);
  const sh = sheet(`<h2>${ic(z.ic)}${z.n}</h2><div class="dim small" style="margin:-4px 4px 8px">大賢者解析了附近的魔物：</div>
    ${enc.map((e, i) => { const tot = e.ep * e.grp, r = tot / S.ep, nw = !S.sk[e.m.sk]; return `<div class="beast" style="--c:${rankOf(e.ep).c}"><div class="bic">${ic(e.m.ic)}</div><div class="grow"><b>${e.m.n}${e.grp > 1 ? ' ×' + e.grp : ''}</b><div class="tagr">${rankChip(e.ep)}<span class="tag">魔素 ${fmt(e.ep)}</span><span class="tag ${r > 1.6 ? 'q5' : r > 0.9 ? 'q4' : 'ok'}">${r > 1.6 ? '危險' : r > 0.9 ? '勢均力敵' : r > 0.25 ? '有把握' : '太弱'}</span>${nw ? `<span class="tag q6">新技能【${SKILLS[e.m.sk].n}】</span>` : ''}</div></div><button class="btn sm gold" data-e="${i}">討伐</button></div>`; }).join('')}
    <div class="row" style="margin-top:8px"><button class="btn ghost sm" id="bLeave" style="margin-left:auto">回去</button></div>`);
  sh.querySelectorAll('[data-e]').forEach(b => b.onclick = () => {
    const e = enc[+b.dataset.e]; closeSheet(true);
    const A = teamUnits(2); const Bs = Array.from({ length: e.grp }, () => monUnit(e.m, e.ep));
    const res = simBattle(A, Bs);
    playBattle(res, `${z.n}・${e.m.n}`, () => afterHunt(res, e), z.id);
  });
  $('bLeave').onclick = () => closeSheet();
}
function afterHunt(res, e) {
  if (!res.win) { S.loss++; S.inj = 2; save(); return result('broken-shield', '撤退', `${e.m.n}太強了，你把身體分裂成好幾塊逃走了。<br><span class="dim">（再生中：兩個月內修行效率減半、攻擊下降）</span>`); }
  S.wins++;
  const d = devour(e); save();
  result('slime', '捕食', `<div class="pred">${ic('slime')}</div>你吞噬了${e.m.n}${e.grp > 1 ? ' ×' + e.grp : ''}！<br>魔素 <b class="gold">+${fmt(d.g)}</b>${d.skr === 'new' ? `<br><b class="gold">${ic('sparkles')} 獲得新技能【${SKILLS[e.m.sk].n}】！</b><br><span class="dim">${SKILLS[e.m.sk].d}</span>` : d.skr === 'up' ? `<br>【${SKILLS[e.m.sk].n}】熟練度提升到 ${'★'.repeat(S.sk[e.m.sk])}` : ''}${d.gold ? `<br>素材換得 ${fmt(d.gold)} 金幣、魔鋼礦 +${d.ore}` : ''}`);
}

  <div class="dim small" style="padding:6px">戰鬥時會帶魔素最高的幾位幹部出戰。方針「練兵」、白老、地下迷宮都能讓幹部成長。</div>`;

function vLog(bd) {

  if (logTab === 'guide') body = `<div class="card small guide">
    <b>${ic('slime')} 捕食</b>在「討伐」打倒魔物後吞噬牠，魔素增加並奪取技能。挑戰勢均力敵的對手收穫最大；輸了不會死，只會分裂逃走、再生兩個月。<br>
    <b>${ic('brain')} 大賢者</b>方針的「解析」會產生研究點數、提升技能熟練度，還能把兩個技能合成更強的技能。<br>
    <b>${ic('castle')} 魔國</b>離開洞窟後會建立村子。住宅讓人口成長、農田養活大家；每棟建築都需要人手，人口不夠生產就會打折。<br>

// ======================================================================
//  戰鬥單位
// ======================================================================
function unitHTML(u, i) {
  const face = u.img && IMGS[u.img] ? `<div class="ufig" style="--c:${u.col}"><img src="${CIMG(u.img)}" alt=""></div>` : (u.img === 'rimuru' || u.img === 'rimuruH') ? `<div class="bav sl" style="--c:${u.col}">${slimeSVG('#5ad0ff', 66)}</div>` : `<div class="bav" style="--c:${u.col}">${ic(u.ic || 'wolf-head')}</div>`;
  return `<div class="u ${u.boss ? 'boss' : ''}" id="u${i}">${face}<b>${esc(u.nm)}</b><small>${rankOf(u.ep).n}・${fmt(u.ep)}</small><div class="hp"><i style="width:100%"></i></div></div>`;
}

// ---------------- sheet ----------------
function sheet(html, center, onClose) {
  closeSheet(true);
  const o = document.createElement('div'); o.className = 'ov' + (center ? ' center' : ''); o.id = 'ovl';
  o.innerHTML = `<div class="sheet ${center ? 'evt' : ''}">${center === 2 ? '' : '<button class="x" id="xClose">✕</button>'}${html}</div>`;
  document.body.appendChild(o);
  if (center !== 2) { $('xClose').onclick = () => closeSheet(); o.onclick = e => { if (e.target === o) closeSheet(); }; }
  o._onClose = onClose; return o.querySelector('.sheet');
}
function closeSheet(silent) { const o = $('ovl'); if (o) { o.remove(); if (!silent && o._onClose) o._onClose(); } if (!silent) { render(); setTimeout(nextEvent, 120); } }


// ======================================================================
//  戰鬥動畫
// ======================================================================
function playBattle(res, title, done, bg) {
  const all = res.units; const hp = all.map(u => u.hpM);
  const o = document.createElement('div'); o.id = 'bat';
  o.innerHTML = `<div class="in" style="background-image:linear-gradient(rgba(5,5,20,.25),rgba(5,5,20,.7)),url(${bgFor(bg || 'battle', 540, 900, 77 + title.length)})">
    <div class="vs">${esc(title)}</div>
    <div class="side foe">${all.map((u, i) => u.side === 1 ? unitHTML(u, i) : '').join('')}</div>
    <div class="blog" id="blog"><span class="vsbig">VS</span></div>
    <div class="side ally">${all.map((u, i) => u.side === 0 ? unitHTML(u, i) : '').join('')}</div>
    <div class="bbtn"><button class="btn ghost" id="bFast">加速 ×3</button><button class="btn ghost" id="bSkip">跳過</button></div><div class="flash" id="flash"></div></div>`;
  document.body.appendChild(o);
  let i = 0, speed = 640, stop = false;
  const fin = () => {
    if (stop) return; stop = true; $('blog').innerHTML = '';
    all.forEach((u, k) => { const el = $('u' + k); if (el) { el.querySelector('.hp i').style.width = Math.max(0, u.hp / u.hpM * 100) + '%'; if (u.hp <= 0) el.classList.add('dead'); } });
    const r = document.createElement('div'); r.className = 'bres ' + (res.win ? 'win' : 'lose'); r.innerHTML = `<div class="big">${res.win ? '勝利' : '敗北'}</div><div class="dim">${res.round} 回合</div><button class="btn gold" id="bEnd" style="width:200px">繼續</button>`;
    o.querySelector('.in').appendChild(r); $('bEnd').onclick = () => { o.remove(); done && done(res.win); };
  };
  const step = () => {
    if (stop || !$('blog')) return; if (i >= res.steps.length) return fin();
    const f = res.steps[i++]; const a = all[f.a], ae = $('u' + f.a);
    if (ae) { ae.classList.remove('act'); void ae.offsetWidth; ae.classList.add('act'); }
    const big = f.kind === 'fusion' || (f.tier >= 3 && f.kind !== 'atk');
    const col = f.tier >= 0 ? TIERC[Math.min(f.tier, 5)] : '#fff';
    if (f.kind === 'stun') $('blog').innerHTML = `<span class="bl">${esc(a.nm)} 被控制，無法行動</span>`;
    else if (f.kind === 'miss') $('blog').innerHTML = `<span class="bl">${esc(all[f.t[0]].nm)} 閃開了 ${esc(a.nm)} 的攻擊</span>`;
    else $('blog').innerHTML = `${f.tier >= 0 ? `<span class="sk ${big ? 'big' : ''}" style="--c:${col}">${esc(f.n)}</span>` : ''}<span class="bl">${esc(a.nm)}${f.tier >= 0 ? '' : ' ' + esc(f.n)}${f.txt ? '・' + esc(f.txt) : ''}</span>`;
    if (big) { const fl = $('flash'); fl.style.setProperty('--c', f.kind === 'fusion' ? '#ffd86a' : col); fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on'); }
    (f.t || []).forEach((t, j) => {
      const te = $('u' + t); if (!te) return; const d = f.d ? f.d[j] : undefined;
      if (d === undefined) { te.classList.remove('buff'); void te.offsetWidth; te.classList.add('buff'); return; }
      hp[t] = clamp(hp[t] - d, -1e9, all[t].hpM);
      if (d > 0) { te.classList.remove('hit'); void te.offsetWidth; te.classList.add('hit'); }
      te.querySelector('.hp i').style.width = Math.max(0, hp[t] / all[t].hpM * 100) + '%';
      const dm = document.createElement('div'); dm.className = 'dmg' + (f.crit ? ' crit' : '') + (d < 0 ? ' heal' : '') + (d === 0 ? ' miss' : ''); dm.textContent = d < 0 ? '+' + fmt(-d) : d === 0 ? '閃避' : (f.crit ? '暴擊 ' : '') + fmt(d); te.appendChild(dm); setTimeout(() => dm.remove(), 900);
      if (hp[t] <= 0) te.classList.add('dead');
    });
    setTimeout(step, big ? speed * 1.5 : speed);
  };
  $('bFast').onclick = () => { speed = 200; $('bFast').disabled = true; }; $('bSkip').onclick = fin;
  setTimeout(step, 700);
}

// ======================================================================
//  事件
// ======================================================================
function nextEvent() {
  if (!S || $('ovl') || $('bat') || !S.evq.length) return;
  const e = S.evq.shift();
  const ev = e.k === 'rand' ? EVS[e.id] : STORY[e.k] ? STORY[e.k](e) : null;
  if (!ev) return nextEvent();
  showEv(e.k === 'rand' ? { t: ev.t, ic: ev.ic, body: ev.body(), ch: ev.ch } : ev);
}
function showEv(ev) {
  const sh = sheet(`<div class="eic" style="--c:${'#5ad0ff'}">${ic(ev.ic)}</div><div class="tit">${ev.t}</div><div class="body">${ev.body}</div><div class="opts">${ev.ch.map((o, i) => `<button class="btn ${i ? 'ghost' : 'gold'}" data-o="${i}" ${o.c && !o.c() ? 'disabled' : ''}>${o.t}</button>`).join('')}</div>`, 2);
  sh.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { closeSheet(true); handle(ev.ch[+b.dataset.o].f()); });
}
function handle(r) {
  save();
  if (S.over) { render(); return setTimeout(ending, 200); }
  if (r && r.battle) { const A = r.opt.team || [playerUnit()]; const res = simBattle(A, r.foes); return playBattle(res, r.opt.title || '戰鬥', w => handle(r.cb(w)), r.opt.bg); }
  if (r && r.next) return showEv(r.next);
  render();
  if (r) return result('scroll-unfurled', '結果', r);
  setTimeout(nextEvent, 120);
}
function result(icn, title, body) { showEv({ t: title, ic: icn, body, ch: [{ t: '確定', f: () => '' }] }); }

   <div class="tslime">${slimeSVG('#5ad0ff', 190)}</div>
   <div class="tbtns">${has_ ? `<button class="btn gold" id="tCont">${ic('play-button')} 繼續</button>` : ''}<button class="btn ${has_ ? 'ghost' : 'gold'}" id="tNew">${ic('sparkles')} 轉生開始</button><button class="btn ghost" id="tBox">${ic('exit-door')} 回到遊戲盒</button></div>
   <div class="credit">同人遊戲・原作《關於我轉生變成史萊姆這檔事》伏瀨／講談社・圖示 game-icons.net (CC BY 3.0)・字型 霞鶩文楷、jf open 粉圓 (OFL)</div>`;
  if ($('tCont')) $('tCont').onclick = () => { if (load()) { hideTitle(); render(); if (S.over) return ending(); setTimeout(nextEvent, 300); } };
  $('tNew').onclick = () => { if (has_ && !confirm('重新開始會覆蓋目前存檔，確定嗎？')) return; newGame(); tab = 'me'; save(); hideTitle(); render(); setTimeout(nextEvent, 400); };
  $('tBox').onclick = () => location.href = './';
}
function hideTitle() { $('title').style.display = 'none'; $('app').classList.remove('titled'); }
function ending() {
  if (autoT) toggleAuto();
  const score = Math.round(Math.log10(S.ep) * 1000 + S.pop * 0.2 + Object.values(S.bld).reduce((a, b) => a + b, 0) * 60 + Object.keys(S.sk).length * 80 + Object.keys(S.ach).length * 150 + Object.keys(S.offs).length * 100 - S.t * 5);
  const t = $('title'); t.style.display = 'flex'; $('app').classList.add('titled');
  t.innerHTML = `<div class="tbg" style="background-image:url(${scene(540, 960, 77, { sky: ['#0a1a3a', '#3a6aa8', '#f2d08a'], layers: 4, moonCol: '#fff6d0' })})"></div>
  <div class="create end"><h2 class="ct">${ic('laurel-crown')} 魔國物語・完</h2>
   ${heroHTML({ h: 240, noinfo: 1 })}
   <div class="card"><div class="kv2"><div><span>種族</span><b>${RACES[S.race].n.split('・').pop()}</b></div><div><span>魔素</span><b>${fmt(S.ep)}</b></div><div><span>經過</span><b>${yr(S.t)} 年 ${S.t % 12} 個月</b></div><div><span>人口</span><b>${fmt(S.pop)}</b></div><div><span>技能</span><b>${Object.keys(S.sk).length} 種</b></div><div><span>成就</span><b>${Object.keys(S.ach).length}/${ACHS.length}</b></div></div>
   <div class="score">評分 <b>${fmt(score)}</b></div></div>
   <div class="card small" style="max-height:200px;overflow:auto">${S.log.filter(l => l.imp === 2).slice(0, 16).reverse().map(l => `<div>・第 ${yr(l.t)} 年：${l.txt}</div>`).join('')}</div>
   <button class="btn gold big" id="gCont">${ic('play-button')} 繼續治理魔國</button><button class="btn ghost" id="gNew">${ic('sparkles')} 重新轉生</button><button class="btn ghost" id="gBox">${ic('exit-door')} 回到遊戲盒</button></div>`;
  $('gCont').onclick = () => { S.over = null; S.flags.done = 1; save(); hideTitle(); render(); };
  $('gNew').onclick = () => { localStorage.removeItem(SAVE_KEY); showTitle(); };
  $('gBox').onclick = () => location.href = './';
}

window.addEventListener('load', () => { showTitle(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
