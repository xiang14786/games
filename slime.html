<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050a18"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="遊戲盒">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>轉生史萊姆・捕食卡牌冒險</title>
<style>@font-face{font-family:'Huninn';font-display:swap;src:url('assets/slime2/huninn.woff2') format('woff2')}@font-face{font-family:'LXGW WenKai TC';font-weight:700;font-display:swap;src:url('assets/slime2/wk-bold.woff2') format('woff2')}
:root{--bg:#050a18;--pan:rgba(16,30,60,.78);--line:rgba(140,200,255,.2);--tx:#e9f4ff;--dim:#8ea6c8;--gold:#f2c46b;--gold2:#ffdf9a;--blue:#5ad0ff;--red:#ff5a6a;--ok:#5ae0a8;--hd:'LXGW WenKai TC','Huninn',serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#03030c;color:var(--tx);font-family:'Huninn','PingFang TC','Noto Sans TC',sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none;overflow:hidden}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:540px;margin:0 auto;height:100%;overflow-y:auto;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
#app.scr-battle{overflow:hidden;display:flex;flex-direction:column}
#app.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ic{width:1em;height:1em;fill:currentColor;vertical-align:-.15em;flex:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{background:linear-gradient(180deg,#2a4a8a,#1a2e60);color:var(--tx);border-radius:14px;padding:12px 16px;font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid rgba(140,200,255,.3);box-shadow:0 3px 10px rgba(0,0,0,.35)}
.btn.gold{background:linear-gradient(180deg,#ffe3a0,#e0a840 60%,#b8802a);color:#2a1800;border-color:#ffe9b0}
.btn.ghost{background:rgba(255,255,255,.07);box-shadow:none}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:11px}.btn.sq{padding:7px 10px}
.btn:disabled{opacity:.4}
.col{display:flex;flex-direction:column;gap:8px}.grow{flex:1;min-width:0}
.dim{color:var(--dim)}.small{font-size:13px}.gold{color:var(--gold2)}.ok{color:var(--ok);font-weight:700}.red{color:var(--red)}
.card.small,.card{}
.empty{text-align:center;color:var(--dim);padding:26px 10px}
h3{margin:14px 4px 8px;font-size:17px;font-family:var(--hd)}
.toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 50px);z-index:90;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(14,30,64,.95);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px;max-width:90%;animation:tin .25s;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.toast.gold{border-color:var(--gold);color:var(--gold2)}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}
/* 標題 */
.title{min-height:100%;display:flex;flex-direction:column;align-items:center;position:relative;padding:calc(30px + env(safe-area-inset-top)) 20px 20px}
.tbg{position:fixed;inset:0;background-size:cover;background-position:center;z-index:-1;max-width:540px;margin:0 auto}
.tlogo{text-align:center}.tlogo .sub2{font-size:17px;letter-spacing:4px;color:#cfeaff;font-family:var(--hd)}
.tlogo h1{font-size:64px;letter-spacing:10px;margin:0;font-family:var(--hd);background:linear-gradient(180deg,#fff 10%,#7fd8ff 55%,#2a7ad8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(90,208,255,.55))}
.tlogo .sub{font-size:18px;letter-spacing:8px;color:#cfeaff;font-family:var(--hd);text-shadow:0 0 10px #2a8aff}
.tslime{margin:24px 0;animation:jelly 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes jelly{0%,100%{transform:scale(1,1)}45%{transform:scale(1.07,.92)}60%{transform:scale(.96,1.05)}}
.tbtns{display:flex;flex-direction:column;gap:9px;width:250px;margin-top:auto}.tbtns .btn{padding:14px;font-size:18px}
.credit{margin-top:18px;font-size:11px;color:rgba(200,220,255,.45);text-align:center}
/* 劇情 */
.ov{position:fixed;inset:0;z-index:80;background:rgba(2,6,16,.82);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.box{background:linear-gradient(170deg,#14284e,#0a1630);border:1px solid var(--line);border-radius:22px;padding:22px 20px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.6);animation:pop .3s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.box h2{margin:4px 0 10px;font-family:var(--hd);font-size:26px}.box p{line-height:1.8;font-size:16px;margin:0 0 16px}
.story .sic{font-size:50px;color:var(--gold);filter:drop-shadow(0 0 12px rgba(242,196,107,.6))}
.dots{display:flex;gap:5px;justify-content:center;margin-bottom:12px}.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2)}.dots i.on{background:var(--gold)}
/* 魔國 */
.nhead{background-size:cover;background-position:center bottom;padding:calc(34px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line)}
.nrow{display:flex;align-items:center;gap:10px}.nt{font-size:20px;font-family:var(--hd);display:block}.nrow small{color:var(--dim);font-size:12.5px}
.cry{text-align:center;color:#8ad8ff;line-height:1.1}.cry .ic{font-size:20px}.cry b{display:block;font-size:20px}.cry small{font-size:11px;color:var(--dim)}
.village{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;margin-top:12px;min-height:84px}
.nslime{animation:jelly 3s ease-in-out infinite;transform-origin:50% 100%;margin-right:6px}
.vb{width:44px;height:44px;border-radius:12px;background:rgba(10,20,40,.7);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--gold2);position:relative}
.vb i{position:absolute;right:2px;bottom:0;font-style:normal;font-size:11px;color:#fff}
.ntabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;position:sticky;top:0;z-index:5;background:rgba(5,10,24,.95)}
.ntabs button{padding:9px 2px;border-radius:12px;font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--dim)}
.ntabs button .ic{font-size:22px}.ntabs button.on{background:rgba(90,208,255,.15);color:#fff}
.nbody{padding:4px 10px 30px}
.act{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:14px 12px;border-radius:16px;margin-bottom:8px;background-size:cover;background-position:center;border:1px solid var(--line)}
.act b{font-size:17px;display:block}.act small{display:block;font-size:12.5px;color:#c8d8ee;margin-top:2px;line-height:1.4}
.act .go{background:linear-gradient(180deg,#ffe3a0,#e0a840);color:#2a1800;font-weight:800;padding:8px 14px;border-radius:12px}
.act.lock{opacity:.45;filter:grayscale(.7)}.act .ic{font-size:18px}
.card.small{}
.nbody .card{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.row-b,.off{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--pan);border:1px solid var(--line);margin-bottom:7px;width:100%;text-align:left}
.row-b.lock{opacity:.5}.row-b b,.off b{font-size:16px;display:block}.row-b small,.off small{font-size:12.5px;color:var(--dim);display:block;line-height:1.45;margin-top:1px}
.qic{width:42px;height:42px;border-radius:12px;background:rgba(242,196,107,.1);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--gold2);flex:none}
.lvt{font-size:12px;color:var(--gold2);background:rgba(242,196,107,.12);padding:0 7px;border-radius:8px;font-weight:400}
.off.on{border-color:var(--gold);box-shadow:0 0 12px -3px var(--gold)}
.oav{width:48px;height:48px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--c);background:radial-gradient(circle,rgba(255,255,255,.08),rgba(0,0,0,.4));border:2px solid var(--c)}
.achg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.ach{background:var(--pan);border-radius:12px;padding:8px 2px;text-align:center;opacity:.35;font-size:11.5px}.ach.on{opacity:1;box-shadow:inset 0 0 0 1.5px var(--gold)}.ach .ic{font-size:24px;display:block;margin:0 auto 2px;color:var(--gold)}
/* 卡牌 */
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{position:relative;aspect-ratio:.72;border-radius:12px;padding:20px 6px 6px;background:linear-gradient(170deg,#1e2e52,#0e1830);border:2px solid var(--c);box-shadow:0 4px 12px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.06);text-align:center;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 30%,transparent),transparent 60%);pointer-events:none}
.card.up{border-color:#7dff8a}.card.up b{color:#9dffa8}
.card .cc{position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bff0ff,#2a8aff 60%,#0a3a8a);color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;z-index:2}
.card .cart{font-size:34px;color:var(--c);filter:drop-shadow(0 0 6px var(--c));margin:0 0 2px;position:relative}
.card b{font-size:13.5px;line-height:1.2;position:relative;font-family:var(--hd)}
.card small{font-size:10.5px;color:#d8e4f6;line-height:1.35;margin-top:3px;position:relative;flex:1;overflow:hidden}
.card small b{font-size:10.5px;color:var(--gold2)}
.card .ctype{position:absolute;bottom:3px;left:0;right:0;font-style:normal;font-size:9px;color:var(--r)}
.card.unk{border-color:#334;justify-content:center;color:#556}
.card.dim{filter:grayscale(.6) brightness(.6)}
.cgrid.pick .card{cursor:pointer;animation:pop .35s backwards}.cgrid.pick .card:nth-child(2){animation-delay:.07s}.cgrid.pick .card:nth-child(3){animation-delay:.14s}
.buy{display:flex;flex-direction:column;align-items:center;gap:3px}.buy .card{width:100%}.price{font-size:14px;font-weight:800;color:var(--gold2)}.price.no{color:var(--red)}
/* 地圖 */
.rbar{display:flex;align-items:center;gap:10px;padding:calc(34px + env(safe-area-inset-top)) 10px 8px;background:rgba(5,12,28,.95);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;font-weight:800;font-size:15px}
.rbar .hp{color:#ff8a9a}.rbar .gd{color:var(--gold2)}.rbar .cr{color:#8ad8ff}
.mhead{background-size:cover;background-position:center;padding:14px 14px 10px}.mhead b{font-size:19px;font-family:var(--hd);display:block}.mhead small{color:var(--dim)}
.mapw{height:calc(100vh - 210px);overflow-y:auto;display:flex;justify-content:center}
.map{position:relative;margin:0 auto}
.mlines{position:absolute;left:0;top:0}.mlines line{stroke:rgba(160,200,255,.22);stroke-width:2.5;stroke-dasharray:5 6}.mlines line.nxt{stroke:rgba(255,220,130,.8);stroke-dasharray:none}
.mn{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#0e1a34;border:2px solid rgba(160,200,255,.3);color:var(--c);font-size:24px;display:flex;align-items:center;justify-content:center;opacity:.55}
.mn.can{opacity:1;border-color:var(--c);box-shadow:0 0 14px var(--c);animation:pulse 1.4s infinite}
.mn.cur{opacity:1;background:var(--c);color:#0a1020}.mn.past{opacity:.3}
.mn.n-boss{width:64px;height:64px;margin:-32px 0 0 -32px;font-size:36px}
@keyframes pulse{50%{transform:scale(1.12)}}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:12px;padding:6px}.legend span{display:flex;align-items:center;gap:2px}
/* 戰鬥 */
.bfield{flex:1;min-height:0;background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:space-between;padding:8px 6px}
.enemies{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding-top:6px}
.en{width:110px;text-align:center;position:relative;padding:4px;border-radius:14px;transition:transform .15s}
.en.dead{visibility:hidden;width:0;padding:0}
.en.tgt{background:rgba(255,90,90,.12);box-shadow:0 0 0 2px rgba(255,120,120,.6);animation:pulse 1s infinite}
.en.hit{animation:hit .35s}.en.act{animation:lunge .3s}
@keyframes hit{25%{transform:translateX(-6px);filter:brightness(2) saturate(0)}75%{transform:translateX(6px)}}
@keyframes lunge{50%{transform:translateY(16px) scale(1.06)}}
.intent{display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.55);border:1.5px solid var(--c);color:var(--c);border-radius:12px;padding:2px 8px;font-size:15px;margin-bottom:2px}
.intent b{color:#fff;font-size:15px}
.eav{font-size:62px;color:#e8d8ff;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.en.elite .eav{color:#ffb0a0;font-size:72px}.en.boss{width:160px}.en.boss .eav{font-size:110px;color:#ffd0a0;filter:drop-shadow(0 0 18px rgba(255,100,80,.6))}
.enm{display:block;font-size:13px;text-shadow:0 1px 3px #000}
.hpb{position:relative;height:16px;background:rgba(0,0,0,.6);border-radius:8px;overflow:hidden;margin-top:3px;border:1px solid rgba(255,255,255,.15)}
.hpb i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#e83a4a,#ff7a6a);transition:width .3s}
.hpb.me i{background:linear-gradient(90deg,#2ac87a,#8af0a8)}
.hpb span{position:relative;font-size:11px;font-weight:800;line-height:16px;text-shadow:0 1px 2px #000}
.hpb em{position:absolute;right:2px;top:0;font-style:normal;font-size:11px;color:#9ad0ff;font-weight:800}
.sts{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:3px;min-height:18px}
.stc{display:inline-flex;align-items:center;gap:1px;font-size:11px;font-weight:800;color:var(--c);background:rgba(0,0,0,.55);border-radius:8px;padding:1px 5px}
.stc.pw{border:1px solid rgba(255,210,122,.4)}
.me{display:flex;align-items:center;gap:10px;background:rgba(4,10,24,.6);border-radius:16px;padding:6px 10px;border:1px solid var(--line)}
.me .sts{justify-content:flex-start}
.me.hit{animation:hit .35s}
.mav{position:relative;animation:jelly 2.6s ease-in-out infinite;transform-origin:50% 100%}
.blk{position:absolute;right:-8px;top:-6px;font-style:normal;background:#2a6ad8;color:#fff;font-weight:900;font-size:13px;border-radius:10px;padding:1px 6px;border:1.5px solid #fff}
.hud{display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(4,10,24,.92)}
.orb{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8f8ff,#2a9aff 55%,#0a3a8a);border:2px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px #2a9aff;flex:none}
.orb b{font-size:24px;font-weight:900}.orb small{font-size:12px;opacity:.8}
.piles{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--dim)}
.tip{font-size:12.5px;color:var(--gold2);line-height:1.3}
.hand{display:flex;justify-content:center;align-items:flex-end;padding:6px 6px calc(10px + env(safe-area-inset-bottom));min-height:168px;background:rgba(4,10,24,.92)}
.hand .card{width:96px;flex:none;margin:0 -12px;transform:rotate(var(--rot)) translateY(var(--y));transform-origin:50% 120%;transition:transform .15s;cursor:pointer}
.hand .card.sel{transform:translateY(-34px) scale(1.12);z-index:5;box-shadow:0 0 18px var(--c)}
.flt{position:fixed;z-index:95;transform:translateX(-50%);font-weight:900;font-size:26px;pointer-events:none;animation:flt 1s ease-out forwards;text-shadow:0 2px 6px #000;white-space:nowrap}
.flt.dmg{color:#fff}.flt.hurt{color:#ff6a6a}.flt.poi{color:#c88aff}.flt.heal{color:#5ae0a8}.flt.dev{color:var(--gold2);font-size:22px}.flt.play{color:#bfe8ff;font-size:18px}
@keyframes flt{from{transform:translate(-50%,0)}to{transform:translate(-50%,-50px);opacity:0}}
/* 其他畫面 */
.pane{padding:16px 14px 30px;text-align:center}.pane h2{font-family:var(--hd);margin:6px 0}.pane p{color:#c8d8ee;line-height:1.7;margin:4px 0 14px}
.fire{font-size:80px;color:#ffb04a;filter:drop-shadow(0 0 24px #ff7a2a);animation:flick 1.2s infinite alternate}
@keyframes flick{to{transform:scale(1.05,.95);filter:drop-shadow(0 0 34px #ff9a3a)}}
.evic{font-size:64px;color:var(--blue);filter:drop-shadow(0 0 16px rgba(90,208,255,.6))}
.deckv{align-items:stretch;padding:0}.dv{width:100%;max-width:540px;margin:0 auto;overflow-y:auto;padding:calc(34px + env(safe-area-inset-top)) 10px 20px;background:rgba(4,10,24,.97)}
.dvh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:18px;position:sticky;top:0;background:rgba(4,10,24,.97);padding:4px 0;z-index:3}
.death{text-align:center;padding:60px 20px}.death h2{font-family:var(--hd);font-size:28px}.death p{line-height:1.8}
.dslime{opacity:.6;filter:grayscale(.5);transform:scaleY(.6);transform-origin:bottom}

.eav img{width:118px;height:118px;object-fit:contain;display:block;margin:0 auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.en.elite .eav img{width:134px;height:134px;filter:drop-shadow(0 0 12px rgba(255,120,90,.7))}
.en.boss .eav img{width:190px;height:190px;filter:drop-shadow(0 0 20px rgba(255,100,80,.6))}
.slimg{display:block;margin:0 auto;filter:drop-shadow(0 6px 12px rgba(0,0,0,.5))}

const R = (a, b) => a + Math.random() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const chance = p => Math.random() < p;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wpick = (arr, wf) => { const t = arr.reduce((s, x) => s + wf(x), 0); let r = Math.random() * t; for (const x of arr) { r -= wf(x); if (r <= 0) return x; } return arr[arr.length - 1]; };

function startRun(a) {

function genMap(a) {

      row.push({ t, x: (i + 0.5) / n + R(-0.06, 0.06), nx: [] });
    }
    rows.push(row);
  }
  for (let f = 0; f < F - 1; f++) {
    const a1 = rows[f], b1 = rows[f + 1];
    a1.forEach((nd, i) => { const j = Math.round(i / Math.max(1, a1.length - 1) * (b1.length - 1)); nd.nx.push(j); if (chance(0.45) && b1.length > 1) nd.nx.push(clamp(j + (chance(0.5) ? 1 : -1), 0, b1.length - 1)); nd.nx = [...new Set(nd.nx)]; });
    b1.forEach((nd, j) => { if (!a1.some(x => x.nx.includes(j))) { const i = Math.round(j / Math.max(1, b1.length - 1) * (a1.length - 1)); a1[i].nx.push(j); } });

const aM = () => ACTS[RUN.a].hpM * (1 + RUN.asc * 0.15), tM = () => ACTS[RUN.a].atM * (1 + RUN.asc * 0.1);

function bossEnemy(k) { const b = BOSSES[k]; return mkEnemy({ n: b.n, ic: b.ic, img: k, hp: Math.round(b.hp * (1 + RUN.asc * 0.15)), moves: b.moves.map(m => m.slice()), sk: b.sk, boss: 1 }); }

function startBattle(enemies, kind) {
  const deck = RUN.deck.map(c => ({ ...c, uid: Math.random() }));
  BT = { kind, en: [], hand: [], draw: shuffle(deck), disc: [], exh: [], e: 0, block: 0, st: { weak: 0, vul: 0, poi: 0, str: 0 }, pw: {}, turn: 0, fx: [], devoured: [], over: false, enemies };

function draw(n) { for (let i = 0; i < n; i++) { if (BT.hand.length >= 10) break; if (!BT.draw.length) { if (!BT.disc.length) break; BT.draw = shuffle(BT.disc); BT.disc = []; } BT.hand.push(BT.draw.pop()); } }

  if (BT.pw.pBlock) BT.block += BT.pw.pBlock; if (sel('geld')) BT.block += 5;
  if (BT.pw.pStr) BT.st.str += BT.pw.pStr; if (BT.pw.pHeal) healP(BT.pw.pHeal);
  if (sel('veldora') && BT.turn % 3 === 0) { fx({ t: 'veldora' }); for (const e of alive()) dmgE(e, 20, true); checkWin(); if (BT.over) return; }
  BT.e = maxEnergy();

}
const alive = () => BT.enemies.filter(e => e.hp > 0);
function atkDmg(base, isAtk) { let d = base + BT.st.str + (isAtk ? (BT.pw.pAtk || 0) + (sel('shion') ? 3 : 0) : 0); if (BT.st.weak) d *= 0.75; return Math.max(0, Math.floor(d)); }
function dmgE(e, d, raw) {

}
function hurtP(d, isPoi) {

}
function healP(n) { const h = Math.min(n, RUN.max - RUN.hp); RUN.hp += h; if (h > 0) fx({ t: 'heal', v: h }); }
function playCard(hi, ti) {

  const isA = d.t === 'atk';

  if (tgt) { if (e.weak) tgt.st.weak += e.weak; if (e.vul) tgt.st.vul += e.vul; if (e.poi) tgt.st.poi += e.poi; if (e.stun) tgt.st.stun = 1; }

function devourE(e) {

function endTurn() {

      if (f.t === 'devour') { floatAt($('en' + f.who), `${ic('fangs')} 捕食！`, 'dev'); toast(`${ic('fangs')} 吞噬成功！獲得「${CARDS[f.card].n}」`, 'gold'); }
      if (f.t === 'play') floatAt($('hand'), f.name, 'play');
      if (f.t === 'act') { const el = $('en' + f.who); if (el) { el.classList.remove('act'); void el.offsetWidth; el.classList.add('act'); } }
      if (f.t === 'stun') floatAt($('en' + f.who), '被束縛', 'play');
      if (f.t === 'veldora') { toast(`${ic('dragon-head')} 維爾德拉：「暴風之息！」`, 'gold'); }
    };
    if (enemyPhase && (f.t === 'act' || f.t === 'hurt')) delay += f.t === 'act' ? 260 : 0;
    setTimeout(go, enemyPhase ? delay : 0);
  }
  setTimeout(() => { animBusy = false; if (BT.over) afterBattle(); }, enemyPhase ? delay + 300 : 350);
}
function afterBattle() {
  if (BT.handled) return; BT.handled = 1;
  if (BT.over === 'lose') return deathScreen();
  BT.devoured.forEach(d => addCard(d.id)); RUN.devoured += BT.devoured.length;
  const r = battleRewards(); const kind = BT.kind; saveRun();
  if (kind === 'boss') return bossWin(r);
  pickCardScreen('勝利！', `${ic('two-coins')} 金幣 +${r.gold}　${ic('crystal-growth')} 魔晶 +${r.cry}${r.devoured.length ? `<br><b class="gold">${ic('fangs')} 吞噬了 ${r.devoured.map(d => `${d.n}，得到「${CARDS[d.id].n}」`).join('；')}</b>` : ''}${kind === 'elite' ? '<br>菁英獎勵：最大生命 +3' : ''}<br>選一張卡加入牌組：`, r.cards, nodeDone);
}
function bossWin(r) {
  const a = RUN.a; P.cry += RUN.cry; P.wins++; const st = actCleared(a); const got = RUN.cry; RUN = null; saveRun(); saveP();
  const fin = () => { modal(`<h2>${ic('laurel-crown')} ${ACTS[a].n} 通關！</h2><p>帶回魔晶 <b class="gold">${got}</b><br>回到魔國建設吧！</p><button class="btn gold" id="mOk">回到魔國</button>`); $('mOk').onclick = () => { document.querySelector('.ov').remove(); natTab = 'go'; nation(); }; };
  if (st && STORY[st]) storySeq(st, fin); else fin();
}
function deathScreen() {
  const keep = Math.floor(RUN.cry * 0.6); P.cry += keep; const a = RUN.a, f = RUN.f + 1, k = RUN.kills; RUN = null; saveRun(); saveP();
  show(`<div class="death"><div class="dslime">${slimeSVG(140, '#6a8aa8')}</div><h2>身體四分五裂……</h2><p>在 ${ACTS[a].n} 第 ${f} 層倒下了。<br>擊倒 ${k} 隻魔物。<br>帶回 <b class="gold">${ic('crystal-growth')} ${keep} 魔晶</b>（六成）</p><p class="dim">分裂的碎片在魔國重新聚合……<br>用魔晶蓋建築、換部下，再挑戰一次！</p><button class="btn gold" id="dOk">回到魔國</button></div>`, 'scr-death');
  $('dOk').onclick = nation;
}

// ======================================================================
//  選卡・篝火・商店・事件
// ======================================================================
function pickCardScreen(title, txt, ids, done) {
  show(`${topbar()}<div class="pane"><h2>${title}</h2><p>${txt}</p><div class="cgrid pick">${ids.map(id => cardHTML({ id, up: 0 }, { attr: `data-p="${id}"` })).join('')}</div><button class="btn ghost" id="pSkip">跳過</button></div>`, 'scr-pick');
  bindTop();
  document.querySelectorAll('[data-p]').forEach(el => el.onclick = () => { addCard(el.dataset.p); toast(`獲得「${CARDS[el.dataset.p].n}」`); done(); });
  $('pSkip').onclick = done;
}
function restScreen() {
  const h = restHeal(), n = sel('kaijin') ? 2 : 1;
  show(`${topbar()}<div class="pane rest"><div class="fire">${ic('campfire')}</div><h2>篝火</h2><p>在火邊休息一下。</p><div class="col"><button class="btn gold" id="rHeal">${ic('heart-plus')} 休息：回復 ${h} 生命</button><button class="btn" id="rUp">${ic('anvil')} 鍛造：升級 ${n} 張卡</button></div></div>`, 'scr-rest');
  bindTop();
  $('rHeal').onclick = () => { RUN.hp = Math.min(RUN.max, RUN.hp + h); toast(`回復 ${h}`); nodeDone(); };
  $('rUp').onclick = () => { let left = n; const pickOne = () => deckView(`選一張卡升級（剩 ${left}）`, RUN.deck.filter(c => !c.up && CARDS[c.id].u), c => { c.up = 1; toast(`${cname(c)} 升級了`); left--; if (left > 0 && RUN.deck.some(c => !c.up && CARDS[c.id].u)) pickOne(); else nodeDone(); }); pickOne(); };
}
function shopScreen() {
  const S2 = RUN.shop;
  show(`${topbar()}<div class="pane"><h2>${ic('shop')} 行腳商人</h2><p>「史萊姆客人？……錢是真的就好。」</p><div class="cgrid pick">${S2.cards.map((x, i) => x.sold ? '<div class="card unk"><b>已售出</b></div>' : `<div class="buy">${cardHTML({ id: x.id, up: 0 }, { attr: `data-s="${i}"` })}<span class="price ${RUN.gold >= x.p ? '' : 'no'}">${ic('two-coins')}${x.p}</span></div>`).join('')}</div>
    <div class="col" style="margin-top:10px"><button class="btn" id="sRm" ${S2.rmUsed || RUN.gold < S2.rm ? 'disabled' : ''}>${ic('trash-can')} 移除一張卡（${S2.rm} 金幣）</button><button class="btn" id="sHeal" ${RUN.gold < S2.heal || RUN.hp >= RUN.max ? 'disabled' : ''}>${ic('heart-plus')} 回復藥水：回復 20（${S2.heal} 金幣）</button><button class="btn gold" id="sOut">離開</button></div></div>`, 'scr-shop');
  bindTop();
  document.querySelectorAll('[data-s]').forEach(el => el.onclick = () => { const x = S2.cards[+el.dataset.s]; if (RUN.gold < x.p) return toast('金幣不夠'); RUN.gold -= x.p; addCard(x.id); x.sold = 1; saveRun(); toast(`買了「${CARDS[x.id].n}」`); shopScreen(); });
  $('sRm').onclick = () => deckView('選一張卡移除', RUN.deck, c => { RUN.gold -= S2.rm; S2.rmUsed = 1; RUN.deck.splice(RUN.deck.indexOf(c), 1); toast(`移除了「${cname(c)}」`); saveRun(); shopScreen(); });
  $('sHeal').onclick = () => { RUN.gold -= S2.heal; RUN.hp = Math.min(RUN.max, RUN.hp + 20); saveRun(); shopScreen(); };
  $('sOut').onclick = nodeDone;
}
function eventScreen(ev) {
  show(`${topbar()}<div class="pane"><div class="evic">${ic(ev.ic)}</div><h2>${ev.t}</h2><p>${ev.d}</p><div class="col">${ev.ch.map((c, i) => `<button class="btn ${i ? '' : 'gold'}" data-c="${i}">${c[0]}</button>`).join('')}</div></div>`, 'scr-ev');
  bindTop();
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
    const r = ev.ch[+b.dataset.c][1](); saveRun();
    if (r && r.remove) return deckView('選一張卡移除', RUN.deck, c => { RUN.deck.splice(RUN.deck.indexOf(c), 1); toast(`移除了「${cname(c)}」`); nodeDone(); }, nodeDone);
    if (r && r.pickCard) return pickCardScreen(ev.t, '選一本技能書：', r.pickCard, nodeDone);
    const o = modal(`<h2>${ev.t}</h2><p>${r}</p><button class="btn gold" id="eOk">繼續</button>`); $('eOk').onclick = () => { o.remove(); nodeDone(); };
  });
}
function modal(html) { const o = document.createElement('div'); o.className = 'ov'; o.innerHTML = `<div class="box">${html}</div>`; document.body.appendChild(o); return o; }
function deckView(title, cards, onPick, onCancel) {
  const o = document.createElement('div'); o.className = 'ov deckv';
  const sorted = cards.slice().sort((a, b) => (CARDS[a.id].t + a.id).localeCompare(CARDS[b.id].t + b.id));
  o.innerHTML = `<div class="dv"><div class="dvh"><b>${title}</b><button class="btn ghost sm" id="dvX">${onPick ? '取消' : '關閉'}</button></div><div class="cgrid">${sorted.map((c, i) => cardHTML(c, { attr: `data-d="${i}"` })).join('') || '<div class="empty">沒有可選的卡</div>'}</div></div>`;
  document.body.appendChild(o);
  $('dvX').onclick = () => { o.remove(); onCancel && onCancel(); };
  if (onPick) o.querySelectorAll('[data-d]').forEach(el => el.onclick = () => { o.remove(); onPick(sorted[+el.dataset.d]); });
}
