<script>
// ===== 出題引擎 v2（爬山修正法，9×9、10×10 也很快，保證唯一解） =====
function mulberry32(a) { return function() { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function randPlacement(n, rnd) {
  const p = []; const used = Array(n).fill(false);
  function bt(r) {
    if (r === n) return true;
    const cols = [...Array(n).keys()].sort(() => rnd() - 0.5);
    for (const c of cols) { if (used[c]) continue; if (r > 0 && Math.abs(p[r-1] - c) <= 1) continue; used[c] = true; p[r] = c; if (bt(r+1)) return true; used[c] = false; }
    return false;
  }
  bt(0); return p;
}
function growRegions(n, sol, rnd, spread) {
  const reg = Array(n*n).fill(-1);
  for (let r = 0; r < n; r++) reg[r*n + sol[r]] = r;
  const w = Array.from({length:n}, () => 1 - spread / 2 + rnd() * spread);
  let left = n*n - n;
  while (left > 0) {
    let tot = 0; for (const x of w) tot += x;
    let k = rnd() * tot, g = 0; while (k > w[g]) { k -= w[g]; g++; } if (g >= n) g = n-1;
    const cand = [];
    for (let i = 0; i < n*n; i++) if (reg[i] === g) { const r = i / n | 0, c = i % n;
      for (const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]) { const rr = r+dr, cc = c+dc; if (rr>=0&&rr<n&&cc>=0&&cc<n&&reg[rr*n+cc]===-1) cand.push(rr*n+cc); } }
    if (!cand.length) { w[g] = 0.0001; if (w.every(x => x < 0.001)) break; continue; }
    reg[cand[Math.floor(rnd()*cand.length)]] = g; left--;
  }
  return reg;
}
function findSolutions(n, reg, limit = 2) {
  const out = []; const colU = Array(n).fill(false), regU = Array(n).fill(false); const p = [];
  function bt(r) {
    if (out.length >= limit) return;
    if (r === n) { out.push(p.slice()); return; }
    for (let c = 0; c < n; c++) { const g = reg[r*n+c]; if (colU[c] || regU[g]) continue; if (r > 0 && Math.abs(p[r-1] - c) <= 1) continue; colU[c] = regU[g] = true; p[r] = c; bt(r+1); colU[c] = regU[g] = false; }
  }
  bt(0); return out;
}
function connectedWithout(n, reg, g, x) {
  const cells = []; for (let i = 0; i < n*n; i++) if (reg[i] === g && i !== x) cells.push(i);
  if (!cells.length) return false;
  const seen = new Set([cells[0]]), st = [cells[0]];
  while (st.length) { const i = st.pop(), r = i / n | 0, c = i % n;
    for (const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]) { const rr = r+dr, cc = c+dc, j = rr*n+cc; if (rr>=0&&rr<n&&cc>=0&&cc<n&&j!==x&&reg[j]===g&&!seen.has(j)) { seen.add(j); st.push(j); } } }
  return seen.size === cells.length;
}
function makePuzzle(n, seed, spread = 1.7) {
  const rnd = mulberry32(seed);
  for (let tries = 0; tries < 50; tries++) {
    const sol = randPlacement(n, rnd), reg = growRegions(n, sol, rnd, spread);
    if (reg.includes(-1)) continue;
    const seeds = new Set(sol.map((c, r) => r*n + c));
    for (let it = 0; it < 400; it++) {
      const s = findSolutions(n, reg);
      if (s.length === 1) return { n, reg, sol };
      const alt = s.find(a => a.some((c, r) => c !== sol[r]));
      const rows = [...Array(n).keys()].filter(r => alt[r] !== sol[r]).sort(() => rnd() - 0.5);
      let moved = false;
      for (const r of rows) {
        const x = r*n + alt[r]; if (seeds.has(x)) continue; const g = reg[x], c = alt[r];
        const nb = [];
        for (const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]) { const rr = r+dr, cc = c+dc; if (rr>=0&&rr<n&&cc>=0&&cc<n&&reg[rr*n+cc]!==g) nb.push(reg[rr*n+cc]); }
        if (!nb.length || !connectedWithout(n, reg, g, x)) continue;
        reg[x] = nb[Math.floor(rnd()*nb.length)]; moved = true; break;
      }
      if (!moved) break;
    }
  }
  return null;
}
if (typeof module !== 'undefined') module.exports = { makePuzzle, findSolutions };

</script>
<script>
const COLORS = ['#e88c8c','#eab06c','#e3d36b','#8fcf86','#6cc6cf','#83a2ea','#b896ea','#e98fc9','#c8ccd4','#b08a64'];
const AREAS = [ [1,'🏘️ 巷口',5], [6,'🌳 公園',6], [16,'🏠 屋頂',7], [31,'⚓ 漁港',8], [56,'☕ 貓咪咖啡廳',9], [86,'🏯 貓之城',10], [131,'🌙 無盡夜空',10] ];
const CATS = [ ['🐱','小橘'], ['😺','笑笑'], ['😸','瞇瞇'], ['😹','哈哈'], ['😻','花癡'], ['😼','壞壞'], ['😽','親親'], ['🙀','嚇嚇'], ['😿','哭哭'], ['😾','氣氣'],
  ['🐈','散步貓'], ['🐈‍⬛','黑貓'], ['🐯','虎斑'], ['🦁','獅子王'], ['🐆','花豹'], ['🐅','老虎'], ['🐼','熊貓（？）'], ['🦊','狐狸（？）'], ['🐰','兔兔（？）'], ['👑','貓王'] ];
const $ = id => document.getElementById(id);

let store = { level:1, daily:{}, dailyH:{}, best:{}, stars:{}, cat:0 };
try { Object.assign(store, JSON.parse(localStorage.getItem('meowSeat')) || {}); } catch(e) {}
function persist() { try { localStorage.setItem('meowSeat', JSON.stringify(store)); } catch(e) {} }
try { const a = localStorage.getItem('meowAutoX'); if (a !== null) $('autoX').checked = a === '1'; } catch(e) {}
$('autoX').onchange = () => { try { localStorage.setItem('meowAutoX', $('autoX').checked ? '1':'0'); } catch(e) {} };

function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function dateSeed(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
if (!(store.level >= 1)) { const ks = Object.keys(store.stars || {}).map(Number).filter(x => x >= 1); store.level = ks.length ? Math.max(...ks) + 1 : 1; persist(); }
store.dailyH = store.dailyH || {}; store.stars = store.stars || {}; store.cat = store.cat || 0;
function levelSize(l) { return l <= 5 ? 5 : l <= 15 ? 6 : l <= 30 ? 7 : l <= 55 ? 8 : l <= 85 ? 9 : 10; }
function levelSpread(l) { return l <= 10 ? 1.7 : l % 3 === 0 ? 0.6 : l % 3 === 1 ? 1.1 : 1.6; }
function areaOf(l) { let a = AREAS[0], i = 0; AREAS.forEach((x, k) => { if (l >= x[0]) { a = x; i = k; } }); return { a, i, next: AREAS[i + 1] }; }
const catsOwned = () => Math.min(CATS.length, 1 + Math.floor((store.level - 1) / 5));
const catIcon = () => CATS[Math.min(store.cat, catsOwned() - 1)][0];
function fmt(s) { return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }

let G = null, timerH = null;

function refreshHome() {
  const d = store.daily[today()];
  $('dailyInfo').innerHTML = d ? `<span class="done">今天已完成 ✓</span>　用時 ${fmt(d)}` : '每天一題 8×8';
  $('bDaily').textContent = d ? '一般 8×8 ✓' : '一般 8×8';
  const l = store.level, A = areaOf(l), n = levelSize(l);
  $('areaName').textContent = A.a[1]; $('starInfo').textContent = `⭐ ${Object.values(store.stars).reduce((a, b) => a + b, 0)}`;
  $('lvInfo').innerHTML = `目前第 <b>${l}</b> 關（${n}×${n}）${levelSpread(l) < 1 ? '<span style="color:#ff7b9c">・困難盤</span>' : ''}`;
  const end = A.next ? A.next[0] : l + 1; $('lvProg').style.width = (A.next ? (l - A.a[0]) / (end - A.a[0]) * 100 : 100) + '%';
  $('bLevel').textContent = A.next ? `繼續闖關（再 ${end - l} 關到 ${A.next[1]}）` : '繼續闖關';
  const dh = store.dailyH[today()];
  if (dh) $('dailyInfo').innerHTML += `<br><span class="done">困難題已完成 ✓</span>　用時 ${fmt(dh)}`;
  const own = catsOwned(); $('collInfo').textContent = `${own}/${CATS.length}`;
  $('coll').innerHTML = '';
  CATS.forEach(([e, nm], i) => { const b = document.createElement('button'); b.className = i === Math.min(store.cat, own - 1) ? 'on' : ''; b.disabled = i >= own;
    b.innerHTML = i < own ? `${e}<small>${nm}</small>` : `❓<small>第 ${i * 5 + 1} 關</small>`; b.onclick = () => { store.cat = i; persist(); refreshHome(); }; $('coll').appendChild(b); });
}

function start(mode, n, seed, title, spread = 1.5) {
  let pz = null; for (let k = 0; !pz && k < 20; k++) pz = makePuzzle(n, seed + k * 101, k < 10 ? spread : 1.7);
  G = { mode, n, seed, title, reg: pz.reg, sol: pz.sol, st: Array(n*n).fill(0), hearts: 3, t: 0, hints: 0, mistakes: 0, done: false, spread };
  $('home').classList.add('hide'); $('game').classList.remove('hide');
  buildBoard(); render();
  clearInterval(timerH);
  timerH = setInterval(() => { if (!G.done) { G.t++; $('gTime').textContent = fmt(G.t); } }, 1000);
  $('gTime').textContent = '0:00';
}

let cells = [];
function buildBoard() {
  const b = $('board'), n = G.n; b.innerHTML = ''; cells = [];
  b.style.gridTemplateColumns = `repeat(${n},1fr)`; b.style.gridTemplateRows = `repeat(${n},1fr)`;
  for (let i = 0; i < n*n; i++) {
    const r = i/n|0, c = i%n, g = G.reg[i];
    const d = document.createElement('div'); d.className = 'cell'; d.dataset.i = i;
    d.style.background = COLORS[g];
    const th = '3px solid #4a2c20';
    if (r > 0 && G.reg[i-n] !== g) d.style.borderTop = th;
    if (c > 0 && G.reg[i-1] !== g) d.style.borderLeft = th;
    if (r < n-1 && G.reg[i+n] !== g) d.style.borderBottom = th;
    if (c < n-1 && G.reg[i+1] !== g) d.style.borderRight = th;
    b.appendChild(d); cells.push(d);
  }
}

function render() {
  const n = G.n;
  cells.forEach((d, i) => {
    d.classList.toggle('x', G.st[i] === 1);
    d.classList.toggle('cat', G.st[i] === 2);
    d.textContent = G.st[i] === 2 ? catIcon() : '';
  });
  $('gTitle').textContent = G.title;
  $('gHearts').textContent = '❤️'.repeat(G.hearts) + '🖤'.repeat(3 - G.hearts);
  $('gCount').textContent = `🐱 ${G.st.filter(v => v===2).length} / ${n}`;
}

function isSol(i) { return G.sol[i/G.n|0] === i % G.n; }

function autoX(i) {
  if (!$('autoX').checked) return;
  const n = G.n, r = i/n|0, c = i%n, g = G.reg[i];
  for (let j = 0; j < n*n; j++) {
    if (j === i || G.st[j] === 2) continue;
    const rr = j/n|0, cc = j%n;
    if (rr === r || cc === c || G.reg[j] === g || (Math.abs(rr-r) <= 1 && Math.abs(cc-c) <= 1)) G.st[j] = 1;
  }
}

function placeCat(i) {
  if (isSol(i)) {
    G.st[i] = 2; autoX(i); render();
    cells[i].classList.remove('pop'); void cells[i].offsetWidth; cells[i].classList.add('pop');
    if (G.st.filter(v => v===2).length === G.n) win();
  } else {
    G.hearts--; G.mistakes++; G.st[i] = 1; render();
    cells[i].classList.remove('bad'); void cells[i].offsetWidth; cells[i].classList.add('bad');
    $('board').classList.remove('shake'); void $('board').offsetWidth; $('board').classList.add('shake');
    try { navigator.vibrate && navigator.vibrate(120); } catch(e) {}
    if (G.hearts <= 0) lose();
  }
}

function tapCell(i) {
  if (G.done || G.st[i] === 2 && false) return;
  if (G.st[i] === 0) G.st[i] = 1;
  else if (G.st[i] === 1) { placeCat(i); return; }
  else G.st[i] = 0;
  render();
}

// 觸控：點一下循環；滑過多格畫 ✕
let drag = null;
function cellAt(x, y) { const el = document.elementFromPoint(x, y); return el && el.classList.contains('cell') ? +el.dataset.i : -1; }
function pStart(x, y) { if (!G || G.done) return; const i = cellAt(x, y); if (i < 0) return; drag = { first: i, moved: false, mode: G.st[i] === 1 ? 0 : 1 }; }
function pMove(x, y) {
  if (!drag) return; const i = cellAt(x, y); if (i < 0) return;
  if (i !== drag.first || drag.moved) {
    if (!drag.moved) { drag.moved = true; paint(drag.first); }
    paint(i);
  }
}
function paint(i) { if (G.st[i] === 2) return; G.st[i] = drag.mode; render(); }
function pEnd() { if (!drag) return; if (!drag.moved) tapCell(drag.first); drag = null; }
const bd = $('board');
bd.addEventListener('touchstart', e => { e.preventDefault(); const t = e.touches[0]; pStart(t.clientX, t.clientY); }, {passive:false});
bd.addEventListener('touchmove', e => { e.preventDefault(); const t = e.touches[0]; pMove(t.clientX, t.clientY); }, {passive:false});
bd.addEventListener('touchend', e => { e.preventDefault(); pEnd(); }, {passive:false});
bd.addEventListener('mousedown', e => pStart(e.clientX, e.clientY));
window.addEventListener('mousemove', e => { if (drag) pMove(e.clientX, e.clientY); });
window.addEventListener('mouseup', pEnd);

$('bHint').onclick = () => {
  if (G.done) return;
  // 先清掉放錯的 ✕？（✕ 不扣分，提示直接指出一隻貓的位置）
  for (let r = 0; r < G.n; r++) {
    const i = r*G.n + G.sol[r];
    if (G.st[i] !== 2) {
      G.hints++; G.st[i] = 2; autoX(i); render();
      cells[i].classList.add('hint'); setTimeout(() => cells[i].classList.remove('hint'), 1200);
      if (G.st.filter(v => v===2).length === G.n) win();
      return;
    }
  }
};
$('bClear').onclick = () => { G.st = G.st.map(v => v === 1 ? 0 : v); render(); };
function restartG() { const l = G.lvl, sp = G.spread; start(G.mode, G.n, G.seed, G.title, sp); G.lvl = l; }
$('bRestart').onclick = restartG;
$('bBack').onclick = home;

function home() { clearInterval(timerH); $('game').classList.add('hide'); $('home').classList.remove('hide'); $('ov').classList.add('hide'); refreshHome(); }

function overlay(t, p, btns) {
  $('ovT').textContent = t; $('ovP').innerHTML = p;
  const b = $('ovBtns'); b.innerHTML = '';
  for (const [label, fn, ghost] of btns) { const x = document.createElement('button'); x.textContent = label; if (ghost) x.className = 'ghost'; x.onclick = () => { $('ov').classList.add('hide'); fn(); }; b.appendChild(x); }
  $('ov').classList.remove('hide');
}

function win() {
  G.done = true; clearInterval(timerH);
  const stars = G.hints ? 1 : G.mistakes === 0 ? 3 : G.mistakes === 1 ? 2 : 1;
  const key = 'n' + G.n; let rec = '';
  if (!G.hints && (!store.best[key] || G.t < store.best[key])) { store.best[key] = G.t; rec = '<br><span class="done">新的最快紀錄！</span>'; }
  let btns = [['回選單', home, true]];
  let extra = '';
  if (G.mode === 'daily') { const d = today(), D = G.n === 10 ? store.dailyH : store.daily; if (!D[d] || G.t < D[d]) D[d] = G.t; }
  if (G.mode === 'level') {
    const before = catsOwned(), A0 = areaOf(G.lvl).i;
    store.stars[G.lvl] = Math.max(store.stars[G.lvl] || 0, stars);
    if (G.lvl >= 1) store.level = Math.max(store.level || 1, G.lvl + 1);
    if (catsOwned() > before) { const c = CATS[catsOwned() - 1]; extra += `<br><br>🎁 新貓咪加入圖鑑：<b style="font-size:26px">${c[0]}</b> ${c[1]}`; }
    if (areaOf(store.level).i > A0) extra += `<br>🗺️ 解鎖新地區：<b>${areaOf(store.level).a[1]}</b>（${levelSize(store.level)}×${levelSize(store.level)}）`;
    btns.push(['下一關', playLevel]);
  }
  if (G.mode === 'free') btns.push(['再來一題', () => playFree(G.n)]);
  persist();
  confetti();
  setTimeout(() => overlay('🎉 全部入座！', `${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}<br>用時 <b>${fmt(G.t)}</b>　失誤 ${G.mistakes}　提示 ${G.hints}<br>${G.n}×${G.n} 最快 ${store.best[key] ? fmt(store.best[key]) : '—'}${rec}${extra}`, btns), 450);
}
function confetti() { for (let i = 0; i < 26; i++) { const d = document.createElement('div'); d.className = 'conf'; d.textContent = ['🐾', '⭐', '🎉', '💛', catIcon()][i % 5]; d.style.left = Math.random() * 100 + 'vw'; d.style.animationDuration = (1.6 + Math.random() * 1.6) + 's'; d.style.animationDelay = Math.random() * 0.4 + 's'; document.body.appendChild(d); setTimeout(() => d.remove(), 3800); } }
function lose() {
  G.done = true; clearInterval(timerH);
  setTimeout(() => overlay('😿 愛心用完了', '再仔細推理一次吧！', [['回選單', home, true], ['重來這題', restartG]]), 500);
}

function playLevel() { const l = store.level, n = levelSize(l); start('level', n, l * 7919 + 13, `第 ${l} 關`, levelSpread(l)); G.lvl = l; }
function playFree(n) { start('free', n, (Math.random() * 1e9) | 0, `練習 ${n}×${n}`); }
$('bDaily').onclick = () => start('daily', 8, dateSeed('meow' + today()), '每日 ' + today().slice(5).replace('-', '/'));
$('bLevel').onclick = playLevel;
$('bDailyH').onclick = () => start('daily', 10, dateSeed('meowH' + today()), '困難 ' + today().slice(5).replace('-', '/'), 0.7);
document.querySelectorAll('.sizes button').forEach(b => b.onclick = () => playFree(+b.dataset.n));

refreshHome();
</script>
