<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shine欣 敲金豬</title>
<style>
:root{--bg:#14161b;--panel:#1c1f26;--line:#2c313b;--txt:#eceef2;--sub:#9aa3b2;--gold:#e2c28a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:18px/1.6 "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
#wrap{display:flex;gap:18px;height:100%;padding:12px}
#stage{flex:1 1 auto;min-width:0;height:100%;display:flex;align-items:center;justify-content:center;perspective:1400px}
canvas{width:100%;max-height:100%;aspect-ratio:1000/700;object-fit:contain;display:block;transform-origin:50% 60%;background:radial-gradient(ellipse at 50% 60%,#2a2d38,#15171d);border-radius:16px}
#panel{flex:0 0 400px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
h2{margin:4px 0 10px;font-size:22px;color:var(--gold)}
h3{margin:18px 0 8px;font-size:19px;color:var(--gold)}
input,button{font:inherit}
input[type=text],input[type=number]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #3a404c;background:#252a33;color:#fff}
input[type=range]{width:100%;accent-color:#e2c28a}
.btn{border:none;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer}
.go{width:100%;background:linear-gradient(180deg,#f0d29b,#c99a57);color:#1a1a1a;font-size:20px}
.ghost{background:#2c313b;color:var(--txt);font-size:16px;padding:8px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tip{color:var(--sub);font-size:15px}
label{display:block;margin-top:6px}
#log div{padding:5px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:16px}
#log img,#log .ph{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#2c313b}
#secret{color:#ffe08a;font-weight:700}
body.ov,body.ov #wrap{background:transparent!important}
body.ov #panel{display:none}
body.ov #wrap{padding:0}
body.ov #stage{height:100vh;align-items:flex-end;padding-bottom:3vh}
body.ov canvas{background:transparent;border-radius:0}
#ovState{display:none;position:fixed;left:6px;top:6px;font-size:13px;color:#fff;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:8px;transition:opacity 1s}
body.ov #ovState{display:block}
@media (max-width:900px){#wrap{flex-direction:column;height:auto}#stage{height:auto}#panel{flex:none}}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="cv" width="1000" height="700"></canvas></div>
  <div id="panel">
    <h2>🐷 敲金豬</h2>
    <div class="tip" id="state"></div>
    <div class="tip">這隻金豬第 <span id="secret">?</span> 下會破（只有你看得到）</div>
    <div class="row" style="margin-top:8px"><button class="btn go" id="newPig">🐷 換一隻新金豬</button></div>

    <h3>⚙️ 遊戲設定</h3>
    <label>第幾下敲破（每隻在範圍內隨機；兩格一樣＝固定）</label>
    <div class="row"><input type="number" id="tmin" min="1" style="flex:1"><span>～</span><input type="number" id="tmax" min="1" style="flex:1"><span>下</span></div>
    <label>獎品名稱<input type="text" id="prize" placeholder="例：贈品任選券"></label>
    <label><input type="checkbox" id="showT"> 畫面上顯示目標（例：已敲 23 / 88 下）</label>
    <div class="tip">改了要按「換一隻新金豬」才會用新的數字。</div>

    <h3>📡 自動接 FB 留言</h3>
    <div class="row"><label style="flex:1">關鍵字（逗號分開；* ＝任何留言）<input type="text" id="kw"></label><label style="width:120px">同一人幾秒算一次<input type="number" id="cd" min="0"></label></div>
    <label>連線代碼（Session ID）<input type="text" id="sid"></label>
    <div class="row" style="margin-top:8px"><button class="btn ghost" id="conn">開始接留言</button><span id="wsState" class="tip">未連線</span></div>
    <div class="row" style="margin-top:8px"><button class="btn ghost" id="copyOv">複製手機直播用網址</button><button class="btn ghost" id="copyRec">複製電腦紀錄用網址</button><span class="tip" id="ovTip"></span></div>
    <details style="margin-top:8px"><summary class="tip" style="cursor:pointer">不用直播，先模擬敲一下</summary>
      <div class="row" style="margin-top:6px"><input type="text" id="fakeN" placeholder="名字" style="flex:1"><button class="btn ghost" id="fakeGo">敲！</button><button class="btn ghost" id="fake10">連敲 10 下</button></div>
    </details>

    <h3>🎚️ 角度與大小</h3>
    <label>前後傾斜 <span id="v_rx"></span><input type="range" id="rx" min="-45" max="45"></label>
    <label>左右轉 <span id="v_ry"></span><input type="range" id="ry" min="-45" max="45"></label>
    <label>歪一邊 <span id="v_rz"></span><input type="range" id="rz" min="-25" max="25"></label>
    <label>大小 <span id="v_sc"></span><input type="range" id="sc" min="40" max="100"></label>
    <label>透明度 <span id="v_op"></span><input type="range" id="op" min="40" max="100"></label>
    <div class="row" style="margin-top:6px"><button class="btn ghost" id="tiltReset">擺正</button></div>

    <h3>🏆 敲破紀錄</h3>
    <div class="row"><button class="btn ghost" id="copyWin">複製得獎名單</button><button class="btn ghost" id="clrWin">清空紀錄</button></div>
    <div id="log"></div>
  </div>
</div>
<div id="ovState"></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=1000,H=700,$=id=>document.getElementById(id);
const FONT='"Microsoft JhengHei","PingFang TC",sans-serif';
const LS=(k,d)=>{try{const v=localStorage.getItem('pig_'+k);return v?JSON.parse(v):d}catch(e){return d}};
const SV=(k,v)=>{try{localStorage.setItem('pig_'+k,JSON.stringify(v))}catch(e){}};
const QS=new URLSearchParams(location.search),OV=QS.get('mode')==='overlay',REC=QS.get('mode')==='record';
const SERVER=QS.get('server')||'wss://io.socialstream.ninja';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const imgCache=new Map();function imgOf(s){if(!s)return null;if(!imgCache.has(s)){const im=new Image();im.referrerPolicy='no-referrer';im.src=s;imgCache.set(s,im);}return imgCache.get(s);}

/* ===== 設定 ===== */
const rid=()=>'shine'+Math.random().toString(36).slice(2,9);
let cfg=Object.assign({kw:'抽',cd:60,tmin:50,tmax:120,prize:'贈品任選券',showT:false},LS('cfg',{}));
let sid=QS.get('session')||LS('sid','')||rid();SV('sid',sid);
['kw','cd'].forEach(k=>{if(QS.get(k)!=null)cfg[k]=k==='cd'?+QS.get(k):QS.get(k);});
if(OV){const c=LS('cfgR',null);if(c)Object.assign(cfg,c);}
/* 金豬狀態 */
let pig=LS('pig',null);
function newPig(){const a=Math.max(1,Math.min(cfg.tmin,cfg.tmax)),b=Math.max(cfg.tmin,cfg.tmax,1);pig={target:a+Math.floor(Math.random()*(b-a+1)),hits:0,broken:false,winner:null,id:Date.now()};SV('pig',pig);queue.length=0;hammers.length=0;shards.length=0;coins.length=0;crackSeed();renderUI();}
let wins=LS('wins',[]);
const queue=[],hammers=[],shards=[],coins=[],sparks=[],pops=[];let shake=0,flash=0,brokeAt=0,lastHit=0;
if(!pig)newPig();

/* ===== 裂痕 ===== */
var cracks=[];
function crackSeed(){let s=(pig&&pig.id||1)%2147483647;const R=()=>(s=s*16807%2147483647)/2147483647;cracks=[];
  for(let i=0;i<14;i++){const sx=-150+R()*300,sy=-110+R()*80;let x=sx,y=sy,a=Math.PI/2+(R()-.5)*1.6;const pts=[[x,y]];const n=6+Math.floor(R()*6);
    for(let j=0;j<n;j++){a+=(R()-.5)*1.1;const l=14+R()*22;x+=Math.cos(a)*l;y+=Math.sin(a)*l;pts.push([x,y]);}
    const br=[];for(let k=0;k<2;k++){const p=pts[1+Math.floor(R()*(pts.length-2))];let bx=p[0],by=p[1],ba=a+(R()<.5?-1:1)*(.6+R()*.6);const bp=[[bx,by]];for(let j=0;j<3;j++){ba+=(R()-.5)*.8;const l=10+R()*16;bx+=Math.cos(ba)*l;by+=Math.sin(ba)*l;bp.push([bx,by]);}br.push(bp);}
    cracks.push({pts,br});}}
crackSeed();

/* ===== 畫金豬 ===== */
const PX=480,PY=420;
function goldGrad(x,y,r){const g=ctx.createRadialGradient(x-r*.35,y-r*.45,r*.05,x,y,r*1.1);g.addColorStop(0,'#fffbe0');g.addColorStop(.25,'#ffe27a');g.addColorStop(.6,'#e2a92a');g.addColorStop(1,'#8a5a0c');return g;}
function drawPig(prog,now){
  const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;ctx.save();ctx.translate(PX+sx,PY+sy);
  // 影子
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,175,230,26,0,0,7);ctx.fill();
  // 腳
  for(const [lx,ly] of [[-130,120],[-55,135],[70,135],[145,118]]){ctx.fillStyle=goldGrad(lx,ly+20,50);rr(lx-26,ly,52,58,20);ctx.fill();}
  // 尾巴
  ctx.strokeStyle='#c98f1f';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(228,-10);ctx.bezierCurveTo(275,-40,290,10,255,12);ctx.bezierCurveTo(235,14,240,-15,262,-18);ctx.stroke();
  // 身體
  ctx.fillStyle=goldGrad(-20,-10,250);ctx.beginPath();ctx.ellipse(0,0,240,175,0,0,7);ctx.fill();
  // 耳朵
  for(const [ex,ang] of [[-120,-0.35],[-35,0.2]]){ctx.save();ctx.translate(ex,-140);ctx.rotate(ang);ctx.fillStyle=goldGrad(0,10,60);ctx.beginPath();ctx.moveTo(-34,30);ctx.quadraticCurveTo(-10,-70,30,-40);ctx.quadraticCurveTo(40,0,34,30);ctx.closePath();ctx.fill();ctx.restore();}
  // 鼻子
  ctx.fillStyle=goldGrad(-238,-5,70);ctx.beginPath();ctx.ellipse(-232,-5,48,58,0,0,7);ctx.fill();
  ctx.fillStyle='#7a4f08';for(const ny of [-24,16]){ctx.beginPath();ctx.ellipse(-250,ny,8,13,0,0,7);ctx.fill();}
  // 眼睛
  ctx.fillStyle='#3a2604';ctx.beginPath();ctx.ellipse(-150,-62,10,13,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-146,-67,4,0,7);ctx.fill();
  // 投幣孔
  ctx.fillStyle='#5a3a06';rr(-10,-178,90,14,7);ctx.fill();
  // 高光
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=10;ctx.beginPath();ctx.ellipse(-40,-60,170,110,0,-2.6,-1.6);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(60,40,160,100,0,0.2,1.0);ctx.stroke();
  // 裂痕
  if(prog>0){ctx.save();ctx.beginPath();ctx.ellipse(0,0,236,171,0,0,7);ctx.clip();
    const n=Math.min(cracks.length,Math.ceil(prog*cracks.length*1.05));const glow=Math.max(0,(prog-.55)/.45);
    for(let i=0;i<n;i++){const c=cracks[i],grow=Math.min(1,prog*cracks.length/1.05-i+0.3),m=Math.max(2,Math.ceil(c.pts.length*grow));
      const lw=2+prog*5;
      if(glow>0){ctx.strokeStyle=`rgba(255,250,200,${.4+glow*.5})`;ctx.lineWidth=lw+6*glow;ctx.shadowColor='#fff4b0';ctx.shadowBlur=18*glow;line(c.pts.slice(0,m));ctx.shadowBlur=0;}
      ctx.strokeStyle='#4a2f04';ctx.lineWidth=lw;line(c.pts.slice(0,m));
      if(grow>.6)for(const b of c.br){ctx.lineWidth=lw*.6;line(b);}}
    ctx.restore();}
  ctx.restore();
}
function line(p){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();}

/* ===== 槌子 ===== */
function drawHammer(h,now){
  const t=(now-h.t0)/700;if(t>1.15)return false;
  // 角度：舉起 → 揮下 → 回彈
  const AI=2.65;let a;if(t<.4)a=3.6+(t/.4)*0.45;else if(t<.55)a=4.05-((t-.4)/.15)*(4.05-AI);else a=AI+Math.min(1,(t-.55)/.3)*.2;
  const al=t>.85?Math.max(0,1-(t-.85)/.3):1;
  ctx.save();ctx.globalAlpha=al;ctx.translate(h.px,h.py);ctx.rotate(a);
  // 握把
  const hg=ctx.createLinearGradient(0,-8,0,8);hg.addColorStop(0,'#c08a52');hg.addColorStop(1,'#7a4e24');ctx.fillStyle=hg;rr(-10,-9,300,18,9);ctx.fill();
  // 槌頭
  ctx.save();ctx.translate(300,0);const mg=ctx.createLinearGradient(-50,0,50,0);mg.addColorStop(0,'#9aa3ad');mg.addColorStop(.5,'#eef2f5');mg.addColorStop(1,'#7c858f');ctx.fillStyle=mg;rr(-34,-62,68,124,16);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=2;ctx.stroke();
  // 頭像
  ctx.rotate(-a);const im=imgOf(h.img);ctx.save();ctx.beginPath();ctx.arc(0,0,30,0,7);ctx.clip();if(im&&im.complete&&im.naturalWidth)ctx.drawImage(im,-30,-30,60,60);else{ctx.fillStyle='#c9748a';ctx.fillRect(-30,-30,60,60);ctx.fillStyle='#fff';ctx.font='bold 28px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(h.name[0],0,2);}ctx.restore();
  ctx.beginPath();ctx.arc(0,0,30,0,7);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
  const nm=h.name.length>8?h.name.slice(0,8)+'…':h.name;ctx.font='bold 20px '+FONT;const tw=ctx.measureText(nm).width+18;ctx.fillStyle='rgba(0,0,0,.7)';rr(-tw/2,-74,tw,28,14);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(nm,0,-60);
  ctx.restore();ctx.restore();
  if(!h.hit&&t>=.55){h.hit=true;impact(h);}
  return true;
}
function impact(h){
  if(pig.broken)return;
  pig.hits++;SV('pig',pig);shake=Math.min(26,8+pig.hits/pig.target*18);lastHit=performance.now();
  const ix=h.px+Math.cos(2.65)*300,iy=h.py+Math.sin(2.65)*300+40;
  for(let i=0;i<14;i++)sparks.push({x:ix,y:iy,vx:(Math.random()-.5)*700,vy:-Math.random()*500,t0:performance.now()});
  pops.push({x:ix,y:iy-60,t:`第 ${pig.hits} 下`,t0:performance.now()});
  sendUp({pigHit:{n:h.name,s:h.img||'',hits:pig.hits}});
  if(pig.hits>=pig.target)breakPig(h);
  renderUI();
}
function breakPig(h){
  pig.broken=true;pig.winner={n:h.name,s:h.img||'',hits:pig.hits,prize:cfg.prize,t:Date.now()};SV('pig',pig);brokeAt=performance.now();flash=1;queue.length=0;
  for(let i=0;i<46;i++){const a=Math.random()*Math.PI*2,sp=250+Math.random()*650;shards.push({x:PX+Math.cos(a)*90,y:PY+Math.sin(a)*60,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-350,r:Math.random()*6,vr:(Math.random()-.5)*12,s:16+Math.random()*34});}
  for(let i=0;i<40;i++){const a=-Math.PI/2+(Math.random()-.5)*2.4,sp=300+Math.random()*700;coins.push({x:PX,y:PY-40,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:Math.random()*6});}
  if(!REC){wins.unshift(pig.winner);wins=wins.slice(0,200);SV('wins',wins);}
  sendUp({pigWin:pig.winner});renderUI();
}

/* ===== 主迴圈 ===== */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  // 發槌（太多人同時留言就排隊，每 0.28 秒一支）
  if(queue.length&&!pig.broken&&now-(frame.lt||0)>280&&hammers.length<6){const q=queue.shift();const slot=hammers.length%3;hammers.push({name:q.name,img:q.img,t0:now,px:PX+270+(slot-1)*70,py:PY-330+slot*6,hit:false});frame.lt=now;}
  ctx.clearRect(0,0,W,H);
  const prog=pig.broken?1:pig.hits/pig.target;
  if(!pig.broken||now-brokeAt<60)drawPig(Math.min(prog,.98),now);
  shake=Math.max(0,shake-dt*60);
  for(let i=hammers.length-1;i>=0;i--)if(!drawHammer(hammers[i],now))hammers.splice(i,1);
  // 火花
  for(let i=sparks.length-1;i>=0;i--){const p=sparks[i],k=(now-p.t0)/500;if(k>1){sparks.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=1400*dt;ctx.fillStyle=`rgba(255,${220-k*80|0},120,${1-k})`;ctx.beginPath();ctx.arc(p.x,p.y,4*(1-k)+1,0,7);ctx.fill();}
  for(let i=pops.length-1;i>=0;i--){const p=pops[i],k=(now-p.t0)/900;if(k>1){pops.splice(i,1);continue;}ctx.globalAlpha=1-k;ctx.font='bold 30px '+FONT;ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(p.t,p.x,p.y-k*40);ctx.fillStyle='#ffe08a';ctx.fillText(p.t,p.x,p.y-k*40);ctx.globalAlpha=1;}
  // 爆開
  for(const s of shards){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=1300*dt;s.r+=s.vr*dt;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.r);ctx.fillStyle=goldGrad(0,0,s.s);ctx.beginPath();ctx.moveTo(-s.s/2,-s.s/3);ctx.lineTo(s.s/2,-s.s/4);ctx.lineTo(0,s.s/2);ctx.closePath();ctx.fill();ctx.restore();}
  for(const c of coins){c.x+=c.vx*dt;c.y+=c.vy*dt;c.vy+=1200*dt;c.r+=dt*8;ctx.save();ctx.translate(c.x,c.y);ctx.scale(Math.abs(Math.cos(c.r))+.1,1);ctx.fillStyle='#ffd34d';ctx.beginPath();ctx.arc(0,0,14,0,7);ctx.fill();ctx.strokeStyle='#b8860b';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#b8860b';ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',0,1);ctx.restore();}
  if(shards.length&&now-brokeAt>4000){shards.length=0;coins.length=0;}
  if(flash>0){ctx.fillStyle=`rgba(255,248,210,${flash})`;ctx.fillRect(0,0,W,H);flash=Math.max(0,flash-dt*1.6);}
  // 上方標題
  if(!pig.broken){ctx.fillStyle='rgba(0,0,0,.6)';const kw=cfg.kw.split(/[,，]/)[0]||'抽';const t=`🔨 留言「${kw==='*'?'任何字':kw}」敲金豬！ 已敲 ${pig.hits}${cfg.showT?' / '+pig.target:''} 下`;ctx.font='bold 30px '+FONT;const tw=ctx.measureText(t).width+44;rr(W/2-tw/2,18,tw,54,27);ctx.fill();ctx.fillStyle='#ffe08a';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,W/2,46);
    if(queue.length){ctx.fillStyle='#fff';ctx.font='20px '+FONT;ctx.fillText(`還有 ${queue.length} 支槌子排隊中`,W/2,92);}}
  // 得獎卡
  if(pig.broken&&now-brokeAt>900||pig.broken&&!brokeAt){const k=brokeAt?Math.min(1,(now-brokeAt-900)/400):1,w=pig.winner;ctx.globalAlpha=k;
    ctx.fillStyle='rgba(12,14,22,.9)';rr(170,150,660,400,30);ctx.fill();ctx.strokeStyle='#f3d9a6';ctx.lineWidth=5;ctx.stroke();
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#f3d9a6';ctx.font='bold 46px '+FONT;ctx.fillText('🎉 金豬被敲破了！',W/2,215);
    const im=imgOf(w.s);ctx.save();ctx.beginPath();ctx.arc(W/2,315,60,0,7);ctx.clip();if(im&&im.complete&&im.naturalWidth)ctx.drawImage(im,W/2-60,255,120,120);else{ctx.fillStyle='#c9748a';ctx.fillRect(W/2-60,255,120,120);ctx.fillStyle='#fff';ctx.font='bold 54px '+FONT;ctx.fillText(w.n[0],W/2,318);}ctx.restore();ctx.beginPath();ctx.arc(W/2,315,60,0,7);ctx.strokeStyle='#ffe08a';ctx.lineWidth=5;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 38px '+FONT;ctx.fillText(`恭喜 ${w.n}`,W/2,415);
    ctx.fillStyle='#cfd5df';ctx.font='26px '+FONT;ctx.fillText(`敲下第 ${w.hits} 下，獲得`,W/2,460);
    ctx.fillStyle='#ffe08a';ctx.font='bold 46px '+FONT;ctx.fillText(w.prize||'大獎',W/2,515);ctx.globalAlpha=1;}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ===== 留言 ===== */
const lastBy=new Map();
function onComment(name,msg,img){
  name=(name||'').trim();msg=String(msg||'').replace(/<[^>]*>/g,'');if(!name||pig.broken)return;
  const kws=cfg.kw.split(/[,，]/).map(s=>s.trim()).filter(Boolean);if(!kws.some(k=>k==='*'||msg.includes(k)))return;
  const now=Date.now();if(now-(lastBy.get(name)||0)<cfg.cd*1000)return;lastBy.set(name,now);
  if(queue.length<200)queue.push({name,img:img||''});
}
/* ===== 連線 ===== */
let ws=null,cmdWs=null,recWs=null;
function setState(t){$('wsState').textContent=t;$('ovState').textContent=t;}
function sendUp(o){if(OV&&ws&&ws.readyState===1){try{ws.send(JSON.stringify(o));}catch(e){}}}
function sendDown(o){if(recWs&&recWs.readyState===1){try{recWs.send(JSON.stringify(o));}catch(e){}}}
function connect(){try{ws&&ws.close();}catch(e){}setState('連線中…');ws=new WebSocket(SERVER);
  ws.onopen=()=>{ws.send(JSON.stringify({join:sid,in:4,out:5}));setState('✅ 已連線，等留言中（代碼 '+sid+'）');$('conn').textContent='已連線';};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(x){return;}const d=m.overlayNinja||m;if(d&&(d.chatname||d.chatmessage))onComment(d.chatname,d.chatmessage,d.chatimg);};
  ws.onclose=()=>{setState('⚠️ 斷線，3 秒後重連…');setTimeout(connect,3000);};}
function listenCmd(){cmdWs=new WebSocket(SERVER);cmdWs.onopen=()=>cmdWs.send(JSON.stringify({join:sid,in:6,out:7}));
  cmdWs.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(x){return;}const d=m.overlayNinja||m;
    if(d.pigCfg){Object.assign(cfg,d.pigCfg);SV('cfgR',cfg);renderUI();}
    if(d.pigTilt){tilt=Object.assign({},TDEF,d.pigTilt);SV('tiltR',tilt);applyTilt();}
    if(d.pigCmd==='new')newPig();
    if(d.pigCmd==='hit')onComment(d.n||'測試',(cfg.kw.split(/[,，]/)[0]||'抽')==='*'?'x':cfg.kw.split(/[,，]/)[0],'');
    if(d.pigCmd==='sync'||d.pigCmd==='new')sendUp({pigState:pig});};
  cmdWs.onclose=()=>setTimeout(listenCmd,4000);}
function listenRec(){recWs=new WebSocket(SERVER);recWs.onopen=()=>{recWs.send(JSON.stringify({join:sid,in:5,out:6}));setTimeout(()=>{pushCfg();pushTilt();sendDown({pigCmd:'sync'});},300);};
  recWs.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(x){return;}const d=m.overlayNinja||m;
    if(d.pigState){pig=d.pigState;SV('pig',pig);crackSeed();renderUI();}
    if(d.pigHit&&!pig.broken){pig.hits=d.pigHit.hits;hammers.push({name:d.pigHit.n,img:d.pigHit.s,t0:performance.now(),px:PX+270,py:PY-330,hit:true});renderUI();}
    if(d.pigWin){pig.broken=true;pig.winner=d.pigWin;pig.hits=d.pigWin.hits;brokeAt=performance.now();if(!wins.some(w=>w.t===d.pigWin.t)){wins.unshift(d.pigWin);SV('wins',wins);}renderUI();}};
  recWs.onclose=()=>setTimeout(listenRec,4000);}
function pushCfg(){sendDown({pigCfg:{kw:cfg.kw,cd:cfg.cd,tmin:cfg.tmin,tmax:cfg.tmax,prize:cfg.prize,showT:cfg.showT}});}

/* ===== 介面 ===== */
function renderUI(){
  $('state').textContent=pig.broken?`這隻已被 ${pig.winner&&pig.winner.n} 敲破（第 ${pig.hits} 下）`:`目前已敲 ${pig.hits} 下`;
  $('secret').textContent=pig.target;
  $('log').innerHTML=wins.map(w=>`<div>${w.s?`<img src="${esc(w.s)}" referrerpolicy="no-referrer">`:'<span class="ph"></span>'}<span>${esc(w.n)}</span><span class="tip">第 ${w.hits} 下</span><span style="margin-left:auto;color:var(--gold);font-weight:700">${esc(w.prize||'')}</span></div>`).join('')||'<div class="tip">還沒有人敲破</div>';
}
$('kw').value=cfg.kw;$('cd').value=cfg.cd;$('tmin').value=cfg.tmin;$('tmax').value=cfg.tmax;$('prize').value=cfg.prize;$('showT').checked=cfg.showT;$('sid').value=sid;
function saveCfg(){cfg.kw=$('kw').value.trim()||'抽';cfg.cd=Math.max(0,+$('cd').value||0);cfg.tmin=Math.max(1,+$('tmin').value||1);cfg.tmax=Math.max(1,+$('tmax').value||cfg.tmin);cfg.prize=$('prize').value.trim();cfg.showT=$('showT').checked;SV('cfg',cfg);pushCfg();renderUI();}
['kw','cd','tmin','tmax','prize','showT'].forEach(id=>$(id).addEventListener('change',saveCfg));
$('sid').onchange=()=>{sid=$('sid').value.trim()||rid();$('sid').value=sid;SV('sid',sid);};
$('newPig').onclick=()=>{if(!confirm('換一隻新金豬？目前這隻的進度會清空。'))return;newPig();sendDown({pigCmd:'new'});};
$('conn').onclick=()=>{connect();if(!REC&&!recWs)listenRec();};
$('fakeGo').onclick=()=>{const n=$('fakeN').value.trim()||'測試觀眾';if(REC)sendDown({pigCmd:'hit',n});else onComment(n,cfg.kw.split(/[,，]/)[0]==='*'?'x':cfg.kw.split(/[,，]/)[0],'');};
$('fake10').onclick=()=>{for(let i=0;i<10;i++){const n='測試'+Math.floor(Math.random()*1000);if(REC)sendDown({pigCmd:'hit',n});else onComment(n,cfg.kw.split(/[,，]/)[0]==='*'?'x':cfg.kw.split(/[,，]/)[0],'');}};
const base=()=>location.href.split('?')[0];
function copy(u){navigator.clipboard.writeText(u).then(()=>{$('ovTip').textContent='已複製 ✓';setTimeout(()=>$('ovTip').textContent='',2000);});}
$('copyOv').onclick=()=>copy(`${base()}?mode=overlay&session=${encodeURIComponent(sid)}&v=1`);
$('copyRec').onclick=()=>copy(`${base()}?mode=record&session=${encodeURIComponent(sid)}`);
$('copyWin').onclick=()=>copy(wins.slice().reverse().map(w=>`${w.n}　${w.prize}（第 ${w.hits} 下）`).join('\n')||'目前沒有');
$('clrWin').onclick=()=>{if(confirm('清空敲破紀錄？')){wins=[];SV('wins',wins);renderUI();}};

/* ===== 角度 ===== */
const TDEF={rx:0,ry:0,rz:0,sc:100,op:90};let tilt=Object.assign({},TDEF,LS('tilt',{}));
if(OV){const r=LS('tiltR',null);if(r)tilt=Object.assign({},TDEF,r);}
function applyTilt(){cv.style.transform=`rotateX(${tilt.rx}deg) rotateY(${tilt.ry}deg) rotateZ(${tilt.rz}deg) scale(${tilt.sc/100})`;cv.style.opacity=tilt.op/100;['rx','ry','rz','sc','op'].forEach(k=>{$(k).value=tilt[k];$('v_'+k).textContent=tilt[k]+(k==='sc'||k==='op'?'%':'°');});}
let tT=0;function pushTilt(){clearTimeout(tT);tT=setTimeout(()=>sendDown({pigTilt:tilt}),80);}
['rx','ry','rz','sc','op'].forEach(k=>$(k).addEventListener('input',()=>{tilt[k]=+$(k).value;SV('tilt',tilt);applyTilt();pushTilt();}));
$('tiltReset').onclick=()=>{tilt=Object.assign({},TDEF);SV('tilt',tilt);applyTilt();pushTilt();};
applyTilt();

/* ===== 啟動 ===== */
renderUI();
if(OV){document.body.classList.add('ov');document.documentElement.style.background='transparent';connect();listenCmd();setTimeout(()=>$('ovState').style.opacity=0,8000);}
else if(REC){listenRec();$('conn').style.display='none';setState('📋 紀錄模式：遙控手機上的金豬（代碼 '+sid+'）');}
else if(QS.get('session')){connect();}
</script>
</body>
