<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<title>Shine欣 直播遊戲總台</title>
<style>
:root{--bg:#14161d;--card:#1f222c;--line:#323644;--ink:#eef0f5;--sub:#a9afbf;--gold:#f3d9a6;--on:#e0a95a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC",sans-serif}
body.ov,html.ov{background:transparent!important}
#ovFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent;transition:opacity .4s}
#ctl{display:flex;flex-direction:column;height:100%}
header{padding:6px 12px;border-bottom:1px solid var(--line);background:#181a22;display:flex;flex-direction:column;gap:6px}
h1{font-size:17px;margin:0 4px 0 0;color:var(--gold);white-space:nowrap}
#st{font-size:13px;color:var(--sub);margin-left:auto;text-align:right;line-height:1.35}
#st b{color:#9fe7a4}
.sec{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.grp{display:inline-flex;align-items:center;gap:5px;padding:3px 6px;border:1px solid var(--line);border-radius:10px;background:#1b1e27;flex-wrap:wrap}
.lab{font-size:13px;font-weight:700;color:var(--gold);white-space:nowrap;margin-right:2px}
.grow{flex:1}.hint{color:var(--sub)}
.g{font-size:15px;font-weight:700;padding:6px 9px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.g:hover{border-color:#5a6072}
.g.on{border-color:var(--on);background:#3a2e1c;color:#ffe3b0}
.s{font-size:14px;font-weight:700;padding:5px 10px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.s.off{color:var(--sub)}
#pauseBtn{font-size:16px;font-weight:700;padding:6px 14px;border-radius:9px;border:2px solid;cursor:pointer;min-width:250px}
#pauseBtn.hid{background:#1f5f35;border-color:#4fd07a;color:#eafff0}
#pauseBtn.shown{background:#5a2020;border-color:#ff8a8a;color:#ffecec}
.sec input[type=range]{width:110px;vertical-align:middle;accent-color:#e0a95a}
#vibeBtn.on{background:linear-gradient(90deg,#4a2a6a,#2a4a6a);border-color:#c6a0ff;color:#fff}
#vibeFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent;pointer-events:none;z-index:4}
#sess{font-size:16px;color:var(--sub);display:flex;gap:8px;align-items:center}
#sess input{font-size:16px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#0f1116;color:var(--ink);width:150px}
#url{font-size:12px;color:var(--sub);padding:3px 12px;background:#16181f;border-bottom:1px solid var(--line);word-break:break-all}
#url summary{cursor:pointer}
#url button{font-size:15px;margin-left:8px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
#recFrame{flex:1;width:100%;border:0;background:var(--bg)}
#empty{flex:1;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--sub)}
#fxWrap{position:fixed;inset:0;z-index:6;opacity:0;transition:opacity .5s;pointer-events:none;background:transparent;overflow:hidden}
#fxWrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#fxTxt{position:absolute;left:5%;right:5%;top:9%;text-align:center;color:#fff;font-family:"Noto Serif TC","Noto Serif KR","Songti TC","PMingLiU",serif;font-weight:700;text-shadow:0 .4vw 2.4vw rgba(50,15,65,.95),0 0 1.2vw rgba(50,15,65,.8),0 0 3vw rgba(255,190,220,.35)}
#fxTxt div{opacity:0;transform:translateY(1.6vw);filter:blur(1.2vw);transition:opacity 1.3s ease,transform 1.3s ease,filter 1.3s ease}
#fxTxt.on div{opacity:1;transform:none;filter:none}
#fxTxt .zh,#fxTxt .ko{white-space:nowrap}
#fxTxt .zh{font-size:10vw;letter-spacing:.12em;line-height:1.35}
#fxTxt .ln{height:.4vw;width:42%;margin:1.6vw auto 1.2vw;background:linear-gradient(90deg,transparent,#ffecd2,transparent)}
#fxTxt .ko{font-size:8.2vw;letter-spacing:.04em;line-height:1.35;font-family:"Noto Serif KR","Noto Serif TC","Apple SD Gothic Neo",serif}
#fxTxt.on .ln{transition-delay:.35s}#fxTxt.on .ko{transition-delay:.6s}
</style></head>
<body>
<div id="ctl" style="display:none">
  <header>
    <div class="sec">
      <h1>🎮 總台</h1>
      <span class="grp"><span class="lab">☕ 中場休息玩</span>
        <button class="g" data-g="plinko">🎯 彈珠台</button>
        <button class="g" data-g="arena">⚔️ 大逃殺</button>
        <button class="g" data-g="fish">🐟 撈金魚</button>
        <button class="g" data-g="popo">👵 婆婆來了</button>
      </span>
      <span class="grp"><span class="lab">🛍 邊播邊玩</span>
        <button class="g" data-g="pig">🔨 敲金豬</button>
        <button class="g" data-g="zhanan">👊 爆揍渣男</button>
        <button class="g" data-g="rescue">🐾 拯救浪浪</button>
        <button class="g" data-g="grid">👑 我的地盤</button>
        <button class="g" data-g="charge">⚡ 全場集氣</button>
      </span>
      <div id="st">手機：<span id="phone">還沒連上</span><br>FB 留言：<span id="cmt">檢查中…</span></div>
    </div>
    <div class="sec">
      <button id="pauseBtn" style="display:none"></button>
      <span id="opBox" style="display:none">🔆 透明度 <input type="range" id="op" min="20" max="100" step="5"> <b id="opV"></b><span id="opName" style="display:none"></span><span style="display:none"><input type="checkbox" id="fill"><input type="range" id="sw"><b id="swV"></b><input type="range" id="sh"><b id="shV"></b></span></span>
      <span id="noGame" class="hint">👆 先選一個遊戲</span>
      <span class="grow"></span>
      <button class="s" id="vibeBtn">🌈 彈幕＋愛心雨：關</button>
      <span>透明度 <input type="range" id="vop" min="20" max="100" step="5" style="accent-color:#c6a0ff"> <b id="vopV"></b></span>
      <button class="s off" id="vibeSet">⚙️ 彈幕設定</button>
    </div>
  </header>
  <details id="url"><summary>⚙️ 連線設定（平常不用動）</summary><div style="margin-top:8px"><span id="sess">連線代碼 <input id="sid"></span>　手機 PRISM 網址：<span id="ovUrl"></span><button id="cp">複製</button></div></details>
  <iframe id="recFrame" style="display:none"></iframe>
  <div id="empty">👆 先選一個遊戲，設定好之後再按「顯示到直播」</div>
</div>
<script>
const SERVER=new URLSearchParams(location.search).get('server')||'wss://io.socialstream.ninja';
const GAMES={plinko:'🎯 彈珠台',pig:'🔨 敲金豬',arena:'⚔️ 頭像大逃殺',fish:'🐟 撈金魚',zhanan:'👊 爆揍渣男',popo:'👵 婆婆來了',rescue:'🐾 拯救浪浪',grid:'👑 我的地盤我做主',charge:'⚡ 全場集氣',none:'🙈 沒有顯示遊戲'};
const FX={rose:{n:'🌹 玫瑰城堡',f:'fx_rose.mp4',at:2.9,top:63,dur:6.6},swan:{n:'🦢 天鵝湖',f:'fx_swan.mp4',at:5.8,top:7,dur:9.4},angel:{n:'👼 天使降臨',f:'fx_angel.mp4',at:4.9,top:5,dur:8.7},xmas:{n:'🎄 聖誕雪球',f:'fx_xmas.mp4',at:4.6,top:68,dur:8.7},zerozero:{n:'💎 ZERO ZERO 專屬',f:'fx_zerozero.mp4',at:-1,dur:7.9}};
const FXV='1';
const QS=new URLSearchParams(location.search),OV=QS.get('mode')==='overlay';
const LS=(k,d)=>{try{const v=localStorage.getItem('hub_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}};
const SV=(k,v)=>{try{localStorage.setItem('hub_'+k,JSON.stringify(v));}catch(e){}};
let sid=QS.get('session')||LS('sid','')||'';
const base=location.href.split('?')[0].replace(/hub\.html$/,'');
const gameUrl=(g,mode)=>`${base}${g}.html?mode=${mode}&session=${encodeURIComponent(sid)}&v=${Date.now()}`+(QS.get('server')?'&server='+encodeURIComponent(QS.get('server')):'');

if(OV){
  /* ===== 手機：只放這一個網址 ===== */
  document.documentElement.classList.add('ov');document.body.classList.add('ov');
  const fr=document.createElement('iframe');fr.id='ovFrame';fr.setAttribute('allowtransparency','true');document.body.appendChild(fr);
  if(!LS('d70',0)){SV('ops',{});SV('vop',70);SV('vibe',true);SV('d70',1);} // 一次性：新預設
  let cur=null,ws=null,ops=LS('ops',{});
  let paused=LS('paused',true);window.__hubPaused=paused;
  const cover=document.createElement('div');cover.id='prep';document.body.appendChild(cover);
  let vibe=LS('vibe',true),vop=LS('vop',70);const vf=document.createElement('iframe');vf.id='vibeFrame';vf.setAttribute('allowtransparency','true');document.body.appendChild(vf);
  function applyVibe(){const want=vibe?gameUrl('vibe','overlay'):'about:blank';if(vibe&&!/vibe\.html/.test(vf.src))vf.src=want;if(!vibe&&vf.src!=='about:blank')vf.src='about:blank';}
  applyVibe();vf.style.opacity=vop/100;
  function applyPause(){window.__hubPaused=paused;cover.style.display='none';applyOp();if(fxV)fxW.style.opacity=fxOp();}
  let fills=LS('fills',{}),sizes=LS('sizes',{});
  function applySize(){const z={w:100,h:100};fr.style.width=z.w+'%';fr.style.height=z.h+'%';fr.style.left=((100-z.w)/2)+'%';fr.style.right='auto';fr.style.top='0';fr.style.bottom='auto';}
  const FILLCSS='html,body{height:100%!important;overflow:hidden!important}#wrap{padding:0!important;height:100vh!important}#stage{height:100vh!important;padding:0!important;align-items:stretch!important}canvas{width:100vw!important;height:100vh!important;max-height:none!important;aspect-ratio:auto!important;object-fit:fill!important;transform:none!important}';
  function applyFill(){try{const w=fr.contentWindow;if(!w)return;w.__fill=false;if(w.__fit)w.__fit();}catch(e){}}
  function applyOp(){fr.style.opacity=!paused&&cur&&cur!=='none'?(ops[cur]!=null?ops[cur]:70)/100:0;applyFill();applySize();}
  function show(g){if(!GAMES[g])return;if(g===cur)return;cur=g;SV('ovGame',g);paused=true;SV('paused',true);applyPause();
    fr.style.opacity=0;setTimeout(()=>{fr.src=g==='none'?'about:blank':gameUrl(g,'overlay');fr.onload=applyOp;},300);report();}
  function report(){if(ws&&ws.readyState===1){try{ws.send(JSON.stringify({hubState:{game:cur,t:Date.now(),ops,fills,sizes,paused,vibe,vop}}));}catch(e){}}}
  /* ===== 特效影片：全螢幕播放，播完自動淡出 ===== */
  const fxW=document.createElement('div');fxW.id='fxWrap';fxW.innerHTML='<div id="fxTxt"><div class="zh"></div><div class="ln"></div><div class="ko"></div></div>';document.body.appendChild(fxW);
  const fxT=fxW.querySelector('#fxTxt');let fxV=null,fxTok=0,fxEndT=0;const fxBlob={};
  const fxSrc=id=>fxBlob[id]||(base+FX[id].f+'?v='+FXV);
  // 先把影片抓進來，按下去才不會等
  (async()=>{await new Promise(r=>setTimeout(r,2500));for(const id of Object.keys(FX)){try{const r=await fetch(base+FX[id].f+'?v='+FXV);if(r.ok)fxBlob[id]=URL.createObjectURL(await r.blob());}catch(e){}}})();
  function stopFx(){fxTok++;clearTimeout(fxEndT);fxW.style.opacity=0;fxT.classList.remove('on');const v=fxV;fxV=null;if(v)setTimeout(()=>{try{v.pause();v.remove();}catch(e){}},600);}
  function playFx(id,ph0){const F=FX[id];if(!F)return 0;stopFx();const tok=++fxTok;const v=document.createElement('video');v.muted=true;v.defaultMuted=true;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');v.setAttribute('muted','');v.preload='auto';v.src=fxSrc(id);fxW.insertBefore(v,fxT);fxV=v;
    const ph=F.at>=0&&ph0&&(ph0[0]||ph0[1])?[ph0[0]||'',ph0[1]||'']:null;fxT.style.top=(F.top!=null?F.top:9)+'%';fxT.classList.remove('on');fxT.style.display=ph?'block':'none';
    if(ph){fxT.querySelector('.zh').textContent=ph[0]||'';fxT.querySelector('.ko').textContent=ph[1]||'';fxT.querySelector('.zh').style.display=ph[0]?'block':'none';fxT.querySelector('.ko').style.display=ph[1]?'block':'none';fxT.querySelector('.ln').style.display=ph[0]&&ph[1]?'block':'none';
      const z=fxT.querySelector('.zh'),k=fxT.querySelector('.ko');z.style.fontSize=Math.min(10,86/(Math.max(1,ph[0].length)*1.13))+'vw';k.style.fontSize=Math.min(8.2,86/(Math.max(1,ph[1].length)*0.9))+'vw';}
    const end=()=>{if(tok!==fxTok)return;stopFx();};
    v.addEventListener('playing',()=>{if(tok===fxTok)fxW.style.opacity=fxOp();});
    v.addEventListener('timeupdate',()=>{if(tok!==fxTok)return;if(ph&&v.currentTime>=F.at)fxT.classList.add('on');if(v.duration&&v.currentTime>=v.duration-0.45)end();});
    v.addEventListener('ended',end);v.addEventListener('error',end);
    const p=v.play();if(p&&p.catch)p.catch(()=>{});
    clearTimeout(fxEndT);fxEndT=setTimeout(end,(F.dur+4)*1000);return F.dur*1000;}
  // 給「全場集氣」用；透明度跟全場集氣同步，畫面隱藏時不播
  const fxOp=()=>paused?0:(ops.charge!=null?ops.charge:70)/100;
  window.__playFx=(id,ph)=>playFx(id,ph);window.__stopFx=stopFx;
  function connect(){ws=new WebSocket(SERVER);
    ws.onopen=()=>{ws.send(JSON.stringify({join:sid,in:6,out:5}));setTimeout(report,300);};
    ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(x){return;}const d=m.overlayNinja||m;
      if(d.hubOps){ops=Object.assign({},ops,d.hubOps);SV('ops',ops);applyOp();if(fxV)fxW.style.opacity=fxOp();}
      if(d.hubFills){fills=Object.assign({},fills,d.hubFills);SV('fills',fills);applyFill();}
      if(d.hubSizes){sizes=Object.assign({},sizes,d.hubSizes);SV('sizes',sizes);applySize();}
      if(d.hubCmd==='dumpWins'){const since=+d.since||0;const keys=[];for(let i=0;i<localStorage.length;i++)keys.push(localStorage.key(i));
        keys.filter(k=>/(_wins|_hist)$/.test(k)).forEach(k=>{let a=[];try{a=JSON.parse(localStorage.getItem(k))||[];}catch(e){}
          if(!Array.isArray(a))return;a=a.filter(w=>!since||(w.t||0)>=since).slice(0,300);
          const slim=a.map(w=>({t:w.t,n:w.n||w.name,p:w.prize||w.label,a:w.a,list:w.list&&w.list.map(x=>({n:x.n,c:x.c,prize:x.prize})),rank:w.rank&&w.rank.slice(0,5).map(r=>({n:r.n,c:r.c})),top:w.top,prizeCell:w.prizeCell,cells:w.cells&&w.cells.map(c=>({ch:c.ch,n:c.n}))}));
          for(let i=0;i<slim.length;i+=40){try{ws.send(JSON.stringify({hubWins:{key:k,part:i/40,total:slim.length,items:slim.slice(i,i+40)}}));}catch(e){}}});
        try{ws.send(JSON.stringify({hubWinsDone:keys.filter(k=>/(_wins|_hist)$/.test(k))}));}catch(e){}}
      if(d.hubVop!==undefined){vop=+d.hubVop;SV('vop',vop);vf.style.opacity=vop/100;report();}
      if(d.hubVibe!==undefined){vibe=!!d.hubVibe;SV('vibe',vibe);applyVibe();report();}
      if(d.hubPause!==undefined){paused=!!d.hubPause;SV('paused',paused);applyPause();report();}
      if(d.hubGame)show(d.hubGame);if(d.hubCmd==='sync')report();};
    ws.onclose=()=>setTimeout(connect,3000);}
  const p0=LS('paused',true);show(QS.get('game')||LS('ovGame','none'));paused=p0;SV('paused',p0);applyPause();connect();
  setInterval(report,15000);
}else{
  /* ===== 電腦：總控 ===== */
  const $=id=>document.getElementById(id);$('ctl').style.display='flex';
  if(!sid){sid='JUVRjNBuLH';}
  $('sid').value=sid;
  const ovUrl=()=>`${base}hub.html?mode=overlay&session=${encodeURIComponent(sid)}`;
  $('ovUrl').textContent=ovUrl();
  $('cp').onclick=()=>navigator.clipboard.writeText(ovUrl()).then(()=>{$('cp').textContent='已複製 ✓';setTimeout(()=>$('cp').textContent='複製',1500);});
  $('sid').onchange=()=>{sid=$('sid').value.trim()||sid;$('sid').value=sid;SV('sid',sid);$('ovUrl').textContent=ovUrl();connect();if(curRec)openRec(curRec,true);};
  if(!LS('d70pc',0)){SV('ops',{});SV('vop',70);SV('d70pc',1);}
  let ws=null,curRec=null,lastSeen=0,phoneGame=null,ops=LS('ops',{});
  const opOf=g=>ops[g]!=null?ops[g]:70;
  function paintOp(){const g=curRec;if(!g||g==='none'){$('opBox').style.display='none';$('noGame').style.display='inline';return;}$('opBox').style.display='inline';$('noGame').style.display='none';$('opName').textContent=GAMES[g]+' ';$('op').value=opOf(g);$('opV').textContent=opOf(g)+'%';$('fill').checked=!!fills[g];const z=sizes[g]||{w:100,h:100};$('sw').value=z.w;$('sh').value=z.h;$('swV').textContent=z.w+'%';$('shV').textContent=z.h+'%';}
  let fills=LS('fills',{}),sizes=LS('sizes',{});let szT=0;
  ['sw','sh'].forEach(id=>$(id).addEventListener('input',()=>{if(!curRec||curRec==='none')return;const z={w:+$('sw').value,h:+$('sh').value};sizes[curRec]=z;SV('sizes',sizes);$('swV').textContent=z.w+'%';$('shV').textContent=z.h+'%';clearTimeout(szT);szT=setTimeout(()=>send({hubSizes:{[curRec]:z}}),60);}));
  $('fill').addEventListener('change',()=>{if(!curRec||curRec==='none')return;fills[curRec]=$('fill').checked;SV('fills',fills);send({hubFills:{[curRec]:fills[curRec]}});});
  let opT=0;$('op').addEventListener('input',()=>{if(!curRec||curRec==='none')return;ops[curRec]=+$('op').value;SV('ops',ops);$('opV').textContent=ops[curRec]+'%';$('recFrame').style.opacity=1;clearTimeout(opT);opT=setTimeout(()=>send({hubOps:{[curRec]:ops[curRec]}}),60);});
  function openRec(g,force){if(g===curRec&&!force)return;curRec=g;SV('recGame',g);
    document.querySelectorAll('.g').forEach(b=>b.classList.toggle('on',b.dataset.g===g));paintOp();
    if(g==='none'){$('recFrame').style.display='none';$('empty').style.display='flex';$('empty').textContent='👆 先選一個遊戲，設定好之後再按「顯示到直播」';return;}
    $('empty').style.display='none';$('recFrame').style.display='block';$('recFrame').src=gameUrl(g,'record');paintPause();}
  function send(o){if(ws&&ws.readyState===1){try{ws.send(JSON.stringify(o));}catch(e){}}}
  let pausedUI=true,vibeUI=true;
  setTimeout(()=>paintVibe(),0);
  function paintVibe(){$('vibeBtn').classList.toggle('on',vibeUI);$('vibeBtn').textContent='🌈 彈幕＋愛心雨：'+(vibeUI?'開':'關');}
  $('vibeBtn').onclick=()=>{vibeUI=!vibeUI;send({hubVibe:vibeUI});paintVibe();};
  let vopUI=LS('vop',70),vT=0;const paintVop=()=>{if(document.activeElement!==$('vop'))$('vop').value=vopUI;$('vopV').textContent=vopUI+'%';};paintVop();
  $('vop').addEventListener('input',()=>{vopUI=+$('vop').value;SV('vop',vopUI);paintVop();clearTimeout(vT);vT=setTimeout(()=>send({hubVop:vopUI}),60);});
  $('vibeSet').onclick=()=>window.open(gameUrl('vibe','record'),'_blank');
  function paintPause(){const b=$('pauseBtn');if(!curRec||curRec==='none'){b.style.display='none';return;}b.style.display='inline-block';
    b.className=pausedUI?'hid':'shown';b.textContent=pausedUI?'🙈 沒顯示｜▶ 按這裡顯示到直播':'👁 顯示中｜■ 按這裡隱藏';}
  $('pauseBtn').onclick=()=>{pausedUI=!pausedUI;send({hubPause:pausedUI});paintPause();};
  document.querySelectorAll('.g[data-g]').forEach(b=>b.onclick=()=>{const g=b.dataset.g;send({hubGame:g});openRec(g);pausedUI=true;paintPause();});
  function connect(){try{ws&&ws.close();}catch(e){}ws=new WebSocket(SERVER);
    ws.onopen=()=>{ws.send(JSON.stringify({join:sid,in:5,out:6}));setTimeout(()=>{send({hubCmd:'sync'});},300);};
    ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(x){return;}const d=m.overlayNinja||m;
      if(d.hubState&&d.hubState.vibe!==undefined&&vibeUI!==!!d.hubState.vibe){vibeUI=!!d.hubState.vibe;paintVibe();}
      if(d.hubState&&d.hubState.vop!==undefined&&document.activeElement!==$('vop')){vopUI=+d.hubState.vop;SV('vop',vopUI);paintVop();}
      if(d.hubState){lastSeen=Date.now();phoneGame=d.hubState.game;if(d.hubState.paused!==undefined&&d.hubState.game===curRec){pausedUI=!!d.hubState.paused;paintPause();}if(d.hubState.ops){ops=d.hubState.ops;fills=d.hubState.fills||{};sizes=d.hubState.sizes||{};SV('ops',ops);SV('fills',fills);SV('sizes',sizes);if(document.activeElement!==$('op')&&document.activeElement!==$('sw')&&document.activeElement!==$('sh'))paintOp();}if(!curRec&&phoneGame)openRec(phoneGame);paint();}};
    ws.onclose=()=>setTimeout(connect,3000);}
  // 直接偵測外掛有沒有把 FB 留言送出來
  let lastCmt=0,lastTxt='';function listenCmt(){const c=new WebSocket(SERVER);c.onopen=()=>c.send(JSON.stringify({join:sid,in:4,out:99}));
    c.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(x){return;}const d=m.overlayNinja||m;if(d&&(d.chatname||d.chatmessage)){lastCmt=Date.now();lastTxt=`${d.chatname}：${String(d.chatmessage||'').replace(/<img[^>]*alt="([^"]*)"[^>]*>/gi,'$1').replace(/<[^>]*>/g,'').slice(0,20)}`;paintCmt();}};c.onclose=()=>setTimeout(listenCmt,3000);}
  function paintCmt(){const s=Math.floor((Date.now()-lastCmt)/1000);$('cmt').innerHTML=!lastCmt?'<span style="color:#ffb070">⚠️ 還沒收到任何留言（檢查外掛、FB直播頁）</span>':s<120?`<b>✅ ${s} 秒前</b> ${lastTxt.replace(/</g,'&lt;')}`:`<span style="color:#ffb070">⚠️ ${Math.floor(s/60)} 分鐘沒收到留言了</span>`;}
  listenCmt();setInterval(paintCmt,2000);
  function paint(){const ok=Date.now()-lastSeen<40000;$('phone').innerHTML=ok?`<b>✅ 已連上</b>・正在顯示 ${GAMES[phoneGame]||'?'}`:'⚠️ 還沒連上（手機 PRISM 有開總台網址嗎？）';}
  setInterval(paint,3000);paint();connect();setInterval(()=>send({hubCmd:'sync'}),5000);
  const g0=LS('recGame',null);if(g0)setTimeout(()=>{if(!curRec)openRec(g0);},1500);
}
</script>
