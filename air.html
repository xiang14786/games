<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="遊戲盒">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>天空航線</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0a1628; color:#e8eef8;
    font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; user-select:none; -webkit-user-select:none; overscroll-behavior:none; }
  img { -webkit-user-drag:none; pointer-events:none; }
  .hide { display:none !important; }
  #app { position:relative; max-width:560px; height:100%; margin:0 auto; display:flex; flex-direction:column; overflow:hidden; }
  #top { padding:calc(env(safe-area-inset-top) + 6px) 10px 6px; background:linear-gradient(180deg,#0f2240,#0c1b33); border-bottom:1px solid #1e3a60; display:flex; flex-direction:column; gap:5px; z-index:4; }
  #top .r1 { display:flex; align-items:center; gap:8px; }
  #logoMini { width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:14px; color:#fff; flex:none; }
  #coName { font-weight:900; font-size:16px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #date { font-weight:800; font-size:15px; color:#9fc2ff; }
  #top .r2 { display:flex; align-items:center; gap:6px; font-size:13px; }
  .stat { background:rgba(255,255,255,.06); border-radius:10px; padding:3px 8px; display:flex; align-items:center; gap:4px; white-space:nowrap; }
  .stat img { width:16px; height:16px; }
  .stat b { font-size:14px; }
  .pos { color:#5fe08a; } .neg { color:#ff7a7a; }
  .spd { margin-left:auto; display:flex; gap:3px; }
  .spd button { width:34px; height:28px; border-radius:8px; border:1px solid #2a4a78; background:#132a4c; color:#cfe0ff; font-size:13px; font-weight:800; padding:0; font-family:inherit; }
  .spd button.on { background:#3a7bff; color:#fff; border-color:#5a95ff; }
  #mapWrap { position:relative; flex:1; min-height:0; }
  #map { display:block; width:100%; height:100%; touch-action:none; }
  #toast { position:absolute; left:8px; right:8px; top:8px; display:flex; flex-direction:column; gap:6px; pointer-events:none; z-index:3; }
  .tst { background:rgba(10,20,40,.92); border:1px solid #2a4a78; border-radius:12px; padding:8px 10px; font-size:13px; display:flex; gap:8px; align-items:center; animation:tin .3s; box-shadow:0 6px 14px rgba(0,0,0,.4); }
  .tst img { width:26px; height:26px; flex:none; }
  @keyframes tin { from { transform:translateY(-12px); opacity:0; } }
  #mapBtns { position:absolute; right:8px; bottom:8px; display:flex; flex-direction:column; gap:6px; z-index:2; }
  #mapBtns button { width:38px; height:38px; border-radius:12px; border:1px solid #2a4a78; background:rgba(15,34,64,.9); color:#fff; font-size:18px; padding:0; }
  #sheet { flex:0 0 46%; background:#0e1e38; border-top:1px solid #1e3a60; display:flex; flex-direction:column; min-height:0; z-index:4; }
  #sheet.big { flex-basis:72%; }
  #sheetBody { flex:1; overflow-y:auto; padding:10px 10px 6px; -webkit-overflow-scrolling:touch; touch-action:pan-y; }
  #tabs { display:flex; border-top:1px solid #1e3a60; padding-bottom:env(safe-area-inset-bottom); background:#0b182e; }
  #tabs button { flex:1; background:none; border:0; color:#7f9cc8; font-size:11px; font-weight:800; padding:6px 0 7px; display:flex; flex-direction:column; align-items:center; gap:2px; font-family:inherit; }
  #tabs button img { width:24px; height:24px; opacity:.6; }
  #tabs button.on { color:#fff; } #tabs button.on img { opacity:1; }
  h3 { margin:2px 0 8px; font-size:17px; display:flex; align-items:center; gap:6px; }
  h3 img { width:24px; height:24px; }
  h3 small { margin-left:auto; font-size:12px; color:#7f9cc8; font-weight:600; }
  .card { background:#132848; border:1px solid #1f3d66; border-radius:14px; padding:10px; margin-bottom:8px; }
  .row { display:flex; align-items:center; gap:8px; }
  .muted { color:#7f9cc8; font-size:12px; }
  button.b { background:linear-gradient(180deg,#4a8bff,#2f6ae0); color:#fff; border:0; border-radius:12px; padding:9px 14px; font-size:15px; font-weight:800; font-family:inherit; }
  button.b.g { background:#1f3d66; } button.b.r { background:linear-gradient(180deg,#ff6b6b,#d94040); } button.b.y { background:linear-gradient(180deg,#ffcf4a,#e8a020); color:#3a2500; }
  button.b:disabled { opacity:.4; }
  button.b.sm { padding:6px 10px; font-size:13px; border-radius:10px; }
  .lf { height:8px; background:#0a1628; border-radius:4px; overflow:hidden; flex:1; }
  .lf i { display:block; height:100%; }
  .route { display:flex; align-items:center; gap:8px; padding:8px 4px; border-bottom:1px solid #1f3d66; }
  .route:last-child { border-bottom:0; }
  .route .nm { font-weight:900; font-size:15px; min-width:96px; }
  .route .nm small { display:block; font-weight:600; color:#7f9cc8; font-size:11px; }
  .route .val { text-align:right; font-size:13px; font-weight:800; min-width:70px; }
  .plane { display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid #1f3d66; }
  .plane svg { width:96px; height:40px; flex:none; }
  .plane .info { flex:1; font-size:12px; color:#a8bfe0; line-height:1.5; }
  .plane .info b { color:#fff; font-size:15px; }
  .spec { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin-top:4px; }
  .spec div { background:#0e1e38; border-radius:6px; padding:2px 4px; text-align:center; font-size:11px; color:#a8bfe0; }
  .spec div b { display:block; color:#fff; font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td { padding:4px 3px; border-bottom:1px solid #1a3458; }
  td:last-child { text-align:right; font-weight:800; }
  .pill { display:inline-block; padding:1px 7px; border-radius:999px; font-size:11px; font-weight:800; background:#1f3d66; }
  input[type=range] { width:100%; accent-color:#4a8bff; }
  .slider { display:flex; align-items:center; gap:8px; font-size:13px; }
  .goal { display:flex; gap:10px; align-items:center; }
  .goal .p { flex:1; }
  .bar { height:10px; background:#0a1628; border-radius:6px; overflow:hidden; margin-top:4px; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#4a8bff,#5fe08a); }
  .ov { position:absolute; inset:0; z-index:20; background:radial-gradient(circle at 50% 0%, #1a3a6a, #07101e 70%); display:flex; flex-direction:column; align-items:center; padding:calc(env(safe-area-inset-top) + 18px) 16px 20px; overflow-y:auto; gap:12px; touch-action:pan-y; }
  .ov .title { font-size:40px; font-weight:900; text-align:center; line-height:1.1; background:linear-gradient(180deg,#fff,#8fc0ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .ov .title small { display:block; font-size:14px; letter-spacing:6px; color:#7f9cc8; -webkit-text-fill-color:#7f9cc8; margin-top:6px; }
  .choice { width:100%; max-width:420px; display:grid; gap:8px; }
  .era { display:flex; align-items:center; gap:10px; background:#132848; border:2px solid #1f3d66; border-radius:16px; padding:10px; text-align:left; color:#fff; font-family:inherit; }
  .era.on { border-color:#4a8bff; background:#18325a; }
  .era b { font-size:17px; } .era small { display:block; color:#a8bfe0; font-size:12px; margin-top:2px; }
  .era svg { width:80px; height:34px; flex:none; }
  .hubs { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .hub { background:#132848; border:2px solid #1f3d66; border-radius:12px; padding:7px 4px; color:#fff; font-family:inherit; font-size:13px; font-weight:800; }
  .hub small { display:block; font-size:10px; color:#7f9cc8; }
  .hub.on { border-color:#4a8bff; background:#18325a; }
  .colors { display:flex; gap:8px; justify-content:center; }
  .colors button { width:34px; height:34px; border-radius:50%; border:3px solid transparent; padding:0; }
  .colors button.on { border-color:#fff; }
  input.txt { width:100%; background:#0e1e38; border:2px solid #1f3d66; border-radius:12px; color:#fff; font-size:18px; padding:9px 12px; font-family:inherit; text-align:center; }
  .modal { position:absolute; inset:0; z-index:15; background:rgba(3,8,18,.7); display:flex; align-items:flex-end; }
  .modal .box { width:100%; max-height:84%; overflow-y:auto; background:#0e1e38; border-top:2px solid #2a4a78; border-radius:20px 20px 0 0; padding:14px 12px calc(env(safe-area-inset-bottom) + 14px); touch-action:pan-y; animation:up .25s; }
  @keyframes up { from { transform:translateY(40px); opacity:0; } }
  .close { float:right; width:34px; height:34px; border-radius:50%; border:0; background:#1f3d66; color:#fff; font-size:16px; }
  .dest { display:flex; align-items:center; gap:8px; padding:8px 4px; border-bottom:1px solid #1f3d66; }
  .dest .c { font-weight:900; width:44px; }
  .dest .d { flex:1; font-size:12px; color:#a8bfe0; }
  .chart { width:100%; height:90px; display:block; }
  .rank { display:flex; align-items:center; gap:8px; padding:7px 4px; border-bottom:1px solid #1f3d66; }
  .rank .sw { width:12px; height:28px; border-radius:4px; }
  .rank .n { flex:1; font-weight:800; }
  .rank .n small { display:block; color:#7f9cc8; font-weight:600; font-size:11px; }
  .credit { font-size:10px; color:#4f6a90; text-align:center; }
</style>
</head>

<div id="app">
  <div id="top">
    <div class="r1"><div id="logoMini"></div><div id="coName"></div><div id="date"></div></div>
    <div class="r2"><div class="stat"><img src="assets/fe/air_cash.png"><b id="sCash"></b></div><div class="stat"><img src="assets/fe/air_up.png"><b id="sProfit"></b><span class="muted">/週</span></div>

    </div>
  </div>
  <div id="modal" class="modal hide"><div class="box" id="mbox"></div></div>
  <div class="ov" id="start"></div>
</div>

  $('bClose').onclick = () => { closeRoute(m, r, false); toast('air_warn', `已關閉 ${r.a}⇄${r.b}，飛機變成閒置`); closeModal(); };
}
function openShop(routeId) {
  const m = me(), y = yearOf(S.t), r = routeId ? m.routes.find(x => x.id === routeId) : null, d = r ? dist(APM[r.a], APM[r.b]) : 0;
  const types = avail(y).filter(p => p.range >= d);
  modal(`<h3><img src="${IMG('air_plane')}">飛機商店 <small>現金 ${fmtM(m.cash)}</small></h3>${r ? `<div class="muted">加到 ${r.a}⇄${r.b}</div>` : ''}
    <div class="card" style="padding:2px 8px">${types.map(pl => `<div class="plane" style="flex-wrap:wrap">${planeSVG(pl.id, m.color)}<div class="info"><b>${pl.n}</b><br>${fmtM(pl.price * 1e6)}・租金 ${fmtM(pl.price * 1e6 * 0.0048)}/週</div><div style="display:flex;flex-direction:column;gap:4px"><button class="b sm y" data-buy="${pl.id}" ${m.cash < pl.price * 1e6 ? 'disabled' : ''}>買</button><button class="b sm" data-lease="${pl.id}">租</button></div>
      <div class="spec" style="width:100%"><div>座位<b>${pl.seats}</b></div><div>航程<b>${pl.range.toLocaleString()}km</b></div><div>時速<b>${pl.spd}</b></div><div>油耗<b>${(pl.burn / pl.seats * 100).toFixed(1)}</b></div></div></div>`).join('')}</div><div class="muted">油耗＝每百座公里的公升數，越低越省油。</div>`);
  const done = p => { if (r) { p.route = r.id; r.planes.push(p.id); closeModal(); openRoute(r.id); } else { toast('air_plane', `新飛機 ${PM[p.type].n} 加入機隊！`); openShop(null); } };
  document.querySelectorAll('[data-buy]').forEach(x => x.onclick = () => done(addPlane(m, x.dataset.buy, false)));
  document.querySelectorAll('[data-lease]').forEach(x => x.onclick = () => done(addPlane(m, x.dataset.lease, true)));
}
function openPlane(pid) {
  const m = me(), p = m.fleet.find(f => f.id === pid), pl = PM[p.type], val = PM[p.type].price * 1e6 * Math.max(0.12, 1 - p.age * 0.05) * 0.9;
  const routes = m.routes.filter(r => dist(APM[r.a], APM[r.b]) <= pl.range);
  modal(`<h3>${pl.n}</h3>${planeSVG(p.type, m.color).replace('<svg', '<svg style="width:100%;height:110px"')}
    <div class="spec"><div>座位<b>${pl.seats}</b></div><div>航程<b>${pl.range.toLocaleString()}</b></div><div>時速<b>${pl.spd}</b></div><div>機齡<b>${p.age.toFixed(1)}年</b></div></div>
    <div style="margin:10px 0 4px;font-weight:800">派到航線</div><div class="card" style="padding:2px 8px">${routes.map(r => `<div class="route"><div class="nm">${r.a}⇄${r.b}</div><div style="flex:1" class="muted">載客率 ${Math.round((r.lf || 0) * 100)}%</div>${p.route === r.id ? '<span class="pill">目前</span>' : `<button class="b sm" data-to="${r.id}">派過去</button>`}</div>`).join('') || '<div class="muted" style="padding:8px">沒有飛得到的航線</div>'}</div>
    <button class="b r" style="width:100%;margin-top:6px" id="bSell">${p.leased ? '退租' : `賣掉（約 ${fmtM(val)}）`}</button>`);
  document.querySelectorAll('[data-to]').forEach(x => x.onclick = () => { if (p.route) { const o = m.routes.find(r => r.id === p.route); o.planes = o.planes.filter(q => q !== p.id); if (!o.planes.length) m.routes = m.routes.filter(q => q !== o); } const r = m.routes.find(z => z.id === +x.dataset.to); p.route = r.id; r.planes.push(p.id); closeModal(); });
  $('bSell').onclick = () => { if (p.route) { const o = m.routes.find(r => r.id === p.route); o.planes = o.planes.filter(q => q !== p.id); if (!o.planes.length) m.routes = m.routes.filter(q => q !== o); } if (!p.leased) m.cash += val; m.fleet = m.fleet.filter(f => f !== p); closeModal(); };
}
function openStock(a) {
  const m = me(), own = m.holds[a.id] || 0, pct = own / a.shares, lot = 500000;
  modal(`<h3><span class="sw" style="display:inline-block;width:14px;height:24px;border-radius:4px;background:${a.color}"></span>${a.name}</h3>
    <div class="muted">基地 ${APM[a.home].n}・${a.routes.length} 條航線・${a.fleet.length} 架飛機・現金 ${fmtM(a.cash)}</div>
    <div class="card" style="margin-top:8px"><div class="row"><div style="flex:1"><div class="muted">股價</div><b style="font-size:22px">${(a.price * cpi()).toFixed(2)}</b></div><div style="flex:1"><div class="muted">市值</div><b>${fmtM(a.price * a.shares)}</b></div><div style="flex:1;text-align:right"><div class="muted">你持股</div><b>${(pct * 100).toFixed(1)}%</b></div></div><canvas class="chart" id="chS"></canvas></div>
    <div class="row" style="gap:6px"><button class="b" style="flex:1" id="bB">買 5%（${fmtM(a.price * lot * 1.02)}）</button><button class="b g" style="flex:1" id="bS" ${own < lot ? 'disabled' : ''}>賣 5%</button></div>
    ${pct >= 0.5 ? `<button class="b y" style="width:100%;margin-top:8px" id="bTake">🤝 收購 ${a.name}！</button>` : `<div class="muted" style="margin-top:8px">持股達 50% 可以收購。${pct >= 0.25 ? '你已經能分到股利。' : ''}</div>`}`);
  chart($('chS'), a.priceHist, false, a.color);
  $('bB').onclick = () => { const c = a.price * lot * 1.02; if (m.cash < c) return toast('air_warn', '現金不夠'); if (own + lot > a.shares) return; m.cash -= c; m.holds[a.id] = own + lot; a.price *= 1.03; openStock(a); renderTop(); };
  $('bS').onclick = () => { m.cash += a.price * lot * 0.98; m.holds[a.id] = own - lot; a.price *= 0.97; openStock(a); renderTop(); };
  if ($('bTake')) $('bTake').onclick = () => {
    a.alive = false; for (const p of a.fleet) m.fleet.push(p); for (const r of a.routes) { const dup = m.routes.find(x => [x.a, x.b].sort().join() === [r.a, r.b].sort().join()); if (dup) { dup.planes.push(...r.planes); } else m.routes.push(r); }
    m.cash += a.cash - a.debt; m.debt += 0; delete m.holds[a.id]; a.routes = []; a.fleet = [];
    news('air_hand', `你收購了 ${a.name}！`, `接收 ${a.fleet.length} 架飛機和它所有的航線。`); closeModal();
  };
}

// ===================== 存檔與開始 =====================
function save() { try { localStorage.setItem('skyRoutes', JSON.stringify(S)); } catch (e) {} }
function load() { try { return JSON.parse(localStorage.getItem('skyRoutes')); } catch (e) { return null; } }
const ERAS = [
  { y: 1950, n: '螺旋槳時代', d: '從兩架小螺旋槳飛機開始，見證噴射機誕生', pl: 'P70' },
  { y: 1970, n: '噴射機黃金年代', d: '巨無霸客機登場，但石油危機就在眼前', pl: 'J747' },
  { y: 1995, n: '全球化時代', d: '廉航崛起、亞洲起飛，還有 911 和 SARS', pl: 'J777' },
  { y: 2015, n: '現代航空', d: '省油新機型，但疫情即將來襲……', pl: 'J787' },
];
const COLORS = ['#3a7bff', '#e8402a', '#2fae5a', '#ff9a2e', '#a05aff', '#19c0e0', '#ff5ca8', '#ffcf3a'];
let pickE = 0, pickH = 'TSA', pickC = 0;
function showStart() {
  const sv = load();
  $('start').classList.remove('hide');
  const homes = ['TSA', 'TPE', 'HKG', 'HND', 'SIN', 'BKK', 'ICN', 'PVG', 'DXB', 'LHR', 'CDG', 'FRA', 'JFK', 'LAX', 'SYD', 'GRU'];
  const draw = () => {
    const y = ERAS[pickE].y; if (apSize(APM[pickH], y) <= 0) pickH = pickH === 'TPE' ? 'TSA' : pickH === 'ICN' ? 'GMP' : pickH === 'PVG' ? 'SHA' : 'HKG';
    $('start').innerHTML = `<img src="${IMG('air_plane')}" style="width:84px;margin-top:4px"><div class="title">天空航線<small>SKY ROUTES</small></div>
      ${sv ? `<button class="b y" style="width:100%;max-width:420px" id="bCont">▶ 繼續經營 ${sv.airlines[0].name}（${new Date(sv.t).getFullYear()} 年）</button>` : ''}
      <div style="font-weight:800;align-self:center">選擇年代</div><div class="choice">${ERAS.map((e, i) => `<button class="era ${i === pickE ? 'on' : ''}" data-e="${i}">${planeSVG(e.pl, COLORS[pickC])}<div><b>${e.y}　${e.n}</b><small>${e.d}</small></div></button>`).join('')}</div>
      <div style="font-weight:800">選擇基地</div><div class="hubs choice" style="grid-template-columns:repeat(4,1fr)">${homes.filter(c => APM[c] && apSize(APM[c], y) > 0).concat(apSize(APM.GMP, y) > 0 && apSize(APM.ICN, y) <= 0 ? ['GMP'] : []).filter((c, i, a) => a.indexOf(c) === i).map(c => `<button class="hub ${c === pickH ? 'on' : ''}" data-h="${c}">${c}<small>${APM[c].n}</small></button>`).join('')}</div>
      <div style="font-weight:800">公司名稱與代表色</div><input class="txt" id="iName" maxlength="8" value="${$('iName') ? $('iName').value : '星宇航空'}" style="max-width:420px"><div class="colors">${COLORS.map((c, i) => `<button style="background:${c}" class="${i === pickC ? 'on' : ''}" data-c="${i}"></button>`).join('')}</div>
      <button class="b" style="width:100%;max-width:420px;font-size:20px;padding:14px" id="bGo">🛫 創立航空公司</button>
      <div class="card" style="max-width:420px;font-size:13px;line-height:1.7"><b>怎麼玩</b><br>① 點地圖上的機場開航線，選飛機（買或租）<br>② 調整票價，看載客率：綠色賺錢、紅色要注意<br>③ 對手會跟你搶航線，油價和歷史事件也會影響生意<br>④ 在股市買對手股票，持股過半就能收購<br>⑤ 每十年有董事會目標，達成拿獎金和獎牌</div>
      <div class="credit">機型名稱為虛構，規格參考真實客機・圖示：Microsoft Fluent Emoji（MIT）・地圖：Natural Earth</div>`;
    document.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { pickE = +b.dataset.e; draw(); });
    document.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { pickH = b.dataset.h; draw(); });
    document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { pickC = +b.dataset.c; draw(); });
    $('bGo').onclick = () => { newWorld(ERAS[pickE].y, pickH, ($('iName').value.trim() || '星宇航空').slice(0, 8), COLORS[pickC]); begin(); };
    if ($('bCont')) $('bCont').onclick = () => { S = sv; begin(); };
  };
  draw();
}
function begin() { $('start').classList.add('hide'); resize(); const h = APM[me().home]; cam = { lon: h.lon, lat: h.lat, z: 2.6 }; S.speed = 0; renderTop(); renderTab(); if (!me().routes.length) toast('air_hand', '歡迎！點地圖上的機場（或「＋開新航線」）開第一條航線。時間在暫停中，按 ▶ 開始。'); }
document.addEventListener('visibilitychange', () => { if (document.hidden && S) { save(); } });
resize(); showStart(); requestAnimationFrame(t => { lastTick = t; loop(t); });
</script>
