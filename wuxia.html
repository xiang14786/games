<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14120f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="遊戲盒">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>江湖一世</title>
<style>
  :root { --bg:#14120f; --card:#1f1b16; --card2:#2a241c; --ink:#ece3d2; --muted:#a39885; --gold:#d9b25f; --red:#d0584b; --blue:#6aa6d8; --green:#7fbf7a; --purple:#a77fd6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Serif TC","Songti TC",-apple-system,"PingFang TC",serif; font-size:17px; user-select:none; -webkit-user-select:none; overscroll-behavior:none; }
  .wrap { max-width:520px; margin:0 auto; padding:calc(10px + env(safe-area-inset-top)) 12px calc(30px + env(safe-area-inset-bottom)); }
  .hide { display:none !important; }
  h1 { font-size:46px; text-align:center; margin:8px 0 2px; color:var(--gold); letter-spacing:8px; }
  h2 { color:var(--gold); margin:4px 0 10px; font-size:24px; }
  button { font-family:inherit; background:var(--gold); color:#20180a; border:0; border-radius:12px; padding:13px 16px; font-size:18px; font-weight:700; cursor:pointer; }
  button.ghost { background:var(--card2); color:var(--ink); border:1px solid #3d3428; }
  button:disabled { opacity:.35; }
  .col { display:flex; flex-direction:column; gap:10px; }
  .card { background:var(--card); border:1px solid #2f281f; border-radius:14px; padding:12px; margin-bottom:10px; }
  .muted { color:var(--muted); } .good { color:var(--green); } .bad { color:var(--red); } .gold { color:var(--gold); }
  .top { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
  .bars { flex:1; }
  .bar { height:12px; background:#0e0c0a; border-radius:7px; overflow:hidden; margin:3px 0; position:relative; }
  .bar i { display:block; height:100%; border-radius:7px; transition:width .35s; }
  .bar span { position:absolute; right:6px; top:-2px; font-size:12px; color:#fff; text-shadow:0 1px 2px #000; font-family:sans-serif; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; font-size:14px; }
  .chip { background:var(--card2); border-radius:8px; padding:4px 8px; }
  .goal { background:linear-gradient(90deg,#3a2c14,#1f1b16); border:1px solid #5a4422; border-radius:12px; padding:10px 12px; margin-bottom:10px; font-size:16px; }
  .goal b { color:var(--gold); }
  /* 地圖 */
  .path { display:flex; flex-direction:column; gap:8px; }
  .step { display:flex; align-items:center; gap:10px; }
  .step .no { width:28px; text-align:center; color:var(--muted); font-size:14px; }
  .step .opts { flex:1; display:flex; gap:8px; }
  .node { flex:1; background:var(--card2); border:2px solid #3d3428; border-radius:12px; padding:10px 6px; text-align:center; font-size:15px; color:var(--ink); }
  .node .ic { font-size:26px; display:block; }
  .node.done { opacity:.35; }
  .node.taken { border-color:var(--gold); opacity:.55; }
  .node.now { border-color:var(--gold); background:#3a2c14; animation:glow 1.4s infinite; }
  @keyframes glow { 50% { box-shadow:0 0 14px #d9b25f88; } }
  /* 戰鬥 */
  #battle { position:fixed; inset:0; background:var(--bg); z-index:8; overflow-y:auto; }
  #battle .inner { max-width:520px; margin:0 auto; padding:calc(8px + env(safe-area-inset-top)) 10px calc(20px + env(safe-area-inset-bottom)); }
  .stage { position:relative; height:250px; border-radius:14px; overflow:hidden; }
  .stage .bg { position:absolute; inset:0; }
  .stage .bg svg { margin:0 !important; height:100%; width:100%; border-radius:0 !important; }
  .stage .shade { position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55)); }
  .fighter { position:absolute; bottom:12px; width:120px; height:160px; transition:transform .15s; }
  .fighter svg { width:100%; height:100%; overflow:visible; }
  #pF { left:30px; } #eF { right:30px; }
  .hpbox { position:absolute; top:8px; width:46%; font-size:14px; }
  .hpbox .nm { font-weight:800; text-shadow:0 1px 3px #000; }
  #pHP { left:8px; } #eHP { right:8px; text-align:right; }
  .intent { position:absolute; right:12px; top:62px; background:rgba(20,16,12,.88); border:2px solid #5a4422; border-radius:10px; padding:5px 9px; font-size:15px; font-weight:800; max-width:62%; text-align:right; }
  .intent.danger { border-color:var(--red); color:#ffb0a6; animation:pulse .8s infinite; }
  @keyframes pulse { 50% { transform:scale(1.05); } }
  .status { font-size:13px; margin-top:2px; }
  .float { position:absolute; font-weight:900; font-size:30px; pointer-events:none; text-shadow:0 2px 4px #000; animation:fl 1s forwards; font-family:sans-serif; }
  @keyframes fl { 0% { opacity:0; transform:translateY(10px) scale(.6); } 15% { opacity:1; transform:translateY(0) scale(1.2); } 100% { opacity:0; transform:translateY(-50px) scale(1); } }
  .lungeR { animation:lr .35s; } .lungeL { animation:ll .35s; }
  @keyframes lr { 50% { transform:translateX(150px); } } @keyframes ll { 50% { transform:translateX(-150px); } }
  .hurt { animation:hurt .4s; } @keyframes hurt { 20%,60% { transform:translateX(-8px); filter:brightness(2) saturate(0); } 40%,80% { transform:translateX(8px); } }
  .guarding svg { filter:drop-shadow(0 0 10px #6aa6d8); }
  .charging svg { filter:drop-shadow(0 0 14px #ff5040); animation:pulse .6s infinite; }
  .slash { position:absolute; pointer-events:none; animation:sl .4s forwards; }
  @keyframes sl { 0% { opacity:0; transform:scale(.4) rotate(-20deg); } 30% { opacity:1; } 100% { opacity:0; transform:scale(1.3) rotate(10deg); } }
  .blog { min-height:46px; font-size:16px; line-height:1.5; margin:8px 2px; }
  .mp { display:flex; align-items:center; gap:8px; }
  .moves { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:8px; }
  .mv { padding:9px 5px; font-size:15px; line-height:1.25; text-align:center; background:var(--card2); color:var(--ink); border:1px solid #4a3e2c; }
  .mv b { display:block; font-size:16px; }
  .mv small { display:block; font-size:12px; color:var(--muted); font-weight:400; }
  .mv .c { color:var(--blue); font-size:12px; font-weight:700; }
  .mv.ult { border-color:var(--gold); }
  .tip { background:#2a2214; border:1px dashed #6a5530; border-radius:10px; padding:8px 10px; font-size:15px; margin-top:8px; color:#e8d6ac; }
  /* 場景 */
  .scene { position:fixed; inset:0; background:rgba(10,8,6,.96); z-index:10; overflow-y:auto; }
  .scene .inner { max-width:520px; margin:0 auto; padding:calc(16px + env(safe-area-inset-top)) 14px 40px; }
  .story { font-size:18px; line-height:1.8; white-space:pre-wrap; margin-bottom:14px; }
  .choice { text-align:left; background:var(--card2); color:var(--ink); border:1px solid #4a3e2c; font-weight:700; }
  .choice small { display:block; color:var(--muted); font-weight:400; font-size:14px; margin-top:3px; }
  .reward { text-align:left; background:var(--card2); color:var(--ink); border:2px solid #4a3e2c; }
  .reward .t { font-size:13px; color:var(--muted); }
  .reward b { font-size:19px; color:var(--gold); }
  .reward small { display:block; font-weight:400; color:#cfc4ad; font-size:15px; margin-top:2px; }
  .lvup { text-align:center; font-size:30px; color:var(--gold); font-weight:900; animation:pulse 1s infinite; margin:6px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div id="sTitle">
    <div id="tArt" style="margin-top:6px"></div>
    <h1>江湖一世</h1>
    <div style="text-align:center;color:var(--muted);margin-bottom:18px">從青石鎮的無名小子，打到華山之巔</div>
    <div class="col">
      <button id="bNew">出山</button>
      <button class="ghost hide" id="bCont">繼續闖蕩</button>
      <button class="ghost" id="bLegacy">轉世傳承</button>
    </div>
    <div class="card" style="margin-top:16px;line-height:1.8;font-size:16px">
      <b class="gold">怎麼玩</b><br>
      ① 在地圖上選路：⚔ 戰鬥、💀 強敵、❓ 奇遇、💰 商店、🍵 客棧。<br>
      ② 每章盡頭有一個<b>頭目</b>，打倒他進入下一章，五章打完就是天下第一。<br>
      ③ 戰鬥時<b>看對手頭上的意圖</b>：他要「蓄力」，就用<b>格擋</b>擋下，或用<b>點穴手</b>打斷。<br>
      ④ 打贏可以三選一：學新招式、加能力或拿兵器。倒下了也會留下名望，讓下一世更強。
    </div>
  </div>

  <div id="sMap" class="hide">
    <div class="top">
      <div id="mAv"></div>
      <div class="bars">
        <div style="display:flex;justify-content:space-between"><b id="mName"></b><span class="muted" id="mLv"></span></div>
        <div class="bar"><i id="mHp" style="background:#c0503f"></i><span id="mHpT"></span></div>
        <div class="bar"><i id="mExp" style="background:#d9b25f"></i><span id="mExpT"></span></div>
      </div>
    </div>
    <div class="chips" id="mChips" style="margin-bottom:8px"></div>
    <div id="mArt"></div>
    <div class="goal" id="mGoal"></div>
    <div class="path" id="mPath"></div>
    <div class="card" style="margin-top:12px"><b>招式</b><div id="mMoves" class="muted" style="font-size:15px;line-height:1.7;margin-top:4px"></div></div>
  </div>
</div>

<div id="battle" class="hide"><div class="inner">
  <div class="stage" id="stage">
    <div class="bg" id="stBg"></div><div class="shade"></div>
    <div class="hpbox" id="pHP"><div class="nm" id="pName"></div><div class="bar"><i id="pHpBar" style="background:#c0503f"></i><span id="pHpT"></span></div><div class="status" id="pSt"></div></div>
    <div class="hpbox" id="eHP"><div class="nm" id="eName"></div><div class="bar"><i id="eHpBar" style="background:#8a3a8a"></i><span id="eHpT"></span></div><div class="status" id="eSt"></div></div>
    <div class="intent" id="intent"></div>
    <div class="fighter" id="pF"></div>
    <div class="fighter" id="eF"></div>
  </div>
  <div class="blog" id="blog"></div>
  <div class="mp"><span class="muted" style="width:36px">內力</span><div class="bar" style="flex:1;height:14px"><i id="mpBar" style="background:#4f7fc0"></i><span id="mpT"></span></div><button class="ghost" id="bPot" style="padding:7px 10px;font-size:15px">💊 金創藥</button></div>
  <div class="moves" id="moves"></div>
  <div class="tip hide" id="tip"></div>
</div></div>

<div class="scene hide" id="scene"><div class="inner" id="sceneIn"></div></div>

<script>
const G = null; // 給插圖函式用
// ================= 水墨插圖 =================
function wsr(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }
let ART = 'gate';
const TITLE_ART = { '出山':'gate','閉關':'cave','武林榜':'arena','鏢局':'road','歸隱':'moon','宿敵':'inn','路見不平':'village','山洞殘卷':'cave','老乞丐':'temple','酒館切磋':'inn','名醫':'village',
  '師門差遣':'gate','師門傳功':'gate','邪派招攬':'night','懸崖靈芝':'cliff','書生求助':'road','賭坊':'inn','隱世高人':'hut','滅門血案':'night','擂台':'arena','魔功反噬':'cave',
  '觀瀑悟劍':'waterfall','蒙冤':'inn','少年拜師':'hut','故人重逢':'river','武林大會':'arena','正邪大戰':'war','新的一生':'gate' };
function wfig(x, y, s, robe, pose = 'stand', flip = 1) {
  // 簡筆人物剪影：斗笠或髮髻、長袍、劍
  const k = `transform="translate(${x},${y}) scale(${s * flip},${s})"`;
  if (pose === 'sit') return `<g ${k}><ellipse cx="0" cy="-2" rx="16" ry="5" fill="${robe}" opacity=".9"/><path d="M-12 -2 Q-10 -26 0 -28 Q10 -26 12 -2Z" fill="${robe}"/><circle cx="0" cy="-34" r="6" fill="#1a1612"/><circle cx="0" cy="-41" r="3" fill="#1a1612"/></g>`;
  if (pose === 'duel') return `<g ${k}><path d="M-8 0 L-4 -30 L6 -30 L10 0Z" fill="${robe}"/><path d="M-4 -26 Q-16 -14 -22 -6" stroke="${robe}" stroke-width="4" fill="none"/><line x1="4" y1="-24" x2="30" y2="-38" stroke="#d8d8d0" stroke-width="2"/><path d="M4 -26 L4 -26 L20 -30" stroke="${robe}" stroke-width="4"/><circle cx="1" cy="-36" r="6" fill="#1a1612"/><path d="M-12 -40 Q1 -48 14 -40Z" fill="#3a3226"/></g>`;
  return `<g ${k}><path d="M-9 0 L-5 -30 L5 -30 L9 0Z" fill="${robe}"/><path d="M-5 -28 L-12 -10 M5 -28 L12 -12" stroke="${robe}" stroke-width="4"/><line x1="8" y1="-28" x2="12" y2="2" stroke="#9a9a90" stroke-width="2"/><circle cx="0" cy="-36" r="6" fill="#1a1612"/><path d="M-13 -39 Q0 -48 13 -39Z" fill="#3a3226"/></g>`;
}
function mountains(R, base, layers, cols) {
  let g = '';
  for (let l = 0; l < layers; l++) {
    const y0 = base + l * 16; let pts = `0,170 0,${y0}`;
    for (let x = 0; x <= 400; x += 25) pts += ` ${x},${y0 - R() * (60 - l * 12) - 10}`;
    pts += ` 400,${y0} 400,170`;
    g += `<polygon points="${pts}" fill="${cols[l]}" opacity="${0.9 - l * 0.05}"/>`;
  }
  return g;
}
function wxArt(kind, seed = 3, tint = '#d9b25f') {
  const R = wsr(seed * 31 + kind.length * 7);
  const autumn = G && G.age % 1 ? true : false;
  const sky = { night:['#0b0d14','#1e2133'], war:['#2a0e0b','#6b2416'], moon:['#0d1020','#2b2f4a'], cave:['#0e0c0a','#1b1713'] }[kind] || (autumn ? ['#2a1d14','#7a5434'] : ['#1a2026','#4f5d5a']);
  let g = `<defs><linearGradient id="sk${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient>
    <radialGradient id="gl${seed}"><stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient></defs>
    <rect width="400" height="170" fill="url(#sk${seed})"/>`;
  const ink = ['#3a3f3c','#2b2f2d','#1f2221','#141614'];
  const sun = (x, y, r, c) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" opacity=".85"/>`;
  const pine = (x, y, s) => `<g transform="translate(${x},${y}) scale(${s})"><line x1="0" y1="0" x2="0" y2="-40" stroke="#1a1612" stroke-width="3"/>${[0,1,2,3].map(i => `<ellipse cx="${(i % 2 ? 8 : -8)}" cy="${-14 - i * 8}" rx="${14 - i * 2}" ry="4" fill="#1d2a22"/>`).join('')}</g>`;
  const roof = (x, y, w, c = '#1a1612') => `<path d="M${x - 6} ${y} Q${x + w / 2} ${y - 16} ${x + w + 6} ${y} Z" fill="${c}"/>`;
  const house = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#2b2620"/>${roof(x, y, w)}<rect x="${x + w / 2 - 5}" y="${y + h - 16}" width="10" height="16" fill="#140f0b"/>`;
  const lantern = (x, y) => `<circle cx="${x}" cy="${y}" r="10" fill="url(#gl${seed})"/><ellipse cx="${x}" cy="${y}" rx="4" ry="5" fill="#c73a2c"/>`;
  if (['gate','bamboo','waterfall','cliff','hut','road','river','village','temple','arena','meditate'].includes(kind)) g += sun(320, 40, 18, autumn ? '#e8a35a' : '#e9e2c8') + mountains(R, 95, 3, ink);
  if (kind === 'gate') {
    g += `<polygon points="160,170 240,170 214,110 186,110" fill="#57534a"/>`; for (let i = 0; i < 8; i++) g += `<line x1="${186 - i * 3}" y1="${112 + i * 7.5}" x2="${214 + i * 3}" y2="${112 + i * 7.5}" stroke="#3a372f" stroke-width="2"/>`;
    g += `<rect x="168" y="70" width="6" height="42" fill="#2a221a"/><rect x="226" y="70" width="6" height="42" fill="#2a221a"/><path d="M156 72 Q200 56 244 72 L240 66 Q200 52 160 66Z" fill="#1a1612"/><rect x="186" y="74" width="28" height="12" fill="${tint}"/>`;
    g += pine(60, 150, 1.2) + pine(350, 160, 1) + wfig(200, 160, 0.8, '#6a5a44');
  } else if (kind === 'bamboo') {
    for (let i = 0; i < 18; i++) { const x = R() * 400, w = 3 + R() * 3; g += `<rect x="${x}" y="0" width="${w}" height="170" fill="#2c3b2a" opacity="${0.5 + R() * 0.5}"/>`; for (let j = 0; j < 4; j++) g += `<path d="M${x} ${30 + j * 35} q14 -6 22 2 q-12 2 -22 -2" fill="#3f5a38"/>`; }
    g += wfig(200, 162, 1.1, '#5a4a3a', 'duel');
  } else if (kind === 'waterfall') {
    g += `<polygon points="150,0 250,0 260,170 140,170" fill="#232825"/>`; for (let i = 0; i < 14; i++) g += `<rect x="${170 + i * 4.5}" y="0" width="2.5" height="150" fill="#dfe8e4" opacity="${0.3 + R() * 0.5}"/>`;
    g += `<ellipse cx="200" cy="150" rx="80" ry="14" fill="#e9efe9" opacity=".35"/>` + wfig(110, 160, 0.9, '#4a4036', 'sit');
  } else if (kind === 'cave' ) {
    g += `<path d="M60 170 Q60 30 200 26 Q340 30 340 170Z" fill="#050403"/><circle cx="250" cy="120" r="50" fill="url(#gl${seed})"/><rect x="246" y="116" width="6" height="18" fill="#e8dcc0"/>` + wfig(190, 150, 1.1, '#4a3a2a', 'sit');
    for (let i = 0; i < 6; i++) g += `<path d="M${80 + R() * 240} ${30 + R() * 20} l4 ${10 + R() * 14} l4 -${10 + R() * 14}Z" fill="#1a1612"/>`;
  } else if (kind === 'inn' || kind === 'night') {
    if (kind === 'night') g += sun(80, 36, 16, '#e9e2c8');
    g += house(40, 90, 120, 60) + house(220, 80, 140, 70) + `<rect x="0" y="150" width="400" height="20" fill="#120f0c"/>`;
    g += lantern(70, 104) + lantern(130, 104) + lantern(250, 96) + lantern(330, 96);
    if (kind === 'inn') g += `<rect x="176" y="70" width="22" height="46" fill="#7a2a1f"/><text x="187" y="98" font-size="16" fill="#f0d9a0" text-anchor="middle" font-weight="900">酒</text>` + wfig(195, 160, 0.9, '#4a3a2a') + wfig(230, 160, 0.9, '#3a3a50', 'stand', -1);
    else g += wfig(200, 150, 0.9, '#121212', 'duel') + wfig(300, 140, 0.8, '#121212', 'duel', -1);
  } else if (kind === 'village') {
    g += house(30, 110, 70, 40) + house(130, 104, 90, 46) + house(260, 112, 80, 38) + pine(360, 160, 0.9) + wfig(200, 165, 0.9, '#5a4a3a') + wfig(240, 165, 0.8, '#6a2a22', 'stand', -1);
  } else if (kind === 'temple') {
    g += `<rect x="130" y="96" width="140" height="60" fill="#2b2620"/>${roof(130, 96, 140)}<rect x="185" y="116" width="30" height="40" fill="#0e0b08"/>` + pine(80, 160, 1) + wfig(240, 162, 0.7, '#5c5246', 'sit');
  } else if (kind === 'cliff') {
    g += `<polygon points="0,170 0,60 120,70 170,170" fill="#1a1d1b"/><circle cx="118" cy="70" r="7" fill="#b23b2a"/><rect x="116" y="70" width="4" height="8" fill="#e8dcc0"/>` + wfig(150, 150, 0.9, '#4a3a2a');
  } else if (kind === 'hut') {
    g += `<rect x="180" y="110" width="90" height="46" fill="#3a3024"/><path d="M168 112 L225 78 L282 112Z" fill="#6b5a3a"/>` + pine(110, 160, 1.3) + pine(330, 162, 1) + wfig(150, 162, 0.9, '#cfc6b0');
  } else if (kind === 'road') {
    g += `<path d="M150 170 Q220 120 230 95 L250 95 Q250 130 260 170Z" fill="#4d4433"/><rect x="200" y="122" width="40" height="22" fill="#5a3d24"/><circle cx="208" cy="146" r="7" fill="#2a1d12"/><circle cx="234" cy="146" r="7" fill="#2a1d12"/>
      <line x1="236" y1="122" x2="236" y2="92" stroke="#2a1d12" stroke-width="2"/><rect x="236" y="92" width="20" height="14" fill="#b23b2a"/><text x="246" y="103" font-size="10" fill="#f0d9a0" text-anchor="middle" font-weight="900">鏢</text>` + wfig(170, 160, 0.9, '#4a3a2a');
  } else if (kind === 'river') {

  pickIntent();

  if (S.firstFight) tip('先看右邊對手頭上的意圖！他要「蓄力」時，用格擋擋下或點穴打斷。內力不夠時記得調息。');
  else $('tip').classList.add('hide');

function tip(t) { $('tip').textContent = '💡 ' + t; $('tip').classList.remove('hide'); }
function say(t) { $('blog').innerHTML = t; }
function pickIntent() {
  const e = B.e;
  if (B.eStun) { e.intent = { t:'stunned' }; return; }
  if (e.charging) { e.intent = { t:'heavy', v: Math.round(e.atk * 2.6) }; return; }
  const w = { atk: 6, guard: 1, charge: 1.2 };
  if (e.traits.includes('charge')) w.charge += 2;
  if (e.traits.includes('guard')) w.guard += 2.5;
  if (e.traits.includes('poison')) w.poison = 3;
  if (e.traits.includes('drain')) w.drain = 2.5;
  if (e.kind === 'boss' && e.hp < e.max * 0.5 && !e.healed) w.heal = 1.5;
  if (B.phase2) { w.charge += 2; }
  let tot = 0; for (const k in w) tot += w[k];
  let r = Math.random() * tot, t = 'atk'; for (const k in w) { r -= w[k]; if (r <= 0) { t = k; break; } }
  const a = e.atk * (B.phase2 ? 1.25 : 1);
  e.intent = { t, v: Math.round(t === 'poison' ? a * 0.7 : t === 'drain' ? a * 1.1 : a) };
}
function intentText() {
  const i = B.e.intent;

}
function renderBattle() {
  const e = B.e;
  $('pHpBar').style.width = (S.hp / S.hpMax * 100) + '%'; $('pHpT').textContent = `${S.hp}/${S.hpMax}`;

}
function shop() {
  const items = [
    { n:'金創藥', d:'戰鬥中回復 40% 生命', p:30, f:() => S.pots++ },
    { n:'秘笈', d:'隨機學會一種新招式', p:80, ok: MOVE_POOL.some(m => !S.moves.includes(m)), f:() => { const m = pick(MOVE_POOL.filter(x => !S.moves.includes(x))); S.moves.push(m); return `學會「${MOVES[m].n}」`; } },
    { n:'磨刀石', d:'攻擊 +2', p:50, f:() => S.atk += 2 },
    { n:'護身甲', d:'防禦 +2', p:50, f:() => S.def += 2 },
    { n:'大補丸', d:'生命上限 +20', p:60, f:() => { S.hpMax += 20; S.hp += 20; } },
  ];
  const draw = (msgT = '') => {
    $('sceneIn').innerHTML = wxArt('village', 9) + `<h2>雜貨鋪</h2><div class="story">掌櫃笑瞇瞇：「客官要點什麼？」\n你有 <b class="gold">${S.gold}</b> 兩${msgT ? '\n\n' + msgT : ''}</div><div class="col" id="shopL"></div>`;
    for (const it of items) { const b = document.createElement('button'); b.className = 'choice'; b.innerHTML = `${it.n}　<span class="gold">${it.p} 兩</span><small>${it.d}</small>`; b.disabled = S.gold < it.p || it.ok === false;
      b.onclick = () => { S.gold -= it.p; const r = it.f(); saveS(); draw(`<span class="good">買了${it.n}${typeof r === 'string' ? '：' + r : ''}</span>`); }; $('shopL').appendChild(b); }
    const x = document.createElement('button'); x.textContent = '離開'; x.onclick = () => { closeScene(); nextStep(); }; $('shopL').appendChild(x);
  };
  draw(); $('scene').classList.remove('hide'); $('scene').scrollTop = 0;
}
function rest() {
  scene('客棧', `熱騰騰的飯菜，乾淨的床鋪。\n目前生命 ${S.hp}/${S.hpMax}`, [
    { label:'好好睡一覺', note:`回復 50% 生命`, fn: () => { S.hp = Math.min(S.hpMax, S.hp + Math.round(S.hpMax * 0.5)); saveS(); closeScene(); nextStep(); } },
    { label:'挑燈夜練', note:'攻擊 +2、內力上限 +8', fn: () => { S.atk += 2; S.mpMax += 8; S.mp = S.mpMax; saveS(); closeScene(); nextStep(); } },
  ], 'inn');
}

// ================= 傳承 =================
const LUP = [
  { k:'hp', n:'根骨', d:'起始生命 +10', base:30 }, { k:'atk', n:'筋力', d:'起始攻擊 +1', base:40 },
  { k:'mp', n:'內息', d:'起始內力 +5', base:30 }, { k:'gold', n:'家底', d:'起始銀兩 +25', base:25 },
];
function legacy() {
  const draw = () => {
    $('sceneIn').innerHTML = wxArt('moon', 1) + `<h2>轉世傳承</h2><div class="story">前世留下的名望，能讓下一世更強。\n名望：<b class="gold">${L.fame}</b>　闖蕩 ${L.runs} 次　通關 ${L.wins} 次</div><div class="col" id="lg"></div>`;
    for (const u of LUP) { const lv = L.up[u.k], cost = Math.round(u.base * (1 + lv * 0.6)); const b = document.createElement('button'); b.className = 'choice';
      b.innerHTML = `${u.n}　Lv.${lv}　<span class="gold">${cost} 名望</span><small>${u.d}（目前 +${lv * { hp:10, atk:1, mp:5, gold:25 }[u.k]}）</small>`; b.disabled = L.fame < cost;
      b.onclick = () => { L.fame -= cost; L.up[u.k]++; saveL(); draw(); }; $('lg').appendChild(b); }
    const x = document.createElement('button'); x.textContent = '完成'; x.onclick = () => { closeScene(); title_(); }; $('lg').appendChild(x);
  };
  draw(); $('scene').classList.remove('hide');
}

// ================= 場景 =================
function scene(title, text, choices, kind) {
  $('sceneIn').innerHTML = (kind ? wxArt(kind, ri(1, 99)) : '') + `<h2>${title}</h2><div class="story">${text}</div><div class="col" id="chs"></div>`;
  for (const c of choices) { const b = document.createElement('button'); b.className = 'choice'; b.innerHTML = c.label + (c.note ? `<small>${c.note}</small>` : ''); b.disabled = !!c.dis; b.onclick = () => c.fn(); $('chs').appendChild(b); }
  $('scene').classList.remove('hide'); $('scene').scrollTop = 0;
}
function closeScene() { $('scene').classList.add('hide'); }

// ================= 標題 =================
function title_() {
  showOnly('sTitle'); $('tArt').innerHTML = wxArt('gate', 2);
  $('bCont').classList.toggle('hide', !loadS());
}
$('bNew').onclick = () => {
  const go = () => { newRun(); closeScene(); const C = CHAPTERS[0]; scene('出山', `你叫 <b class="gold">${S.name}</b>，十六歲，剛下山。\n\n${C.story}`, [{ label:'踏入江湖', fn: () => { closeScene(); renderMap(); } }], 'gate'); };
  if (loadS()) scene('重新出山', '你還有一段未完的江湖路，重新開始會放棄它。', [{ label:'確定重新開始', fn: go }, { label:'算了', fn: closeScene }]); else go();
};
$('bCont').onclick = () => { S = loadS(); if (S) renderMap(); };
$('bLegacy').onclick = legacy;
title_();
</script>
