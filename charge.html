<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shine欣 全場集氣</title>
<style>
:root{--bg:#14161b;--panel:#1c1f26;--line:#2c313b;--txt:#eceef2;--sub:#9aa3b2;--gold:#e2c28a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:18px/1.6 "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
#wrap{display:flex;gap:18px;height:100%;padding:12px}
#stage{flex:1 1 auto;min-width:0;height:100%;display:flex;align-items:center;justify-content:center}
canvas{height:100%;max-width:100%;aspect-ratio:720/1280;display:block;border-radius:14px;background:repeating-conic-gradient(#3a3f4a 0 25%,#30343d 0 50%) 0 0/40px 40px}
#panel{flex:0 0 400px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
h2{margin:4px 0 10px;font-size:22px;color:var(--gold)}
h3{margin:18px 0 8px;font-size:19px;color:var(--gold)}
input,button,select{font:inherit}
input[type=text],input[type=number],select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #3a404c;background:#252a33;color:#fff}
.btn{border:none;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer}
.go{width:100%;background:linear-gradient(180deg,#f0d29b,#c99a57);color:#1a1a1a;font-size:20px}
.ghost{background:#2c313b;color:var(--txt);font-size:16px;padding:8px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tip{color:var(--sub);font-size:15px}
label{display:block;margin-top:6px}
#log div{padding:6px 0;border-bottom:1px solid var(--line);font-size:16px}
#who div{display:flex;justify-content:space-between;font-size:15px;border-bottom:1px solid var(--line);padding:3px 0}
body.ov,body.ov #wrap{background:transparent!important}
body.ov #panel{display:none}
body.ov #wrap{padding:0}
body.ov canvas{background:transparent;border-radius:0}
#ovState{display:none;position:fixed;left:6px;bottom:6px;font-size:13px;color:#fff;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:8px;transition:opacity 1s}
body.ov #ovState{display:block}
@media (max-width:900px){#wrap{flex-direction:column;height:auto}#stage{height:80vh}#panel{flex:none}}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="cv" width="720" height="1280"></canvas></div>
  <div id="panel">
    <h2>⚡ 全場集氣</h2>
    <div class="tip" id="state"></div>
    <div class="row" style="margin-top:8px"><button class="btn go" id="startBtn">⚡ 開始集氣</button></div>
    <div class="row" style="margin-top:8px"><button class="btn ghost" id="drawBtn">🎁 抽購物金</button><button class="btn ghost" id="fullBtn">✨ 直接集滿（看特效）</button><button class="btn ghost" id="newBtn">🔄 重來</button></div>

    <h3>⚙️ 遊戲設定</h3>
    <label>集氣關鍵字（逗號分開；* ＝任何留言）<input type="text" id="kw"></label>
    <div class="row"><label style="flex:1">要集幾次才滿<input type="number" id="goal" min="1"></label><label style="flex:1">同一人幾秒算一次<input type="number" id="cd" min="0"></label></div>
    <h3>🎬 集滿時的特效影片</h3>
    <label>播哪一支<select id="fx"><option value="rotate">每次輪流（玫瑰城堡 → 天鵝湖 → 天使降臨）</option><option value="rose">🌹 玫瑰城堡</option><option value="swan">🦢 天鵝湖</option><option value="angel">👼 天使降臨</option><option value="pegasus">🦄 天馬</option><option value="boat">🌙 月亮船</option><option value="balloon">🎈 熱氣球花海</option><option value="butterfly">🦋 蝴蝶花房</option><option value="ballet">🩰 音樂盒芭蕾</option><option value="ferris">🎡 摩天輪煙火</option><option value="xmas">🎄 聖誕雪球</option><option value="zerozero">💎 ZERO ZERO 專屬</option></select></label>
    <label>影片上面的字（中韓一起出現）<select id="phr"><option value="rand">每次隨機挑一句</option><option value="0">歐膩今天好漂亮｜언니 오늘 너무 예뻐요</option><option value="1">歐膩穿什麼都好看｜언니는 뭘 입어도 예뻐요</option><option value="2">歐膩穿起來最好看｜언니 핏 최고예요</option><option value="3">歐膩比模特兒還漂亮｜언니가 모델보다 더 예뻐요</option><option value="4">歐膩今天的造型超讚｜언니 오늘 스타일 대박이에요</option><option value="5">歐膩今天辛苦了｜언니 오늘도 수고 많았어요</option><option value="6">謝謝歐膩今天也穿給我們看｜오늘도 옷 입어줘서 고마워요</option><option value="7">換這麼多套辛苦了，謝謝妳｜옷 많이 갈아입느라 힘들었죠? 고마워요</option><option value="8">因為歐膩，買衣服好開心｜언니 덕분에 쇼핑이 너무 즐거워요</option><option value="9">台灣粉絲都愛妳｜대만 팬들이 언니 사랑해요</option><option value="custom">用我自己打的（下面兩格）</option><option value="none">不要顯示字</option></select></label>
    <div class="row"><label style="flex:1">自己打：中文<input type="text" id="czh" placeholder="例：歐膩今天好漂亮"></label><label style="flex:1">韓文<input type="text" id="cko" placeholder="例：언니 오늘 너무 예뻐요"></label></div>
    <div class="row"><button class="btn ghost" id="fxTest">▶ 在手機試播這支特效</button><button class="btn ghost" id="fxStopBtn">⏹ 停止</button></div>
    <div class="tip" id="fxTip">影片的透明度跟上面「全場集氣 透明度」一樣。ZERO ZERO 專屬的字已經做在影片裡，不受上面的字影響。</div>
    <h3>⚙️ 其他設定</h3>
    <label>集氣條放哪裡<select id="pos"><option value="left">左邊</option><option value="right">右邊</option><option value="top">上面</option></select></label>
    <div class="row"><label style="flex:1">抽幾個人<input type="number" id="winN" min="1" max="20"></label><label style="flex:1">集滿後自動抽<select id="autoDraw"><option value="1">是（特效一結束馬上抽）</option><option value="0">否（我按抽）</option></select></label></div>
    <label>獎品<input type="text" id="prize" placeholder="例：購物金50元"></label>
    <div class="tip">中獎機率：有集氣的人都有機會；留言越多機率稍微高一點（最多約一般人的 3 倍），不會一面倒。</div>

    <h3>👥 目前集氣的人</h3>
    <div id="who" class="tip"></div>

    <h3>📡 自動接 FB 留言</h3>
    <label>連線代碼（Session ID）<input type="text" id="sid"></label>
    <div class="row" style="margin-top:8px"><button class="btn ghost" id="conn">開始接留言</button><span id="wsState" class="tip">未連線</span></div>
    <div class="row" style="margin-top:8px"><button class="btn ghost" id="copyOv">複製手機直播用網址</button><button class="btn ghost" id="copyRec">複製電腦紀錄用網址</button><span class="tip" id="ovTip"></span></div>
    <div class="row" style="margin-top:8px"><button class="btn ghost" id="fakeBtn">模擬 10 人集氣</button></div>

    <h3>🏆 得獎紀錄</h3>
    <div class="row"><button class="btn ghost" id="copyWin">複製得獎名單</button><button class="btn ghost" id="clrWin">清空紀錄</button></div>
    <div id="log"></div>
  </div>
</div>
<div id="ovState"></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=720,H=1280,$=id=>document.getElementById(id);
const FONT='"Microsoft JhengHei","PingFang TC",sans-serif';
const LS=(k,d)=>{try{const v=localStorage.getItem('ch_'+k);return v?JSON.parse(v):d}catch(e){return d}};
const SV=(k,v)=>{try{localStorage.setItem('ch_'+k,JSON.stringify(v))}catch(e){}};
/* 一次性：獎品改成購物金10元、清空得獎紀錄（p10_done） */
(function(){try{const P='ch_';if(localStorage.getItem(P+'p10_done'))return;
  ['cfg','cfg2','cfgR'].forEach(k=>{const r=localStorage.getItem(P+k);if(!r)return;const o=JSON.parse(r);o['prize']='購物金10元';localStorage.setItem(P+k,JSON.stringify(o));});
  localStorage.removeItem(P+'wins');localStorage.setItem(P+'p10_done','1');}catch(e){}})();
const QS=new URLSearchParams(location.search),OV=QS.get('mode')==='overlay',REC=QS.get('mode')==='record';
const SERVER=QS.get('server')||'wss://io.socialstream.ninja';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const imgCache=new Map();function imgOf(s){if(!s)return null;if(!imgCache.has(s)){const im=new Image();im.referrerPolicy='no-referrer';im.src=s;imgCache.set(s,im);}return imgCache.get(s);}
const ok=im=>im&&im.complete&&im.naturalWidth>0;
const CASTLE=new Image();const PEG=new Image();const PHX=new Image();const DIA=new Image();const FRAME=new Image();FRAME.src='fx_frame.png';
let fxNow='both';const ROT=['both','phoenix','diamond'];
const shim=document.createElement('canvas'),sctx=shim.getContext('2d');const trail=[];

/* ===== 設定 ===== */
const rid=()=>'shine'+Math.random().toString(36).slice(2,9);
const HEARTS='❤,♥,💕,💖,💗,💓,💞,💘,💝,💟,❣,💛,🧡,💚,💙,💜,🩷,🩵,🤍,🖤,🤎,😍,🥰,😘,😻,愛心';
const PHR=[["歐膩今天好漂亮", "언니 오늘 너무 예뻐요"], ["歐膩穿什麼都好看", "언니는 뭘 입어도 예뻐요"], ["歐膩穿起來最好看", "언니 핏 최고예요"], ["歐膩比模特兒還漂亮", "언니가 모델보다 더 예뻐요"], ["歐膩今天的造型超讚", "언니 오늘 스타일 대박이에요"], ["歐膩今天辛苦了", "언니 오늘도 수고 많았어요"], ["謝謝歐膩今天也穿給我們看", "오늘도 옷 입어줘서 고마워요"], ["換這麼多套辛苦了，謝謝妳", "옷 많이 갈아입느라 힘들었죠? 고마워요"], ["因為歐膩，買衣服好開心", "언니 덕분에 쇼핑이 너무 즐거워요"], ["台灣粉絲都愛妳", "대만 팬들이 언니 사랑해요"]];
const DEF={fx:'rotate',phr:'rand',czh:'',cko:'',kw:HEARTS,goal:150,cd:5,pos:'left',winN:2,autoDraw:'1',prize:'購物金20元',v:2};
const _sv=LS('cfg',{});let cfg=Object.assign({},DEF,_sv);if(_sv.v!==2){Object.assign(cfg,{kw:HEARTS,goal:150,prize:'購物金10元',autoDraw:'1',v:2});SV('cfg',cfg);}if(!_sv.v3){cfg.fx='rotate';cfg.v3=1;SV('cfg',cfg);}if(!_sv.v4){cfg.kw=HEARTS;cfg.v4=1;SV('cfg',cfg);}if(!_sv.v6){cfg.prize='購物金20元';cfg.v6=1;SV('cfg',cfg);}if(!_sv.v5){cfg.fx='rotate';cfg.winN=2;cfg.cd=5;delete cfg.msg;cfg.v5=1;SV('cfg',cfg);}
let sid=QS.get('session')||LS('sid','')||rid();SV('sid',sid);
if(OV){const c=LS('cfgR',null);if(c&&c.v===2&&c.v3&&c.v4)Object.assign(cfg,c);}
let wins=LS('wins',[]);

/* ===== 狀態 ===== */
// phase: idle → play（集氣中）→ full（特效）→ draw（抽獎動畫）→ end
let phase='idle',pts=0,who={},whoImg={},fullAt=0,drawAt=0,result=null,remote=null;const pops=[],parts=[];
function goal(){return Math.max(1,+cfg.goal||100);}
function newGame(){phase='idle';pts=0;who={};whoImg={};result=null;pops.length=0;parts.length=0;sendUp({chState:stateMsg()});renderUI();}
function startGame(){if(phase!=='idle'){newGame();}phase='play';sendUp({chState:stateMsg()});renderUI();}
function addPoint(name,img){pts=Math.min(goal(),pts+1);who[name]=(who[name]||0)+1;if(img)whoImg[name]=img;
  pops.unshift({name,img,t:performance.now()});if(pops.length>6)pops.length=6;
  if(pts>=goal())goFull();sendUp({chAdd:{n:name,s:img||''},chState:stateMsg()});renderUI();}
let fxVideo=false;const FXROT=['rose','swan','angel'];
function fxId(){if(cfg.fx&&cfg.fx!=='rotate')return cfg.fx;const n=(LS('fxRotN',-1)+1)%FXROT.length;SV('fxRotN',n);return FXROT[n];}
function fxPhrase(){const p=String(cfg.phr==null?'rand':cfg.phr);if(p==='none')return null;if(p==='custom'){const c=[String(cfg.czh||'').trim(),String(cfg.cko||'').trim()];return c[0]||c[1]?c:null;}
  if(p==='rand'){let i=Math.floor(Math.random()*PHR.length);if(i===LS('phrLast',-1))i=(i+1)%PHR.length;SV('phrLast',i);return PHR[i];}return PHR[+p]||PHR[0];}
// 在總台裡面時，交給總台全螢幕播特效影片；回傳影片長度（毫秒），不在總台裡回傳 0
function playVideo(){try{const P=window.parent;if(P&&P!==window&&P.__playFx)return P.__playFx(fxId(),fxPhrase())||0;}catch(e){}return 0;}
function warmVideo(){try{const P=window.parent;if(OV&&P&&P!==window&&P.__warmFx&&cfg.fx&&cfg.fx!=='rotate')P.__warmFx(cfg.fx);}catch(e){}}
setTimeout(warmVideo,3500);
function stopVideo(){try{const P=window.parent;if(P&&P!==window&&P.__stopFx)P.__stopFx();}catch(e){}}
function goFull(){if(phase!=='play')return;phase='full';fullAt=performance.now();fxNow='none';fxVideo=false;let wait=6500;
  // 在總台裡面時，交給總台全螢幕播特效影片，播完再抽獎
  if(OV&&!REC){const d=playVideo();if(d>0){fxVideo=true;wait=d+400;}}
  sendUp({chState:stateMsg()});
  if(cfg.autoDraw==='1'&&!(REC&&overlaySeen))setTimeout(()=>{if(phase==='full')doDraw();},wait);renderUI();}
function weight(c){return Math.min(3,1+0.55*Math.log(c));} // 1 則＝1，10 則≈2.3，40 則以上封頂 3
function doDraw(){if(!(phase==='full'||phase==='play'))return;const names=Object.keys(who);const n=Math.max(1,Math.min(20,+cfg.winN||1));
  const pool=names.map(nm=>({n:nm,w:weight(who[nm])}));const picked=[];
  while(picked.length<n&&pool.length){const tot=pool.reduce((a,b)=>a+b.w,0);let r=Math.random()*tot,k=0;for(;k<pool.length;k++){r-=pool[k].w;if(r<=0)break;}k=Math.min(k,pool.length-1);picked.push(pool.splice(k,1)[0].n);}
  result={list:picked.map(nm=>({n:nm,s:whoImg[nm]||'',c:who[nm]})),prize:cfg.prize,people:names.length,pts,t:Date.now()};
  phase='draw';drawAt=performance.now();
  if(!REC){wins.unshift(result);wins=wins.slice(0,100);SV('wins',wins);}
  sendUp({chWin:result,chState:stateMsg()});renderUI();}
function stateMsg(){return{phase,pts,goal:goal(),people:Object.keys(who).length,result,who:Object.entries(who).sort((a,b)=>b[1]-a[1]).slice(0,30)};}

/* ===== 畫面 ===== */
function drawAv(img,name,x,y,r){const im=imgOf(img);ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.clip();if(ok(im))ctx.drawImage(im,x-r,y-r,r*2,r*2);else{ctx.fillStyle='#c9748a';ctx.fillRect(x-r,y-r,r*2,r*2);ctx.fillStyle='#fff';ctx.font=`bold ${r|0}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText((name||'?')[0],x,y+2);}ctx.restore();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();}
function txt(t,x,y,size,col,align,stroke){ctx.font=`bold ${size}px ${FONT}`;ctx.textAlign=align||'center';ctx.textBaseline='middle';if(stroke){ctx.lineWidth=stroke===true?7:stroke;ctx.strokeStyle='rgba(0,0,0,.75)';ctx.strokeText(t,x,y);}ctx.fillStyle=col||'#fff';ctx.fillText(t,x,y);}
const kw1=()=>{const k=(String(cfg.kw).split(/[,，]/)[0]||'集氣').trim();return k==='*'?'任何字':k;};
function gauge(now){
  const r=pts/goal(),pos=cfg.pos||'left',glow=0.5+0.5*Math.sin(now/300);
  let bx,by,bw,bh,vert=pos!=='top';
  if(vert){bw=30;bh=640;by=330;bx=pos==='left'?30:W-30-bw;}else{bw=W-120;bh=26;bx=60;by=170;}
  ctx.save();
  ctx.fillStyle='rgba(10,14,24,.6)';rr(bx-6,by-6,bw+12,bh+12,vert?21:19);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.12)';rr(bx,by,bw,bh,vert?15:13);ctx.fill();
  const g=vert?ctx.createLinearGradient(0,by+bh,0,by):ctx.createLinearGradient(bx,0,bx+bw,0);g.addColorStop(0,'#ff6a88');g.addColorStop(.5,'#ffb347');g.addColorStop(1,'#fff07a');
  ctx.save();rr(bx,by,bw,bh,vert?15:13);ctx.clip();ctx.fillStyle=g;
  if(vert){const fh=bh*r;ctx.fillRect(bx,by+bh-fh,bw,fh);ctx.fillStyle=`rgba(255,255,255,${.25+.25*glow})`;for(let k=0;k<4;k++){const yy=by+bh-fh+((now/12+k*60)%Math.max(1,fh));if(fh>10)ctx.fillRect(bx+8,yy,bw-16,4);}}
  else{const fw=bw*r;ctx.fillRect(bx,by,fw,bh);ctx.fillStyle=`rgba(255,255,255,${.25+.25*glow})`;for(let k=0;k<4;k++){const xx=bx+((now/8+k*90)%Math.max(1,fw));if(fw>10)ctx.fillRect(xx,by+8,4,bh-16);}}
  ctx.restore();
  ctx.strokeStyle=`rgba(255,230,150,${.6+.4*glow})`;ctx.lineWidth=4;rr(bx,by,bw,bh,vert?15:13);ctx.stroke();
  const pct=Math.floor(r*100)+'%';
  if(vert){txt('⚡',bx+bw/2,by-36,38,'#ffe08a');txt(pct,bx+bw/2,by+bh+34,28,'#fff','center',true);}
  else{txt(`⚡ ${pct}`,W/2,by-26,28,'#fff','center',true);}
  ctx.restore();
  return {bx,by,bw,bh,vert,pos};
}
function drawPops(G,now){
  // 參與集氣的提示：集氣條旁邊一則一則往上冒
  pops.forEach((p,i)=>{const age=now-p.t;if(age>4500)return;const a=Math.min(1,age/250)*(age>3800?1-(age-3800)/700:1)*(1-i*.12);
    const t=`${p.name.length>6?p.name.slice(0,6)+'…':p.name} 參與集氣！`;ctx.font='bold 24px '+FONT;const tw=ctx.measureText(t).width+70;
    if(i>2)return;let x,y;if(G.vert){y=G.by-90-i*54-(1-Math.min(1,age/250))*14;x=G.pos==='left'?G.bx-6:G.bx+G.bw+6-tw;}else{x=30;y=G.by+G.bh+50+i*54;}
    ctx.globalAlpha=Math.max(0,a);ctx.fillStyle='rgba(10,14,24,.72)';rr(x,y-23,tw,46,23);ctx.fill();ctx.strokeStyle='rgba(255,224,138,.8)';ctx.lineWidth=2;ctx.stroke();
    drawAv(p.img,p.name,x+24,y,18);txt(t,x+50,y,24,'#ffe08a','left');ctx.globalAlpha=1;});
}
function castle(cx,base,s,now){
  // 沒有 Gemini 圖時用畫的金色城堡
  const g=ctx.createLinearGradient(0,base-420*s,0,base);g.addColorStop(0,'#fff6c8');g.addColorStop(.5,'#ffd36b');g.addColorStop(1,'#c8892f');ctx.fillStyle=g;
  const tower=(x,w,h,roof)=>{ctx.fillRect(cx+x*s,base-h*s,w*s,h*s);for(let k=0;k<Math.floor(w/22);k++)ctx.fillRect(cx+(x+k*22)*s,base-(h+14)*s,12*s,14*s);if(roof){ctx.beginPath();ctx.moveTo(cx+(x-6)*s,base-h*s);ctx.lineTo(cx+(x+w/2)*s,base-(h+roof)*s);ctx.lineTo(cx+(x+w+6)*s,base-h*s);ctx.closePath();ctx.fill();}};

$('fakeBtn').onclick=ctl('fake',fake10);
$('fxTest').onclick=()=>{if(REC&&overlaySeen){sendDown({chCmd:'fxTest'});$('fxTip').textContent='已送出，手機畫面播放中（要先按上面的「顯示」才看得到）';}else $('fxTip').textContent='⚠️ 手機還沒連上，沒辦法試播';};
$('fxStopBtn').onclick=()=>{if(REC&&overlaySeen)sendDown({chCmd:'fxStop'});};
$('conn').onclick=()=>{connect();if(!REC&&!recWs)listenRec();};
const base=()=>location.href.split('?')[0];
function copy(u){navigator.clipboard.writeText(u).then(()=>{$('ovTip').textContent='已複製 ✓';setTimeout(()=>$('ovTip').textContent='',2000);});}
$('copyOv').onclick=()=>copy(`${base()}?mode=overlay&session=${encodeURIComponent(sid)}&v=1`);
$('copyRec').onclick=()=>copy(`${base()}?mode=record&session=${encodeURIComponent(sid)}`);
$('copyWin').onclick=()=>copy(wins.slice().reverse().map(w=>w.list.map(x=>`${x.n}　${w.prize}`).join('\n')).join('\n')||'目前沒有');
$('clrWin').onclick=()=>{if(confirm('清空得獎紀錄？')){wins=[];SV('wins',wins);renderUI();}};

/* ===== 啟動 ===== */
renderUI();
if(OV){document.body.classList.add('ov');document.documentElement.style.background='transparent';connect();listenCmd();setTimeout(()=>$('ovState').style.opacity=0,8000);}
else if(REC){listenRec();$('conn').style.display='none';setState('📋 紀錄模式：還沒偵測到手機（現在按按鈕會在這頁自己跑）');}
else if(QS.get('session')){connect();}
if(OV){window.__fill=false;window.__fit=function(){const vw=innerWidth,vh=innerHeight;const s=Math.min(vw/cv.width,vh/cv.height);const w=cv.width*s,h=cv.height*s;
  Object.assign(cv.style,{position:'fixed',left:((vw-w)/2)+'px',top:((vh-h)/2)+'px',width:w+'px',height:h+'px',maxWidth:'none',aspectRatio:'auto',margin:'0'});};
  addEventListener('resize',window.__fit);setInterval(window.__fit,1000);window.__fit();}
</script>
</body>
</html>
