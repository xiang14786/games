<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="遊戲盒">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>跳跳果凍</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#0d1120; overflow:hidden;
    font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none; overscroll-behavior:none; color:#fff; }
  #wrap { position:relative; width:100%; height:100%; max-width:480px; margin:0 auto; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:absolute; top:calc(env(safe-area-inset-top) + 10px); left:12px; right:12px; display:flex; align-items:center; gap:8px; pointer-events:none; }
  .pill { background:rgba(10,14,30,.55); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.15); border-radius:999px; padding:6px 14px; font-weight:900; font-size:20px; text-shadow:0 2px 4px rgba(0,0,0,.4); }
  .pill small { font-size:12px; opacity:.7; font-weight:700; margin-left:4px; }
  #pause { pointer-events:auto; margin-left:auto; width:42px; height:42px; padding:0; border-radius:50%; font-size:18px; background:rgba(10,14,30,.55); border:1px solid rgba(255,255,255,.2); color:#fff; }
  #power { position:absolute; top:calc(env(safe-area-inset-top) + 62px); left:12px; display:flex; flex-direction:column; gap:6px; pointer-events:none; }
  #power .pw { background:rgba(10,14,30,.55); border-radius:12px; padding:4px 10px; font-size:14px; font-weight:800; display:flex; align-items:center; gap:6px; }
  #power .bar { width:60px; height:6px; background:rgba(255,255,255,.2); border-radius:4px; overflow:hidden; }
  #power .bar i { display:block; height:100%; background:#ffd34d; }
  #zone { position:absolute; top:28%; left:0; right:0; text-align:center; font-size:26px; font-weight:900; text-shadow:0 3px 10px rgba(0,0,0,.6); opacity:0; transition:opacity .5s; pointer-events:none; }
  .ov { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center;
    background:linear-gradient(180deg, rgba(15,20,50,.35), rgba(8,10,25,.85)); overflow-y:auto; }
  .ov.hide, .hide { display:none !important; }
  .logo { font-size:52px; font-weight:900; letter-spacing:2px; line-height:1.05;
    background:linear-gradient(180deg,#fff 0%,#ffd1e6 45%,#ff7fb5 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 0 #b3306b) drop-shadow(0 8px 14px rgba(0,0,0,.4)); }
  .sub { font-size:16px; color:#d8dcf0; line-height:1.7; }
  .sub b { color:#ffd34d; }
  .card { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:18px; padding:12px 14px; width:100%; max-width:340px; text-align:left; }
  .card h3 { margin:0 0 8px; font-size:17px; }
  .items { display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; font-size:14px; color:#dfe3f5; }
  .items span { display:flex; align-items:center; gap:6px; }
  .items i { font-style:normal; font-size:20px; }
  button.big { background:linear-gradient(180deg,#ff9cc6,#ff5c9e); color:#fff; border:0; border-radius:999px; padding:15px 46px; font-size:24px; font-weight:900;
    box-shadow:0 6px 0 #b3306b, 0 10px 20px rgba(0,0,0,.35); font-family:inherit; }
  button.big:active { transform:translateY(4px); box-shadow:0 2px 0 #b3306b; }
  button.alt { background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:11px 24px; font-size:17px; font-weight:800; font-family:inherit; }
  button.alt:disabled { opacity:.4; }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .coins { color:#ffd34d; font-weight:900; }
  .shopitem { display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid rgba(255,255,255,.08); }
  .shopitem:first-of-type { border-top:0; }
  .shopitem .ic { font-size:28px; width:36px; text-align:center; }
  .shopitem .t { flex:1; font-size:15px; font-weight:800; }
  .shopitem .t small { display:block; font-size:12px; color:#aab0c8; font-weight:500; margin-top:2px; }
  .shopitem button { background:#ffd34d; color:#3a2a00; border:0; border-radius:12px; padding:8px 12px; font-weight:900; font-size:14px; min-width:70px; font-family:inherit; }
  .shopitem button:disabled { background:#555b70; color:#aaa; }
  .shopitem button.on { background:#7ee0a8; color:#0b2a18; }
  .lv { display:inline-flex; gap:2px; margin-left:4px; }
  .lv u { width:8px; height:8px; border-radius:2px; background:rgba(255,255,255,.2); }
  .lv u.f { background:#ffd34d; }
  .big-num { font-size:56px; font-weight:900; color:#fff; text-shadow:0 4px 0 #b3306b; line-height:1; }
  .newrec { color:#ffd34d; font-weight:900; font-size:18px; animation:pop .6s infinite alternate; }
  @keyframes pop { from { transform:scale(1); } to { transform:scale(1.12); } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud" class="hide">
    <div class="pill" id="sc">0</div>
    <div class="pill coins" id="cn">🪙 0</div>
    <button id="pause">⏸</button>
  </div>
  <div id="power"></div>
  <div id="zone"></div>

  <div class="ov" id="start">
    <div class="logo">跳跳<br>果凍</div>
    <div class="sub">按住螢幕<b>左半邊</b>往左、<b>右半邊</b>往右<br>一路往上跳，飛越雲海直達太空！</div>
    <div class="card"><h3>🎁 道具</h3><div class="items">
      <span><i>🟡</i>小彈簧：跳很高</span><span><i>🔴</i>大彈簧：彈上天</span>
      <span><i>🟦</i>彈跳床：空翻高跳</span><span><i>🧢</i>竹蜻蜓：飛一段</span>
      <span><i>🚀</i>火箭：衝超遠</span><span><i>🫧</i>泡泡盾：擋一次</span>
      <span><i>🧲</i>磁鐵：吸金幣</span><span><i>👾</i>怪物：從上面踩</span>
    </div></div>
    <div class="sub" id="bestLine"></div>
    <button class="big" id="go">開始</button>
    <div class="row"><button class="alt" id="bShop">🛍️ 商店・造型</button></div>
  </div>

  <div class="ov hide" id="shop">
    <div style="font-size:30px;font-weight:900">🛍️ 商店</div>
    <div class="coins" style="font-size:22px" id="shopCoins"></div>
    <div class="card"><h3>⬆️ 升級</h3><div id="upList"></div></div>
    <div class="card"><h3>🎨 造型</h3><div id="skinList"></div></div>
    <button class="alt" id="shopBack">返回</button>
  </div>

  <div class="ov hide" id="pauseOv">
    <div style="font-size:34px;font-weight:900">暫停</div>
    <button class="big" id="resume">繼續</button>
    <button class="alt" id="quit">回主選單</button>
  </div>

  <div class="ov hide" id="over">
    <div style="font-size:30px;font-weight:900;color:#ffb3cf">掉下去了！</div>
    <div class="big-num" id="resNum">0</div>
    <div id="resRec"></div>
    <div class="sub" id="res"></div>
    <button class="alt" id="revive" style="border-color:#ffd34d;color:#ffd34d">🪙 100 復活（附火箭）</button>
    <button class="big" id="again">再跳一次</button>
    <div class="row"><button class="alt" id="toShop">🛍️ 商店</button><button class="alt" id="toHome">主選單</button></div>
  </div>
</div>
<script>
const cv = document.getElementById('c'), $ = id => document.getElementById(id);
let ctx = cv.getContext('2d'); const mainCtx = ctx;
const W = 360; let H = 640, scale = 1;
function resize() { const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; scale = r.width / W; H = r.height / scale; cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0); }
window.addEventListener('resize', resize); resize();
const rand = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- 存檔 ----------
let S = { best: 0, coins: 0, up: { rocket: 0, prop: 0, luck: 0, shield: 0, coin2: 0 }, skins: ['pink'], skin: 'pink' };
try { const o = JSON.parse(localStorage.getItem('jelly2')); if (o) S = Object.assign(S, o, { up: Object.assign(S.up, o.up || {}) }); else S.best = +localStorage.getItem('jellyBest') || 0; } catch (e) {}
const save = () => { try { localStorage.setItem('jelly2', JSON.stringify(S)); } catch (e) {} };
const UPS = [
  { k: 'rocket', ic: '🚀', n: '火箭燃料', d: '火箭飛行時間 +15%', max: 5, cost: l => [60, 120, 220, 360, 550][l] },
  { k: 'prop', ic: '🧢', n: '竹蜻蜓電池', d: '竹蜻蜓飛行時間 +20%', max: 5, cost: l => [50, 100, 180, 300, 450][l] },
  { k: 'luck', ic: '🍀', n: '幸運', d: '道具出現機率 +20%', max: 4, cost: l => [80, 160, 300, 500][l] },
  { k: 'shield', ic: '🫧', n: '開局泡泡盾', d: '每局一開始就帶著護盾', max: 1, cost: () => 300 },
  { k: 'coin2', ic: '💰', n: '金幣加倍', d: '撿到的金幣 ×2', max: 1, cost: () => 700 },
];
const SKINS = [
  { k: 'pink', n: '草莓果凍', c: '#ff8fb8', c2: '#ff5c9e', p: 0 },
  { k: 'mint', n: '薄荷果凍', c: '#7ee0c0', c2: '#2fb894', p: 120 },
  { k: 'lemon', n: '檸檬果凍', c: '#ffe066', c2: '#f2b51b', p: 200 },
  { k: 'grape', n: '葡萄果凍', c: '#b48cff', c2: '#7c4dff', p: 300 },
  { k: 'soda', n: '汽水果凍', c: '#7cc8ff', c2: '#2f8fe8', p: 400 },
  { k: 'cat', n: '貓耳果凍', c: '#ffb070', c2: '#f07a2a', p: 600, ears: true },
  { k: 'king', n: '國王果凍', c: '#ff8fb8', c2: '#ff5c9e', p: 900, crown: true },
  { k: 'rainbow', n: '彩虹果凍', c: 'rainbow', c2: '#ff5c9e', p: 1500 },
];
const skin = () => SKINS.find(s => s.k === S.skin) || SKINS[0];

// ---------- 物理常數 ----------
const GR = 0.38, JUMP = -11.5, SPRING = -18.5, BIG = -27, TRAMP = -21.5, PW = 62, PH = 14;
let p, plats, items, coins, mons, parts, clouds, stars, maxH, score, coinsRun, running = false, paused = false, dirL = false, dirR = false, revived = false, zoneIdx = 0, shake = 0;

const ZONES = [
  { h: 0, n: '☁️ 晴空草原', top: [110, 190, 255], bot: [190, 232, 255] },
  { h: 2500, n: '🌤️ 雲海之上', top: [70, 140, 235], bot: [165, 210, 255] },
  { h: 6000, n: '🌇 黃昏天空', top: [90, 70, 160], bot: [255, 150, 120] },
  { h: 11000, n: '🌙 星空', top: [14, 18, 50], bot: [40, 40, 100] },
  { h: 18000, n: '🪐 外太空', top: [5, 5, 15], bot: [20, 10, 45] },
];
function zoneAt(h) { let i = 0; ZONES.forEach((z, k) => { if (h >= z.h) i = k; }); return i; }
function skyCol(h, which) {
  const i = zoneAt(h), a = ZONES[i], b = ZONES[Math.min(i + 1, ZONES.length - 1)];
  const t = b === a ? 0 : clamp((h - a.h) / (b.h - a.h), 0, 1) ** 2;
  const ca = a[which], cb = b[which];
  return `rgb(${ca.map((v, k) => Math.round(v + (cb[k] - v) * t)).join(',')})`;
}

function lvl() { return Math.min(score / 4000, 1); }
function makePlat(y) {
  const L = lvl(), r = Math.random();
  let type = 'n';
  if (r < 0.1 + 0.22 * L) type = 'm';
  else if (r < 0.14 + 0.32 * L && score > 600) type = 'w';
  const pl = { x: rand(0, W - PW), y, type, vx: type === 'm' ? (Math.random() < .5 ? -1 : 1) * rand(1, 1.5 + L * 1.6) : 0, broken: false, fall: 0, gone: false, item: null };
  const luck = 1 + S.up.luck * 0.2;
  if (type !== 'w') {
    const q = Math.random();
    if (q < 0.07 * luck) pl.item = { t: 'spring', x: rand(8, PW - 24) };
    else if (q < 0.095 * luck && score > 300) pl.item = { t: 'big', x: rand(8, PW - 24) };
    else if (q < 0.12 * luck) pl.item = { t: 'tramp', x: 6 };
    else if (q < 0.135 * luck && score > 200) items.push({ t: 'prop', x: pl.x + PW / 2, y: y - 26 });
    else if (q < 0.145 * luck && score > 500) items.push({ t: 'rocket', x: pl.x + PW / 2, y: y - 30 });
    else if (q < 0.155 * luck) items.push({ t: 'shield', x: pl.x + PW / 2, y: y - 26 });
    else if (q < 0.165 * luck) items.push({ t: 'magnet', x: pl.x + PW / 2, y: y - 26 });
  }
  if (Math.random() < 0.22) { const n = 3 + Math.floor(Math.random() * 3), cx = rand(20, W - 20); for (let i = 0; i < n; i++) coins.push({ x: cx, y: y - 40 - i * 24, a: Math.random() * 6 }); }
  return pl;
}
function reset() {
  const sk = skin();
  p = { x: W / 2 - 18, y: H - 130, w: 36, h: 34, vx: 0, vy: JUMP, face: 1, squish: 0, fly: 0, flyT: null, flyMax: 1, shield: S.up.shield > 0, magnet: 0, spin: 0 };
  maxH = 0; score = 0; coinsRun = 0; revived = false; zoneIdx = 0; shake = 0;
  plats = [{ x: W / 2 - PW / 2, y: H - 60, type: 'n', vx: 0, broken: false, fall: 0, gone: false, item: null }];
  items = []; coins = []; mons = []; parts = [];
  let y = H - 60; while (y > -200) { y -= rand(55, 85); plats.push(makePlat(y)); }
  clouds = Array.from({ length: 8 }, () => ({ x: rand(-40, W), y: rand(-H, H), s: rand(0.6, 1.4), d: rand(0.2, 0.5) }));
  stars = Array.from({ length: 70 }, () => ({ x: rand(0, W), y: rand(0, H), r: rand(.5, 1.8), tw: rand(0, 6) }));
}
function gap() { const L = lvl(); return rand(55 + 30 * L, 85 + 48 * L); }
function burst(x, y, col, n = 8, sp = 3) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = rand(0.5, sp); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: rand(20, 40), col, r: rand(2, 4) }); } }
function startFly(t) {
  const dur = t === 'rocket' ? 200 * (1 + S.up.rocket * 0.15) : 140 * (1 + S.up.prop * 0.2);
  p.fly = dur; p.flyMax = dur; p.flyT = t; p.vy = t === 'rocket' ? -16 : -9.5;
}
function update() {
  const acc = 0.9, maxV = 6.8;
  if (dirL && !dirR) { p.vx -= acc; p.face = -1; } else if (dirR && !dirL) { p.vx += acc; p.face = 1; } else p.vx *= 0.85;
  p.vx = clamp(p.vx, -maxV, maxV); p.x += p.vx;
  if (p.x + p.w < 0) p.x = W; if (p.x > W) p.x = -p.w;
  if (p.fly > 0) {
    p.fly--; p.vy = p.flyT === 'rocket' ? -16 : -9.5;
    if (Math.random() < 0.8) parts.push({ x: p.x + p.w / 2 + rand(-5, 5), y: p.y + p.h + 4, vx: rand(-.6, .6), vy: rand(2, 4), life: 22, col: p.flyT === 'rocket' ? (Math.random() < .5 ? '#ffb02e' : '#ff5b2e') : '#ffffffaa', r: rand(2, 5) });
    if (p.fly === 0) { p.vy = -7; burst(p.x + 18, p.y, '#ffd34d', 10); p.flyT = null; }
  } else { p.vy += GR; }
  p.y += p.vy; p.squish *= 0.85; if (p.spin) p.spin = Math.max(0, p.spin - 0.12);
  if (p.magnet > 0) p.magnet--;

  if (p.vy > 0 && !p.fly) {
    for (const pl of plats) {
      if (pl.broken || pl.gone) continue;
      const feet = p.y + p.h, prev = feet - p.vy;
      if (p.x + p.w - 6 > pl.x && p.x + 6 < pl.x + PW && prev <= pl.y + 2 && feet >= pl.y) {
        if (pl.type === 'b') { pl.broken = true; burst(pl.x + PW / 2, pl.y, '#c98a5a', 6); continue; }
        p.y = pl.y - p.h; p.squish = 1;
        const it = pl.item, cx = p.x + p.w / 2;
        if (it && (it.t === 'tramp' || cx > pl.x + it.x - 10 && cx < pl.x + it.x + 26)) {
          it.used = 8;
          if (it.t === 'spring') p.vy = SPRING;
          else if (it.t === 'big') { p.vy = BIG; shake = 8; burst(cx, pl.y, '#ff5b5b', 14, 4); }
          else { p.vy = TRAMP; p.spin = Math.PI * 2; }
        } else p.vy = JUMP;
        if (pl.type === 'w') { pl.gone = true; burst(pl.x + PW / 2, pl.y + 6, '#ffffff', 10); }
        burst(cx, pl.y, 'rgba(255,255,255,.7)', 4, 1.5);
        break;
      }
    }
  }
  for (const pl of plats) {
    if (pl.type === 'm' && !pl.broken) { pl.x += pl.vx; if (pl.x < 0 || pl.x + PW > W) pl.vx *= -1; }
    if (pl.broken) { pl.fall += 0.6; pl.y += pl.fall; }
    if (pl.item && pl.item.used) pl.item.used--;
  }
  // 道具
  for (const it of items) {
    if (it.got) continue;
    if (Math.abs(p.x + p.w / 2 - it.x) < 26 && Math.abs(p.y + p.h / 2 - it.y) < 28) {
      it.got = true; burst(it.x, it.y, '#ffd34d', 12);
      if (it.t === 'rocket' || it.t === 'prop') startFly(it.t);
      else if (it.t === 'shield') p.shield = true;
      else if (it.t === 'magnet') p.magnet = 600;
    }
  }
  // 金幣
  for (const c of coins) {
    if (c.got) continue;
    const dx = p.x + p.w / 2 - c.x, dy = p.y + p.h / 2 - c.y, d = Math.hypot(dx, dy);
    if (p.magnet > 0 && d < 170) { c.x += dx / d * 7; c.y += dy / d * 7; }
    if (d < 24) { c.got = true; coinsRun += S.up.coin2 ? 2 : 1; parts.push({ x: c.x, y: c.y, vx: 0, vy: -1.5, life: 26, txt: S.up.coin2 ? '+2' : '+1', col: '#ffd34d' }); }
  }
  // 怪物
  for (const m of mons) {
    if (m.dead) { m.y += m.fall; m.fall += 0.6; continue; }
    m.t += 0.05; m.x = m.bx + Math.sin(m.t) * m.amp;
    const hit = Math.abs(p.x + p.w / 2 - m.x) < 30 && Math.abs(p.y + p.h / 2 - m.y) < 28;
    if (!hit) continue;
    if (p.fly) { m.dead = true; m.fall = -4; burst(m.x, m.y, '#9b6bff', 14, 4); coinsRun += 3; continue; }
    if (p.vy > 0 && p.y + p.h < m.y + 4) { m.dead = true; m.fall = 0; p.vy = JUMP * 1.15; p.squish = 1; burst(m.x, m.y, '#9b6bff', 14, 4); coinsRun += 3; parts.push({ x: m.x, y: m.y - 20, vx: 0, vy: -1.5, life: 30, txt: '踩扁！+3', col: '#ffd34d' }); shake = 5; }
    else if (p.shield) { p.shield = false; m.dead = true; m.fall = -3; p.vy = JUMP; burst(p.x + 18, p.y + 17, '#8fd8ff', 18, 4); shake = 6; }
    else { return die(); }
  }
  // 鏡頭
  const line = H * 0.42;
  if (p.y < line) {
    const d = line - p.y; p.y = line; maxH += d;
    for (const a of [plats, items, coins, mons]) for (const o of a) o.y += d;
    for (const o of parts) o.y += d;
    for (const c of clouds) { c.y += d * c.d; if (c.y > H + 60) { c.y = rand(-160, -60); c.x = rand(-60, W); c.s = rand(0.6, 1.4); } }
    for (const s of stars) { s.y += d * 0.08; if (s.y > H) { s.y -= H; s.x = rand(0, W); } }
  }
  score = Math.floor(maxH / 4);
  const z = zoneAt(maxH); if (z > zoneIdx) { zoneIdx = z; showZone(ZONES[z].n); }
  plats = plats.filter(pl => pl.y < H + 60 && !(pl.gone && pl.y > H));
  items = items.filter(o => o.y < H + 60 && !o.got); coins = coins.filter(o => o.y < H + 60 && !o.got); mons = mons.filter(m => m.y < H + 80);
  let top = Math.min(...plats.map(pl => pl.y));
  while (top > -80) {
    const g2 = gap(); top -= g2; plats.push(makePlat(top));

let zoneT = null;
function showZone(n) { const z = $('zone'); z.textContent = n; z.style.opacity = 1; clearTimeout(zoneT); zoneT = setTimeout(() => z.style.opacity = 0, 1800); }

// ---------- 繪圖 ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

function drawPlat(pl) {

  if (pl.type === 'w') { ctx.fillStyle = 'rgba(120,140,190,.6)'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('一次性', pl.x + PW / 2, pl.y + 11); }

      ctx.fillStyle = '#3d7bff'; rr(pl.x + 4, y - 14 + up, PW - 8, 6, 3); ctx.fill(); ctx.fillStyle = '#9cc0ff'; rr(pl.x + 8, y - 13 + up, PW - 16, 2, 1); ctx.fill();

}
function drawItem(it) {
  const t = performance.now() / 300, y = it.y + Math.sin(t + it.x) * 3, x = it.x;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.arc(0, 0, 18, 0, 7); ctx.fill();

function drawJelly(x, y, w, h, face, sk, spin) {

function draw() {

// ---------- 迴圈 ----------
let last = 0, accT = 0;
function loop(t) {
  if (!running) return;
  if (!paused) { const dt = Math.min(t - last, 100); accT += dt; while (accT >= 1000 / 60) { update(); accT -= 1000 / 60; if (!running) break; } }
  last = t; if (running) draw();
  requestAnimationFrame(loop);
}
function show(id) { ['start', 'shop', 'over', 'pauseOv'].forEach(x => $(x).classList.toggle('hide', x !== id)); $('hud').classList.toggle('hide', id !== null && id !== 'pauseOv'); }
function start() { show(null); reset(); running = true; paused = false; last = performance.now(); accT = 0; requestAnimationFrame(loop); }

  $('resRec').innerHTML = rec ? '<div class="newrec">🎉 新紀錄！</div>' : `<div class="sub">最高紀錄 <b>${S.best}m</b></div>`;
  $('res').innerHTML = `抵達：<b>${ZONES[zoneAt(maxH)].n}</b>　金幣共 <b class="coins">🪙 ${S.coins}</b>`;

function home() { show('start'); $('hud').classList.add('hide'); $('bestLine').innerHTML = `最高紀錄 <b>${S.best}m</b>　金幣 <b>🪙 ${S.coins}</b>`; reset(); maxH = 0; draw(); }

$('go').onclick = start; $('again').onclick = start; $('revive').onclick = revive;
$('bShop').onclick = () => { renderShop(); show('shop'); $('hud').classList.add('hide'); };
$('toShop').onclick = () => { renderShop(); show('shop'); $('hud').classList.add('hide'); };

document.addEventListener('visibilitychange', () => { if (document.hidden && running && !paused) { paused = true; show('pauseOv'); } });

function updTouches(e) { if (!running || paused) return; const r = cv.getBoundingClientRect(); dirL = dirR = false; for (const t of e.touches) { if (t.clientX - r.left < r.width / 2) dirL = true; else dirR = true; } }
