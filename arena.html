<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shine欣 頭像大逃殺</title>
<style>
:root{--bg:#14161b;--panel:#1c1f26;--line:#2c313b;--txt:#eceef2;--sub:#9aa3b2;--gold:#e2c28a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:18px/1.6 "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
#wrap{display:flex;gap:18px;height:100%;padding:12px}
#stage{flex:1 1 auto;min-width:0;height:100%;display:flex;align-items:center;justify-content:center}
canvas{width:100%;max-height:100%;aspect-ratio:990/1280;object-fit:contain;display:block;background:radial-gradient(ellipse at 50% 55%,#2a2d38,#15171d);border-radius:16px}
#panel{flex:0 0 400px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
h2{margin:4px 0 10px;font-size:22px;color:var(--gold)}
h3{margin:18px 0 8px;font-size:19px;color:var(--gold)}
input,button{font:inherit}
input[type=text],input[type=number]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #3a404c;background:#252a33;color:#fff}
.btn{border:none;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer}
.go{width:100%;background:linear-gradient(180deg,#f0d29b,#c99a57);color:#1a1a1a;font-size:20px}
.red{width:100%;background:linear-gradient(180deg,#e2687a,#a83a4c);color:#fff;font-size:20px}
.ghost{background:#2c313b;color:var(--txt);font-size:16px;padding:8px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tip{color:var(--sub);font-size:15px}
label{display:block;margin-top:6px}
#log div{padding:5px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:16px}
#log img,#log .ph{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#2c313b}
#state{font-size:17px;color:#ffe08a;font-weight:700}
body.ov,body.ov #wrap{background:transparent!important}
body.ov #panel{display:none}
body.ov #wrap{padding:0}
body.ov #stage{height:100vh;align-items:flex-end;padding-bottom:2vh}
body.ov canvas{background:transparent;border-radius:0}
#ovState{display:none;position:fixed;left:6px;top:6px;font-size:13px;color:#fff;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:8px;transition:opacity 1s}
body.ov #ovState{display:block}
@media (max-width:900px){#wrap{flex-direction:column;height:auto}#stage{height:auto}#panel{flex:none}}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="cv" width="990" height="1280"></canvas></div>
  <div id="panel">
    <h2>⚔️ 頭像大逃殺</h2>
    <div id="state"></div>
    <div class="row" style="margin-top:8px"><button class="btn red" id="start">⚔️ 開戰！</button></div>
    <div class="row" style="margin-top:8px"><button class="btn go" id="newRound">🔄 開新的一輪（開放報名）</button></div>

    <h3>⚙️ 遊戲設定</h3>
    <label>獎品名稱<input type="text" id="prize" placeholder="例：購物金100元"></label>
    <label>對戰時間（秒，場地會在這段時間縮到最小）<input type="number" id="dur" min="15" max="180"></label>
    <label>報名後自動開戰（秒；0＝手動按開戰）<input type="number" id="auto" min="0" max="300"></label>
    <label>最少幾人才能開戰<input type="number" id="minP" min="2" max="50"></label>

    <h3>📡 自動接 FB 留言</h3>
    <div class="tip">報名中留言「加入關鍵字」就進場；進場後留言下面的字就強化（報名中、對戰中都可以）。裝備越多、等級越高越重，越難被擠下去。每樣最多 5 級。</div>
    <div class="row"><label style="flex:1">加入關鍵字<input type="text" id="kw"></label><label style="width:120px">同一樣強化幾秒算一次<input type="number" id="cd" min="0"></label></div>
    <label>🛡️ 鎧甲（逗號分開）<input type="text" id="armor"></label>
    <label>⚔️ 武器<input type="text" id="weapon"></label>
    <label>⛑️ 頭盔<input type="text" id="helmet"></label>
    <label>⭐ 升級（可放表情符號）<input type="text" id="level"></label>
    <label>連線代碼（Session ID）<input type="text" id="sid"></label>
    <div class="row" style="margin-top:8px"><button class="btn ghost" id="conn">開始接留言</button><span id="wsState" class="tip">未連線</span></div>
    <div class="row" style="margin-top:8px"><button class="btn ghost" id="copyOv">複製手機直播用網址</button><button class="btn ghost" id="copyRec">複製電腦紀錄用網址</button><span class="tip" id="ovTip"></span></div>
    <details style="margin-top:8px"><summary class="tip" style="cursor:pointer">不用直播，先模擬</summary>
      <div class="row" style="margin-top:6px"><button class="btn ghost" id="fake10">模擬 10 人報名</button><button class="btn ghost" id="fakeCheer">模擬隨機強化 10 次</button></div>
    </details>

    <h3>🏆 冠軍紀錄</h3>
    <div class="row"><button class="btn ghost" id="copyWin">複製冠軍名單</button><button class="btn ghost" id="clrWin">清空紀錄</button></div>
    <div id="log"></div>
  </div>
</div>
<div id="ovState"></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=720,H=1280,$=id=>document.getElementById(id);
const FONT='"Microsoft JhengHei","PingFang TC",sans-serif';
const LS=(k,d)=>{try{const v=localStorage.getItem('ar_'+k);return v?JSON.parse(v):d}catch(e){return d}};
const SV=(k,v)=>{try{localStorage.setItem('ar_'+k,JSON.stringify(v))}catch(e){}};
/* 一次性：獎品改成購物金10元、清空得獎紀錄（p10_done） */
(function(){try{const P='ar_';if(localStorage.getItem(P+'p10_done'))return;
  ['cfg','cfg2','cfgR'].forEach(k=>{const r=localStorage.getItem(P+k);if(!r)return;const o=JSON.parse(r);o['prize']='購物金10元';localStorage.setItem(P+k,JSON.stringify(o));});
  localStorage.removeItem(P+'wins');localStorage.setItem(P+'p10_done','1');}catch(e){}})();
const QS=new URLSearchParams(location.search),OV=QS.get('mode')==='overlay',REC=QS.get('mode')==='record';
const SERVER=QS.get('server')||'wss://io.socialstream.ninja';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const imgCache=new Map();function imgOf(s){if(!s)return null;if(!imgCache.has(s)){const im=new Image();im.referrerPolicy='no-referrer';im.src=s;imgCache.set(s,im);}return imgCache.get(s);}

/* ===== 設定 ===== */
const rid=()=>'shine'+Math.random().toString(36).slice(2,9);
let cfg=Object.assign({kw:'+1',cd:3,prize:'購物金10元',dur:45,auto:0,minP:3,armor:'衣服,外套,上衣',weapon:'包包,包',helmet:'帽子,帽',level:'喜歡,愛心,❤,♥,💕,💖,😍,🥰,💗,💓'},LS('cfg2',{}));
let sid=QS.get('session')||LS('sid','')||rid();SV('sid',sid);
if(OV){const c=LS('cfgR',null);if(c)Object.assign(cfg,c);}
let wins=LS('wins',[]);

/* ===== 場地與玩家 ===== */
const CX=360,CY=640,R0=335,RMIN=34;
let phase='lobby',players=[],R=R0,battleT0=0,firstJoin=0,winner=null,endAt=0,lastShove=0;
const pops=[],sparks=[];
const BR=()=>Math.max(16,Math.min(30,Math.sqrt(R0*R0*0.42/Math.max(1,players.length))));
function join(name,img){
  if(phase!=='lobby'||players.some(p=>p.name===name)||players.length>=80)return false;
  const a=Math.random()*Math.PI*2,d=Math.random()*(R0-40);
  players.push({name,img:img||'',x:CX+Math.cos(a)*d,y:CY-260-Math.random()*80,tx:CX+Math.cos(a)*d,ty:CY+Math.sin(a)*d,vx:0,vy:0,drop:0,alive:true,fall:0,mass:1,boost:0,lastCheer:0,armor:0,weapon:0,helmet:0,level:0,cdBy:{}});
  if(!firstJoin)firstJoin=performance.now();
  pops.push({x:W/2,y:110,t:`${name} 加入了！`,t0:performance.now(),c:'#9fe7a4'});addFeed(name,img||'','🔥 進場了','#9fe7a4');
  sendUp({arState:stateMsg()});renderUI();return true;
}
const GEAR={armor:['🥋','鎧甲'],weapon:['🔪','武器'],helmet:['🎩','頭盔'],level:['⭐','升級']},GMAX=5;
function power(p){return 1+0.35*p.armor+0.25*p.helmet+0.3*p.level+0.1*p.weapon;}
function gear(name,slot){
  if(phase==='end')return;const p=players.find(p=>p.name===name&&!p.fall);if(!p)return;
  const now=performance.now();if(p.cdBy[slot]!=null&&now-p.cdBy[slot]<cfg.cd*1000)return;p.cdBy[slot]=now;
  if(p[slot]>=GMAX){pops.push({x:p.x,y:p.y-40,t:`${GEAR[slot][1]}已滿級`,t0:now,c:'#cfd5df'});return;}
  p[slot]++;p.boost=now+900;addFeed(p.name,p.img,slot==='level'?`⭐ 升級 Lv${p.level+1}`:`${GEAR[slot][0]} ${GEAR[slot][1]}+1`,'#ffe08a');
  pops.push({x:p.x,y:p.y-44,t:slot==='level'?`⭐ 升級！Lv${p.level+1}`:`${GEAR[slot][0]} ${GEAR[slot][1]}+1`,t0:now,c:'#ffe08a'});
  for(let i=0;i<10;i++)sparks.push({x:p.x,y:p.y,vx:(Math.random()-.5)*300,vy:(Math.random()-.5)*300,t0:now,c:'#ffe08a'});
}
function cheer(name){const sl=['armor','weapon','helmet','level'][Math.floor(Math.random()*4)];gear(name,sl);}
function startBattle(){
  if(phase!=='lobby')return;if(players.length<Math.max(2,cfg.minP)){flash(`至少要 ${Math.max(2,cfg.minP)} 人才能開戰`);return;}
  phase='battle';battleT0=performance.now();players.forEach(p=>{p.drop=1;p.x=p.tx;p.y=p.ty;p.vx=(Math.random()-.5)*200;p.vy=(Math.random()-.5)*200;});
  pops.push({x:W/2,y:H/2,t:'⚔️ 開戰！',t0:performance.now(),c:'#ff8a8a',big:1});sendUp({arState:stateMsg()});renderUI();
}
function newRound(){clearFeed();phase='lobby';players=[];R=R0;winner=null;firstJoin=0;endAt=0;pops.length=0;sendUp({arState:stateMsg()});renderUI();}
function alive(){return players.filter(p=>p.alive&&!p.fall);}
function eliminate(p,now){p.fall=now;const left=alive().length;pops.push({x:p.x,y:p.y-30,t:`${p.name} 淘汰！`,t0:now,c:'#ff9a9a'});
  if(left<=1)finish(left===1?alive()[0]:p,now);sendUp({arState:stateMsg()});renderUI();}
function finish(p,now){if(phase!=='battle')return;phase='end';winner={n:p.name,s:p.img,prize:cfg.prize,count:players.length,t:Date.now()};endAt=now;
  for(let i=0;i<60;i++)sparks.push({x:CX,y:CY,vx:(Math.random()-.5)*900,vy:(Math.random()-.5)*900-200,t0:now,c:['#ffe08a','#ff8a8a','#9fe7a4','#8ac7ff'][i%4]});
  if(!REC){wins.unshift(winner);wins=wins.slice(0,200);SV('wins',wins);}sendUp({arWin:winner});renderUI();}
function stateMsg(){return{phase,joined:players.length,alive:alive().length,winner};}

/* ===== 物理（上帝視角，沒有重力） ===== */
function physics(dt,now){
  const br=BR();
  if(phase==='battle'){const k=Math.min(1,(now-battleT0)/(cfg.dur*1000));R=R0-(R0-RMIN)*k*k*(3-2*k);
    if(now-lastShove>900){lastShove=now;const al=alive();if(al.length){const p=al[Math.floor(Math.random()*al.length)];const a=Math.random()*Math.PI*2;const f=170/Math.sqrt(power(p));p.vx+=Math.cos(a)*f;p.vy+=Math.sin(a)*f;}}}
  for(const p of players){
    if(p.fall)continue;
    if(phase==='lobby'&&p.drop<1){p.drop=Math.min(1,p.drop+dt*2.2);const e=1-Math.pow(1-p.drop,3);p.x=p.tx;p.y=(CY-300)+(p.ty-(CY-300))*e;continue;}
    // 隨機走動
    const wf=220*dt*(phase==='battle'?1.6:1)/Math.sqrt(power(p));p.vx+=(Math.random()-.5)*wf;p.vy+=(Math.random()-.5)*wf;
    p.mass=power(p);
    p.vx*=Math.pow(.35,dt);p.vy*=Math.pow(.35,dt);{const cx=CX-p.x,cy=CY-p.y,cd2=Math.hypot(cx,cy)||1;const pull=90*dt*(cd2/R);p.vx+=cx/cd2*pull;p.vy+=cy/cd2*pull;}p.x+=p.vx*dt;p.y+=p.vy*dt;
    const dx=p.x-CX,dy=p.y-CY,d=Math.hypot(dx,dy);
    if(phase==='lobby'||phase==='end'){if(d>R-br){const nx=dx/d,ny=dy/d;p.x=CX+nx*(R-br);p.y=CY+ny*(R-br);const vn=p.vx*nx+p.vy*ny;if(vn>0){p.vx-=1.6*vn*nx;p.vy-=1.6*vn*ny;}}}
    else if(d>R)eliminate(p,now);
  }
  // 互撞（重的推輕的）
  const al=players.filter(p=>!p.fall&&(phase!=='lobby'||p.drop>=1));
  for(let i=0;i<al.length;i++)for(let j=i+1;j<al.length;j++){const a=al[i],b=al[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),md=br*2;
    if(d>0&&d<md){const nx=dx/d,ny=dy/d,o=md-d,tm=a.mass+b.mass;a.x-=nx*o*b.mass/tm;a.y-=ny*o*b.mass/tm;b.x+=nx*o*a.mass/tm;b.y+=ny*o*a.mass/tm;
      const vr=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(vr<0){const im=-1.9*vr/tm,wa=1+0.25*a.weapon,wb=1+0.25*b.weapon;a.vx-=im*b.mass*wb*nx;a.vy-=im*b.mass*wb*ny;b.vx+=im*a.mass*wa*nx;b.vy+=im*a.mass*wa*ny;
        if(-vr>140)sparks.push({x:a.x+nx*br,y:a.y+ny*br,vx:(Math.random()-.5)*300,vy:(Math.random()-.5)*300,t0:now,c:'#fff3b0'});}}}
}

/* ===== 畫面 ===== */
function drawBall(p,r,alpha,scale){
  const now=performance.now();ctx.save();ctx.globalAlpha=alpha;ctx.translate(p.x,p.y);ctx.scale(scale,scale);
  const lv=p.level||0,ar=p.armor||0;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(r*.15,r*.9,r*.95,r*.32,0,0,7);ctx.fill();
  if(lv>0||p.boost>now){ctx.shadowColor=lv>=3?'#ff9ad5':'#ffd34d';ctx.shadowBlur=10+lv*6+(p.boost>now?16:0);}
  const ring=3+ar*2.2;ctx.beginPath();ctx.arc(0,0,r+ring,0,7);{const base=ar===0?['#ffffff','#9aa4b0']:ar<3?['#e9eef3','#6f7b88']:ar<5?['#fff1c4','#a87a2a']:['#fff6b0','#c9900f'];const rg=ctx.createLinearGradient(-r,-r,r,r);rg.addColorStop(0,base[0]);rg.addColorStop(1,base[1]);ctx.fillStyle=rg;}ctx.fill();ctx.shadowBlur=0;
  if(ar>0){ctx.strokeStyle='rgba(60,60,70,.6)';ctx.lineWidth=1.5;for(let i=0;i<8;i++){const a=i/8*Math.PI*2;ctx.beginPath();ctx.arc(Math.cos(a)*(r+ring/2),Math.sin(a)*(r+ring/2),Math.max(1.2,ring/4),0,7);ctx.stroke();}}
  ctx.save();ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.clip();const im=imgOf(p.img);
  if(im&&im.complete&&im.naturalWidth)ctx.drawImage(im,-r,-r,r*2,r*2);else{ctx.fillStyle='#c9748a';ctx.fillRect(-r,-r,r*2,r*2);ctx.fillStyle='#fff';ctx.font=`bold ${r*0.9|0}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.name[0],0,1);}
  // 立體感：邊緣暗、左上反光（像玻璃球）
  {const sh=ctx.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r*1.02);sh.addColorStop(0,'rgba(255,255,255,0)');sh.addColorStop(.62,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=sh;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
   const hl=ctx.createRadialGradient(-r*.38,-r*.48,0,-r*.38,-r*.48,r*.62);hl.addColorStop(0,'rgba(255,255,255,.85)');hl.addColorStop(.35,'rgba(255,255,255,.35)');hl.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=hl;ctx.beginPath();ctx.ellipse(-r*.32,-r*.42,r*.55,r*.38,-0.6,0,7);ctx.fill();
   ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,r-1.5,0.9,2.3);ctx.stroke();}
  ctx.restore();
  if(p.helmet>0){const hs=r*(0.9+p.helmet*0.08);const hg=ctx.createLinearGradient(0,-r-hs*0.7,0,-r*0.35);hg.addColorStop(0,p.helmet>=4?'#ffe9a8':'#e6ebf1');hg.addColorStop(1,p.helmet>=4?'#b8862e':'#7d8794');ctx.fillStyle=hg;
    ctx.beginPath();ctx.ellipse(0,-r*0.72,hs*0.92,hs*0.5,0,Math.PI,0);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.5;ctx.stroke();
    if(p.helmet>=2){ctx.fillStyle='#d8343f';ctx.beginPath();ctx.ellipse(0,-r*0.72-hs*0.5,hs*0.16,hs*0.28,0,0,7);ctx.fill();}}
  if(p.weapon>0){ctx.save();ctx.translate(r*0.95,-r*0.1);ctx.rotate(-0.6);const L=r*(0.9+p.weapon*0.18);const sg=ctx.createLinearGradient(-3,0,3,0);sg.addColorStop(0,'#cfd6de');sg.addColorStop(1,'#8a949f');ctx.fillStyle=sg;
    ctx.beginPath();ctx.moveTo(-3.5,0);ctx.lineTo(3.5,0);ctx.lineTo(2,-L);ctx.lineTo(0,-L-7);ctx.lineTo(-2,-L);ctx.closePath();ctx.fill();ctx.fillStyle='#b8862e';ctx.fillRect(-8,-2,16,5);ctx.fillStyle='#5a3a1a';ctx.fillRect(-2.5,3,5,10);ctx.restore();}
  if(lv>0){ctx.font='bold 14px Arial';const t='Lv'+(lv+1),tw=ctx.measureText(t).width+10;ctx.fillStyle=lv>=3?'#c2185b':'#b8862e';rr(-r-6,-r-4,tw,18,9);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,-r-6+tw/2,-r+5);}
  const nm=p.name.length>6?p.name.slice(0,6)+'…':p.name;ctx.font='bold 15px '+FONT;const tw=ctx.measureText(nm).width+10;ctx.fillStyle='rgba(0,0,0,.65)';rr(-tw/2,r+ring+2,tw,20,10);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(nm,0,r+ring+12);
  ctx.restore();
}
const f1=s=>(String(s).split(/[,，]/)[0]||'').trim();
let toast=null;function flash(t){toast={t,at:performance.now()};}
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(!REC||!overlaySeen){
    if(phase==='lobby'&&cfg.auto>0&&firstJoin&&now-firstJoin>cfg.auto*1000&&players.length>=Math.max(2,cfg.minP))startBattle();
    for(let s=0;s<2;s++)physics(dt/2,now);
  }
  ctx.clearRect(0,0,W,H);
  // 場地
  const danger=phase==='battle'?Math.min(1,(now-battleT0)/(cfg.dur*1000)):0;
  ctx.save();ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(CX,CY+R*0.08+14,R+10,R*0.98+10,0,0,7);ctx.fill();
  const g=ctx.createRadialGradient(CX-R*.3,CY-R*.3,R*.1,CX,CY,R);g.addColorStop(0,'#5a4a7a');g.addColorStop(1,'#2a2140');ctx.fillStyle=g;ctx.beginPath();ctx.arc(CX,CY,R,0,7);ctx.fill();
  ctx.strokeStyle=phase==='battle'?`rgba(255,${120-danger*80|0},${120-danger*80|0},${.6+.4*Math.sin(now/150)})`:'#e2c28a';ctx.lineWidth=phase==='battle'?8:6;ctx.beginPath();ctx.arc(CX,CY,R,0,7);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=2;for(let rr2=60;rr2<R;rr2+=60){ctx.beginPath();ctx.arc(CX,CY,rr2,0,7);ctx.stroke();}
  ctx.restore();
  // 玩家
  const br=BR();
  for(const p of players){if(p.fall){const k=(now-p.fall)/700;if(k<1)drawBall(p,br,1-k,1-k*.6);continue;}drawBall(p,br,1,1);}
  // 特效
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i],k=(now-s.t0)/(phase==='end'?1600:400);if(k>1){sparks.splice(i,1);continue;}s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=(phase==='end'?600:0)*dt;ctx.globalAlpha=1-k;ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.x,s.y,phase==='end'?6:3,0,7);ctx.fill();ctx.globalAlpha=1;}
  for(let i=pops.length-1;i>=0;i--){const p=pops[i],k=(now-p.t0)/(p.big?1400:1100);if(k>1){pops.splice(i,1);continue;}ctx.globalAlpha=1-k;ctx.font=`bold ${p.big?70:24}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=6;ctx.strokeStyle='rgba(0,0,0,.65)';ctx.strokeText(p.t,p.x,p.y-k*30);ctx.fillStyle=p.c;ctx.fillText(p.t,p.x,p.y-k*30);ctx.globalAlpha=1;}
  // 下方標題（放下面，才不會被直播人數擋住）
  if(phase!=='end'){const k0=(cfg.kw.split(/[,，]/)[0]||'衝').trim();
    const t=phase==='lobby'?`🔥 留言「${k0}」加入大逃殺！ 已報名 ${players.length} 人`:`🔥 大逃殺中！ 剩 ${alive().length} 人`;
    bannerT(`強化：${f1(cfg.armor)}＝🥋鎧甲　${f1(cfg.weapon)}＝🔪武器`,H-160,30,'#fff','rgba(0,0,0,.62)');
    bannerT(`${f1(cfg.helmet)}＝🎩頭盔　${f1(cfg.level)}＝⭐升級`,H-102,30,'#fff','rgba(0,0,0,.62)');
    bannerT(t,H-40,34);
    if(phase==='lobby'&&cfg.auto>0&&firstJoin){const left=Math.max(0,Math.ceil(cfg.auto-(now-firstJoin)/1000));bannerT(`${left} 秒後開戰`,H-218,26,'#fff','rgba(0,0,0,.5)');}
    if(phase==='battle'){const left=Math.max(0,Math.ceil(cfg.dur-(now-battleT0)/1000));bannerT(left>0?`場地縮小中… ${left}`:'最後決戰！',H-218,26,'#ffb0b0','rgba(0,0,0,.5)');}}
  // 冠軍卡
  if(phase==='end'&&winner&&now-endAt>600){const k=Math.min(1,(now-endAt-600)/400),w=winner;ctx.save();ctx.translate(0,H/2-370);ctx.globalAlpha=k;
    ctx.fillStyle='rgba(12,14,22,.9)';rr(W/2-330,170,660,390,30);ctx.fill();ctx.strokeStyle='#f3d9a6';ctx.lineWidth=5;ctx.stroke();
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#f3d9a6';ctx.font='bold 44px '+FONT;ctx.fillText('👑 大逃殺冠軍！',W/2,232);
    const im=imgOf(w.s);ctx.save();ctx.beginPath();ctx.arc(W/2,330,62,0,7);ctx.clip();if(im&&im.complete&&im.naturalWidth)ctx.drawImage(im,W/2-62,268,124,124);else{ctx.fillStyle='#c9748a';ctx.fillRect(W/2-62,268,124,124);ctx.fillStyle='#fff';ctx.font='bold 56px '+FONT;ctx.fillText(w.n[0],W/2,333);}ctx.restore();ctx.beginPath();ctx.arc(W/2,330,62,0,7);ctx.strokeStyle='#ffe08a';ctx.lineWidth=5;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 38px '+FONT;ctx.fillText(`恭喜 ${w.n}`,W/2,432);
    ctx.fillStyle='#cfd5df';ctx.font='24px '+FONT;ctx.fillText(`從 ${w.count} 人中活到最後，獲得`,W/2,474);
    ctx.fillStyle='#ffe08a';ctx.font='bold 44px '+FONT;ctx.fillText(w.prize||'大獎',W/2,526);ctx.globalAlpha=1;ctx.restore();}
  if(REC&&overlaySeen){ctx.fillStyle='rgba(0,0,0,.55)';rr(W/2-300,H/2-25,600,50,25);ctx.fill();ctx.fillStyle='#fff';ctx.font='22px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(`手機上：${remote.phase==='lobby'?'報名中':remote.phase==='battle'?'對戰中':'已結束'}・報名 ${remote.joined} 人・剩 ${remote.alive} 人`,W/2,H/2);}
  if(toast){const age=now-toast.at;if(age>1800)toast=null;else{ctx.globalAlpha=Math.min(1,(1800-age)/300);ctx.fillStyle='rgba(0,0,0,.75)';ctx.font='bold 26px '+FONT;const tw=ctx.measureText(toast.t).width+40;rr(W/2-tw/2,H/2-28,tw,56,28);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(toast.t,W/2,H/2);ctx.globalAlpha=1;}}
  drawSide(now,`留言「${(cfg.kw.split(/[,，]/)[0]||"").trim()}」就會出現在這`);
  requestAnimationFrame(frame);
}
/* 置中文字條（自己算位置，iPhone 也不會跑掉；太長會自動縮小） */
function bannerT(t,y,size,col,bg){t=String(t).replace(/️/g,'');ctx.save();ctx.font=`bold ${size}px ${FONT}`;let w=ctx.measureText(t).width;const max=(typeof BT_MAX!=='undefined'?BT_MAX:W-30);
  if(w+40>max){size=Math.max(14,Math.floor(size*(max-40)/w));ctx.font=`bold ${size}px ${FONT}`;w=ctx.measureText(t).width;}
  const h=size+22,tw=w+40;ctx.fillStyle=bg||'rgba(0,0,0,.7)';rr(W/2-tw/2,y-h/2,tw,h,h/2);ctx.fill();ctx.fillStyle=col||'#ffe08a';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(t,W/2-w/2,y+1);ctx.restore();}
/* ===== 右側有效留言欄 ===== */
var feed=[],validN=0,feedNames=new Set();
function addFeed(name,img,txt,c){validN++;feedNames.add(name);feed.unshift({name,img,txt,c,t:performance.now()});if(feed.length>30)feed.length=30;}
function clearFeed(){feed=[];validN=0;feedNames=new Set();}
function drawSide(now,hint){
  // 直式版：字和頭像放大，手機上看得清楚
  const okI=im=>im&&im.complete&&im.naturalWidth>0;
  ctx.save();ctx.setTransform(1,0,0,1,0,0);const X=W+10,Y=6,PW=cv.width-X-6,PH=H-12;ctx.clearRect(W,0,cv.width-W,cv.height);
  ctx.fillStyle='rgba(10,14,24,.8)';rr(X,Y,PW,PH,20);ctx.fill();ctx.strokeStyle='rgba(243,217,166,.7)';ctx.lineWidth=2;ctx.stroke();
  const ppl=(typeof feedNames!=='undefined')?feedNames.size:new Set(feed.map(e=>e.name)).size;
  ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle='#f3d9a6';ctx.font='bold 34px '+FONT;ctx.fillText('💬 有效留言',X+14,Y+40);
  ctx.font='bold 23px '+FONT;ctx.fillStyle='#cfd5df';ctx.fillText(`${validN} 則・${ppl} 人`,X+14,Y+84);
  ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(X+12,Y+108,PW-24,2);
  const RH=86,top=Y+120,maxR=Math.floor((PH-128)/RH);
  if(!feed.length){ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='22px '+FONT;const t=/mode=record/.test(location.search)?'（實際留言看手機直播畫面）':(hint||'有效留言會出現在這');for(let k=0;k*9<t.length;k++)ctx.fillText(t.slice(k*9,k*9+9),X+14,top+30+k*34);}
  feed.slice(0,maxR).forEach((e,i)=>{const age=now-e.t,a=Math.min(1,age/250),y=top+i*RH-(1-a)*20;ctx.globalAlpha=a*(i>=maxR-2?0.55:1);
    if(age<1200){ctx.fillStyle=`rgba(255,224,138,${.22*(1-age/1200)})`;rr(X+6,y,PW-12,RH-8,14);ctx.fill();}
    const r=32,cx=X+12+r,cy=y+(RH-8)/2;const im=imgOf(e.img);ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.clip();
    if(okI(im))ctx.drawImage(im,cx-r,cy-r,r*2,r*2);else{ctx.fillStyle='#c9748a';ctx.fillRect(cx-r,cy-r,r*2,r*2);ctx.fillStyle='#fff';ctx.font='bold 30px '+FONT;ctx.textAlign='center';ctx.fillText(e.name[0]||'?',cx,cy+1);ctx.textAlign='left';}ctx.restore();
    ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=3;ctx.stroke();
    const nm=e.name.length>5?e.name.slice(0,5)+'…':e.name;ctx.fillStyle='#fff';ctx.font='bold 27px '+FONT;ctx.fillText(nm,cx+r+10,cy-16);ctx.fillStyle=e.c;ctx.font='bold 23px '+FONT;ctx.fillText(String(e.txt).replace(/️/g,''),cx+r+10,cy+18);ctx.globalAlpha=1;});
  ctx.restore();
}
requestAnimationFrame(frame);

/* ===== 留言 ===== */
function onComment(name,msg,img){try{if(window.parent!==window&&window.parent.__hubPaused)return;}catch(e){}
  name=(name||'').trim();msg=String(msg||'').replace(/<img[^>]*alt="([^"]*)"[^>]*>/gi,'$1').replace(/<[^>]*>/g,'').replace(/️/g,'');if(!name)return;
  const has=list=>String(list).replace(/\uFE0F/g,'').split(/[,，]/).map(s=>s.trim()).filter(Boolean).some(k=>k==='*'||msg.includes(k));
  if(phase==='lobby'&&has(cfg.kw))join(name,img);
  for(const sl of ['armor','weapon','helmet','level'])if(has(cfg[sl]))gear(name,sl);
}
/* ===== 連線 ===== */
let ws=null,cmdWs=null,recWs=null,overlaySeen=false,remote={phase:'lobby',joined:0,alive:0};
function setState(t){$('wsState').textContent=t;$('ovState').textContent=t;}
function sendUp(o){if(OV&&ws&&ws.readyState===1){try{ws.send(JSON.stringify(o));}catch(e){}}}
function sendDown(o){if(recWs&&recWs.readyState===1){try{recWs.send(JSON.stringify(o));}catch(e){}}}
function connect(){try{ws&&ws.close();}catch(e){}setState('連線中…');ws=new WebSocket(SERVER);
  ws.onopen=()=>{ws.send(JSON.stringify({join:sid,in:4,out:5}));setState('✅ 已連線，等留言中（代碼 '+sid+'）');$('conn').textContent='已連線';};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(x){return;}const d=m.overlayNinja||m;if(d&&(d.chatname||d.chatmessage))onComment(d.chatname,d.chatmessage,d.chatimg);};
  ws.onclose=()=>{setState('⚠️ 斷線，3 秒後重連…');setTimeout(connect,3000);};}
function listenCmd(){cmdWs=new WebSocket(SERVER);cmdWs.onopen=()=>cmdWs.send(JSON.stringify({join:sid,in:6,out:7}));
  cmdWs.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(x){return;}const d=m.overlayNinja||m;
    if(d.arCfg){Object.assign(cfg,d.arCfg);SV('cfgR',cfg);renderUI();sendUp({arCfgNow:cfg});}
    if(d.arCmd==='start')startBattle();if(d.arCmd==='new')newRound();
    if(d.arCmd==='fake'){for(let i=0;i<10;i++)join('測試'+Math.floor(Math.random()*1000),'');}
    if(d.arCmd==='cheer'){for(let i=0;i<10;i++){const al=players.filter(p=>!p.fall);if(al.length){const q=al[Math.floor(Math.random()*al.length)];q.cdBy={};cheer(q.name);}}}
    if(d.arCmd==='sync')sendUp({arCfgNow:cfg});if(d.arCmd==='sync')sendUp({arState:stateMsg()});};
  cmdWs.onclose=()=>setTimeout(listenCmd,4000);}
function listenRec(){recWs=new WebSocket(SERVER);recWs.onopen=()=>{recWs.send(JSON.stringify({join:sid,in:5,out:6}));setTimeout(()=>{sendDown({arCmd:'sync'});},300);};
  recWs.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(x){return;}const d=m.overlayNinja||m;if(d.arCfgNow)adoptCfg(d.arCfgNow);
    if(d.arState||d.arWin){lastOv=Date.now();if(!overlaySeen){overlaySeen=true;setState('📋 紀錄模式：已連上手機（代碼 '+sid+'）');}}
    if(d.arState){remote=d.arState;renderUI();}
    if(d.arWin){if(!wins.some(w=>w.t===d.arWin.t)){wins.unshift(d.arWin);SV('wins',wins);}remote.phase='end';remote.winner=d.arWin;renderUI();}};
  recWs.onclose=()=>setTimeout(listenRec,4000);}
function pushCfg(){sendDown({arCfg:{kw:cfg.kw,cd:cfg.cd,prize:cfg.prize,dur:cfg.dur,auto:cfg.auto,minP:cfg.minP,armor:cfg.armor,weapon:cfg.weapon,helmet:cfg.helmet,level:cfg.level}});}

/* ===== 介面 ===== */
function renderUI(){
  const st=(REC&&overlaySeen)?remote:stateMsg();
  $('state').textContent=st.phase==='lobby'?`報名中：已報名 ${st.joined} 人`:st.phase==='battle'?`對戰中：剩 ${st.alive} / ${st.joined} 人`:`已結束：冠軍 ${st.winner?st.winner.n:''}`;
  $('log').innerHTML=wins.map(w=>`<div>${w.s?`<img src="${esc(w.s)}" referrerpolicy="no-referrer">`:'<span class="ph"></span>'}<span>${esc(w.n)}</span><span class="tip">${w.count} 人中</span><span style="margin-left:auto;color:var(--gold);font-weight:700">${esc(w.prize||'')}</span></div>`).join('')||'<div class="tip">還沒有冠軍</div>';
}
['kw','cd','prize','dur','auto','minP','armor','weapon','helmet','level'].forEach(k=>$(k).value=cfg[k]);$('sid').value=sid;
['kw','cd','prize','dur','auto','minP','armor','weapon','helmet','level'].forEach(k=>$(k).addEventListener('change',()=>{const v=$(k).value;cfg[k]=['kw','prize','armor','weapon','helmet','level'].includes(k)?(v.trim()||(k==='kw'?'+1':'')):Math.max(0,+v||0);SV('cfg2',cfg);pushCfg();renderUI();}));
$('sid').onchange=()=>{sid=$('sid').value.trim()||rid();$('sid').value=sid;SV('sid',sid);};
const remoteMode=()=>REC&&overlaySeen;
$('start').onclick=()=>{if(remoteMode())sendDown({arCmd:'start'});else startBattle();};
$('newRound').onclick=()=>{if(remoteMode())sendDown({arCmd:'new'});else newRound();};
$('fake10').onclick=()=>{if(remoteMode())sendDown({arCmd:'fake'});else for(let i=0;i<10;i++)join('測試'+Math.floor(Math.random()*1000),'');};
$('fakeCheer').onclick=()=>{if(remoteMode())sendDown({arCmd:'cheer'});else for(let i=0;i<10;i++){const al=players.filter(p=>!p.fall);if(al.length){const q=al[Math.floor(Math.random()*al.length)];q.cdBy={};cheer(q.name);}}};
$('conn').onclick=()=>{connect();};
const base=()=>location.href.split('?')[0];
function copy(u){navigator.clipboard.writeText(u).then(()=>{$('ovTip').textContent='已複製 ✓';setTimeout(()=>$('ovTip').textContent='',2000);});}
$('copyOv').onclick=()=>copy(`${base()}?mode=overlay&session=${encodeURIComponent(sid)}&v=1`);
$('copyRec').onclick=()=>copy(`${base()}?mode=record&session=${encodeURIComponent(sid)}`);
$('copyWin').onclick=()=>copy(wins.slice().reverse().map(w=>`${w.n}　${w.prize}（${w.count} 人中）`).join('\n')||'目前沒有');
$('clrWin').onclick=()=>{if(confirm('清空冠軍紀錄？')){wins=[];SV('wins',wins);renderUI();}};

/* ===== 啟動 ===== */
renderUI();
if(OV){document.body.classList.add('ov');document.documentElement.style.background='transparent';connect();listenCmd();setTimeout(()=>$('ovState').style.opacity=0,8000);}
else if(REC){listenRec();$('conn').style.display='none';setState('📋 紀錄模式：還沒偵測到手機上的大逃殺（現在按按鈕會在這頁自己跑）');}
else if(QS.get('session')){connect();}

/* 紀錄頁：一直確認手機有沒有在線（手機晚開、或總台切換遊戲也能接上） */
var lastOv=0;
if(REC)setInterval(()=>{sendDown({arCmd:'sync'});if(overlaySeen&&Date.now()-lastOv>15000){overlaySeen=false;setState('📋 紀錄模式：還沒偵測到手機（現在按按鈕會在這頁自己跑）');try{renderUI();}catch(e){}}},4000);

/* 手機直播畫面：用程式算大小（iPhone 不會超出框、字不會被切掉）；總台可切換「填滿」 */
if(OV){window.__fill=window.__fill||false;window.__fit=function(){const c=document.getElementById('cv');if(!c)return;const vw=innerWidth,vh=innerHeight;let w,h;
  if(window.__fill){w=vw;h=vh;}else{const s=Math.min(vw/c.width,vh/c.height)*0.9;w=c.width*s;h=c.height*s;}
  Object.assign(c.style,{position:'fixed',left:((vw-w)/2)+'px',top:((vh-h)/2)+'px',width:w+'px',height:h+'px',maxHeight:'none',aspectRatio:'auto',objectFit:'fill',transform:'none',margin:'0'});};
  addEventListener('resize',window.__fit);setInterval(window.__fit,1000);window.__fit();}

/* 兩台電腦同步：以手機上的設定為準，大家都跟著手機 */
var _lastCfgJ='';
function adoptCfg(c){const j=JSON.stringify(c);if(j===_lastCfgJ)return;_lastCfgJ=j;
  for(const k in c){if(!(k in cfg))continue;cfg[k]=c[k];const el=document.getElementById(k);if(!el||el===document.activeElement)continue;if(el.type==='checkbox')el.checked=!!c[k];else el.value=c[k];}
  SV('cfg',cfg);try{renderUI();}catch(e){}}
</script>
