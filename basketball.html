<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="遊戲盒">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>籃球轉生記</title>
<style>
  :root { --bg:#10131a; --card:#1a1f29; --card2:#252c38; --ink:#eaeef4; --muted:#95a1b3; --gold:#ffb84d; --red:#ef6461; --blue:#5aa9ff; --green:#6fd08c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; font-size:17px; user-select:none; -webkit-user-select:none; }
  .wrap { max-width:540px; margin:0 auto; padding:12px 12px 40px; }
  .hide { display:none !important; }
  h1 { text-align:center; font-size:40px; margin:10px 0 4px; color:var(--gold); }
  h2 { margin:6px 0 12px; color:var(--gold); font-size:24px; }
  .sub { text-align:center; color:var(--muted); margin-bottom:20px; }
  button { font-family:inherit; background:var(--gold); color:#2a1600; border:0; border-radius:12px; padding:13px 16px; font-size:18px; font-weight:800; cursor:pointer; }
  button.ghost { background:var(--card2); color:var(--ink); border:1px solid #333d4c; }
  button:disabled { opacity:.35; }
  .col { display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; gap:8px; }
  .card { background:var(--card); border:1px solid #29313e; border-radius:14px; padding:14px; margin-bottom:12px; }
  .muted { color:var(--muted); } .good { color:var(--green); } .bad { color:var(--red); } .gold { color:var(--gold); }
  input { width:100%; font-family:inherit; font-size:20px; padding:12px; border-radius:10px; border:1px solid #333d4c; background:#0b0e13; color:var(--ink); }
  .lb { color:var(--muted); font-size:15px; margin:14px 0 6px; display:block; }
  .opt { text-align:left; background:var(--card2); color:var(--ink); border:2px solid transparent; font-weight:700; font-size:17px; }
  .opt.sel { border-color:var(--gold); }
  .opt small { display:block; color:var(--muted); font-weight:400; font-size:14px; margin-top:2px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .grid2 button { text-align:left; padding:12px 10px; font-size:16px; line-height:1.3; }
  .grid2 button small { display:block; font-size:13px; color:var(--muted); font-weight:400; }
  .stat { display:flex; align-items:center; gap:8px; margin:5px 0; font-size:16px; }
  .stat .l { width:44px; color:var(--muted); }
  .bar { flex:1; height:10px; background:#0b0e13; border-radius:6px; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:6px; }
  .stat .v { width:36px; text-align:right; font-weight:800; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { background:var(--card2); border-radius:8px; padding:5px 9px; font-size:15px; }
  .art { width:100%; display:block; border-radius:14px; margin-bottom:12px; }
  .prof { display:flex; gap:12px; align-items:center; }
  .prof svg { width:84px; height:84px; flex:none; border-radius:16px; }
  .scene { position:fixed; inset:0; background:rgba(8,10,14,.96); z-index:10; overflow-y:auto; }
  .scene .inner { max-width:540px; margin:0 auto; padding:16px 14px 40px; }
  .story { font-size:18px; line-height:1.8; white-space:pre-wrap; margin-bottom:16px; }
  .choice { text-align:left; background:var(--card2); color:var(--ink); border:1px solid #333d4c; }
  .choice small { display:block; color:var(--muted); font-weight:400; font-size:14px; margin-top:3px; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  td,th { padding:6px 3px; border-bottom:1px solid #29313e; text-align:center; }
  th { color:var(--muted); font-weight:600; }
  #game { position:fixed; inset:0; background:var(--bg); z-index:8; overflow-y:auto; }
  #game .inner { max-width:540px; margin:0 auto; padding:8px 10px 24px; }
  .sb { display:flex; justify-content:space-between; align-items:center; background:var(--card); border-radius:12px; padding:8px 12px; }
  .sb .t { font-size:13px; color:var(--muted); }
  .sb .s { font-size:28px; font-weight:900; font-variant-numeric:tabular-nums; }
  #court { width:100%; display:block; border-radius:12px; margin:8px 0; }
  .sit { font-size:17px; line-height:1.6; margin:4px 2px; }
  .hint { background:#1d2531; border-left:4px solid var(--gold); border-radius:8px; padding:8px 10px; font-size:15px; margin:6px 0; }
  .acts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .acts button { padding:12px 8px; font-size:17px; line-height:1.25; }
  .acts button small { display:block; font-size:12px; font-weight:600; opacity:.75; }
  .meter { position:relative; height:24px; background:#0b0e13; border-radius:12px; overflow:hidden; margin:8px 0; }
  .meter .z1 { position:absolute; top:0; bottom:0; left:65%; width:35%; background:rgba(111,208,140,.3); }
  .meter .z2 { position:absolute; top:0; bottom:0; background:rgba(255,184,77,.9); }
  .meter .cur { position:absolute; top:-2px; bottom:-2px; width:5px; background:#fff; border-radius:3px; }
  #release { width:100%; padding:18px; font-size:21px; touch-action:none; }
  .res { text-align:center; font-size:24px; font-weight:900; min-height:32px; }
  .plog { font-size:14px; color:var(--muted); line-height:1.6; max-height:96px; overflow-y:auto; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="sTitle">
    <div id="titleArt"></div>
    <h1>🏀 籃球轉生記</h1>
    <div class="sub">打不進職業，就再活一次</div>
    <div class="col">
      <button id="bNew">新的人生</button>
      <button class="ghost" id="bCont">繼續</button>
      <button class="ghost" id="bHall">歷代球員</button>
    </div>
    <div class="card muted" style="margin-top:18px;line-height:1.8;font-size:16px">
      高中三年練球、打聯賽，爭取選秀。進了職業，從板凳一路打到球隊核心。<br>
      比賽中你親自操作關鍵回合：<b class="gold">投籃、切入、傳球</b>，或在防守時猜對手的動作。<br>
      退役或落選後轉生，前世的記憶會變成天賦。
    </div>
  </div>

  <div id="sCreate" class="hide">
    <h2>新的球員</h2>
    <div id="legacy"></div>
    <div class="prof card" id="cAvatar"></div>
    <label class="lb">姓名</label>
    <div class="row"><input id="iName" maxlength="6"><button class="ghost" id="bRnd" style="white-space:nowrap">隨機</button></div>
    <label class="lb">位置</label>
    <div class="col" id="posPick"></div>
    <label class="lb">外型</label>
    <div class="row"><button class="ghost" id="bLook" style="flex:1">換個髮型膚色</button></div>
    <button id="bStart" style="width:100%;margin-top:16px">入學</button>
  </div>

  <div id="sHub" class="hide">
    <div id="hArt"></div>
    <div class="card prof"><div id="hAvatar"></div><div style="flex:1"><div style="font-size:24px;font-weight:900" id="hName"></div><div class="muted" id="hSub"></div><div id="hWhen" style="margin-top:4px"></div></div></div>
    <div class="card" id="hStats"></div>
    <div class="card hide" id="hNote" style="font-size:16px;line-height:1.6"></div>
    <div class="grid2" id="hActs"></div>
    <div class="card" id="hSeason" style="margin-top:12px"></div>
  </div>

  <div id="sHall" class="hide">
    <h2>歷代球員</h2>
    <div id="hallList"></div>
    <button class="ghost" id="bHallBack" style="width:100%">返回</button>
  </div>
</div>

<div class="scene hide" id="scene"><div class="inner" id="sceneIn"></div></div>

<div id="game" class="hide"><div class="inner">
  <div class="sb">
    <div><div class="t" id="gHome"></div><div class="s" id="gOur"></div></div>
    <div style="text-align:center"><div style="font-weight:900;font-size:18px" id="gQ"></div><div class="t" id="gLeft"></div></div>
    <div style="text-align:right"><div class="t" id="gAway"></div><div class="s" id="gOpp"></div></div>
  </div>
  <canvas id="court" width="600" height="520"></canvas>
  <div class="res" id="gRes"></div>
  <div class="sit" id="gSit"></div>
  <div class="hint" id="gHint"></div>
  <div class="acts" id="gActs"></div>
  <div id="gShoot" class="hide">
    <div class="meter"><div class="z1"></div><div class="z2" id="mz2"></div><div class="cur" id="mcur"></div></div>
    <button id="release">按住出手・放開</button>
  </div>
  <div class="row" style="margin-top:10px"><button class="ghost" id="gSim" style="flex:1;font-size:15px">快速模擬剩下比賽</button></div>
  <div class="plog" id="gLog"></div>
</div></div>

<script>
// ===================== 工具 =====================
const rnd = (a,b) => a + Math.random()*(b-a), ri = (a,b) => Math.floor(rnd(a,b+1)), pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const SUR = ['林','陳','黃','張','李','王','吳','劉','蔡','楊','許','鄭','謝','郭','洪','曾','邱','廖','賴','周','高','簡','游','韋'];
const GIV = ['承','宇','翔','哲','皓','睿','恩','昊','俊','浩','東','賢','成','勳','振','凱','佑','廷','晨','祐','澤','碩','岳','騰'];
const randName = () => pick(SUR) + pick(GIV) + pick(GIV);
const TEAMS = [ { n:'台港海鷗', c:'#3fa7d6' }, { n:'山城猛虎', c:'#f29e4c' }, { n:'北境雪狼', c:'#9aa5b1' }, { n:'南灣巨鯨', c:'#2f6fb5' }, { n:'中原雷鳴', c:'#f1c40f' }, { n:'東岸飛鷹', c:'#c0392b' }, { n:'西嶺黑熊', c:'#5d4037' }, { n:'星城閃電', c:'#8e44ad' } ];
const SCHOOLS = [ { n:'青嶺高中', c:'#2e86de' }, { n:'海星高中', c:'#10ac84' }, { n:'白楊工商', c:'#ee5253' }, { n:'明德高中', c:'#5f27cd' }, { n:'鳳鳴實中', c:'#ff9f43' }, { n:'大成高中', c:'#222f3e' } ];
const STATS = { shoot:'投籃', three:'三分', drive:'切入', pass:'傳球', def:'防守', ath:'體能' };
const POS = {
  G: { n:'後衛', d:'控球組織、三分外線。傳球與三分起點較高', h:[180,188], base:{ shoot:2, three:5, drive:2, pass:6, def:0, ath:0 }, w:{ shoot:0.2, three:0.22, drive:0.15, pass:0.23, def:0.1, ath:0.1 } },
  F: { n:'前鋒', d:'全能得分手。投籃與切入起點較高', h:[192,200], base:{ shoot:5, three:2, drive:5, pass:1, def:2, ath:2 }, w:{ shoot:0.24, three:0.14, drive:0.24, pass:0.1, def:0.14, ath:0.14 } },
  C: { n:'中鋒', d:'禁區霸主。防守、籃板與體能起點較高', h:[203,212], base:{ shoot:2, three:-4, drive:4, pass:0, def:6, ath:6 }, w:{ shoot:0.18, three:0.04, drive:0.26, pass:0.08, def:0.24, ath:0.2 } },
};
const MEMORIES = {
  HS_CHAMP:  { n:'體育館的歡呼', from:'高中聯賽奪冠', t:'大心臟', d:'出手完美判定區變寬' },
  DRAFT1:    { n:'選秀會的聚光燈', from:'首輪被選中', t:'天生彈性', d:'起始切入 +6' },
  UNDRAFTED: { n:'沒被唸到名字的夜晚', from:'選秀落選', t:'不屈', d:'受傷機率 -35%' },
  P40:       { n:'四十分之夜', from:'單場 40 分', t:'得分本能', d:'投籃、三分成長 +25%' },
  TD:        { n:'大三元', from:'單場得分、籃板、助攻都上雙', t:'全能', d:'所有能力起始 +2' },
  MVP:       { n:'年度最有價值球員', from:'奪得 MVP', t:'王者氣場', d:'教練起始信任 +25、隊友投籃命中提升' },
  DPOY:      { n:'鐵壁', from:'單季抄截＋阻攻平均 3 次以上', t:'防守天才', d:'防守成長 +25%' },
  RIVAL:     { n:'宿敵', from:'一季內三度守住宿敵', t:'讀心', d:'教練的戰術判讀更準' },
  LONG:      { n:'十年老將', from:'職業生涯十年', t:'不老', d:'體能衰退延後兩年' },
};

// ===================== 插圖（SVG） =====================
function srand(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }
function art(kind, color = '#5aa9ff', seed = 7) {
  const R = srand(seed); const W = 400, H = 170;
  let g = '';
  const floor = (y, c1, c2) => { let s = `<polygon points="0,${y} ${W},${y} ${W},${H} 0,${H}" fill="${c1}"/>`; for (let i = -10; i <= 10; i++) s += `<line x1="${W/2 + i*20}" y1="${y}" x2="${W/2 + i*70}" y2="${H}" stroke="${c2}" stroke-width="1"/>`; return s; };
  const hoop = (x, y, s = 1) => `<g transform="translate(${x},${y}) scale(${s})"><rect x="-4" y="0" width="8" height="90" fill="#555"/><rect x="-30" y="-36" width="60" height="40" rx="3" fill="#e8eef5" stroke="#999"/><rect x="-12" y="-22" width="24" height="16" fill="none" stroke="#ef6461" stroke-width="2"/><ellipse cx="0" cy="6" rx="14" ry="4" fill="none" stroke="#ef6461" stroke-width="3"/><path d="M-13 7 L-8 24 M13 7 L8 24 M-4 8 L-3 24 M4 8 L3 24" stroke="#ddd" stroke-width="1.2"/></g>`;
  const ball = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#e8742a"/><path d="M${x-r} ${y} H${x+r} M${x} ${y-r} V${y+r} M${x-r*0.7} ${y-r*0.7} Q${x} ${y} ${x-r*0.7} ${y+r*0.7} M${x+r*0.7} ${y-r*0.7} Q${x} ${y} ${x+r*0.7} ${y+r*0.7}" stroke="#3a1d0a" stroke-width="1.2" fill="none"/>`;
  if (kind === 'gym') {
    g += `<rect width="${W}" height="${H}" fill="#1c2230"/>`;
    for (let i = 0; i < 5; i++) g += `<rect x="${30 + i*72}" y="14" width="46" height="40" rx="3" fill="#2d3b52"/><line x1="${53 + i*72}" y1="14" x2="${53 + i*72}" y2="54" stroke="#1c2230" stroke-width="3"/>`;
    g += `<rect x="0" y="62" width="${W}" height="10" fill="${color}" opacity=".8"/>` + floor(96, '#8a5a32', '#7a4e2b') + hoop(330, 40, 0.9);
    g += `<rect x="40" y="104" width="70" height="30" rx="4" fill="#333"/>` + [0,1,2].map(i => ball(55 + i*20, 100, 9)).join('');
  } else if (kind === 'arena') {
    g += `<rect width="${W}" height="${H}" fill="#0c0f16"/>`;
    for (let r = 0; r < 6; r++) for (let i = 0; i < 46; i++) g += `<circle cx="${i*9 + (r%2)*4}" cy="${16 + r*11}" r="3.3" fill="${pick([color,'#eaeef4','#ef6461','#ffb84d','#5aa9ff','#444'])}" opacity="${0.4 + R()*0.6}"/>`;
    g += `<polygon points="60,0 90,0 150,100 20,100" fill="#fff" opacity=".05"/><polygon points="310,0 340,0 380,100 250,100" fill="#fff" opacity=".05"/>`;
    g += floor(90, '#9a6a3c', '#8a5d33') + `<ellipse cx="200" cy="135" rx="70" ry="18" fill="none" stroke="#f1e6d6" stroke-width="2" opacity=".7"/><circle cx="200" cy="135" r="6" fill="${color}"/>`;
    g += `<rect x="150" y="2" width="100" height="26" rx="4" fill="#111" stroke="#333"/><text x="200" y="20" fill="#ffb84d" font-size="14" text-anchor="middle" font-weight="900" font-family="monospace">GAME DAY</text>`;
  } else if (kind === 'draft') {
    g += `<rect width="${W}" height="${H}" fill="#07080c"/>`;
    for (let i = 0; i < 14; i++) g += `<rect x="${i*30}" y="0" width="22" height="120" fill="#3a0d14" opacity=".8"/>`;
    g += `<polygon points="185,0 215,0 290,170 110,170" fill="#ffe9b0" opacity=".18"/><rect x="0" y="120" width="${W}" height="50" fill="#141820"/>`;
    g += `<rect x="168" y="96" width="64" height="58" rx="4" fill="#242c3a"/><circle cx="200" cy="118" r="13" fill="none" stroke="${color}" stroke-width="3"/>${ball(200, 118, 7)}`;
    g += `<text x="200" y="40" fill="#ffb84d" font-size="22" text-anchor="middle" font-weight="900">選秀會</text>`;
  } else if (kind === 'trophy') {
    g += `<rect width="${W}" height="${H}" fill="#120f08"/>`;
    for (let i = 0; i < 60; i++) g += `<rect x="${R()*W}" y="${R()*H}" width="5" height="9" fill="${pick(['#ffb84d','#5aa9ff','#ef6461','#6fd08c','#fff'])}" transform="rotate(${R()*90} ${R()*W} ${R()*H})" opacity=".85"/>`;
    g += `<path d="M170 40 H230 V70 Q230 100 200 104 Q170 100 170 70 Z" fill="#f2c14e"/><path d="M170 50 Q150 50 152 66 Q155 80 172 82 M230 50 Q250 50 248 66 Q245 80 228 82" stroke="#f2c14e" stroke-width="6" fill="none"/><rect x="194" y="104" width="12" height="20" fill="#d9a632"/><rect x="176" y="124" width="48" height="14" rx="2" fill="#8a6a1f"/>`;
  } else if (kind === 'school') {
    g += `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1f3a"/><stop offset="1" stop-color="#c46a4a"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#sky)"/>`;
    g += `<rect x="60" y="54" width="280" height="90" fill="#2a2f3a"/>`; for (let r = 0; r < 3; r++) for (let i = 0; i < 9; i++) g += `<rect x="${74 + i*30}" y="${64 + r*24}" width="18" height="14" fill="${R() < 0.4 ? '#ffd88a' : '#3c4454'}"/>`;
    g += `<rect x="190" y="30" width="20" height="24" fill="#2a2f3a"/><line x1="350" y1="30" x2="350" y2="144" stroke="#bbb" stroke-width="2"/><rect x="350" y="30" width="26" height="16" fill="${color}"/><rect x="0" y="144" width="${W}" height="26" fill="#1b1e25"/>`;
  } else if (kind === 'injury') {
    g += `<rect width="${W}" height="${H}" fill="#151c22"/><rect x="0" y="120" width="${W}" height="50" fill="#1e262e"/><rect x="100" y="96" width="200" height="30" rx="6" fill="#d6dde4"/><rect x="100" y="86" width="40" height="18" rx="6" fill="#fff"/><rect x="110" y="126" width="8" height="30" fill="#777"/><rect x="282" y="126" width="8" height="30" fill="#777"/>`;
    g += `<rect x="300" y="20" width="44" height="44" rx="8" fill="#ef6461"/><rect x="316" y="28" width="12" height="28" fill="#fff"/><rect x="308" y="36" width="28" height="12" fill="#fff"/>`;
  } else if (kind === 'night') {
    g += `<rect width="${W}" height="${H}" fill="#06070a"/><polygon points="190,0 210,0 300,170 100,170" fill="#ffe9b0" opacity=".12"/>` + floor(110, '#3d2a1a', '#33230f') + hoop(200, 40, 0.8) + ball(150, 150, 10);
  }
  return `<svg class="art" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}
const SKIN = ['#f1c9a5','#e0ac7e','#c68a5c','#8d5a3b','#5b3a26'];
const HAIRC = ['#1b1b1b','#3b2416','#6b4a2b','#c9a066','#1b1b1b'];
function avatar(look, color, num) {
  const s = SKIN[look.skin], h = HAIRC[look.hc];
  let hair = '';
  if (look.hair === 0) hair = `<path d="M30 40 Q30 18 50 17 Q70 18 70 40 Q68 28 50 27 Q32 28 30 40Z" fill="${h}"/>`;
  if (look.hair === 1) hair = `<path d="M31 36 Q32 20 50 20 Q68 20 69 36 Q60 30 50 30 Q40 30 31 36Z" fill="${h}" opacity=".85"/>`;
  if (look.hair === 2) hair = `<g fill="${h}">${[...Array(11)].map((_, i) => `<circle cx="${32 + i*3.6}" cy="${24 + Math.abs(i-5)*1.6}" r="6"/>`).join('')}</g>`;
  if (look.hair === 3) hair = `<path d="M29 44 Q26 16 50 15 Q74 16 71 44 L70 34 Q60 24 40 26 Q32 30 30 44Z" fill="${h}"/><rect x="29" y="30" width="42" height="5" fill="${color}"/>`;
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#222a36"/>
    <path d="M14 100 Q16 72 50 70 Q84 72 86 100Z" fill="${color}"/><path d="M38 70 L50 82 L62 70" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="50" y="96" font-size="14" font-weight="900" text-anchor="middle" fill="#fff" font-family="sans-serif">${num}</text>
    <rect x="43" y="56" width="14" height="16" fill="${s}"/><ellipse cx="50" cy="42" rx="19" ry="22" fill="${s}"/>
    <ellipse cx="31" cy="44" rx="3" ry="5" fill="${s}"/><ellipse cx="69" cy="44" rx="3" ry="5" fill="${s}"/>${hair}
    <path d="M40 37 h7 M53 37 h7" stroke="#2a1a10" stroke-width="2.2" stroke-linecap="round"/><circle cx="43.5" cy="43" r="2.2" fill="#1a1a1a"/><circle cx="56.5" cy="43" r="2.2" fill="#1a1a1a"/>
    <path d="M45 54 Q50 57 55 54" stroke="#6b3a2a" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
}

// ===================== 存檔 =====================
let C = null, LEG = { lives:[], talents:[], inherit:null };
try { const l = JSON.parse(localStorage.getItem('hoopLegacy')); if (l) LEG = Object.assign(LEG, l); } catch(e) {}
const saveLeg = () => { try { localStorage.setItem('hoopLegacy', JSON.stringify(LEG)); } catch(e) {} };
const saveRun = () => { try { localStorage.setItem('hoopRun', JSON.stringify(C)); } catch(e) {} };
const loadRun = () => { try { return JSON.parse(localStorage.getItem('hoopRun')); } catch(e) { return null; } };
const has = t => LEG.talents.includes(t);

// ===================== 建立 =====================
let selPos = 'F', look = { skin: 2, hair: 0, hc: 0 }, num = 23;
function renderCreate() {
  $('iName').value = randName(); num = ri(0, 99);

  drawCreate();
}
function drawCreate() {
  $('posPick').innerHTML = '';
  for (const [k, p] of Object.entries(POS)) { const b = document.createElement('button'); b.className = 'opt' + (selPos === k ? ' sel' : ''); b.innerHTML = `${p.n}（${p.h[0]}–${p.h[1]} cm）<small>${p.d}</small>`; b.onclick = () => { selPos = k; drawCreate(); }; $('posPick').appendChild(b); }

}
$('bRnd').onclick = () => $('iName').value = randName();
$('bLook').onclick = () => { look = { skin: ri(0, 4), hair: ri(0, 3), hc: ri(0, 4) }; num = ri(0, 99); drawCreate(); };
$('bStart').onclick = () => {
  const P = POS[selPos], inh = LEG.inherit;
  const school = pick(SCHOOLS);
  C = { name: ($('iName').value.trim() || randName()).slice(0, 6), pos: selPos, look, num, height: ri(P.h[0], P.h[1]), school: school.n, color: school.c,
    phase:'HS', year:1, week:1, age:16, fatigue:0, injury:0, iq:20, trust: 20 + (has('MVP') ? 25 : 0), money:0, team:null, tcolor:null, role:'先發', proYear:0, salary:0,
    season: line(), career: line(), seasons: [], memories: [], highlights: [], rival:null, note:'', rec:{ w:0, l:0 } };
  for (const k in STATS) C[k] = ri(24, 32) + P.base[k] + (has('TD') ? 2 : 0) + (inh && inh.k === k ? inh.v : 0);
  if (has('DRAFT1')) C.drive += 6;
  newRival();
  const coach = LEG.lives[0];
  C.note = coach ? `你進了${C.school}籃球隊。教練是 <b class="gold">${coach.name}</b>——前世的你。他把球丟給你：「讓我看看你的跳投。」` : `你進了${C.school}籃球隊，穿上 ${C.num} 號球衣。`;
  saveRun(); showHub();
};
function line() { return { g:0, min:0, pts:0, reb:0, ast:0, stl:0, blk:0, fgm:0, fga:0, tpm:0, w:0, l:0 }; }
function newRival() { C.rival = { name: randName(), faced: 0, stops: 0, res: [] }; }

// ===================== 能力 =====================
function ovr() { const w = POS[C.pos].w; let s = 0; for (const k in w) s += C[k] * w[k]; return s; }
function growth(k) {
  let g = C.phase === 'HS' ? 1 : C.age <= 26 ? 0.85 : C.age <= 30 ? 0.6 : 0.35;
  if ((k === 'shoot' || k === 'three') && has('P40')) g *= 1.25;
  if (k === 'def' && has('DPOY')) g *= 1.25;
  return g;
}
const avg = (l, k) => l.g ? (l[k] / l.g).toFixed(1) : '0.0';
const pct = l => l.fga ? Math.round(l.fgm / l.fga * 100) + '%' : '—';

// ===================== 畫面 =====================
function showOnly(id) { ['sTitle','sCreate','sHub','sHall'].forEach(x => $(x).classList.toggle('hide', x !== id)); window.scrollTo(0,0); }
function showHub() { showOnly('sHub'); renderHub(); }
function sbar(l, v, col) { return `<div class="stat"><span class="l">${l}</span><div class="bar"><i style="width:${Math.min(100, v)}%;background:${col}"></i></div><span class="v">${Math.round(v)}</span></div>`; }
function renderHub() {
  const col = C.phase === 'HS' ? C.color : C.tcolor;
  $('hArt').innerHTML = art(C.injury ? 'injury' : C.phase === 'HS' ? 'school' : 'gym', col, C.week + C.year * 10 + C.proYear * 7);
  $('hAvatar').innerHTML = avatar(C.look, col, C.num);
  $('hName').textContent = C.name;
  $('hSub').textContent = C.phase === 'HS' ? `${C.school}・高${'一二三'[C.year-1]}・${POS[C.pos].n}・${C.height}cm` : `${C.team}・${C.role}・${POS[C.pos].n}`;
  $('hWhen').innerHTML = C.phase === 'HS' ? `第 ${C.week} 週　<span class="muted">聯賽前 ${9 - C.week} 週</span>` : `職業第 ${C.proYear} 年・第 ${C.week} 週　<span class="muted">${C.age} 歲・年薪 ${C.salary} 萬</span>`;
  const cols = { shoot:'#ffb84d', three:'#f39c12', drive:'#ef6461', pass:'#5aa9ff', def:'#6fd08c', ath:'#c792ea' };
  let s = ''; for (const k in STATS) s += sbar(STATS[k], C[k], cols[k]);
  s += `<div class="chips"><span class="chip">綜合 ${Math.round(ovr())}</span><span class="chip ${C.fatigue >= 70 ? 'bad' : ''}">疲勞 ${Math.round(C.fatigue)}</span>${C.injury ? `<span class="chip bad">傷停 ${C.injury} 週</span>` : ''}<span class="chip">球商 ${C.iq}</span><span class="chip">教練信任 ${C.trust}</span>${C.phase === 'PRO' ? `<span class="chip">存款 ${C.money} 萬</span><span class="chip">戰績 ${C.rec.w}-${C.rec.l}</span>` : ''}</div>`;
  $('hStats').innerHTML = s;
  $('hNote').innerHTML = C.note; $('hNote').classList.toggle('hide', !C.note);
  const A = [];
  if (C.injury) A.push(['復健', `還要 ${C.injury} 週`, () => turn('rehab')]);
  else A.push(['投籃練習', '中距離', () => turn('shoot')], ['三分練習', '外線', () => turn('three')], ['切入／禁區', '上籃、灌籃、低位', () => turn('drive')],
    ['傳球視野', '助攻、組織', () => turn('pass')], ['防守腳步', '抄截、阻攻', () => turn('def')], ['體能重訓', '爆發力、籃板、上場時間', () => turn('ath')],
    ['看比賽錄影', '球商 +（教練判讀更準）', () => turn('iq')], ['休息', '疲勞大幅下降', () => turn('rest')]);
  if (C.phase === 'PRO' && C.age >= 32) A.push(['宣布退休', '結束職業生涯', () => scene('退休', `你今年 ${C.age} 歲。要在這裡畫下句點嗎？`, [{ label:'宣布退休', fn:() => endLife('退休') }, { label:'再打一年', fn:d => d() }], 'night')]);
  $('hActs').innerHTML = '';
  for (const [t, d, f] of A) { const b = document.createElement('button'); b.className = 'ghost'; b.innerHTML = `${t}<small>${d}</small>`; b.onclick = f; $('hActs').appendChild(b); }
  const L = C.season;
  $('hSeason').innerHTML = `<b>${C.phase === 'HS' ? '本學年' : '本季'}平均</b><table style="margin-top:6px"><tr><th>場</th><th>得分</th><th>籃板</th><th>助攻</th><th>抄截</th><th>阻攻</th><th>命中</th></tr>
    <tr><td>${L.g}</td><td>${avg(L,'pts')}</td><td>${avg(L,'reb')}</td><td>${avg(L,'ast')}</td><td>${avg(L,'stl')}</td><td>${avg(L,'blk')}</td><td>${pct(L)}</td></tr></table>
    ${C.rival ? `<div style="margin-top:8px;font-size:15px">宿敵 <b class="bad">${C.rival.name}</b>：本季對位 ${C.rival.faced}/3${C.rival.res.length ? '　' + C.rival.res.join('、') : ''}</div>` : ''}`;
}

// ===================== 場景 =====================
function scene(title, text, choices, kind, color) {
  $('sceneIn').innerHTML = (kind ? art(kind, color || (C && (C.tcolor || C.color)) || '#5aa9ff', ri(1, 999)) : '') + `<h2>${title}</h2><div class="story">${text}</div><div class="col" id="chs"></div>`;
  for (const c of choices) { const b = document.createElement('button'); b.className = 'choice'; b.innerHTML = c.label + (c.note ? `<small>${c.note}</small>` : ''); b.onclick = () => c.fn(() => closeScene()); $('chs').appendChild(b); }
  $('scene').classList.remove('hide'); $('scene').scrollTop = 0;
}
function msg(title, text, next, kind) { scene(title, text, [{ label:'繼續', fn:() => { closeScene(); if (next) next(); } }], kind); }
function closeScene() { $('scene').classList.add('hide'); if (!$('sHub').classList.contains('hide')) renderHub(); }

// ===================== 每週 =====================
function turn(k) {
  let t = ''; const base = rnd(2.4, 4.2);
  if (k === 'rehab') { C.injury--; C.fatigue = Math.max(0, C.fatigue - 30); t = '你在防護室做復健。'; }
  else if (k === 'rest') { C.fatigue = Math.max(0, C.fatigue - 45); t = '你好好休息了一週，腿不再那麼沉了。'; }
  else if (k === 'iq') { C.iq = Math.min(100, C.iq + 8); C.fatigue += 4; t = '你把對手的比賽錄影看了三遍，抄了滿滿一本筆記。\n球商 +8'; }
  else {
    const tired = C.fatigue >= 60 ? 0.6 : 1, g = base * growth(k) * tired;
    C[k] = Math.min(130, C[k] + g); C.fatigue += rnd(12, 17);
    t = pick({ shoot:['你投了五百顆中距離。','一次次急停跳投，手感越來越熱。'], three:['你在三分線外一個點一個點地投。','左右底角、45 度、弧頂，各投一百顆。'], drive:['你對著擋拆假人反覆切入。','你練了一整週的歐洲步和反手上籃。'], pass:['你閉著眼睛也能把球傳到隊友手上了。','你和隊友練了一整週的擋拆配合。'], def:['你蹲低滑步，直到大腿發抖。','你一對一防守隊上最快的後衛。'], ath:['你在重訓室把深蹲加了十公斤。','你衝刺折返跑，衝到喘不過氣。'] }[k]) + `\n\n${STATS[k]} <span class="good">+${g.toFixed(1)}</span>${tired < 1 ? '\n<span class="muted">（太疲勞，效果打折）</span>' : ''}`;
    if (C.fatigue > 70 && Math.random() < (C.fatigue - 65) * 0.012 * (has('UNDRAFTED') ? 0.65 : 1)) return injure('訓練量過大', Math.round(C.fatigue));
  }
  C.note = '';
  after(t, k === 'rehab' ? 'injury' : 'gym');
}
function injure(why, f) {
  const w = ri(2, 5), part = pick(['腳踝扭傷','膝蓋發炎','大腿拉傷','手指挫傷']);
  C.injury = w; C.fatigue = 30;
  C.note = `<b class="bad">${part}</b>　原因：${why}（疲勞 ${f}）。需要復健 ${w} 週。`;
  after(`<span class="bad">落地時一陣劇痛……${part}。</span>\n原因：${why}（疲勞累積到 ${f}）。\n需要休養 ${w} 週，這段期間只能復健、不能上場。`, 'injury');
}
function after(text, kind) {
  saveRun();
  if (C.phase === 'HS') msg('本週', text, () => { C.week++; if (C.week > 8) hsLeague(); else { hsEvent(); saveRun(); renderHub(); } }, kind);
  else msg('本週', text, () => proGame(), kind);
}
function hsEvent() {
  if (Math.random() < 0.3) C.note = pick([
    () => { C.trust += 5; return '教練在練習後把你叫過去：「下週的戰術，以你為主。」（教練信任 +5）'; },
    () => { C.iq += 4; return '學長教了你幾招無球跑位的眉角。（球商 +4）'; },
    () => { C.fatigue += 10; return '段考週，熬了好幾個晚上。（疲勞 +10）'; },
    () => `聽說別校的 <b class="bad">${C.rival.name}</b> 上週單場砍了 38 分。`,
    () => { C.ath += 1; return '你又長高了一點點，彈跳也更好了。（體能 +1）'; },
  ])();
}

// ===================== 高中聯賽 =====================
function hsLeague() {
  const lv = [[30, 37, 44], [38, 45, 52], [45, 52, 60]][C.year - 1];
  const names = ['預賽', '複賽', '冠軍賽'];
  let r = 0;
  const next = () => {
    const opp = pick(SCHOOLS.filter(s => s.n !== C.school));
    scene(`青雲盃高中聯賽・${names[r]}`, `對手：${opp.n}${r === 2 ? '\n電視轉播，球探坐在第一排。' : ''}${r >= 1 ? `\n\n<b class="bad">對方王牌是 ${C.rival.name}。</b>` : ''}`, [
      { label:'上場', fn:() => { closeScene(); startGame({ level: lv[r], minutes: 30, opp: opp.n, ocolor: opp.c, rival: r >= 1, onEnd: done }); } },
      { label:'快速模擬', note:'用目前能力自動打完', fn:() => { closeScene(); startGame({ level: lv[r], minutes: 30, opp: opp.n, ocolor: opp.c, rival: r >= 1, quick: true, onEnd: done }); } },
    ], 'arena', opp.c);
  };
  const done = res => {
    if (res.win && r < 2) { r++; msg('晉級！', `${res.summary}\n\n球隊晉級${names[r]}！`, next, 'arena'); return; }
    if (res.win) { pushMem('HS_CHAMP'); C.highlights.push(`高${'一二三'[C.year-1]}奪得青雲盃冠軍`); C.trust += 15; return msg('🏆 冠軍！', `${res.summary}\n\n<b class="gold">你們拿下青雲盃冠軍！</b>`, endYear, 'trophy'); }
    msg('賽季結束', `${res.summary}\n\n${names[r]}落敗，這一季結束了。`, endYear, 'night');
  };
  next();
}
function endYear() {
  C.seasons.push({ label:`高${'一二三'[C.year-1]}`, ...C.season }); C.season = line();
  if (C.year === 3) return draft();
  C.year++; C.age++; C.week = 1; C.fatigue = Math.max(0, C.fatigue - 30); newRival();
  C.note = `升上高${'一二三'[C.year-1]}了。這一屆最強的球員是 <b class="bad">${C.rival.name}</b>。`;
  saveRun(); showHub();
}

// ===================== 選秀 =====================
function draft() {
  const v = ovr() + (C.memories.includes('HS_CHAMP') ? 6 : 0) + C.seasons.slice(-1)[0].pts / Math.max(1, C.seasons.slice(-1)[0].g) * 0.25 + rnd(-3, 3);
  const round = v >= 53 ? 1 : v >= 46 ? 2 : 0;
  const head = `選秀會當晚，你坐在台下，手心都是汗。\n（球探評價 ${Math.round(v)}）\n\n`;
  if (!round) { pushMem('UNDRAFTED'); C.highlights.push('選秀會上沒有被唸到名字'); return scene('選秀會', head + '一輪、二輪……最後一個名字唸完，燈光暗了下來。\n\n<b class="bad">落選了。</b>', [{ label:'這一世到此為止', fn:() => endLife('選秀落選') }], 'draft'); }
  const T = pick(TEAMS); C.team = T.n; C.tcolor = T.c; const pk = round === 1 ? ri(1, 8) : ri(9, 16);
  if (round === 1) pushMem('DRAFT1');
  C.highlights.push(`第 ${round} 輪第 ${pk} 順位被${T.n}選中`);
  const bonus = round === 1 ? 900 - pk * 60 : 150; C.money += bonus; C.salary = round === 1 ? 300 : 80;
  scene('選秀會', head + `「第 ${round} 輪，第 ${pk} 順位——${T.n}選擇……${C.school}，${C.name}！」\n\n簽約金 ${bonus} 萬。`, [{ label:'加入職業聯盟', fn:() => {
    C.phase = 'PRO'; C.proYear = 1; C.week = 1; C.age = 19; C.role = '板凳'; C.season = line(); C.rec = { w:0, l:0 }; newRival(); assignRole();
    C.note = `你穿上了${C.team}的球衣。總教練說：「新秀先從板凳開始，表現給我看。」`; saveRun(); closeScene(); showHub();
  } }], 'draft', T.c);
}

// ===================== 職業 =====================
const WEEKS = 14;
const MIN = { 板凳:12, 輪替:22, 先發:32, 核心:36 };
function assignRole() {
  const o = ovr(), t = C.trust;
  C.role = o >= 72 && t >= 55 ? '核心' : o >= 62 && t >= 35 ? '先發' : o >= 53 ? '輪替' : '板凳';
}
const proLevel = () => 54 + Math.min(C.proYear, 8) * 1.4;
function proGame() {
  if (C.injury) return advance('（傷停中，本週沒有上場）');
  const T = pick(TEAMS.filter(t => t.n !== C.team)), rivalWeek = [3, 8, 12].includes(C.week) && C.rival.faced < 3;
  const cfg = { level: proLevel(), minutes: MIN[C.role], opp: T.n, ocolor: T.c, rival: rivalWeek, onEnd: afterGame };
  scene(`第 ${C.week} 週・對 ${T.n}`, `你的角色：${C.role}（約 ${MIN[C.role]} 分鐘）${rivalWeek ? `\n\n<b class="bad">宿敵 ${C.rival.name} 是對方的王牌。</b>` : ''}`, [
    { label:'上場', fn:() => { closeScene(); startGame(cfg); } },
    { label:'快速模擬', fn:() => { closeScene(); startGame({ ...cfg, quick: true }); } },
  ], 'arena', T.c);
}
function afterGame(res) {
  const old = C.role; assignRole();
  let t = res.summary;
  if (old !== C.role) { const up = Object.keys(MIN).indexOf(C.role) > Object.keys(MIN).indexOf(old); t += up ? `\n\n<b class="gold">教練把你升為${C.role}！</b>` : `\n\n<span class="bad">你被調整為${C.role}。</span>`; if (up && C.role === '先發' && !C.flags) { C.flags = 1; C.highlights.push(`職業第 ${C.proYear} 年成為先發`); } }
  advance(t);
}
function advance(t) { C.week++; if (C.week > WEEKS) return msg('比賽結果', t, endSeason, 'arena'); saveRun(); msg('比賽結果', t, () => showHub(), 'arena'); }
function endSeason() {
  const L = C.season, lines = [], ppg = L.pts / Math.max(1, L.g);
  if (L.g >= 10 && ppg >= 24 && C.rec.w >= 9) { pushMem('MVP'); lines.push('<b class="gold">年度 MVP！</b>'); C.highlights.push(`職業第 ${C.proYear} 年獲選 MVP`); }
  if (L.g >= 10 && (L.stl + L.blk) / L.g >= 3) { pushMem('DPOY'); lines.push('<b class="gold">年度最佳防守球員！</b>'); C.highlights.push(`職業第 ${C.proYear} 年獲選最佳防守`); }
  if (C.rival.stops >= 3) { pushMem('RIVAL'); lines.push(`本季三度守住宿敵 ${C.rival.name}！`); }
  const sal = Math.round(80 + Math.max(0, ovr() - 45) * 12 + ppg * 15 + (C.role === '核心' ? 300 : 0));
  C.money += C.salary; const old = C.salary; C.salary = sal;
  C.seasons.push({ label:`職${C.proYear}`, ...L });
  C.age++; C.proYear++;
  const dAge = has('LONG') ? 32 : 30;
  if (C.age > dAge) { const d = C.age - dAge; C.ath -= 2 + d * 0.5; C.drive -= 1.2 + d * 0.4; C.def -= 1 + d * 0.3; }
  if (C.proYear > 10) pushMem('LONG');
  const text = `<b>第 ${C.proYear - 1} 季結束</b>　球隊戰績 ${C.rec.w} 勝 ${C.rec.l} 敗\n平均 ${avg(L,'pts')} 分 ${avg(L,'reb')} 板 ${avg(L,'ast')} 助　命中率 ${pct(L)}\n\n${lines.join('\n')}${lines.length ? '\n\n' : ''}今年領了 ${old} 萬，明年年薪 ${sal} 萬。`;

  for (const r of GS.rivalRes) { if (C.rival.faced < 3) { C.rival.faced++; C.rival.res.push(r); if (r === '守住') C.rival.stops++; } }
  if (C.fatigue > 75 && Math.random() < (C.fatigue - 70) * 0.01 * (has('UNDRAFTED') ? 0.65 : 1)) { C.injury = ri(2, 4); extra.push(`<span class="bad">賽後腳踝腫起來了，傷停 ${C.injury} 週（疲勞累積、上場時間太長）。</span>`); }
  const summary = `${win ? '贏球！' : '輸球'}　${our} : ${opp}\n你的數據：${GS.cfg.minutes} 分鐘　<b>${st.pts}</b> 分　${st.reb} 籃板　${st.ast} 助攻　${st.stl} 抄截　${st.blk} 阻攻\n投籃 ${st.fgm}/${st.fga}${st.tpm ? `（三分 ${st.tpm} 顆）` : ''}${GS.rivalRes.length ? `\n對宿敵 ${C.rival.name}：${GS.rivalRes.join('、')}` : ''}${extra.length ? '\n\n' + extra.join('\n') : ''}`;
  $('game').classList.add('hide'); saveRun();
  GS.cfg.onEnd({ win, summary });
}

// ===================== 球場繪圖 =====================
const cv = $('court'), ctx = cv.getContext ? cv.getContext('2d') : null;
function drawCourt(extra) {
  if (!ctx || !GS) return;
  const c = ctx, W = 600, H = 520;
  const col = C.phase === 'HS' ? C.color : C.tcolor, oc = GS.cfg.ocolor || '#ef6461';
  // 地板
  c.fillStyle = '#7a5230'; c.fillRect(0, 0, W, H);
  for (let x = 0; x < W; x += 30) { c.fillStyle = x % 60 ? 'rgba(0,0,0,.06)' : 'rgba(255,255,255,.03)'; c.fillRect(x, 0, 30, H); }
  c.strokeStyle = 'rgba(255,240,220,.85)'; c.lineWidth = 4;
  c.strokeRect(10, 10, W - 20, H - 10);
  // 禁區
  c.fillStyle = col + '55'; c.fillRect(220, 10, 160, 190); c.strokeRect(220, 10, 160, 190);
  c.beginPath(); c.arc(300, 200, 60, 0, Math.PI); c.stroke();
  // 三分線
  c.beginPath(); c.moveTo(40, 10); c.lineTo(40, 120); c.arc(300, 58, 268, Math.PI - 0.26, 0.26, true); c.lineTo(560, 10); c.stroke();
  // 中圈
  c.beginPath(); c.arc(300, H, 60, Math.PI, 0); c.stroke();
  // 籃框
  c.fillStyle = '#ddd'; c.fillRect(260, 26, 80, 6);
  c.strokeStyle = '#ef6461'; c.lineWidth = 4; c.beginPath(); c.arc(300, 50, 14, 0, 7); c.stroke();
  if (!GS.cur) return;
  const cur = GS.cur, dot = (x, y, fill, txt, r = 18, ring) => { c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(x + 3, y + 6, r, r * 0.6, 0, 0, 7); c.fill(); c.fillStyle = fill; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); if (ring) { c.strokeStyle = ring; c.lineWidth = 4; c.stroke(); } c.fillStyle = '#fff'; c.font = `900 ${r * 0.95}px sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(txt, x, y + 1); };
  const S = SPOTS[cur.spot];
  if (cur.type === 'O') {
    // 隊友
    const others = Object.keys(SPOTS).filter(s => s !== cur.spot).slice(0, 4);
    for (const s of others) { const p = SPOTS[s]; dot(p.x, p.y, col, '', 14); dot(p.x + 22, p.y - 26, oc, '', 13); }
    const M = SPOTS[cur.mate]; c.strokeStyle = 'rgba(255,255,255,.25)'; c.setLineDash([8, 8]); c.lineWidth = 2; c.beginPath(); c.moveTo(S.x, S.y); c.lineTo(M.x, M.y); c.stroke(); c.setLineDash([]);
    // 防守者位置
    const dd = { tight: 44, sag: 88, help: 50 }[cur.ds];
    const ang = Math.atan2(58 - S.y, 300 - S.x);
    dot(S.x + Math.cos(ang) * dd, S.y + Math.sin(ang) * dd, oc, '', 18);
    if (cur.ds === 'help') dot(S.x + Math.cos(ang + 0.9) * 46, S.y + Math.sin(ang + 0.9) * 46, oc, '', 16);
    if (!extra || !extra.hideMe) dot(S.x, S.y, col, C.num, 22, '#ffb84d');
    if (!extra) drawBall(S.x + 16, S.y + 12, 8);
  } else {
    const others = ['corner3','wing3','wingR','post'].filter(s => s !== cur.spot);
    for (const s of others) { const p = SPOTS[s]; dot(p.x, p.y, oc, '', 14); dot(p.x + 20, p.y - 22, col, '', 13); }
    if (!extra || !extra.hideOpp) dot(S.x, S.y, oc, cur.o.rival ? '敵' : '', 22, cur.o.rival ? '#ef6461' : null);
    const ang = Math.atan2(58 - S.y, 300 - S.x);
    dot(S.x + Math.cos(ang) * 48, S.y + Math.sin(ang) * 48, col, C.num, 20, '#ffb84d');
    if (!extra) drawBall(S.x + 16, S.y + 12, 8);
  }
}
function drawBall(x, y, r) {
  const c = ctx; c.fillStyle = '#e8742a'; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  c.strokeStyle = '#3a1d0a'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x - r, y); c.lineTo(x + r, y); c.moveTo(x, y - r); c.lineTo(x, y + r); c.stroke();
}
// 動畫：拋物線（高度用球的大小與陰影表現）
function play(a, cb) {
  if (!ctx || typeof requestAnimationFrame === 'undefined') { cb(); return; }
  const segs = [];
  if (a.pass) { segs.push({ from: a.from, to: a.mid, h: 20, dur: 380 }); if (a.to) segs.push({ from: a.mid, to: a.to, h: 120, dur: 750, shot: true }); }
  else if (a.drive) { segs.push({ from: a.from, to: [a.to[0] + (a.from[0] < 300 ? -30 : 30), 110], h: 0, dur: 420, run: true }); segs.push({ from: [a.to[0] + (a.from[0] < 300 ? -20 : 20), 100], to: [300, 50], h: a.dunk ? 10 : 40, dur: 380, shot: true }); }
  else segs.push({ from: a.from, to: a.to, h: 140, dur: 850, shot: true });
  let si = 0, t0 = performance.now(), runner = null;
  const step = now => {
    const s = segs[si], t = Math.min(1, (now - t0) / s.dur);
    let tx = s.to[0], ty = s.to[1];
    if (s.shot && !a.made && !a.tov) { tx += 14 * (a.from[0] < 300 ? 1 : -1); ty += 6; }
    const x = s.from[0] + (tx - s.from[0]) * t, y = s.from[1] + (ty - s.from[1]) * t;
    const hgt = Math.sin(t * Math.PI) * s.h;
    drawCourt({ hideMe: a.drive && !a.opp, hideOpp: a.drive && a.opp });
    if (s.run) { runner = [x, y]; }
    if (runner && a.drive) { ctx.fillStyle = (a.opp ? GS.cfg.ocolor : (C.phase === 'HS' ? C.color : C.tcolor)); ctx.beginPath(); ctx.arc(runner[0], runner[1], 22, 0, 7); ctx.fill(); }
    // 陰影與球
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(x, y + 8, 9, 5, 0, 0, 7); ctx.fill();
    drawBall(x, y - hgt * 0.5, 9 + hgt / 22);
    if (a.perfect && s.shot) { ctx.strokeStyle = 'rgba(255,184,77,.8)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(x, y - hgt * 0.5, 16 + hgt / 22, 0, 7); ctx.stroke(); }
    if (t < 1) return requestAnimationFrame(step);
    if (si < segs.length - 1) { si++; t0 = performance.now(); return requestAnimationFrame(step); }
    // 結尾效果
    if (a.made && !a.tov) { ctx.strokeStyle = a.opp ? '#ef6461' : '#ffb84d'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(300, 50, 26, 0, 7); ctx.stroke(); }
    setTimeout(cb, 250);
  };
  requestAnimationFrame(step);
}

// ===================== 出手計 =====================
const PERF = 0.9;
let charging = false, cStart = 0, cVal = 0;
function meterLoop(now) { if (!charging) return; const t = ((now - cStart) / 850) % 2; cVal = t < 1 ? t : 2 - t; $('mcur').style.left = (cVal * 100) + '%'; requestAnimationFrame(meterLoop); }
$('release').addEventListener('pointerdown', e => { e.preventDefault(); if (!GS || GS.busy || charging) return; charging = true; cStart = performance.now(); requestAnimationFrame(meterLoop); });
const rel = e => {
  e.preventDefault(); if (!charging) return; charging = false;
  const pw = has('HS_CHAMP') ? 0.065 : 0.04, d = Math.abs(cVal - PERF);
  const q = d <= pw ? 1 : cVal >= 0.65 ? clamp(0.92 - d * 1.3, 0.55, 0.92) : clamp(0.25 + cVal * 0.5, 0.25, 0.6);
  doRelease(q);
};
$('release').addEventListener('pointerup', rel);
$('release').addEventListener('pointerleave', e => { if (charging) rel(e); });
function doRelease(q) {
  if (!GS || GS.busy) return; GS.busy = true;
  $('gShoot').classList.add('hide');
  const r = resolveOff(q);
  play(r.anim, () => endEv(r.txt + (q >= 0.97 ? '　✦完美出手' : ''), r.made));
}
$('gSim').onclick = () => { if (!GS || GS.busy) return; GS.busy = true; while (GS.i < GS.ev.length) autoEv(); finish(); };

// ===================== 標題 =====================
function title_() { showOnly('sTitle'); $('titleArt').innerHTML = art('arena', '#ffb84d', 11); const r = loadRun(); $('bCont').classList.toggle('hide', !r); }
$('bNew').onclick = () => {
  const r = loadRun(); const go = () => { closeScene(); renderCreate(); showOnly('sCreate'); };
  if (r) scene('新的人生', `你還有一位進行中的球員「${r.name}」。重新開始會放棄他（不會留下轉生記憶）。`, [{ label:'確定', fn:() => { try { localStorage.removeItem('hoopRun'); } catch(e) {} go(); } }, { label:'算了', fn:d => d() }]);
  else go();
};
$('bCont').onclick = () => { C = loadRun(); if (C) showHub(); };
$('bHall').onclick = () => {
  $('hallList').innerHTML = LEG.lives.length ? LEG.lives.map((l, i) => `<div class="card prof">${avatar(l.look, l.color, l.num)}<div><b style="font-size:19px">第 ${LEG.lives.length - i} 世　${l.name}</b>　<span class="muted">${POS[l.pos].n}</span><br><span class="muted">${l.school}${l.team ? '→' + l.team : ''}</span><br>${l.summary}${l.highlights && l.highlights.length ? `<div class="muted" style="font-size:14px;margin-top:4px;line-height:1.6">${l.highlights.join('<br>')}</div>` : ''}</div></div>`).join('') + `<div class="card">目前天賦：${LEG.talents.length ? LEG.talents.map(k => MEMORIES[k].t).join('、') : '無'}</div>` : '<div class="card muted">還沒有前世。</div>';
  showOnly('sHall');
};
$('bHallBack').onclick = title_;
title_();
</script>
