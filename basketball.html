<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="遊戲盒">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>籃球轉生記</title>
<style>
  :root { --bg:#10131a; --card:#1a1f29; --card2:#252c38; --ink:#eaeef4; --muted:#95a1b3; --gold:#ffb84d; --red:#ef6461; --blue:#5aa9ff; --green:#6fd08c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; font-size:17px; user-select:none; -webkit-user-select:none; overscroll-behavior:none; }
  .wrap { max-width:540px; margin:0 auto; padding:calc(30px + env(safe-area-inset-top)) 12px calc(40px + env(safe-area-inset-bottom)); }
  .hide { display:none !important; }
  h1 { text-align:center; font-size:40px; margin:8px 0 4px; color:var(--gold); }
  h2 { margin:6px 0 10px; color:var(--gold); font-size:23px; }
  h3 { margin:0 0 8px; font-size:18px; }
  button { font-family:inherit; background:var(--gold); color:#2a1600; border:0; border-radius:12px; padding:13px 16px; font-size:18px; font-weight:800; cursor:pointer; }
  button.ghost { background:var(--card2); color:var(--ink); border:1px solid #333d4c; }
  button:disabled { opacity:.35; }
  .col { display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; gap:8px; }
  .card { background:var(--card); border:1px solid #29313e; border-radius:14px; padding:12px; margin-bottom:10px; }
  .muted { color:var(--muted); } .good { color:var(--green); } .bad { color:var(--red); } .gold { color:var(--gold); } .blue { color:var(--blue); }
  input { width:100%; font-family:inherit; font-size:20px; padding:12px; border-radius:10px; border:1px solid #333d4c; background:#0b0e13; color:var(--ink); }
  .lb { color:var(--muted); font-size:15px; margin:14px 0 6px; display:block; }
  .opt { text-align:left; background:var(--card2); color:var(--ink); border:2px solid transparent; font-weight:700; font-size:17px; }
  .opt.sel { border-color:var(--gold); }
  .opt small { display:block; color:var(--muted); font-weight:400; font-size:14px; margin-top:2px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .grid2 button, .grid3 button { text-align:left; padding:11px 9px; font-size:16px; line-height:1.3; }
  .grid2 button small, .grid3 button small { display:block; font-size:12px; color:var(--muted); font-weight:400; }
  .stat { display:flex; align-items:center; gap:8px; margin:4px 0; font-size:15px; }
  .stat .l { width:40px; color:var(--muted); }
  .bar { flex:1; height:9px; background:#0b0e13; border-radius:6px; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:6px; }
  .stat .v { width:30px; text-align:right; font-weight:800; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip { background:var(--card2); border-radius:8px; padding:4px 8px; font-size:14px; }
  .art { width:100%; display:block; border-radius:14px; margin-bottom:10px; }
  .prof { display:flex; gap:12px; align-items:center; }
  .prof svg { width:80px; height:80px; flex:none; border-radius:16px; }
  .ovr { font-size:34px; font-weight:900; color:var(--gold); line-height:1; text-align:center; }
  .ovr small { display:block; font-size:12px; color:var(--muted); font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td,th { padding:5px 3px; border-bottom:1px solid #29313e; text-align:center; }
  th { color:var(--muted); font-weight:600; }
  td.l, th.l { text-align:left; }
  tr.me td { color:var(--gold); font-weight:800; }
  .tabs { display:flex; gap:6px; margin:8px 0; }
  .tabs button { flex:1; padding:9px 2px; font-size:15px; }
  .tabs button.on { background:var(--gold); color:#2a1600; }
  .scene { position:fixed; inset:0; background:rgba(8,10,14,.96); z-index:10; overflow-y:auto; }
  .scene .inner { max-width:540px; margin:0 auto; padding:calc(30px + env(safe-area-inset-top)) 14px 40px; }
  .story { font-size:18px; line-height:1.8; white-space:pre-wrap; margin-bottom:14px; }
  .choice { text-align:left; background:var(--card2); color:var(--ink); border:1px solid #333d4c; }
  .choice small { display:block; color:var(--muted); font-weight:400; font-size:14px; margin-top:3px; }
  /* 比賽 */
  #game { position:fixed; inset:0; background:var(--bg); z-index:9; overflow-y:auto; }
  #game .inner { max-width:540px; margin:0 auto; padding:calc(30px + env(safe-area-inset-top)) 10px 24px; }
  .sb { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; background:var(--card); border-radius:14px; padding:10px 12px; }
  .sb .tm { font-size:14px; color:var(--muted); }
  .sb .sc { font-size:38px; font-weight:900; font-variant-numeric:tabular-nums; line-height:1.1; }
  .sb .mid { text-align:center; }
  .sb .q { font-weight:900; font-size:18px; } .sb .clk { color:var(--muted); font-variant-numeric:tabular-nums; }
  #lead { width:100%; height:90px; display:block; margin:8px 0; background:var(--card); border-radius:12px; }
  .myline { display:flex; justify-content:space-around; background:var(--card); border-radius:12px; padding:8px; margin-bottom:8px; }
  .myline div { text-align:center; } .myline b { display:block; font-size:24px; } .myline span { font-size:12px; color:var(--muted); }
  .feed { background:#0b0e13; border-radius:12px; padding:10px; height:230px; overflow-y:auto; font-size:15px; line-height:1.7; }
  .feed .me { color:var(--gold); font-weight:700; } .feed .q { color:var(--blue); font-weight:800; margin-top:4px; } .feed .op { color:#c9a3a3; } .feed .big { color:#fff; font-weight:900; }
  .clutch { background:linear-gradient(135deg,#4a2a0a,#1a1f29); border:2px solid var(--gold); border-radius:14px; padding:12px; margin-top:10px; animation:glow 1.2s infinite; }
  @keyframes glow { 50% { box-shadow:0 0 18px #ffb84d88; } }
  .toast { position:fixed; left:50%; top:calc(40px + env(safe-area-inset-top)); transform:translateX(-50%); z-index:50; background:linear-gradient(135deg,#ffb84d,#f08a24); color:#2a1600; border-radius:14px; padding:10px 16px; font-weight:900; font-size:17px; box-shadow:0 6px 20px rgba(0,0,0,.5); animation:tin 3.2s forwards; text-align:center; min-width:240px; }
  .toast small { display:block; font-weight:600; font-size:13px; }
  @keyframes tin { 0% { opacity:0; transform:translate(-50%,-20px); } 10%,85% { opacity:1; transform:translate(-50%,0); } 100% { opacity:0; transform:translate(-50%,-10px); } }
  .ach { display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid #29313e; }
  .ach .i { font-size:28px; width:36px; text-align:center; }
  .ach.off { opacity:.3; filter:grayscale(1); }
  .big-num { font-size:44px; font-weight:900; color:var(--gold); text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div id="sTitle">
    <div id="titleArt"></div>
    <h1>🏀 籃球轉生記</h1>
    <div style="text-align:center;color:var(--muted);margin-bottom:18px">籃球生涯模擬：從高中打到名人堂</div>
    <div class="col">
      <button id="bNew">新的人生</button>
      <button class="ghost hide" id="bCont">繼續生涯</button>
      <button class="ghost" id="bHall">歷代球員・成就殿堂</button>
    </div>
    <div class="card muted" style="margin-top:16px;line-height:1.8;font-size:16px">
      每週安排訓練，然後<b class="gold">觀看比賽</b>：比分、走勢圖和你的每一球都會即時播出。<br>
      比賽最後關頭由你決定怎麼打——自己單打、擋拆、還是傳給射手，投進就是<b class="gold">絕殺</b>。<br>
      拚明星賽、MVP、冠軍戒指，最後退休球衣、進名人堂。
    </div>
  </div>

  <div id="sCreate" class="hide">
    <h2>新的球員</h2>
    <div id="legacy"></div>
    <div class="prof card" id="cAvatar"></div>
    <label class="lb">姓名</label>
    <div class="row"><input id="iName" maxlength="6"><button class="ghost" id="bRnd" style="white-space:nowrap">隨機</button></div>
    <label class="lb">位置</label>
    <div class="col" id="posPick"></div>
    <div class="row" style="margin-top:10px"><button class="ghost" id="bLook" style="flex:1">換個外型</button></div>
    <button id="bStart" style="width:100%;margin-top:14px">入學</button>
  </div>

  <div id="sHub" class="hide">
    <div id="hArt"></div>
    <div class="card prof"><div id="hAvatar"></div><div style="flex:1"><div style="font-size:23px;font-weight:900" id="hName"></div><div class="muted" id="hSub" style="font-size:15px"></div><div id="hWhen" style="margin-top:3px;font-size:15px"></div></div><div class="ovr" id="hOvr"></div></div>
    <div class="card hide" id="hNote" style="font-size:16px;line-height:1.6"></div>
    <div class="tabs" id="tabs"><button class="ghost on" data-t="week">本週</button><button class="ghost" data-t="me">能力</button><button class="ghost" data-t="league">聯盟</button><button class="ghost" data-t="ach">成就</button></div>
    <div id="tWeek"></div><div id="tMe" class="hide"></div><div id="tLeague" class="hide"></div><div id="tAch" class="hide"></div>
  </div>

  <div id="sHall" class="hide">
    <h2>歷代球員</h2>
    <div id="hallList"></div>
    <button class="ghost" id="bHallBack" style="width:100%">返回</button>
  </div>
</div>

<div class="scene hide" id="scene"><div class="inner" id="sceneIn"></div></div>

<div id="game" class="hide"><div class="inner">
  <div class="sb"><div><div class="tm" id="gHome"></div><div class="sc" id="gOur">0</div></div>
    <div class="mid"><div class="q" id="gQ">第 1 節</div><div class="clk" id="gClk">12:00</div></div>
    <div style="text-align:right"><div class="tm" id="gAway"></div><div class="sc" id="gOpp">0</div></div></div>
  <canvas id="lead" width="520" height="90"></canvas>
  <div class="myline" id="gMy"></div>
  <div class="feed" id="gFeed"></div>
  <div id="gClutch"></div>
  <div class="row" style="margin-top:10px"><button class="ghost" id="gSpeed" style="flex:1">⏩ 快轉</button><button class="ghost" id="gSkip" style="flex:1">⏭ 直接看結果</button></div>
</div></div>

<script>
// ===================== 插圖（SVG） =====================
function srand(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }
function art(kind, color = '#5aa9ff', seed = 7) {
  const R = srand(seed); const W = 400, H = 170;
  let g = '';
  const floor = (y, c1, c2) => { let s = `<polygon points="0,${y} ${W},${y} ${W},${H} 0,${H}" fill="${c1}"/>`; for (let i = -10; i <= 10; i++) s += `<line x1="${W/2 + i*20}" y1="${y}" x2="${W/2 + i*70}" y2="${H}" stroke="${c2}" stroke-width="1"/>`; return s; };
  const hoop = (x, y, s = 1) => `<g transform="translate(${x},${y}) scale(${s})"><rect x="-4" y="0" width="8" height="90" fill="#555"/><rect x="-30" y="-36" width="60" height="40" rx="3" fill="#e8eef5" stroke="#999"/><rect x="-12" y="-22" width="24" height="16" fill="none" stroke="#ef6461" stroke-width="2"/><ellipse cx="0" cy="6" rx="14" ry="4" fill="none" stroke="#ef6461" stroke-width="3"/><path d="M-13 7 L-8 24 M13 7 L8 24 M-4 8 L-3 24 M4 8 L3 24" stroke="#ddd" stroke-width="1.2"/></g>`;
  const ball = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#e8742a"/><path d="M${x-r} ${y} H${x+r} M${x} ${y-r} V${y+r} M${x-r*0.7} ${y-r*0.7} Q${x} ${y} ${x-r*0.7} ${y+r*0.7} M${x+r*0.7} ${y-r*0.7} Q${x} ${y} ${x+r*0.7} ${y+r*0.7}" stroke="#3a1d0a" stroke-width="1.2" fill="none"/>`;
  if (kind === 'gym') {
    g += `<rect width="${W}" height="${H}" fill="#1c2230"/>`;
    for (let i = 0; i < 5; i++) g += `<rect x="${30 + i*72}" y="14" width="46" height="40" rx="3" fill="#2d3b52"/><line x1="${53 + i*72}" y1="14" x2="${53 + i*72}" y2="54" stroke="#1c2230" stroke-width="3"/>`;
    g += `<rect x="0" y="62" width="${W}" height="10" fill="${color}" opacity=".8"/>` + floor(96, '#8a5a32', '#7a4e2b') + hoop(330, 40, 0.9);
    g += `<rect x="40" y="104" width="70" height="30" rx="4" fill="#333"/>` + [0,1,2].map(i => ball(55 + i*20, 100, 9)).join('');
  } else if (kind === 'arena') {
    g += `<rect width="${W}" height="${H}" fill="#0c0f16"/>`;
    for (let r = 0; r < 6; r++) for (let i = 0; i < 46; i++) g += `<circle cx="${i*9 + (r%2)*4}" cy="${16 + r*11}" r="3.3" fill="${pick([color,'#eaeef4','#ef6461','#ffb84d','#5aa9ff','#444'])}" opacity="${0.4 + R()*0.6}"/>`;
    g += `<polygon points="60,0 90,0 150,100 20,100" fill="#fff" opacity=".05"/><polygon points="310,0 340,0 380,100 250,100" fill="#fff" opacity=".05"/>`;
    g += floor(90, '#9a6a3c', '#8a5d33') + `<ellipse cx="200" cy="135" rx="70" ry="18" fill="none" stroke="#f1e6d6" stroke-width="2" opacity=".7"/><circle cx="200" cy="135" r="6" fill="${color}"/>`;
    g += `<rect x="150" y="2" width="100" height="26" rx="4" fill="#111" stroke="#333"/><text x="200" y="20" fill="#ffb84d" font-size="14" text-anchor="middle" font-weight="900" font-family="monospace">GAME DAY</text>`;
  } else if (kind === 'draft') {
    g += `<rect width="${W}" height="${H}" fill="#07080c"/>`;
    for (let i = 0; i < 14; i++) g += `<rect x="${i*30}" y="0" width="22" height="120" fill="#3a0d14" opacity=".8"/>`;
    g += `<polygon points="185,0 215,0 290,170 110,170" fill="#ffe9b0" opacity=".18"/><rect x="0" y="120" width="${W}" height="50" fill="#141820"/>`;
    g += `<rect x="168" y="96" width="64" height="58" rx="4" fill="#242c3a"/><circle cx="200" cy="118" r="13" fill="none" stroke="${color}" stroke-width="3"/>${ball(200, 118, 7)}`;
    g += `<text x="200" y="40" fill="#ffb84d" font-size="22" text-anchor="middle" font-weight="900">選秀會</text>`;
  } else if (kind === 'trophy') {
    g += `<rect width="${W}" height="${H}" fill="#120f08"/>`;
    for (let i = 0; i < 60; i++) g += `<rect x="${R()*W}" y="${R()*H}" width="5" height="9" fill="${pick(['#ffb84d','#5aa9ff','#ef6461','#6fd08c','#fff'])}" transform="rotate(${R()*90} ${R()*W} ${R()*H})" opacity=".85"/>`;
    g += `<path d="M170 40 H230 V70 Q230 100 200 104 Q170 100 170 70 Z" fill="#f2c14e"/><path d="M170 50 Q150 50 152 66 Q155 80 172 82 M230 50 Q250 50 248 66 Q245 80 228 82" stroke="#f2c14e" stroke-width="6" fill="none"/><rect x="194" y="104" width="12" height="20" fill="#d9a632"/><rect x="176" y="124" width="48" height="14" rx="2" fill="#8a6a1f"/>`;
  } else if (kind === 'school') {
    g += `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1f3a"/><stop offset="1" stop-color="#c46a4a"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#sky)"/>`;
    g += `<rect x="60" y="54" width="280" height="90" fill="#2a2f3a"/>`; for (let r = 0; r < 3; r++) for (let i = 0; i < 9; i++) g += `<rect x="${74 + i*30}" y="${64 + r*24}" width="18" height="14" fill="${R() < 0.4 ? '#ffd88a' : '#3c4454'}"/>`;
    g += `<rect x="190" y="30" width="20" height="24" fill="#2a2f3a"/><line x1="350" y1="30" x2="350" y2="144" stroke="#bbb" stroke-width="2"/><rect x="350" y="30" width="26" height="16" fill="${color}"/><rect x="0" y="144" width="${W}" height="26" fill="#1b1e25"/>`;
  } else if (kind === 'injury') {
    g += `<rect width="${W}" height="${H}" fill="#151c22"/><rect x="0" y="120" width="${W}" height="50" fill="#1e262e"/><rect x="100" y="96" width="200" height="30" rx="6" fill="#d6dde4"/><rect x="100" y="86" width="40" height="18" rx="6" fill="#fff"/><rect x="110" y="126" width="8" height="30" fill="#777"/><rect x="282" y="126" width="8" height="30" fill="#777"/>`;
    g += `<rect x="300" y="20" width="44" height="44" rx="8" fill="#ef6461"/><rect x="316" y="28" width="12" height="28" fill="#fff"/><rect x="308" y="36" width="28" height="12" fill="#fff"/>`;
  } else if (kind === 'night') {
    g += `<rect width="${W}" height="${H}" fill="#06070a"/><polygon points="190,0 210,0 300,170 100,170" fill="#ffe9b0" opacity=".12"/>` + floor(110, '#3d2a1a', '#33230f') + hoop(200, 40, 0.8) + ball(150, 150, 10);
  }
  return `<svg class="art" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}
const SKIN = ['#f1c9a5','#e0ac7e','#c68a5c','#8d5a3b','#5b3a26'];
const HAIRC = ['#1b1b1b','#3b2416','#6b4a2b','#c9a066','#1b1b1b'];
function avatar(look, color, num) {
  const s = SKIN[look.skin], h = HAIRC[look.hc];
  let hair = '';
  if (look.hair === 0) hair = `<path d="M30 40 Q30 18 50 17 Q70 18 70 40 Q68 28 50 27 Q32 28 30 40Z" fill="${h}"/>`;
  if (look.hair === 1) hair = `<path d="M31 36 Q32 20 50 20 Q68 20 69 36 Q60 30 50 30 Q40 30 31 36Z" fill="${h}" opacity=".85"/>`;
  if (look.hair === 2) hair = `<g fill="${h}">${[...Array(11)].map((_, i) => `<circle cx="${32 + i*3.6}" cy="${24 + Math.abs(i-5)*1.6}" r="6"/>`).join('')}</g>`;
  if (look.hair === 3) hair = `<path d="M29 44 Q26 16 50 15 Q74 16 71 44 L70 34 Q60 24 40 26 Q32 30 30 44Z" fill="${h}"/><rect x="29" y="30" width="42" height="5" fill="${color}"/>`;
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#222a36"/>
    <path d="M14 100 Q16 72 50 70 Q84 72 86 100Z" fill="${color}"/><path d="M38 70 L50 82 L62 70" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="50" y="96" font-size="14" font-weight="900" text-anchor="middle" fill="#fff" font-family="sans-serif">${num}</text>
    <rect x="43" y="56" width="14" height="16" fill="${s}"/><ellipse cx="50" cy="42" rx="19" ry="22" fill="${s}"/>
    <ellipse cx="31" cy="44" rx="3" ry="5" fill="${s}"/><ellipse cx="69" cy="44" rx="3" ry="5" fill="${s}"/>${hair}
    <path d="M40 37 h7 M53 37 h7" stroke="#2a1a10" stroke-width="2.2" stroke-linecap="round"/><circle cx="43.5" cy="43" r="2.2" fill="#1a1a1a"/><circle cx="56.5" cy="43" r="2.2" fill="#1a1a1a"/>
    <path d="M45 54 Q50 57 55 54" stroke="#6b3a2a" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
}



// ===================== 工具 =====================
const rnd = (a,b) => a + Math.random()*(b-a), ri = (a,b) => Math.floor(rnd(a,b+1)), pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const SUR = ['林','陳','黃','張','李','王','吳','劉','蔡','楊','許','鄭','謝','郭','洪','曾','邱','廖','賴','周','高','簡','游','韋','朴','金','崔'];
const GIV = ['承','宇','翔','哲','皓','睿','恩','昊','俊','浩','東','賢','成','勳','振','凱','佑','廷','晨','祐','澤','碩','岳','騰','旻','彥'];
const randName = () => pick(SUR) + pick(GIV) + pick(GIV);
const f1 = v => (Math.round(v * 10) / 10).toFixed(1);
const PRO_TEAMS = [ ['台港海鷗','#3fa7d6'], ['山城猛虎','#f29e4c'], ['北境雪狼','#9aa5b1'], ['南灣巨鯨','#2f6fb5'], ['中原雷鳴','#f1c40f'], ['東岸飛鷹','#c0392b'], ['西嶺黑熊','#8d6e63'], ['星城閃電','#8e44ad'], ['港灣海盜','#16a085'], ['赤焰鳳凰','#e74c3c'] ];

let toastQ = [], toastOn = false;
function toast(t, s) { toastQ.push([t, s]); if (!toastOn) nextToast(); }
function nextToast() {
  const x = toastQ.shift(); if (!x) { toastOn = false; return; } toastOn = true;
  const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = `${x[0]}${x[1] ? `<small>${x[1]}</small>` : ''}`;
  document.body.appendChild(el); setTimeout(() => { el.remove(); nextToast(); }, 3200);
}
function unlock(id) {
  if (!C || C.ach[id]) return;
  const a = ACH.find(x => x[0] === id); if (!a) return;
  C.ach[id] = C.age; LEG.ach[id] = (LEG.ach[id] || 0) + 1; saveLeg();
  toast(`${a[1]} 成就解鎖：${a[2]}`, a[3]);
}
function pushMem(k) { if (!C.memories.includes(k)) C.memories.push(k); }

function line() { return { g:0, min:0, pts:0, reb:0, ast:0, stl:0, blk:0, fgm:0, fga:0, tpm:0, tpa:0, ftm:0, fta:0 }; }

// ===================== 能力 =====================
function ovr() { const w = POS[C.pos].w; let s = 0; for (const k in w) s += C.a[k] * w[k]; return Math.round(s + C.iq * 0.04); }
function growth(k) {
  let g = C.phase === 'HS' ? 1 : C.age <= 25 ? 0.9 : C.age <= 29 ? 0.65 : 0.35;
  if ((k === 'shoot' || k === 'three') && has('P40')) g *= 1.25;
  if (k === 'def' && has('DPOY')) g *= 1.25;
  return g;
}
const avg = (l, k) => l.g ? f1(l[k] / l.g) : '0.0';
const pct = (m, a) => a ? Math.round(m / a * 100) + '%' : '—';
const MIN = { 板凳:12, 輪替:22, 先發:32, 核心:36 };
function assignRole() {
  if (C.phase === 'HS') { const o = ovr(); C.role = o >= 38 || C.year >= 2 ? '核心' : '先發'; return; }
  const o = ovr(), t = C.trust;
  const old = C.role;
  C.role = o >= 74 && t >= 55 ? '核心' : o >= 63 && t >= 35 ? '先發' : o >= 54 ? '輪替' : '板凳';
  if (C.role !== old && ['先發','核心'].includes(C.role)) unlock('starter');
}

// ===================== 聯盟 =====================
function newSeason() {
  const pro = C.phase === 'PRO';
  const src = pro ? PRO_TEAMS : HS_TEAMS;
  const champBonus = has('CHAMP') ? 3 : 0;
  C.league = src.map(([n, c]) => {
    const old = C.league && C.league.find(t => t.n === n);
    const base = pro ? 60 : 44;
    const r = old ? clamp(old.r + rnd(-4, 4), base - 10, base + 14) : base + rnd(-8, 10);
    return { n, c, r: Math.round(r + (n === C.team.n ? champBonus : 0)), w:0, l:0 };
  });
  // NPC 明星（排行榜、MVP、明星賽用）
  C.stars = [];
  const others = C.league.filter(t => t.n !== C.team.n);
  for (let i = 0; i < (pro ? 14 : 8); i++) {
    const t = pick(others), p = pick(['G','F','C']);
    const tier = pro ? rnd(0.55, 1.05) : rnd(0.5, 1);
    C.stars.push({ name: randName(), team: t.n, pos: p, ppg: (pro ? 13 : 12) + tier * 16, rpg: p === 'C' ? 6 + tier * 7 : p === 'F' ? 4 + tier * 4 : 2.5 + tier * 3, apg: p === 'G' ? 3 + tier * 6 : 1.5 + tier * 3, spb: 0.6 + tier * 1.4, g:0, pts:0, reb:0, ast:0, sb:0, rookie: Math.random() < 0.15 });
  }
  if (!pro) C.rival = pick(C.stars).name;
  C.season = line(); C.week = 1; C.allstarDone = false;
  C.weeks = pro ? 12 : 7; C.gpw = pro ? 2 : 1;
  assignRole();
}
const myTeam = () => C.league.find(t => t.n === C.team.n);
function standings() { return [...C.league].sort((a, b) => (b.w - b.l) - (a.w - a.l) || b.r - a.r); }
function simOthersWeek() {
  // 其他隊伍本週戰績
  for (const t of C.league) if (t.n !== C.team.n) for (let i = 0; i < C.gpw; i++) { const o = pick(C.league.filter(x => x !== t)); if (Math.random() < 0.5 + (t.r - o.r) * 0.02) t.w++; else t.l++; }
  for (const s of C.stars) for (let i = 0; i < C.gpw; i++) { s.g++; s.pts += s.ppg * rnd(0.6, 1.4); s.reb += s.rpg * rnd(0.5, 1.5); s.ast += s.apg * rnd(0.5, 1.5); s.sb += s.spb * rnd(0.3, 1.7); }
}
function leaderRows(stat) {
  const rows = C.stars.map(s => ({ name: s.name, team: s.team, v: s.g ? s[stat] / s.g : 0 }));
  if (C.season.g) rows.push({ name: C.name, team: C.team.n, v: C.season[stat] / C.season.g, me: true });
  return rows.sort((a, b) => b.v - a.v);
}
function mvpScore(s, team) { const g = Math.max(1, s.g); const t = C.league.find(x => x.n === team); const wp = t && (t.w + t.l) ? t.w / (t.w + t.l) : 0.5; return s.pts / g + 0.8 * s.reb / g + 1.0 * s.ast / g + 1.2 * (s.sb !== undefined ? s.sb : s.stl + s.blk) / g + wp * 14; }
function mvpRace() {
  const rows = C.stars.map(s => ({ name: s.name, team: s.team, v: mvpScore(s, s.team) }));
  if (C.season.g) rows.push({ name: C.name, team: C.team.n, v: mvpScore(C.season, C.team.n), me: true });
  return rows.sort((a, b) => b.v - a.v);
}

// ===================== 每週 =====================
function train(k) {
  let t = '';
  if (C.injury) { C.injury--; C.fatigue = Math.max(0, C.fatigue - 35); t = '你在防護室做復健。'; }
  else if (k === 'rest') { C.fatigue = Math.max(0, C.fatigue - 45); t = '你好好休息了一週。'; }
  else if (k === 'iq') { C.iq = Math.min(100, C.iq + 8); C.fatigue += 4; t = '你把下一個對手的比賽錄影看了三遍。\n球商 +8（關鍵時刻判斷更準）'; }
  else {
    const tired = C.fatigue >= 60 ? 0.6 : 1, g = rnd(2.4, 4.2) * growth(k) * tired;
    C.a[k] = Math.min(99, C.a[k] + g); C.fatigue += rnd(10, 15);
    t = `${ATTR[k]} <span class="good">+${g.toFixed(1)}</span>${tired < 1 ? '　<span class="muted">（太疲勞，效果打折）</span>' : ''}`;
    if (C.fatigue > 72 && Math.random() < (C.fatigue - 68) * 0.012 * (has('UNDRAFTED') ? 0.65 : 1)) { const w = ri(1, 3); C.injury = w; C.fatigue = 30; t += `\n\n<span class="bad">練太兇，腳踝扭傷了，傷停 ${w} 週。</span>`; }
  }
  C.note = ''; saveRun();
  playWeek(t);
}
async function playWeek(trainText) {
  const games = [];
  for (let i = 0; i < C.gpw; i++) games.push(pick(C.league.filter(t => t.n !== C.team.n)));
  let i = 0;
  const next = () => {
    if (i >= games.length) return endWeek();
    const o = games[i]; i++;
    if (C.injury) { const win = Math.random() < 0.5 + (myTeam().r - o.r) * 0.02 - 0.08; recordTeam(win); return scene('傷停中', `你坐在場邊看隊友對 ${o.n}。\n\n${win ? '球隊贏了' : '球隊輸了'}`, [{ label:'繼續', fn:() => { closeScene(); next(); } }], 'injury'); }
    const T = myTeam(), isRival = C.phase === 'HS' && C.stars.find(s => s.name === C.rival && s.team === o.n);
    scene(`第 ${C.week} 週・第 ${i} 場`, `${trainText && i === 1 ? trainText + '\n\n' : ''}<b>${C.team.n}</b>（${T.w}-${T.l}）vs <b>${o.n}</b>（${o.w}-${o.l}）\n你的角色：${C.role}，約 ${MIN[C.role]} 分鐘${isRival ? `\n\n<b class="bad">宿敵 ${C.rival} 在對面。</b>` : ''}`, [
      { label:'🏀 觀看比賽', note:'即時播出，最後關頭由你決定', fn:() => { closeScene(); startGame(o, { watch: true, onEnd: next }); } },
      { label:'⏭ 直接看結果', fn:() => { closeScene(); startGame(o, { watch: false, onEnd: next }); } },
    ], 'arena', o.c);
  };
  next();
}
function recordTeam(win) { const T = myTeam(); if (win) T.w++; else T.l++; }
function endWeek() {
  simOthersWeek();
  C.week++;
  C.fatigue = Math.max(0, C.fatigue - 6);
  if (C.phase === 'PRO' && !C.allstarDone && C.week > C.weeks / 2) { C.allstarDone = true; return allStar(); }
  if (C.week > C.weeks) return endRegular();

}
function allStar() {
  const rows = C.stars.map(s => ({ name: s.name, v: mvpScore(s, s.team) })); rows.push({ name: C.name, v: mvpScore(C.season, C.team.n), me: true }); rows.sort((a, b) => b.v - a.v);
  const rank = rows.findIndex(r => r.me) + 1;

    return scene('🌟 明星賽', `票選結果出爐——你以第 ${rank} 名入選明星賽！\n這是你第 ${C.allstars} 次入選。`, [{ label:'繼續', fn:() => { closeScene(); showHub(); } }], 'arena'); }

// ===================== 比賽引擎 =====================
let GM = null;
function startGame(opp, opt) {
  const T = myTeam(), hs = C.phase === 'HS';
  const N = ri(188, 200);
  const mins = clamp(MIN[C.role] + ri(-3, 3), 6, 42);
  const o = ovr();
  const usage = { 板凳:.17, 輪替:.19, 先發:.22, 核心:.28 }[C.role] * (0.7 + o / 150);
  const oppStar = C.stars.filter(s => s.team === opp.n).sort((a, b) => b.ppg - a.ppg)[0];
  GM = { opp, opt, T, N, i: 0, our: 0, them: 0, mins, usage, me: line(), hist: [0], feed: [], oppStar, ot: 0, clutchDone: false, finalDone: false, speed: opt.watch ? 55 : 0, paused: false, clutchHit: false, starPts: 0 };
  GM.me.min = mins;
  if (opt.watch) {
    $('game').classList.remove('hide'); $('game').scrollTop = 0;
    $('gHome').textContent = C.team.n; $('gAway').textContent = opp.n; $('gFeed').innerHTML = ''; $('gClutch').innerHTML = '';
    $('gSpeed').textContent = '⏩ 快轉'; $('gSpeed').disabled = false; $('gSkip').disabled = false;
    feed(`<div class="q">${C.team.n} vs ${opp.n}　比賽開始！</div>`);
  }
  runGame();
}
function onCourt(i) {
  // 你在場上的時段：開場、第三節開場、末段（主力）
  const t = i / GM.N * 48, m = GM.mins;
  if (m >= 30) return !(t > 9 && t < 9 + (48 - m) / 2) && !(t > 33 && t < 33 + (48 - m) / 2);
  const start = C.role === '輪替' ? 10 : 14;
  return (t >= start && t < start + m / 2) || (t >= 34 && t < 34 + m / 2) || (t >= 46 && C.trust >= 50);
}
function clock(i) {
  const total = GM.N, t = Math.min(48, i / total * 48);
  if (GM.ot) { const left = Math.max(0, 5 - ((i - total) % 20) / 20 * 5); return { q:'延長賽', s: fmtClock(left) }; }
  const q = Math.min(4, Math.floor(t / 12) + 1); const left = 12 - (t - (q - 1) * 12);
  return { q:`第 ${q} 節`, s: fmtClock(left), qn: q };
}
const fmtClock = m => `${Math.floor(m)}:${String(Math.floor((m % 1) * 60)).padStart(2, '0')}`;
function feed(h) { if (!GM.opt.watch) return; const f = $('gFeed'); f.insertAdjacentHTML('beforeend', h); f.scrollTop = f.scrollHeight; }
function myLine() {
  const m = GM.me;
  $('gMy').innerHTML = `<div><b>${m.pts}</b><span>得分</span></div><div><b>${m.reb}</b><span>籃板</span></div><div><b>${m.ast}</b><span>助攻</span></div><div><b>${m.stl + m.blk}</b><span>抄阻</span></div><div><b>${m.fgm}/${m.fga}</b><span>投籃</span></div>`;
}
function drawLead() {
  const cv = $('lead'); if (!cv.getContext) return; const c = cv.getContext('2d'); if (!c) return;
  const W = 520, H = 90; c.clearRect(0, 0, W, H);
  c.strokeStyle = '#333d4c'; c.lineWidth = 1; c.beginPath(); c.moveTo(0, H / 2); c.lineTo(W, H / 2); c.stroke();
  for (let q = 1; q < 4; q++) { c.beginPath(); c.moveTo(W * q / 4, 0); c.lineTo(W * q / 4, H); c.stroke(); }
  const h = GM.hist, n = Math.max(GM.N + (GM.ot ? 20 : 0), h.length), mx = Math.max(10, ...h.map(Math.abs));
  c.lineWidth = 3; c.beginPath();
  h.forEach((v, i) => { const x = i / n * W, y = H / 2 - v / mx * (H / 2 - 6); i ? c.lineTo(x, y) : c.moveTo(x, y); });
  c.strokeStyle = C.team.c; c.stroke();
  c.fillStyle = '#95a1b3'; c.font = '11px sans-serif'; c.fillText('領先', 4, 12); c.fillText('落後', 4, H - 4);
}
function render() { if (!GM.opt.watch) return; const k = clock(GM.i); $('gOur').textContent = GM.our; $('gOpp').textContent = GM.them; $('gQ').textContent = k.q; $('gClk').textContent = k.s; myLine(); drawLead(); }

// 一個我方回合
function ourPoss(force) {
  const me = GM.me, oppDef = GM.opp.r, on = onCourt(GM.i) || force;
  const defAdj = (oppDef - (C.phase === 'HS' ? 44 : 60)) * 0.0025;
  if (on && (force || Math.random() < GM.usage)) {
    const a = C.a;
    // 傳球創造
    if (!force && Math.random() < a.pass / 420) {
      const made = Math.random() < 0.5 + a.pass * 0.0015 - defAdj;
      if (made) { const p = Math.random() < 0.38 ? 3 : 2; me.ast++; GM.our += p; feed(`<div class="me">🎯 ${C.name}妙傳助攻，隊友${p === 3 ? '三分' : '上籃'}得手</div>`); return p; }
      return 0;
    }
    const w3 = Math.pow(a.three, 1.6) * (C.pos === 'C' ? 0.3 : 1), wd = Math.pow(a.drive, 1.6), wm = Math.pow(a.shoot, 1.6);
    let r = Math.random() * (w3 + wd + wm), type = r < w3 ? 3 : r < w3 + wd ? 'd' : 2;
    if (force) type = force;
    let p, pts = 0, txt;
    if (type === 3) { p = 0.19 + a.three * 0.0023 - defAdj; me.tpa++; me.fga++; if (Math.random() < p) { pts = 3; me.tpm++; me.fgm++; txt = pick(['左側底角三分，唰！','弧頂急停三分命中！','後撤步三分——進了！','接球就投，三分空心！']); } else txt = '三分出手，沒進'; }
    else if (type === 2) { p = 0.28 + a.shoot * 0.0026 - defAdj; me.fga++; if (Math.random() < p) { pts = 2; me.fgm++; txt = pick(['罰球線急停跳投，進！','轉身後仰跳投，命中！','中距離拔起來投——進了！']); } else txt = '中距離跳投偏出'; }
    else { p = 0.39 + a.drive * 0.003 + a.ath * 0.0008 - defAdj; me.fga++;
      if (Math.random() < 0.17) { const ft = 0.55 + a.shoot * 0.004; let m = 0; for (let k = 0; k < 2; k++) { me.fta++; if (Math.random() < ft) { m++; me.ftm++; } } pts = m; txt = `切入造成犯規，罰球 ${m}/2`; me.fga--; }
      else if (Math.random() < p) { pts = 2; me.fgm++; const dunk = a.ath > 58 && Math.random() < 0.4; txt = dunk ? pick(['一步過人，暴力灌籃！！','空中接力灌籃！']) : pick(['切入上籃得手','歐洲步上籃！','拋投進了','禁區強打得分']); if (Math.random() < 0.12) { me.fta++; if (Math.random() < 0.55 + a.shoot * 0.004) { me.ftm++; pts++; txt += '，還加罰命中！'; } } }
      else txt = pick(['切入上籃被蓋','擠進禁區出手沒進']); }
    me.pts += pts; GM.our += pts;
    if (pts === 0 && Math.random() < POS[C.pos].rebF * 0.8 * (a.reb / 60)) { me.reb++; txt += '（搶下進攻籃板）'; }
    feed(`<div class="me">${pts ? '🔥 ' : '　'}${C.name}：${txt}</div>`);
    return pts;
  }
  // 隊友回合
  const make = clamp(0.47 + (GM.T.r - oppDef) * 0.004, 0.32, 0.62);
  if (Math.random() < make) { const p = Math.random() < 0.35 ? 3 : 2; GM.our += p; if (on && Math.random() < C.a.pass / 900) { me.ast++; } return p; }
  if (on && Math.random() < POS[C.pos].rebF * 0.6 * (C.a.reb / 60)) me.reb++;
  return 0;
}
function theirPoss() {
  const me = GM.me, on = onCourt(GM.i);
  let make = clamp(0.47 + (GM.opp.r - GM.T.r) * 0.004 + (C.phase === 'HS' ? 0 : 0), 0.32, 0.62);
  if (on) make -= (C.a.def - 50) * 0.0012;
  if (on && Math.random() < C.a.def / 1700) { me.stl++; feed(`<div class="me">🖐 ${C.name}抄截！</div>`); return 0; }
  if (on && C.pos !== 'G' && Math.random() < C.a.def / (C.pos === 'C' ? 1300 : 2600)) { me.blk++; feed(`<div class="me">🚫 ${C.name}一記火鍋！</div>`); return 0; }
  if (Math.random() < make) {
    const p = Math.random() < 0.35 ? 3 : 2; GM.them += p;
    if (GM.oppStar && Math.random() < 0.3) { GM.starPts += p; if (GM.opt.watch && Math.random() < 0.35) feed(`<div class="op">　${GM.oppStar.name}${p === 3 ? '三分命中' : '得分'}</div>`); }
    return p;
  }
  if (on && Math.random() < POS[C.pos].rebF * (C.a.reb / 60)) me.reb++;
  return 0;
}

async function runGame() {
  const g = GM;
  while (true) {
    const end = g.N + (g.ot ? g.ot * 20 : 0);
    if (g.i >= end) {
      if (g.our === g.them) { g.ot++; feed(`<div class="q">平手！進入延長賽</div>`); continue; }
      break;
    }
    const k = clock(g.i);
    if (g.opt.watch && g.i > 0 && !g.ot && Math.floor(g.i / g.N * 4) !== Math.floor((g.i - 1) / g.N * 4)) feed(`<div class="q">— ${k.q}開始　比分 ${g.our} : ${g.them} —</div>`);
    // 關鍵時刻：最後一擊（落後 1–3 分或平手、最後一次我方進攻）
    const lastOwn = !g.ot && g.i >= g.N - 2 && g.i % 2 === 0;
    const diff = g.our - g.them;
    if (lastOwn && !g.finalDone && diff <= 0 && diff >= -3) {
      g.finalDone = true;
      const pts = await clutch(true); if (g.dead) return;
      g.hist.push(g.our - g.them); g.i += 2; render(); continue;
    }
    // 兩分鐘關鍵時刻
    if (!g.ot && !g.clutchDone && g.i >= g.N * 0.95 - 2 && g.i % 2 === 0 && Math.abs(diff) <= 6 && onCourt(g.i)) {
      g.clutchDone = true; await clutch(false); if (g.dead) return; g.hist.push(g.our - g.them); g.i += 2; render(); continue;
    }
    const side = g.i % 2 === 0 ? 'us' : 'them';
    const pp = side === 'us' ? ourPoss() : theirPoss();
    if (pp > 0) { if (g.run && g.run.side === side) g.run.pts += pp; else g.run = { side, pts: pp, shown: false };
      if (g.run.pts >= 8 && !g.run.shown) { g.run.shown = true; feed(side === 'us' ? `<div class="big">🔥 ${C.team.n}打出一波 ${g.run.pts}:0 攻勢！</div>` : `<div class="op">⚠ ${g.opp.n}連得 ${g.run.pts} 分，教練喊暫停</div>`); } }
    g.hist.push(g.our - g.them); g.i++;
    if (g.opt.watch) { render(); if (g.speed) await sleep(g.speed); if (g.dead) return; }
  }
  finishGame();
}
function clutch(final) {
  return new Promise(res => {
    const g = GM, diff = g.our - g.them;
    const iqB = C.iq / 400 + (has('HS_CHAMP') ? 0.08 : 0) + (has('CLUTCH') ? 0.12 : 0);
    const a = C.a, defAdj = (g.opp.r - (C.phase === 'HS' ? 44 : 60)) * 0.0025;
    const opts = [
      { k:'iso3', l:'自己投三分', p: 0.2 + a.three * 0.0026 + iqB - defAdj, pts:3, d:`三分 ${Math.round(a.three)}` },
      { k:'iso2', l:'自己切入／中距', p: 0.36 + Math.max(a.drive, a.shoot) * 0.0028 + iqB - defAdj, pts:2, d:`切入 ${Math.round(a.drive)}・中距 ${Math.round(a.shoot)}` },
      { k:'pnr', l:'擋拆找隊友', p: 0.38 + a.pass * 0.0025 + iqB * 0.6 - defAdj, pts:2, ast:true, d:`傳球 ${Math.round(a.pass)}` },
    ];
    const resolve = (o) => {
      const made = Math.random() < clamp(o.p, 0.12, 0.8);
      const me = g.me;
      if (o.k !== 'pnr') { me.fga++; if (o.pts === 3) me.tpa++; }
      let txt;
      if (made) { g.our += o.pts; if (o.k === 'pnr') { me.ast++; txt = '你吸引包夾，把球塞給切入的隊友——得手！'; } else { me.fgm++; me.pts += o.pts; if (o.pts === 3) me.tpm++; txt = o.pts === 3 ? '你在三分線外拔起來——<b>唰！</b>' : '你一個節奏變換切進去——<b>進了！</b>'; } }
      else txt = o.k === 'pnr' ? '傳球被對手預判，隊友出手不進。' : '出手……打框彈出！';
      const nd = g.our - g.them;
      if (final && made && nd > 0 && o.k !== 'pnr') { g.clutchHit = true; txt += '<br><span class="big">💥 絕殺！！全場沸騰！</span>'; }
      else if (final && made && nd > 0) txt += '<br><span class="big">💥 最後一擊逆轉！</span>';
      else if (final && made && nd === 0) txt += '<br>追平比分！';
      feed(`<div class="me">⏱ ${txt}</div>`);
      $('gClutch').innerHTML = ''; render(); res();
    };
    if (!g.opt.watch) { // AI 自動選
      const best = opts.filter(o => !(diff <= -3 && o.pts < 3) || !final).sort((x, y) => y.p * y.pts - x.p * x.pts)[0];
      if (final && diff === -3) resolve(opts[0]); else resolve(best || opts[1]);
      return;
    }
    const left = final ? '最後 8 秒' : '剩 2 分鐘';
    const situ = diff === 0 ? '平手' : diff > 0 ? `領先 ${diff} 分` : `落後 ${-diff} 分`;
    const need = final && diff <= -3 ? '<br><b class="bad">要三分才追得平！</b>' : final && diff < 0 ? '<br>投進兩分可以追平或超前！' : '';
    $('gClutch').innerHTML = `<div class="clutch"><div style="font-size:19px;font-weight:900">⏱ ${final ? '最後一擊！' : '關鍵時刻！'}　${left}・${situ}</div><div class="muted" style="margin:4px 0 10px">球在你手上，教練看著你。${need}</div><div class="col" id="cBtns"></div></div>`;
    for (const o of opts) { const b = document.createElement('button'); b.className = 'choice'; b.innerHTML = `${o.l}　<span class="gold">成功率約 ${Math.round(clamp(o.p, 0.12, 0.8) * 100)}%</span><small>${o.d}・${o.pts} 分</small>`; b.onclick = () => resolve(o); $('cBtns').appendChild(b); }
    $('gClutch').scrollIntoView && $('gClutch').scrollIntoView({ block:'end', behavior:'smooth' });
  });
}
$('gSpeed').onclick = () => { if (!GM) return; GM.speed = GM.speed > 5 ? 4 : 55; $('gSpeed').textContent = GM.speed > 5 ? '⏩ 快轉' : '▶ 正常速度'; };
$('gSkip').onclick = () => { if (!GM) return; GM.speed = 0; $('gSpeed').disabled = true; $('gSkip').disabled = true; };

function finishGame() {
  const g = GM, m = g.me, win = g.our > g.them, playoff = g.opt.playoff;
  if (!playoff) recordTeam(win);
  for (const T of [C.season, C.career]) { T.g++; for (const k in m) T[k] += m[k]; }
  if (playoff) { C.po = C.po || line(); C.po.g++; for (const k in m) C.po[k] += m[k]; }
  C.fatigue += 6 + g.mins * 0.2;
  const gs = m.pts + 0.7 * m.reb + 0.9 * m.ast + 1.2 * (m.stl + m.blk) - 0.3 * (m.fga - m.fgm);
  C.trust = clamp(C.trust + (gs >= 20 ? 5 : gs >= 12 ? 3 : gs >= 6 ? 1 : -2) + (win ? 1 : 0), 0, 100);
  // 成就
  unlock('debut');
  const tag = C.phase === 'HS' ? `高${'一二三'[C.year-1]}` : `職業第 ${C.proYear} 年`;
  if (m.pts >= 20) unlock('p20'); if (m.pts >= 30) unlock('p30');
  if (m.pts >= 40) { unlock('p40'); pushMem('P40'); C.highlights.push(`${tag}對 ${g.opp.n} 砍下 ${m.pts} 分`); }
  if (m.pts >= 50) unlock('p50');
  const dbl = [m.pts, m.reb, m.ast, m.stl, m.blk].filter(v => v >= 10).length;
  if (dbl >= 2) unlock('dd'); if (dbl >= 3) { unlock('td'); pushMem('TD'); C.highlights.push(`${tag}對 ${g.opp.n} 拿下大三元`); }
  if (g.clutchHit && win) { unlock('clutch'); pushMem('CLUTCH'); C.highlights.push(`${tag}對 ${g.opp.n} 投進絕殺`); }
  const K = C.career.pts; if (K >= 1000) unlock('k1'); if (K >= 5000) unlock('k5'); if (K >= 10000) unlock('k10');
  if (C.fatigue > 78 && Math.random() < (C.fatigue - 74) * 0.01 * (has('UNDRAFTED') ? 0.65 : 1)) { C.injury = ri(1, 3); }
  saveRun();
  const box = `<div class="card"><table><tr><th class="l"></th><th>分</th><th>板</th><th>助</th><th>抄</th><th>阻</th><th>投籃</th><th>三分</th></tr>
    <tr class="me"><td class="l">${C.name}</td><td>${m.pts}</td><td>${m.reb}</td><td>${m.ast}</td><td>${m.stl}</td><td>${m.blk}</td><td>${m.fgm}/${m.fga}</td><td>${m.tpm}/${m.tpa}</td></tr>
    ${g.oppStar ? `<tr><td class="l muted">${g.oppStar.name}</td><td>${Math.max(g.starPts, Math.round(g.oppStar.ppg * rnd(0.6, 1.2)))}</td><td colspan="6" class="muted">${g.opp.n}頭號球星</td></tr>` : ''}</table>
    <div class="muted" style="font-size:14px;margin-top:6px">上場 ${g.mins} 分鐘　效率值 ${f1(gs)}${gs >= 25 ? '　<b class="gold">本場最佳球員</b>' : ''}</div></div>`;
  const head = `<div class="big-num">${g.our} : ${g.them}</div><div style="text-align:center;font-size:22px;font-weight:900" class="${win ? 'good' : 'bad'}">${win ? '贏球！' : '輸球'}${g.ot ? '（延長賽）' : ''}</div>`;
  const after = () => { $('game').classList.add('hide'); GM = null; g.opt.onEnd(win, m); };
  if (C.injury) { C.note = `<span class="bad">賽後膝蓋不舒服，傷停 ${C.injury} 週（疲勞累積）。</span>`; }
  const show = () => {
    $('sceneIn').innerHTML = art(win ? 'arena' : 'night', C.team.c, ri(1, 99)) + head + box + (C.injury ? `<div class="card bad">賽後受傷，傷停 ${C.injury} 週（疲勞太高）。</div>` : '') + `<button id="bNextG" style="width:100%">繼續</button>`;
    $('scene').classList.remove('hide'); $('scene').scrollTop = 0;
    $('bNextG').onclick = () => { $('scene').classList.add('hide'); after(); };
  };
  if (g.opt.watch) { render(); feed(`<div class="q">比賽結束　${g.our} : ${g.them}</div>`); setTimeout(show, 900); } else show();
}

// ===================== 季後賽 =====================
function endRegular() {
  const st = standings(), seed = st.findIndex(t => t.n === C.team.n) + 1;
  saveRun();
  if (seed > 4) { C.note = ''; return scene('例行賽結束', `球隊戰績 ${myTeam().w}-${myTeam().l}，排名第 ${seed}，<b class="bad">無緣季後賽</b>。`, [{ label:'繼續', fn:() => { closeScene(); endSeason(false); } }], 'night'); }
  C.po = line();
  const bo = C.phase === 'HS' ? 1 : 3;
  const semiOpp = st[seed === 1 ? 3 : seed === 2 ? 2 : seed === 3 ? 1 : 0];
  scene('季後賽！', `球隊以第 ${seed} 種子打進季後賽。\n準決賽對手：${semiOpp.n}（${semiOpp.w}-${semiOpp.l}）\n${bo === 1 ? '單場淘汰' : '三戰兩勝'}`, [{ label:'開打', fn:() => { closeScene(); series(semiOpp, bo, '準決賽', won => {
    if (!won) return scene('季後賽出局', '準決賽落敗，賽季結束。', [{ label:'繼續', fn:() => { closeScene(); endSeason(false); } }], 'night');
    const others = st.slice(0, 4).filter(t => t.n !== C.team.n && t.n !== semiOpp.n);
    const fOpp = Math.random() < 0.5 + (others[0].r - others[1].r) * 0.03 ? others[0] : others[1];
    const bo2 = C.phase === 'HS' ? 1 : 5;
    scene('🏆 總冠軍賽', `你們晉級${C.phase === 'HS' ? '冠軍賽' : '總冠軍賽'}！\n對手：${fOpp.n}\n${bo2 === 1 ? '一場定江山' : '五戰三勝'}`, [{ label:'開打', fn:() => { closeScene(); series(fOpp, bo2, '總冠軍賽', w2 => {
      if (w2) champion(); else scene('亞軍', '只差一步……冠軍賽落敗。明年再來。', [{ label:'繼續', fn:() => { closeScene(); endSeason(false); } }], 'night');
    }); } }], 'arena', fOpp.c);
  }); } }], 'arena', semiOpp.c);
}
function series(opp, bo, name, done) {
  let w = 0, l = 0, n = 0; const need = Math.ceil(bo / 2); const fin = [];
  const next = () => {
    if (w >= need) return done(true); if (l >= need) return done(false);
    n++;
    scene(`${name}・第 ${n} 戰`, `${C.team.n} vs ${opp.n}\n系列賽 ${w} : ${l}${(w === need - 1 || l === need - 1) && bo > 1 ? '\n<b class="gold">' + (w === need - 1 && l === need - 1 ? '搶七般的決勝戰！' : w === need - 1 ? '再贏一場就晉級！' : '輸了就淘汰！') + '</b>' : ''}`, [
      { label:'🏀 觀看比賽', fn:() => { closeScene(); startGame(opp, { watch:true, playoff:true, onEnd:(win, m) => { if (win) w++; else l++; fin.push(m); next(); } }); } },
      { label:'⏭ 直接看結果', fn:() => { closeScene(); startGame(opp, { watch:false, playoff:true, onEnd:(win, m) => { if (win) w++; else l++; fin.push(m); next(); } }); } },
    ], 'arena', opp.c);
  };
  C.lastSeries = fin; next();
}
function champion() {
  if (C.phase === 'HS') { unlock('hsc'); pushMem('HS_CHAMP'); C.highlights.push(`高${'一二三'[C.year-1]}拿下高中聯賽冠軍`); C.trust += 10;
    return scene('🏆 高中冠軍！', `${C.team.n}奪得高中聯賽冠軍！\n全隊把你拋向空中。`, [{ label:'繼續', fn:() => { closeScene(); endSeason(true); } }], 'trophy'); }
  C.rings++; unlock('ring'); pushMem('CHAMP');
  const f = C.lastSeries || []; const avgP = f.length ? f.reduce((s, m) => s + m.pts, 0) / f.length : 0;
  const fmvp = avgP >= 18;
  if (fmvp) { unlock('fmvp'); C.awards.push(`職${C.proYear} 總冠軍賽MVP`); }
  C.highlights.push(`職業第 ${C.proYear} 年拿下總冠軍${fmvp ? '（總冠軍賽 MVP）' : ''}`);
  scene('💍 總冠軍！', `${C.team.n}奪得總冠軍！香檳灑滿了休息室。\n這是你的第 ${C.rings} 枚冠軍戒指。${fmvp ? `\n\n<b class="gold">你以場均 ${f1(avgP)} 分獲選總冠軍賽 MVP！</b>` : ''}`, [{ label:'繼續', fn:() => { closeScene(); endSeason(true); } }], 'trophy');
}

// ===================== 季末 =====================
function endSeason(champ) {
  const L = C.season, lines = [];
  C.seasons.push({ label: C.phase === 'HS' ? `高${'一二三'[C.year-1]}` : `職${C.proYear}`, team: C.team.n, ...L });
  if (C.phase === 'PRO') {
    const R = mvpRace();
    if (R[0].me && L.g >= 12) { C.mvps++; unlock('mvp'); pushMem('MVP'); C.awards.push(`職${C.proYear} MVP`); lines.push('<b class="gold">👑 年度 MVP！</b>'); C.highlights.push(`職業第 ${C.proYear} 年獲選 MVP`); }
    const pts = leaderRows('pts'); if (pts[0].me) { unlock('scoring'); C.awards.push(`職${C.proYear} 得分王`); lines.push(`💯 得分王（${f1(pts[0].v)} 分）`); }
    if (L.g && (L.stl + L.blk) / L.g >= 2.6) { unlock('dpoy'); pushMem('DPOY'); C.awards.push(`職${C.proYear} 最佳防守`); lines.push('🛡️ 年度最佳防守球員'); }
    if (C.proYear === 1 && L.g && L.pts / L.g >= 12) { unlock('roy'); C.awards.push('新人王'); lines.push('🌱 新人王！'); }
    if (R.findIndex(r => r.me) < 5) lines.push('入選年度最佳陣容');
    const perf = L.g ? L.pts / L.g : 0;
    C.money += C.salary;
    C.proYear++; C.contract--;
    if (C.proYear > 10) { unlock('ten'); pushMem('LONG'); }
  }
  // 老化
  C.age++;
  const dAge = has('LONG') ? 32 : 30;
  if (C.phase === 'PRO' && C.age > dAge) { const d = C.age - dAge; C.a.ath -= 2 + d * 0.5; C.a.drive -= 1 + d * 0.4; C.a.def -= 0.8 + d * 0.3; C.a.reb -= 0.6 + d * 0.2; }
  saveRun();
  const text = `<b>${C.phase === 'HS' ? `高${'一二三'[C.year-1]}` : `第 ${C.proYear - 1} 季`}結束</b>\n平均 ${avg(L,'pts')} 分 ${avg(L,'reb')} 板 ${avg(L,'ast')} 助　命中率 ${pct(L.fgm, L.fga)}\n球隊戰績 ${myTeam().w}-${myTeam().l}${lines.length ? '\n\n' + lines.join('\n') : ''}`;
  if (C.phase === 'HS') {
    if (C.year === 3) return scene('畢業', text + '\n\n高中三年結束了。接下來——選秀會。', [{ label:'前往選秀會', fn:() => { closeScene(); draft(); } }], 'school');
    return scene('學年結束', text, [{ label:'升上新學年', fn:() => { closeScene(); C.year++; newSeason(); C.note = `升上高${'一二三'[C.year-1]}。這一屆最強的對手是 <b class="bad">${C.rival}</b>。`; saveRun(); showHub(); } }], lines.length ? 'trophy' : 'school');
  }
  const forced = C.age >= 39 || (C.age >= 30 && ovr() < 50);
  if (forced) return scene('季末', text + `\n\n<span class="bad">${C.age >= 39 ? '身體已經跟不上了。' : '沒有球隊願意給你合約了。'}</span>`, [{ label:'結束職業生涯', fn:() => { closeScene(); retire(); } }], 'night');
  scene('季末', text, [{ label:'繼續', fn:() => { closeScene(); offseason(); } }], lines.length ? 'trophy' : 'gym');
}
function offseason() {
  if (C.contract <= 0) return freeAgency();
  newSeason(); C.note = `新球季開始。你是${C.role}。`; saveRun(); showHub();
}
function freeAgency() {
  const o = ovr(), base = Math.round(80 + Math.max(0, o - 45) * 18 + (C.season.g ? C.season.pts / C.season.g : 0) * 10);
  const cur = myTeam();
  const pool = C.league.filter(t => t.n !== C.team.n).sort((a, b) => b.r - a.r);
  const offers = [
    { t: cur, sal: Math.round(base * 1.0), y: 3, note:'原隊續約，教練信任保留' },
    { t: pool[0], sal: Math.round(base * 0.8), y: 2, note:`聯盟最強隊之一（實力 ${pool[0].r}），衝冠軍但薪水較低` },
    { t: pool[pool.length - 1], sal: Math.round(base * 1.4), y: 4, note:`重建中的球隊（實力 ${pool[pool.length - 1].r}），給你最多錢和球權` },
  ];
  scene('自由球員', `你的合約到期了，三支球隊開出條件：`, offers.map(x => ({ label:`${x.t.n}　<span class="gold">${x.sal} 萬 × ${x.y} 年</span>`, note: x.note, fn:() => {
    const moved = x.t.n !== C.team.n;
    C.team = { n: x.t.n, c: x.t.c }; C.salary = x.sal; C.contract = x.y;
    if (moved) { C.trust = Math.max(30, C.trust - 15); if (x === offers[2]) C.trust += 20; }
    closeScene(); newSeason(); C.note = moved ? `你加盟了${C.team.n}！` : `你和${C.team.n}續約了。`; saveRun(); showHub();
  } })), 'draft');
}

// ===================== 選秀 =====================
function draft() {
  const ppg = C.seasons.length ? C.seasons[C.seasons.length - 1].pts / Math.max(1, C.seasons[C.seasons.length - 1].g) : 0;
  const v = ovr() + ppg * 0.35 + (C.ach.hsc ? 5 : 0) + rnd(-3, 3);
  const pool = []; for (let i = 0; i < 40; i++) pool.push(40 + rnd(-6, 12));
  const rank = pool.filter(x => x > v).length + 1;
  const head = `選秀會當晚，你坐在台下，手心都是汗。\n（球探評價 ${Math.round(v)}）\n\n`;
  if (rank > 20) { pushMem('UNDRAFTED'); C.highlights.push('選秀會上沒有被唸到名字'); saveRun();
    return scene('選秀會', head + '一輪、二輪……最後一個名字唸完，燈光暗了下來。\n\n<b class="bad">落選了。</b>', [{ label:'這一世到此為止', fn:() => { closeScene(); endLife('選秀落選'); } }], 'draft'); }
  const T = pick(PRO_TEAMS);
  if (rank <= 5) unlock('lottery'); if (rank === 1) { unlock('no1'); pushMem('DRAFT1'); }
  C.highlights.push(`第 ${rank <= 10 ? 1 : 2} 輪第 ${rank} 順位被${T[0]}選中`);
  const bonus = Math.round(1200 / rank + 100); C.money += bonus;
  C.salary = Math.round(500 / Math.sqrt(rank) + 60); C.contract = 3;
  scene('選秀會', head + `「第 ${rank} 順位——${T[0]}選擇……${C.name}！」${rank === 1 ? '\n\n<b class="gold">狀元！</b>' : rank <= 5 ? '\n\n<b class="gold">樂透秀！</b>' : ''}\n\n簽約金 ${bonus} 萬，新秀合約 ${C.salary} 萬 × 3 年。`, [{ label:'加入職業聯盟', fn:() => {
    C.phase = 'PRO'; C.proYear = 1; C.age = 19; C.team = { n: T[0], c: T[1] }; C.trust = Math.min(100, 20 + (has('MVP') ? 25 : 0) + Math.max(0, 25 - rank * 2)); C.league = null; newSeason();
    C.note = `你穿上了${C.team.n}的球衣。${C.role === '板凳' ? '總教練說：「新秀先從板凳開始，表現給我看。」' : `你一進聯盟就是${C.role}！`}`; saveRun(); closeScene(); showHub();
  } }], 'draft', T[1]);
}

// ===================== 退休／轉生 =====================
function retire() {
  const K = C.career, score = K.pts / 1000 + C.rings * 3 + C.mvps * 4 + C.allstars * 1.2;
  const msgs = [];
  if ((score >= 9 && K.pts >= 5000) || (C.rings >= 2 && K.pts >= 3000) || C.mvps >= 1) { unlock('jersey'); msgs.push(`👕 ${C.team.n}宣布退休你的 ${C.num} 號球衣。`); }
  if (score >= 16 && (K.pts >= 8000 || C.mvps >= 1)) { unlock('hof'); msgs.push('🏛️ 你入選了名人堂！'); C.highlights.push('入選名人堂'); }
  saveRun();
  scene('退休', `${C.age} 歲，${C.name}宣布退休。\n\n生涯 ${K.g} 場　${K.pts} 分（平均 ${avg(K,'pts')}）\n💍 ${C.rings}　🌟 明星賽 ${C.allstars} 次　👑 MVP ${C.mvps} 次${msgs.length ? '\n\n' + msgs.join('\n') : ''}`, [{ label:'回顧這一生', fn:() => { closeScene(); endLife('退休'); } }], msgs.length ? 'trophy' : 'night');
}
function endLife(how) {
  const K = C.career;
  const summary = C.phase === 'HS' ? `高中畢業後${how}` : `職業 ${C.proYear - 1} 年・${K.pts} 分・💍${C.rings}・MVP ${C.mvps}`;
  const mems = [...new Set(C.memories)];
  const inh = Object.keys(ATTR).map(k => ({ k, v: Math.max(2, Math.round(C.a[k] * 0.1)) })).sort((a, b) => b.v - a.v).slice(0, 4);
  let selM = mems[0] || null, selI = inh[0];
  const draw = () => {
    $('sceneIn').innerHTML = art('night', C.team.c, 3) + `<div class="prof card">${avatar(C.look, C.team.c, C.num)}<div><b style="font-size:22px">${C.name}</b><div class="muted">${summary}</div></div></div>
      ${C.highlights.length ? `<div class="card" style="line-height:1.8"><b>名場面</b><br>${C.highlights.join('<br>')}</div>` : ''}
      <div class="card">成就 <b class="gold">${Object.keys(C.ach).length}/${ACH.length}</b>　${ACH.filter(a => C.ach[a[0]]).map(a => a[1]).join(' ')}</div>
      <h2>轉生</h2><div class="muted" style="margin-bottom:8px">選一段記憶，變成下一位球員的天賦</div><div class="col" id="mm"></div>
      <div class="muted" style="margin:14px 0 8px">再選一項能力傳承下去</div><div class="grid2" id="ii"></div>
      <button id="bReborn" style="width:100%;margin-top:16px">轉生</button>`;
    for (const k of mems) { const m = MEMORIES[k], b = document.createElement('button'); b.className = 'opt' + (selM === k ? ' sel' : ''); b.innerHTML = `${m.n}<small>天賦「${m.t}」：${m.d}${has(k) ? '（已擁有）' : ''}</small>`; b.onclick = () => { selM = k; draw(); }; $('mm').appendChild(b); }
    if (!mems.length) $('mm').innerHTML = '<div class="muted">這一世沒有留下特別的記憶。</div>';
    for (const x of inh) { const b = document.createElement('button'); b.className = 'opt' + (selI === x ? ' sel' : ''); b.innerHTML = `${ATTR[x.k]} +${x.v}`; b.onclick = () => { selI = x; draw(); }; $('ii').appendChild(b); }
    $('bReborn').onclick = () => {
      LEG.lives.unshift({ name: C.name, summary, highlights: C.highlights, team: C.team.n, pos: C.pos, look: C.look, num: C.num, color: C.team.c, ach: Object.keys(C.ach).length });
      if (selM && !LEG.talents.includes(selM)) { LEG.talents.push(selM); if (LEG.talents.length > 4) LEG.talents.shift(); }
      LEG.inherit = selI; saveLeg(); try { localStorage.removeItem('hoop2Run'); } catch(e) {}
      $('scene').classList.add('hide'); renderCreate(); showOnly('sCreate');
    };
  };
  $('scene').classList.remove('hide'); $('scene').scrollTop = 0; draw();
}

// ===================== 標題 =====================
function title_() { showOnly('sTitle'); $('titleArt').innerHTML = art('arena', '#ffb84d', 11); $('bCont').classList.toggle('hide', !loadRun()); }
$('bNew').onclick = () => {
  const go = () => { closeScene(); renderCreate(); showOnly('sCreate'); };
  if (loadRun()) scene('新的人生', '你還有一位進行中的球員，重新開始會放棄他（不會留下轉生記憶）。', [{ label:'確定', fn:() => { try { localStorage.removeItem('hoop2Run'); } catch(e) {} go(); } }, { label:'算了', fn:() => closeScene() }]); else go();
};
$('bCont').onclick = () => { C = loadRun(); if (C) showHub(); };
$('bHall').onclick = () => {
  const totalAch = Object.keys(LEG.ach).length;
  $('hallList').innerHTML = `<div class="card"><h3>成就殿堂　<span class="gold">${totalAch}/${ACH.length}</span></h3>${ACH.map(a => `<div class="ach ${LEG.ach[a[0]] ? '' : 'off'}"><div class="i">${a[1]}</div><div><b>${a[2]}</b>${LEG.ach[a[0]] ? `<span class="muted" style="font-size:13px">　達成 ${LEG.ach[a[0]]} 次</span>` : ''}<div class="muted" style="font-size:14px">${a[3]}</div></div></div>`).join('')}</div>` +
    (LEG.lives.length ? LEG.lives.map((l, i) => `<div class="card prof">${avatar(l.look, l.color, l.num)}<div><b style="font-size:18px">第 ${LEG.lives.length - i} 世　${l.name}</b>　<span class="muted">${POS[l.pos].n}</span><br>${l.summary}${l.highlights && l.highlights.length ? `<div class="muted" style="font-size:14px;margin-top:4px;line-height:1.6">${l.highlights.slice(0, 6).join('<br>')}</div>` : ''}</div></div>`).join('') : '<div class="card muted">還沒有前世。</div>');
  showOnly('sHall');
};
$('bHallBack').onclick = title_;
title_();
</script>
