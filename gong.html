<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12060a"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="遊戲盒">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>鳳闕・深宮謀</title>
<style>@font-face{font-family:'Huninn';font-display:swap;src:url('assets/gong/huninn.woff2') format('woff2')}@font-face{font-family:'LXGW WenKai TC';font-weight:700;font-display:swap;src:url('assets/gong/wk-bold.woff2') format('woff2')}
:root{--bg:#12060a;--pan:rgba(42,14,20,.82);--pan2:rgba(60,20,28,.9);--line:rgba(232,194,122,.22);--gold:#e8c27a;--gold2:#ffe0a0;--tx:#f6e8dc;--dim:#b8a094;--red:#ff6a6a;--jade:#7ad8b0;--pink:#ff9ab8;--vio:#c89aff;--hd:'LXGW WenKai TC','Huninn',serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Huninn',-apple-system,sans-serif;font-size:15px;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.ic{width:1em;height:1em;fill:currentColor;vertical-align:-.14em;flex:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:540px;margin:0 auto;background:radial-gradient(ellipse at 50% 0%,#3a0e16 0%,#12060a 60%)}
#app.titled>*{visibility:hidden}
#hd{flex:none;padding:calc(30px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(180deg,#2a0a10,rgba(30,8,12,.92));border-bottom:1px solid var(--line);box-shadow:0 4px 20px rgba(0,0,0,.5)}
.hrow{display:flex;align-items:center;gap:10px}
.hav{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 0%;border:2px solid var(--gold);background:#3a1418;box-shadow:0 0 12px rgba(232,194,122,.4)}
.hn{flex:1;min-width:0}.hn b{font-family:var(--hd);font-size:19px;margin-right:6px}.hn small{display:block;color:var(--dim);font-size:12.5px}
.rk{font-size:12px;padding:1px 8px;border-radius:8px;background:linear-gradient(90deg,#8a2a1a,#c8502a);color:#fff2d0;border:1px solid var(--gold)}.rk.cold{background:#333;border-color:#666}
.hm{text-align:right;color:var(--gold2);font-weight:700}.hm small{display:block;font-weight:400;color:var(--dim);font-size:12px;letter-spacing:2px}
.hbtn{display:flex;gap:8px;margin-top:8px}.hbtn .btn{flex:1}.hbtn .ico{flex:none;width:48px}
#bd{flex:1;overflow-y:auto;padding:10px 12px 20px;-webkit-overflow-scrolling:touch}
#nav{flex:none;display:flex;background:linear-gradient(180deg,#2a0a10,#1a0608);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;padding:7px 0 6px;font-size:12px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
#nav button .ic{font-size:23px}#nav button.on{color:var(--gold2)}#nav button.on::after{content:'';position:absolute;top:0;left:28%;right:28%;height:2px;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.btn{padding:11px 14px;border-radius:12px;background:linear-gradient(180deg,#4a1820,#2a0c12);border:1px solid var(--line);font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.35}
.btn.gold{background:linear-gradient(180deg,#ffe8b0,#e8b860 55%,#b8802a);color:#3a1404;font-weight:700;border-color:#ffe8b0;box-shadow:0 2px 12px rgba(232,180,90,.4)}
.btn.ghost{background:rgba(255,255,255,.04)}.btn.red{background:linear-gradient(180deg,#a82a2a,#5a0e12);border-color:#ff8a8a}
.btn.big{padding:15px;font-size:18px;font-family:var(--hd);letter-spacing:3px}.btn.sm{padding:6px 12px;font-size:13px}
.col{display:flex;flex-direction:column;gap:8px}
h2{font-family:var(--hd);font-size:21px;color:var(--gold2);margin:8px 2px 10px;display:flex;align-items:center;gap:6px}h2 small{margin-left:auto;font-size:12px;color:var(--dim);font-family:'Huninn'}
h3{font-family:var(--hd);font-size:17px;color:var(--gold);margin:14px 2px 8px;display:flex;align-items:center;gap:6px}
.card{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.card.small,.small{font-size:13.5px;line-height:1.7}.dim{color:var(--dim)}.gold{color:var(--gold2)}.red{color:var(--red)}.jade{color:var(--jade)}.pink{color:var(--pink)}.vio{color:var(--vio)}
.card.warn{border-color:rgba(255,200,100,.5);background:rgba(80,40,10,.6)}.card.pink{border-color:rgba(255,150,180,.5);background:rgba(80,20,40,.6)}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:2px 8px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid var(--line);margin:3px 4px 0 0}
.tag.red{color:#ffb0b0;border-color:#a83a3a}.tag.pink{color:#ffc8d8;border-color:#c86a8a}.tag.gold{color:var(--gold2);border-color:var(--gold)}.tag.jade{color:var(--jade);border-color:#3a8a6a}
/* 宮苑 */
.hero{position:relative;height:250px;border-radius:18px;overflow:hidden;background-size:cover;background-position:center 70%;border:1px solid var(--line);margin-bottom:10px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 30%,rgba(18,4,8,.85));pointer-events:none}
.hero .hp{position:absolute;left:4px;top:8px;height:560px;filter:drop-shadow(0 0 16px rgba(0,0,0,.6));animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-3px)}}
.hinfo{position:absolute;right:14px;top:16px;bottom:14px;left:48%;z-index:1;display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.rk2{font-family:var(--hd);font-size:30px;color:var(--gold2);text-shadow:0 0 14px rgba(232,180,90,.6),0 2px 4px #000;letter-spacing:4px}
.hinfo b{font-size:20px;font-family:var(--hd);margin-top:2px}.hinfo small{color:var(--dim)}.hinfo .tags{margin-top:auto;display:flex;flex-wrap:wrap;justify-content:flex-end}
.mt{display:flex;align-items:center;gap:8px;margin:6px 0}.mt span{width:62px;font-size:13.5px;color:var(--dim);display:flex;align-items:center;gap:4px}.mt b{width:34px;text-align:right;font-size:14px}
.mb{flex:1;height:9px;border-radius:5px;background:rgba(0,0,0,.45);overflow:hidden;border:1px solid rgba(255,255,255,.08)}.mb i{display:block;height:100%;border-radius:5px;transition:width .5s}
.fav .mb i{background:linear-gradient(90deg,#c83a5a,#ff8aa8)}.tru .mb i{background:linear-gradient(90deg,#c88a2a,#ffe08a)}.pre .mb i{background:linear-gradient(90deg,#8a5ac8,#d0a8ff)}.mood .mb i{background:linear-gradient(90deg,#2a8a6a,#8af0c8)}.sus .mb i{background:linear-gradient(90deg,#5a1010,#ff3a3a)}
.nx{margin-top:8px;font-size:13px;color:var(--dim)}.nx b{color:var(--gold2);margin:0 4px}
.stg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}.st span{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--dim)}.st span .ic{font-size:22px;color:var(--gold)}.st b{font-size:18px;font-family:var(--hd)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:10px;font-size:13.5px}.kv div{display:flex;justify-content:space-between}.kv span{color:var(--dim);display:flex;align-items:center;gap:4px}
/* 行程 */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.slot{background:var(--pan);border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px}.slot .ic{font-size:30px;color:var(--gold)}.slot small{color:var(--dim);font-size:12px}.slot b{font-size:13.5px}
.slot.on{border-color:var(--gold);box-shadow:0 0 14px rgba(232,194,122,.35);background:rgba(90,40,20,.6)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;display:grid;grid-template-columns:30px 1fr;column-gap:8px;align-items:center}.act .ic{font-size:26px;color:var(--gold);grid-row:span 2}.act b{font-size:14.5px}.act small{color:var(--dim);font-size:12px}
/* 人物 */
.pc{display:flex;gap:10px;align-items:center;background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:8px}
.pc img{width:58px;height:58px;border-radius:12px;object-fit:cover;object-position:50% 0%;background:linear-gradient(180deg,#4a1a22,#2a0a10);border:1px solid var(--line)}
.grow{flex:1;min-width:0}.pc b{font-size:16px;font-family:var(--hd)}.pc small{font-size:12.5px;color:var(--dim)}.pc small.dim{display:block}
.ab{position:relative;height:6px;border-radius:3px;background:rgba(0,0,0,.4);margin:4px 0;overflow:hidden}.ab::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.3)}.ab i{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#c84a6a,#ff9ab8)}.ab.neg i{background:linear-gradient(90deg,#3a3a5a,#7a6aa8)}
.psh{display:flex;gap:12px;align-items:center;margin-bottom:10px}.psh img{width:90px;height:120px;object-fit:cover;object-position:50% 0%;border-radius:14px;border:1px solid var(--gold);background:#2a0a10}.psh h2{margin:0}
/* 錦囊 */
.deckg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cw{position:relative}.cw .card{width:100%}.cn{position:absolute;top:-6px;right:-4px;background:var(--gold);color:#3a1404;font-style:normal;font-weight:700;font-size:12px;border-radius:9px;padding:0 6px}
/* 起居注 */
.chips{display:flex;gap:6px;margin-bottom:10px}.chip{padding:6px 14px;border-radius:16px;background:var(--pan);border:1px solid var(--line);font-size:13.5px}.chip.on{background:linear-gradient(180deg,#e8c27a,#b8802a);color:#3a1404;font-weight:700}
.logl{display:flex;gap:8px;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13.5px;line-height:1.6}.logl>.ic{font-size:20px;color:var(--dim);margin-top:2px}.logl small{display:block;color:var(--dim);font-size:11.5px}.logl.g>.ic{color:var(--gold)}.logl.g{color:#ffe8c8}
.achg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ach{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;opacity:.35}.ach .ic{font-size:28px;display:block;margin:0 auto 4px}.ach b{font-size:13px}.ach.on{opacity:1;border-color:var(--gold);color:var(--gold2)}
.endg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.endc{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;opacity:.45}.endc .ic{font-size:32px;display:block;margin:0 auto 6px}.endc b{font-family:var(--hd);font-size:16px;display:block}.endc small{color:var(--dim);font-size:12px}.endc.on{opacity:1;border-color:var(--gold)}.endc.on .ic{color:var(--gold2)}
.guide b{display:flex;align-items:center;gap:4px;color:var(--gold2);margin-top:8px}
/* 彈窗 */
#ovl{position:fixed;inset:0;z-index:50;background:rgba(6,2,4,.72);display:flex;align-items:flex-end;justify-content:center;animation:fd .2s;backdrop-filter:blur(3px)}
@keyframes fd{from{opacity:0}}
.sh{width:100%;max-width:540px;max-height:88vh;overflow-y:auto;background:linear-gradient(180deg,#3a1018,#1e080c);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:su .28s cubic-bezier(.2,.8,.3,1)}
@keyframes su{from{transform:translateY(40%);opacity:.3}}
.sh.ev{padding-top:0;align-self:center;border-radius:22px;border-bottom:1px solid var(--line);width:calc(100% - 24px);max-height:92vh}
#ovl:has(.sh.ev){align-items:center}
.evh{position:relative;margin:0 -16px 10px;height:210px;background-size:cover;background-position:center 70%;border-radius:22px 22px 0 0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.evp{position:absolute;top:10px;height:520px;left:50%;transform:translateX(-50%);filter:drop-shadow(0 0 12px rgba(0,0,0,.6));animation:evin .5s ease-out}
@keyframes evin{from{transform:translateX(-50%) translateY(20px);opacity:0}}
.eic{position:absolute;top:50px;left:50%;transform:translateX(-50%);font-size:70px;color:var(--gold2);filter:drop-shadow(0 0 16px rgba(232,180,90,.6))}
.evh .tit{position:relative;z-index:2;font-family:var(--hd);font-size:26px;color:var(--gold2);letter-spacing:4px;padding:6px 18px;margin-bottom:8px;text-shadow:0 0 12px rgba(0,0,0,.9),0 2px 4px #000;background:linear-gradient(90deg,transparent,rgba(30,6,10,.85),transparent)}
.sh .body{font-size:15.5px;line-height:1.85;margin-bottom:14px}.opts{display:flex;flex-direction:column;gap:8px}.opts .btn{text-align:left;justify-content:flex-start;padding:12px 14px;line-height:1.4}
#toast{position:fixed;top:calc(118px + env(safe-area-inset-top));left:0;right:0;z-index:80;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.tst{max-width:92%;background:rgba(40,12,18,.95);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:13.5px;display:flex;gap:8px;align-items:center;animation:su .3s;box-shadow:0 4px 14px rgba(0,0,0,.5);transition:opacity .4s}.tst.g{border-color:var(--gold);color:var(--gold2)}.tst.b{border-color:#a83a3a;color:#ffc0c0}.tst.out{opacity:0}
/* 翻牌子 */
#flip{position:fixed;inset:0;z-index:70;background:radial-gradient(circle,rgba(40,10,14,.9),rgba(6,2,4,.97));display:flex;align-items:center;justify-content:center;animation:fd .3s}
.fin{text-align:center}.ftit{font-family:var(--hd);color:var(--gold2);font-size:22px;letter-spacing:6px;margin-bottom:24px}
.tray{display:flex;gap:10px;justify-content:center;padding:16px;background:linear-gradient(180deg,#8a5a2a,#5a3410);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.2)}
.pai{width:40px;height:150px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#3a8a4a 0 22%,#f2e8d0 22%);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-family:var(--hd);font-size:17px;color:#3a1a0a;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .6s,opacity .6s}
#flip.go .pai.me{transform:translateY(-30px) rotateY(180deg) rotateY(180deg) scale(1.15);box-shadow:0 0 24px #ffd27a}
#flip.go .pai:not(.me){opacity:.35}
.fsub{margin-top:26px;color:var(--pink);font-family:var(--hd);font-size:20px;opacity:0;transition:opacity .5s}#flip.end .fsub{opacity:1}
/* 標題 */
#title{position:fixed;inset:0;z-index:40;display:none;justify-content:center;overflow-y:auto}
.tbg{position:fixed;inset:0;background-size:cover;background-position:center;filter:saturate(1.1)}
.tbg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,2,4,.2),rgba(10,2,4,.75) 70%)}
.tin{position:relative;width:100%;max-width:520px;padding:calc(70px + env(safe-area-inset-top)) 22px 40px;display:flex;flex-direction:column;align-items:stretch}
.logo{display:flex;justify-content:center;gap:10px;font-family:var(--hd);font-size:96px;color:var(--gold2);text-shadow:0 0 30px rgba(255,160,60,.7),0 4px 0 #6a1a0a,0 8px 20px #000;margin-top:40px}
.logo span{animation:lg 1.2s ease-out both}.logo span:nth-child(2){animation-delay:.25s}@keyframes lg{from{opacity:0;transform:translateY(-20px) scale(1.4);filter:blur(6px)}}
.sub{text-align:center;font-family:var(--hd);font-size:22px;letter-spacing:10px;color:#ffd8b8;margin-top:4px;animation:fd 1.5s .6s both}
.tdesc{text-align:center;color:#e8d0c0;line-height:2;margin:36px 0 30px;font-size:15.5px;animation:fd 1.5s 1s both;text-shadow:0 2px 4px #000}
.tb{animation:fd 1s 1.4s both}
.ct{justify-content:center;font-size:26px}
.lb{display:block;color:var(--gold);font-size:13.5px;margin-bottom:6px;font-family:var(--hd)}
#cName{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--tx);font-size:18px;font-family:var(--hd)}
.looks{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.looks img{width:100%;aspect-ratio:3/5;object-fit:cover;object-position:50% 0%;border-radius:10px;border:2px solid transparent;background:linear-gradient(180deg,#4a1a22,#2a0a10);opacity:.6}.looks img.on{border-color:var(--gold);opacity:1;box-shadow:0 0 12px rgba(232,194,122,.6)}
.fams{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fam{text-align:left;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12.5px;color:var(--dim);line-height:1.5}.fam .ic{font-size:22px;color:var(--gold)}.fam b{display:block;font-size:15.5px;color:var(--tx);font-family:var(--hd);margin:2px 0}.fam.on{border-color:var(--gold);background:rgba(90,40,20,.55);box-shadow:0 0 12px rgba(232,194,122,.3)}
.cr .btn{margin-top:8px}
.end{align-items:center;text-align:center}.eic2{font-size:84px;margin-top:20px;color:var(--gold2);filter:drop-shadow(0 0 20px rgba(255,180,80,.7));animation:lg 1s}.eic2.g0,.eic2.g1{color:#a8a0b8;filter:drop-shadow(0 0 16px rgba(160,140,200,.5))}
.ename{font-family:var(--hd);font-size:44px;color:var(--gold2);letter-spacing:10px;margin:6px 0 10px;text-shadow:0 0 20px rgba(255,160,60,.6)}
.end .body{line-height:1.9;margin-bottom:16px;font-size:16px}.end .card{width:100%;text-align:left}.end .btn{width:100%;margin-top:8px}
.score{text-align:center;margin-top:10px;color:var(--dim)}.score b{font-family:var(--hd);font-size:32px;color:var(--gold2);margin-left:8px}
/* ===== 對質 ===== */
#duel{position:fixed;inset:0;z-index:60;background:#0a0204;display:flex;justify-content:center}
.din{position:relative;width:100%;max-width:540px;height:100%;display:flex;flex-direction:column;background-size:cover;background-position:center;overflow:hidden;padding-top:calc(26px + env(safe-area-inset-top))}
.din.hurt{animation:hurt .45s}@keyframes hurt{20%{box-shadow:inset 0 0 120px rgba(255,30,30,.7);transform:translateX(-6px)}50%{transform:translateX(5px)}}
.dtop{text-align:center;padding:4px 10px}.dtitle{font-family:var(--hd);font-size:24px;color:var(--gold2);letter-spacing:6px;text-shadow:0 0 12px rgba(255,160,60,.6)}.dstake{font-size:12px;color:var(--dim)}
.djudge{position:absolute;top:calc(30px + env(safe-area-inset-top));left:10px;display:flex;align-items:center;gap:6px;font-size:13px}.djudge img{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:50% 0%;border:1.5px solid var(--gold);background:#2a0a10}.djudge small{display:block;color:var(--dim);font-size:11px}
.dfoe{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:200px;position:relative;margin-top:4px}
.dfoe{overflow:hidden}.dfoe img{height:430px;align-self:flex-start;margin-top:2px;filter:drop-shadow(0 0 14px rgba(255,60,60,.35));transition:transform .2s}.dfoe.enter img{animation:evin .6s}
.dfoe.atk img{animation:fatk .5s}@keyframes fatk{40%{transform:translateY(16px) scale(1.12)}}
.fn{position:absolute;left:10px;bottom:10px;text-align:left}.fn b{display:block;font-family:var(--hd);font-size:18px}.fn small{color:var(--dim);font-size:12px}
.intent{position:absolute;right:8px;top:14px;width:132px;background:linear-gradient(180deg,rgba(90,10,16,.95),rgba(40,4,8,.95));border:1px solid #ff6a6a;border-radius:12px;padding:8px;text-align:center;box-shadow:0 0 18px rgba(255,60,60,.4);animation:ipulse 1.6s ease-in-out infinite}
@keyframes ipulse{50%{box-shadow:0 0 28px rgba(255,60,60,.7)}}
.intent .ik{font-size:22px;color:#ff8a8a;display:block}.intent b{display:block;font-size:14px}.intent em{display:block;font-style:normal;font-family:var(--hd);font-size:30px;color:#ff6a6a;line-height:1.1}.intent em s{font-size:15px;color:var(--dim);margin-left:4px}.intent small{display:block;font-size:11px;color:#ffd0d0}
.hbar{display:flex;align-items:center;gap:8px;padding:8px 14px}.hl,.hr{font-family:var(--hd);font-size:14px;width:34px;text-align:center}.hl{color:var(--gold2)}.hr{color:#ff9a9a}
.ht{flex:1;position:relative;height:20px;border-radius:10px;background:linear-gradient(90deg,#5a0a10,#2a0408);border:1px solid rgba(255,255,255,.2);overflow:visible}
.hf{position:absolute;left:0;top:0;bottom:0;border-radius:10px;background:linear-gradient(90deg,#b8802a,#ffe08a);transition:width .5s cubic-bezier(.3,.8,.4,1);box-shadow:0 0 12px rgba(255,200,100,.6)}
.hmk{position:absolute;top:-8px;width:6px;height:34px;margin-left:-3px;border-radius:3px;background:#fff;box-shadow:0 0 10px #fff,0 0 20px var(--gold);transition:left .5s cubic-bezier(.3,.8,.4,1)}.hmk.glow{animation:hmg .6s}@keyframes hmg{50%{box-shadow:0 0 22px #fff,0 0 40px #ffd27a;transform:scaleY(1.3)}}
.h50{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.5)}
.dmsg{text-align:center;min-height:24px;padding:2px 12px;font-size:14px;color:#ffe8c8}.dmsg.pop{animation:mp .3s}@keyframes mp{from{transform:scale(1.2);opacity:.4}}
.dme{display:flex;align-items:center;gap:10px;padding:4px 14px;font-size:12.5px;color:var(--dim)}.en{display:flex;align-items:center;gap:4px}.en i{width:16px;height:16px;border-radius:50%;background:#3a1418;border:1.5px solid #6a3a3a}.en i.on{background:radial-gradient(circle at 35% 35%,#fff8d0,#ffc84a 50%,#c87a1a);border-color:#ffe8a0;box-shadow:0 0 8px #ffb84a}.en span{margin-left:4px;color:var(--gold2)}.rd{flex:1;text-align:center}.pile{font-size:11.5px}
.hand{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:6px;padding:6px 8px;overflow-y:auto}
.card.atk,.card.def,.card.sk{width:104px;min-height:142px;margin:0;padding:8px 6px 6px;border-radius:12px;position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:transform .15s,opacity .2s}
.card.atk{background:linear-gradient(180deg,#6a1a20,#2a0608);border:1.5px solid #ff8a7a;box-shadow:0 0 10px rgba(255,100,100,.25)}
.card.def{background:linear-gradient(180deg,#14483a,#06201a);border:1.5px solid #7ad8b0;box-shadow:0 0 10px rgba(100,220,180,.2)}
.card.sk{background:linear-gradient(180deg,#3a1a5a,#14082a);border:1.5px solid #c89aff;box-shadow:0 0 10px rgba(200,150,255,.25)}
.card.ex::before{content:'消耗';position:absolute;left:4px;top:4px;font-size:10px;color:#ffd0a0;opacity:.8}
.card .cc{position:absolute;right:-6px;top:-6px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff8d0,#ffc84a 50%,#a8601a);color:#3a1404;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 0 8px rgba(255,180,70,.7)}
.card .ci{font-size:30px;color:var(--gold2);margin-top:2px}.card b{font-family:var(--hd);font-size:15.5px}.card small{font-size:11px;line-height:1.35;color:#e8d8d0}.card .ct{margin-top:auto;font-style:normal;font-size:10px;color:var(--dim);letter-spacing:2px}
.card.dis{opacity:.45;filter:grayscale(.5)}.hand .card:active{transform:translateY(-6px) scale(1.04)}
.card.fly{transform:translateY(-120px) scale(1.2)!important;opacity:0;transition:transform .2s ease-in,opacity .2s}
.dbtn{display:flex;gap:8px;padding:8px 14px calc(12px + env(safe-area-inset-bottom))}.dbtn .gold{flex:1}
.dfx{position:absolute;inset:0;pointer-events:none;z-index:5}
.dfl{position:absolute;left:50%;top:44%;transform:translateX(-50%);font-family:var(--hd);font-size:34px;font-weight:900;animation:dfl 1.1s forwards;white-space:nowrap}
.dfl.push{color:#ffe08a;text-shadow:0 0 14px #ffb84a,0 2px 4px #000}.dfl.blk{color:#8af0c8;text-shadow:0 0 14px #2ac88a,0 2px 4px #000;top:52%}.dfl.hurt{color:#ff5a5a;text-shadow:0 0 14px #ff0000,0 2px 4px #000;font-size:42px;top:36%}
@keyframes dfl{from{transform:translate(-50%,10px) scale(1.6);opacity:0}20%{transform:translate(-50%,0) scale(1);opacity:1}to{transform:translate(-50%,-60px);opacity:0}}
.dres{position:absolute;inset:0;z-index:8;background:radial-gradient(circle,rgba(40,10,14,.85),rgba(6,2,4,.96));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;animation:fd .4s}
.dres .big{font-family:var(--hd);font-size:110px;line-height:1;animation:lg .7s}.dres.win .big{color:var(--gold2);text-shadow:0 0 40px rgba(255,180,60,.8)}.dres.lose .big{color:#8a8aa8}
.dres .sub{font-family:var(--hd);font-size:18px;letter-spacing:4px;margin:6px 0 16px;color:var(--dim)}.dres .rbody{line-height:1.85;margin-bottom:20px;font-size:15px}.dres .btn{width:220px}
</style></head>

    { t: '倒掉不喝，按兵不動', f: () => { S.st.mou += 2; aff(foe, -5); return '你把藥倒進花盆，第二天那株海棠就枯了。心計 +2'; } },

STORY.barrenFound = () => ({ t: '麝香', ic: 'poison-bottle', who: 'bai', bg: 'palace', body: '白太醫屏退左右，低聲道：「小主脈象寒凝……您身邊有東西，長年摻了麝香。再這樣下去，恐怕終身難有子嗣。」<br>你想起來了——是那個香囊。', ch: [

    { t: '照吃不誤', f: () => { if (chance(0.5)) { S.st.jian -= 12; S.mood -= 10; return '當夜你上吐下瀉，大病一場。<span class="red">康健 -12</span>'; } return '桂花糕很好吃。'; } },
  ] };
  if (ty === 'stage') return { t: '斷弦', ic: 'harp', who: foe, bg: 'night', body: '宮宴上輪到你獻藝，你一撥琴弦——弦斷了！滿座譁然，有人掩嘴偷笑。', ch: [

    { t: '改為清唱一曲', f: () => { if (chk('mao', 40)) { favUp(8); return '你的歌聲婉轉動人。聖寵 +8'; } favUp(-4); return '有些緊張，唱得平平。'; } },
    { t: '當眾指出有人動手腳', f: () => ({ duel: { foe, judge: 'emp', title: '宮宴斷弦', rounds: 5, stakes: '勝：揭穿對方　敗：被說小題大作', bg: 'night', win: () => { N(foe).fav -= 20; aff(foe, -20); S.pres += 6; return `${nm}的宮女招認了。皇上冷冷看了${nm}一眼。威望 +6`; }, lose: () => { favUp(-10); return '查無實據，你掃了大家的興。聖寵 -10'; } } }) },

  return { t: big[0], ic: ty === 'wugu' ? 'voodoo-doll' : ty === 'water' ? 'water-splash' : 'broken-heart', who: foe, bg: 'hall', body: big[1] + (N('fu').loy < 40 || S.flags.fuBought ? '<br><span class="red">東西是從你宮裡搜出的……難道是小福子？</span>' : ''), ch: [

      lose: () => { if (ty === 'wugu' && S.sus > 70) { S.over = { k: 'death', txt: `${S.name}以巫蠱咒君之罪被賜白綾，年 ${ageI()} 歲。` }; return '太后閉上眼睛：「賜白綾。」'; } if (ty !== 'water') { toCold(`蒙受「${big[0]}」之冤`); return '百口莫辯。皇上拂袖而去——<b>你被打入冷宮。</b>'; } demote(1); S.ban = 6; favUp(-20); return `你被降為${rankN()}，禁足半年。`; } } }) },
    { t: '跪求皇上明察，以退為進', f: () => { if (chk('de', 50) || S.fav > 70) { S.st.de += 2; favUp(-5); return '皇上念及舊情，只是讓你禁足三個月了事。'; } S.ban = 4; demote(1); favUp(-12); return `你被降為${rankN()}，禁足四個月。`; } },
  ] };

function storyCheck() {
  const F = S.flags, q = (k, o = {}) => S.evq.push({ k, ...o }), t = S.t;
  if (t === 1) q('fengong');
  if (t === 2) q('qingan');
  if (!F.firstNight && t >= 3 && !S.cold && (S.fav >= 14 || t >= 6) && chance(0.5)) { q('firstNight'); }
  if (month() === 8 && t > 4 && !S.cold) q('zhongqiu');
  if (t === 20) q('ayiArrive');
  if (!F.lin && t >= 16 && N('lin').aff < 0) { F.lin = 1; q('linBetray'); }
  if (!F.wan && t >= 28 && alive('wan') && alive('liu')) { F.wan = 1; q('wanCrisis'); }
  if (!F.guiSec && t >= 34 && alive('gui') && (S.intel >= 15 || N('bai').aff >= 35)) { F.guiSec = 1; q('guiSecret'); }
  if (!F.guiEnd && t >= 60 && N('gui').alive && (F.guiFall || F.guiKnows) && chance(0.08)) { F.guiEnd = 1; q('guiEnd'); }
  if (!F.yhAsk && t >= 50 && S.rank >= 4) { F.yhAsk = 1; q('yhStart'); }
  if (F.yh && !F.houFall && S.clues < 3 && alive('hou') && (S.intel >= 25 + S.clues * 12 || chance(0.035))) { S.intel = Math.max(0, S.intel - 10); q('yhClue'); }
  if (F.houVacant && S.rank >= 6 && S.trust >= 35 && !S.cold) { F.houVacant = 0; q('lihou'); }
  if (F.houVacant && S.rank === 5 && S.pres >= 80 && !S.evq.some(e => e.k === 'promote')) q('promote');
  if (!F.dow && t >= 110 && chance(0.05)) { F.dow = 1; q('dowagerDie'); }
  if (!F.taizi && t >= 140) { F.taizi = 1; q('taizi'); }
  if (!F.yichu && F.taizi && S.heir === 'npc' && sons().some(k => kidAge(k) >= 6) && S.trust >= 55 && chance(0.04)) { F.yichu = 1; F.taizi = 0; }
  if (!F.qiC && t >= 48 && N('qi').aff >= 65) { F.qiC = 1; q('qiConfess'); }
  if (!F.ill && t >= S.empDie - 10) { F.ill = 1; q('empIll'); }
  if (t >= S.empDie && !F.fin) { F.fin = 1; q('finale'); }
  if (S.sus >= 60 && chance((S.sus - 50) / 220) && !S.evq.some(e => e.k === 'exposed')) q('exposed');
  if (S.cold && S.coldT > 0 && S.coldT % 4 === 0) q('coldLife');
  if (!F.leave && age() >= 25 && S.rank <= 1 && S.shiqin === 0) { F.leave = 1; q('leaveAsk'); }
}

  if (night) svg += `<circle cx="400" cy="200" r="120" fill="url(#mn)"/><circle cx="400" cy="200" r="46" fill="#fff4d0" opacity="${k === 'cold' ? .35 : .9}"/>` + Array.from({ length: 40 }, (_, i) => `<circle cx="${(i * 137) % 540}" cy="${(i * 71) % 420}" r="${i % 3 ? 1 : 1.6}" fill="#fff" opacity="${.3 + (i % 5) / 10}"/>`).join('');

  svg += roof(130, 640, 220, rc) + roof(420, 600, 260, rc) + roof(280, 700, 320, shade(rc, 8));
  // 紅牆
  svg += `<rect x="0" y="770" width="540" height="190" fill="${k === 'cold' ? '#2a2428' : k === 'snow' ? '#a83a3a' : '#8a2020'}"/><rect x="0" y="760" width="540" height="16" fill="${k === 'snow' ? '#f8f8ff' : '#c8a040'}" opacity=".8"/>`;
  if (k === 'snow') svg += Array.from({ length: 60 }, (_, i) => `<circle cx="${(i * 97) % 540}" cy="${(i * 53) % 960}" r="${1 + i % 3}" fill="#fff" opacity=".8"/>`).join('');
  if (k === 'garden') svg += Array.from({ length: 30 }, (_, i) => `<circle cx="${(i * 89) % 540}" cy="${300 + (i * 61) % 400}" r="${3 + i % 4}" fill="#ffb0c8" opacity=".55"/>`).join('');

  svg += '</svg>';
  return (BGC[k] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg));

function advance() {

  const r = monthTick();
  const bits = [];
  for (const k in r.gain) if (r.gain[k] > 0.4) bits.push(`${STN[k][0]} +${r.gain[k].toFixed(1)}`);
  if (r.money) bits.push(`刺繡 +${r.money} 兩`); if (r.card) bits.push(`習得【${CARDS[r.card].n}】`); if (r.poor) bits.push('銀兩不足，有行程沒做成');
  if (bits.length && !autoT) toast(bits.join('，'), 'hourglass', 'n', 2400);
  for (const n of NEWS.splice(0).slice(-4)) toast(n.txt, n.ic, n.k);
  save(); render();
  if (S.over) return setTimeout(gameOver, 300);
  const go = () => { if (S && S.evq.length) { if (autoT) toggleAuto(); nextEvent(); } };
  if (r.shiqin) { if (autoT) toggleAuto(); flipCard(go); } else go();
}

  const names = shuffle([S.name, ...CONSORTS.filter(alive).map(id => NPCS[id].n)]).slice(0, 5); if (!names.includes(S.name)) names[2] = S.name;
  const o = document.createElement('div'); o.id = 'flip';
  o.innerHTML = `<div class="fin"><div class="ftit">敬事房・翻牌子</div><div class="tray">${names.map(n => `<div class="pai ${n === S.name ? 'me' : ''}"><span>${esc(n)}</span></div>`).join('')}</div><div class="fsub">皇上翻了你的牌子</div></div>`;
  document.body.appendChild(o); setTimeout(() => o.classList.add('go'), 400); setTimeout(() => o.classList.add('end'), 1900);
  const close = () => { o.remove(); done && done(); }; setTimeout(close, 2500); o.onclick = close;
}

function nextEvent() {
  if (!S || $('ovl') || $('duel') || !S.evq.length) return;

  if (e.k === 'rand') { const v = EVS[e.id]; if (!v) return nextEvent(); return showEv({ t: v.t, ic: v.ic, who: v.who, bg: v.bg, body: v.body(), ch: typeof v.ch === 'function' ? v.ch() : v.ch }); }
  const ev = STORY[e.k] ? STORY[e.k](e) : null;
  if (!ev) return nextEvent();
  if (ev.duel) return handle(ev);
  showEv(ev);
}
function showEv(ev) {
  if (!ev.ch.some(o => !o.c || o.c())) ev.ch = [...ev.ch, { t: '暫且作罷', f: () => '' }];
  const sh = sheet(`<div class="evh" style="background-image:linear-gradient(180deg,rgba(10,2,4,.1),rgba(16,4,8,.95)),url(${sceneBG(ev.bg || 'palace')})">${ev.who ? `<img class="evp" src="${portrait(ev.who)}" alt="">` : `<div class="eic">${ic(ev.ic)}</div>`}<div class="tit">${ev.t}</div></div><div class="body">${ev.body}</div><div class="opts">${ev.ch.map((o, i) => `<button class="btn ${i ? 'ghost' : 'gold'}" data-o="${i}" ${o.c && !o.c() ? 'disabled' : ''}>${o.t}</button>`).join('')}</div>`, 'ev');
  sh.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { closeSheet(true); handle(ev.ch[+b.dataset.o].f()); });
}
function handle(r) {
  save();
  if (S.over) { render(); return setTimeout(gameOver, 250); }
  if (r && r.duel) return startDuel(r.duel, () => { render(); if (S.over) return setTimeout(gameOver, 250); setTimeout(nextEvent, 150); });
  if (r && r.next) return showEv(r.next);
  render();
  if (r) return showEv({ t: '', ic: 'scroll-unfurled', body: r, ch: [{ t: '確定', f: () => '' }] });
  setTimeout(nextEvent, 120);
}
function sheet(html, cls = '', onClose) {
  closeSheet(true);
  const o = document.createElement('div'); o.id = 'ovl'; o.innerHTML = `<div class="sh ${cls}">${html}</div>`; document.body.appendChild(o);
  if (cls !== 'ev') o.onclick = e => { if (e.target === o) closeSheet(); };
  return o.querySelector('.sh');
}
function closeSheet(silent) { const o = $('ovl'); if (o) o.remove(); if (!silent) { render(); setTimeout(nextEvent, 100); } }
function menuSheet() {
  if (autoT) toggleAuto();
  sheet(`<h2>${ic('hamburger-menu')} 選單</h2><div class="col"><button class="btn gold" id="mSave">${ic('save')} 存檔</button><button class="btn" id="mTitle">${ic('house')} 回到標題</button><button class="btn ghost" id="mBox">${ic('exit-door')} 回到遊戲盒</button></div>`);
  $('mSave').onclick = () => { save(); toast('已存檔', 'save', 'g', 1500); closeSheet(); };
  $('mTitle').onclick = () => { save(); closeSheet(true); showTitle(); };
  $('mBox').onclick = () => { save(); location.href = './'; };
}

// ---------------- 標題・創角・結局 ----------------
let CR = null;
function showTitle() {
  if (autoT) toggleAuto();
  const t = $('title'); t.style.display = 'flex'; $('app').classList.add('titled');
  const has = !!localStorage.getItem(SAVE_KEY), e = endsSeen();
  t.innerHTML = `<div class="tbg" style="background-image:url(${sceneBG('title')})"></div><div class="tin">
    <div class="logo"><span>鳳</span><span>闕</span></div><div class="sub">深　宮　謀</div>
    <div class="tdesc">一入宮門深似海。<br>從答應到皇后，從秀女到太后——<br>這一局，你要怎麼下？</div>
    <div class="col tb">${has ? `<button class="btn gold big" id="tCont">${ic('play-button')} 繼續</button>` : ''}<button class="btn ${has ? '' : 'gold'} big" id="tNew">${ic('quill-ink')} 新的人生</button>
    <div class="dim small" style="text-align:center;margin-top:6px">已解鎖結局 ${Object.keys(e).length}／${Object.keys(ENDINGS).length}</div></div></div>`;
  if (has) $('tCont').onclick = () => { load(); hideTitle(); tab = 'home'; render(); setTimeout(nextEvent, 300); };
  $('tNew').onclick = () => { if (has && !confirm2()) return; createStep(); };
}
function confirm2() { return window.confirm('開始新的人生會覆蓋目前的存檔，確定嗎？'); }
function hideTitle() { $('title').style.display = 'none'; $('app').classList.remove('titled'); }
function createStep() {
  CR = CR || { name: pick(['沈', '甄', '林', '蘇', '葉', '蕭', '顧', '溫', '謝', '容']) + pick(['清歡', '昭華', '若雪', '知意', '星闌', '晚吟', '如意', '芷柔', '念卿', '綰綰']), fam: 'scholar', look: 'F1' };
  const t = $('title');
  t.innerHTML = `<div class="tbg" style="background-image:url(${sceneBG('palace')})"></div><div class="tin cr">
    <h2 class="ct">${ic('quill-ink')} 秀女名冊</h2>
    <div class="card"><label class="lb">姓名</label><input id="cName" maxlength="6" value="${esc(CR.name)}"></div>
    <div class="card"><label class="lb">容貌</label><div class="looks">${Object.keys(LOOKS).map(k => `<img src="${portrait(k)}" data-l="${k}" class="${CR.look === k ? 'on' : ''}" alt="">`).join('')}</div></div>
    <div class="card"><label class="lb">家世</label><div class="fams">${Object.entries(FAMS).map(([k, f]) => `<button class="fam ${CR.fam === k ? 'on' : ''}" data-f="${k}">${ic(f.ic)}<b>${f.n}</b><small>${f.d}</small></button>`).join('')}</div></div>
    <button class="btn gold big" id="cGo">${ic('castle')} 入宮選秀</button><button class="btn ghost" id="cBack">返回</button></div>`;
  $('cName').oninput = e => CR.name = e.target.value.trim();
  t.querySelectorAll('[data-l]').forEach(el => el.onclick = () => { CR.look = el.dataset.l; createStep(); });
  t.querySelectorAll('[data-f]').forEach(el => el.onclick = () => { CR.fam = el.dataset.f; createStep(); });
  $('cBack').onclick = showTitle;
  $('cGo').onclick = () => { if (!CR.name) return toast('請輸入姓名', 'quill-ink', 'b'); newGame(CR); CR = null; tab = 'home'; save(); hideTitle(); render(); setTimeout(nextEvent, 400); };
}
function gameOver() {
  if (autoT) toggleAuto();
  const o = S.over, E = ENDINGS[o.k] || ENDINGS.ill; markEnd(o.k);
  const score = Math.round(S.rank * 300 + S.fav * 5 + S.pres * 4 + S.trust * 6 + S.kids.length * 400 + S.wins * 80 + Object.keys(S.ach).length * 150 + E.g * 1500);
  localStorage.removeItem(SAVE_KEY);
  const t = $('title'); t.style.display = 'flex'; $('app').classList.add('titled');
  t.innerHTML = `<div class="tbg" style="background-image:url(${sceneBG(E.g >= 3 ? 'hall' : 'cold')})"></div><div class="tin end">
    <div class="eic2 g${E.g}">${ic(E.ic)}</div><div class="ename">${E.n}</div><div class="body">${o.txt}</div>
    <div class="card"><div class="kv"><div><span>姓名</span><b>${esc(S.name)}</b></div><div><span>最終位份</span><b>${rankN()}</b></div><div><span>享年</span><b>${ageI()} 歲</b></div><div><span>子嗣</span><b>${S.kids.length}</b></div><div><span>對質</span><b>${S.wins} 勝 ${S.losses} 敗</b></div><div><span>成就</span><b>${Object.keys(S.ach).length}/${ACHS.length}</b></div></div><div class="score">評分 <b>${fmt(score)}</b></div></div>
    <div class="card small" style="max-height:180px;overflow:auto">${S.log.filter(l => l.imp === 2).slice(0, 16).reverse().map(l => `<div>・${dateStr(l.t)}　${l.txt}</div>`).join('')}</div>
    <button class="btn gold big" id="gNew">${ic('quill-ink')} 再入宮門</button><button class="btn ghost" id="gBox">${ic('exit-door')} 回到遊戲盒</button></div>`;
  $('gNew').onclick = () => { S = null; createStep(); }; $('gBox').onclick = () => location.href = './';
}
window.addEventListener('load', showTitle);
document.addEventListener('visibilitychange', () => { if (document.hidden && S && !S.over) save(); });

</script>
