<html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#100808"><meta name="apple-mobile-web-app-capable" content="yes">

<title>逐玉</title>
<style>@font-face{font-family:'Huninn';font-display:swap;src:url('assets/zhuyu/huninn.woff2') format('woff2')}@font-face{font-family:'LXGW WenKai TC';font-weight:700;font-display:swap;src:url('assets/zhuyu/wk-bold.woff2') format('woff2')}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0710;color:#f6eef4;font-family:'Huninn',-apple-system,'PingFang TC','Noto Sans TC',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
.hide{display:none!important}
#game{position:fixed;inset:0;max-width:560px;margin:0 auto}
#stage{position:absolute;inset:0;overflow:hidden;background:#000}
.bg{position:absolute;inset:-2%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.1s ease;animation:drift 30s ease-in-out infinite alternate}
.bg.on{opacity:1}
.bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,4,16,.15) 0%,rgba(10,4,16,0) 35%,rgba(10,4,16,.55) 75%,rgba(10,4,16,.9) 100%)}
@keyframes drift{from{transform:scale(1.03) translate(-1%,0)}to{transform:scale(1.08) translate(1%,-1%)}}
#chars{position:absolute;left:0;right:0;bottom:150px;top:12%;pointer-events:none}
.ch{position:absolute;bottom:0;height:100%;display:flex;align-items:flex-end;justify-content:center;transition:transform .45s ease,opacity .45s ease,filter .35s,left .45s ease,width .45s ease;width:62%}
.ch img{max-height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(0,0,0,.55))}
.ch.pc{left:19%}.ch.pl{left:-6%}.ch.pr{right:-6%}
.ch.in{opacity:0;transform:translateY(20px)}.ch.gone{opacity:0}
.ch.dim{filter:brightness(.55) saturate(.7)}
.ch.talk{transform:translateY(-6px)}
.ch.beast{width:92%;bottom:6%}.ch.beast.pc{left:4%}.ch.beast.pl{left:-6%;width:62%}.ch.beast.pr{right:-6%;left:auto;width:62%}
.ch.beast img{max-height:62%;filter:drop-shadow(0 0 24px rgba(255,220,180,.35))}
.cg{position:absolute;inset:0;opacity:0;transition:opacity 1.2s;pointer-events:none;z-index:3}
.cg.on{opacity:1}
.cg .cgfb{position:absolute;inset:-5%;background-size:cover;background-position:center;filter:blur(6px) brightness(.6) saturate(1.3)}
.cg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center 30%;opacity:0;transition:opacity 1.2s}
.cg.hasimg img{opacity:1}
.cgt{position:absolute;left:0;right:0;top:20%;text-align:center;font-family:'LXGW WenKai TC',serif;font-size:30px;letter-spacing:6px;color:#fff;text-shadow:0 0 18px #ff8ac0,0 0 40px #ff5aa0}
.cg.hasimg .cgfb{filter:blur(18px) brightness(.45) saturate(1.2)}
.cg.hasimg .cgt{top:auto;bottom:190px;font-size:20px;letter-spacing:4px;opacity:.9}
#fx{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
#fx i{position:absolute;top:-6%;display:block;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--x),112vh) rotate(360deg)}}
.fx-snow i{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.8;transform:scale(var(--s))}
.fx-petal i{width:12px;height:9px;border-radius:12px 0;background:linear-gradient(135deg,#ffd6e6,#ff8ab8);opacity:.85}
.fx-stars i,.fx-firefly i,.fx-gold i{width:4px;height:4px;border-radius:50%;background:#fff6c0;box-shadow:0 0 8px 2px #ffe080;animation-name:floatup}
.fx-firefly i{background:#c8ff9a;box-shadow:0 0 10px 3px #9aff6a}
.fx-gold i{background:#ffd257;box-shadow:0 0 10px 3px #ffb02a}
@keyframes floatup{from{transform:translate(0,105vh) scale(var(--s));opacity:0}20%{opacity:1}to{transform:translate(var(--x),-10vh) scale(var(--s));opacity:0}}
.fx-rain i{width:1.5px;height:26px;background:linear-gradient(transparent,#9ac8ff);opacity:.6;animation-duration:.9s!important}
.fx-ice i{width:8px;height:8px;background:#c8f0ff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);opacity:.9}
.flash{position:fixed;inset:0;z-index:30;pointer-events:none;animation:flash .6s ease-out forwards}
.flash.flash{background:#fff}.flash.white{background:#fff;animation:fade 1.6s ease forwards}.flash.black{background:#000;animation:fade 1.6s ease forwards}.flash.red{background:#a0001e;animation:fade 1.6s ease forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
@keyframes fade{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}
.hfx{position:relative;color:#ff8ac0;font-size:15px;background:rgba(20,6,18,.75);border:1px solid #ff8ac088;padding:6px 14px;border-radius:20px;pointer-events:none;animation:hup 1.4s ease forwards;white-space:nowrap}
@keyframes hup{0%{opacity:0;transform:translateY(10px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.box{position:absolute;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));min-height:132px;z-index:6;background:linear-gradient(180deg,rgba(28,10,26,.88),rgba(14,6,16,.94));border:1px solid rgba(255,160,200,.35);border-radius:18px;padding:22px 18px 16px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:opacity .3s}
.box.hide{opacity:0;pointer-events:none}
.box.inner{border-color:rgba(255,200,230,.55);background:linear-gradient(180deg,rgba(40,14,34,.9),rgba(20,6,20,.95))}
.box.inner #tx{color:#ffd6ea;font-style:italic}
.box.narr #tx{color:#e8dde6}
#nm{position:absolute;top:-15px;left:16px;background:var(--c);color:#1a0612;font-weight:700;font-size:15px;padding:4px 16px;border-radius:12px;font-family:'LXGW WenKai TC',serif;letter-spacing:2px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
#tx{font-size:17.5px;line-height:1.75;letter-spacing:.5px;min-height:62px}
#tx .ghost{opacity:0}
.box.done::after{content:'▼';position:absolute;right:16px;bottom:8px;font-size:11px;color:#ff9ec8;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#nobox{}
#game.nobox .box,#game.nobox .tools{opacity:0;pointer-events:none}
.tools{position:absolute;top:calc(44px + env(safe-area-inset-top));right:10px;z-index:8;display:flex;gap:6px}
.tools button{background:rgba(20,8,20,.6);border:1px solid rgba(255,160,200,.3);color:#ffd6ea;border-radius:12px;padding:6px 10px;font-size:13px;backdrop-filter:blur(4px)}
.tools button.on{background:#ff8ac0;color:#200818}
#choices{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;justify-content:center;gap:12px;padding:0 28px 120px;background:rgba(8,2,10,.45)}
#choices.on{display:flex}
#choices button{background:linear-gradient(180deg,rgba(60,20,50,.94),rgba(34,10,30,.96));border:1px solid #ff9ec8aa;color:#fff;font-size:16.5px;padding:15px 16px;border-radius:16px;line-height:1.5;box-shadow:0 6px 18px rgba(0,0,0,.45);animation:cin .35s both}
#choices button:nth-child(2){animation-delay:.08s}#choices button:nth-child(3){animation-delay:.16s}
#choices button:active{transform:scale(.97);background:#ff8ac0;color:#200818}
@keyframes cin{from{opacity:0;transform:translateY(12px)}}
.card{position:fixed;inset:0;z-index:25;background:#06030a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .8s}
.card.on{opacity:1;pointer-events:auto}
.card b{font-family:'LXGW WenKai TC',serif;font-size:20px;letter-spacing:8px;color:#ff9ec8}
.card span{font-family:'LXGW WenKai TC',serif;font-size:36px;letter-spacing:10px;color:#fff;text-shadow:0 0 22px #ff5aa0}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:40;background:rgba(30,10,26,.95);border:1px solid #ff9ec8;padding:8px 16px;border-radius:14px;transition:opacity .4s}.toast.out{opacity:0}
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,2,8,.78);display:flex;align-items:center;justify-content:center;padding:18px}
.panel{width:100%;max-width:440px;max-height:86vh;overflow:auto;background:linear-gradient(180deg,#24101f,#140812);border:1px solid #ff9ec866;border-radius:20px;padding:18px}
.panel h2{margin:0 0 12px;font-family:'LXGW WenKai TC',serif;color:#ff9ec8;letter-spacing:3px;font-size:21px}
.btn{display:block;width:100%;background:linear-gradient(180deg,#ff9ec8,#e86aa0);color:#200818;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:700;margin-top:8px}
.btn small{display:block;font-weight:400;font-size:12px;opacity:.8}
.btn.ghost{background:rgba(255,255,255,.06);color:#ffd6ea;border:1px solid rgba(255,160,200,.3);font-weight:400}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{text-align:left;background:rgba(255,255,255,.05);border:1px solid rgba(255,160,200,.3);color:#fff;border-radius:14px;padding:11px 14px}
.slot:disabled{opacity:.4}.slot b{display:block;font-size:15px}.slot small{color:#e8c8da;font-size:12.5px}
.log{max-height:62vh;overflow:auto;font-size:14.5px;line-height:1.7}
.log p{margin:0 0 8px}.log b{color:#ff9ec8;margin-right:6px}.log p.inner{color:#ffd6ea;font-style:italic}.log p.pick{color:#ffd257}
.note{font-size:12.5px;color:#c8a8ba;margin:10px 2px 0}
.ends{display:flex;flex-direction:column;gap:8px}
.endi{background:rgba(255,255,255,.04);border:1px dashed rgba(255,160,200,.25);border-radius:12px;padding:10px 12px}
.endi b{display:block;font-family:'LXGW WenKai TC',serif;font-size:16px}.endi small{font-size:12.5px;color:#c8a8ba}
.endi.got{border-style:solid;border-color:#ff9ec8}.endi.got.true{border-color:#ffd257;background:rgba(255,210,87,.08)}.endi.got.sad{border-color:#8ab0ff}
.cgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cgb{height:110px;border-radius:12px;border:1px solid #ff9ec866;background-size:cover;background-position:center;background-color:#2a1024;color:#fff;display:flex;align-items:flex-end;padding:6px;font-size:12.5px;text-shadow:0 1px 4px #000}
.cgview{width:100%;aspect-ratio:9/16;max-height:70vh;background-size:contain;background-repeat:no-repeat;background-position:center;background-color:#000;border-radius:12px}
.endc{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;background:radial-gradient(circle at 50% 35%,#3a1430,#0a0410 70%)}
.endc.on{display:flex;animation:fadein 1.6s}
.endc.true{background:radial-gradient(circle at 50% 35%,#5a3a14,#120a04 70%)}.endc.sad{background:radial-gradient(circle at 50% 35%,#142a4a,#04080f 70%)}.endc.bad{background:radial-gradient(circle at 50% 35%,#3a0a10,#080204 70%)}
@keyframes fadein{from{opacity:0}}
.endc .ek{letter-spacing:8px;color:#ff9ec8;font-size:14px}.endc.true .ek{color:#ffd257}.endc.sad .ek{color:#8ab0ff}
.endc h1{font-family:'LXGW WenKai TC',serif;font-size:32px;letter-spacing:6px;margin:10px 0 16px;text-shadow:0 0 24px rgba(255,140,190,.6)}
.endc p{font-size:16px;line-height:1.9;max-width:380px;color:#f0e0ea}
.endc .ecount{font-size:13px;color:#c8a8ba;margin:14px 0 6px}.endc .btn{max-width:260px}
#title{position:fixed;inset:0;z-index:20;overflow:hidden}
.tbg{position:absolute;inset:-3%;background:url(assets/zhuyu/bg/snow.webp) center/cover;filter:brightness(.55) saturate(1.2);animation:drift 26s ease-in-out infinite alternate}
.tbg::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,transparent,rgba(10,2,14,.85) 75%)}
.tfx{position:absolute;inset:0;pointer-events:none}
.tfx i{position:absolute;top:-5%;width:12px;height:9px;border-radius:12px 0;background:linear-gradient(135deg,#ffe0ec,#ff8ab8);opacity:.8;animation:fall linear infinite;--x:60px}
.tin{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;max-width:420px;margin:0 auto;text-align:center}
.tsub{letter-spacing:6px;color:#ffb8d6;font-size:14px}
#title h1{font-family:'LXGW WenKai TC',serif;font-size:52px;letter-spacing:10px;margin:6px 0 10px;color:#fff;text-shadow:0 0 20px #ff6aa8,0 0 50px #ff3a8a}
.tline{font-family:'LXGW WenKai TC',serif;color:#ffe0ee;line-height:1.9;font-size:16px;margin-bottom:26px}
.tbtn{width:100%}

.ch.pop img{animation:pop .35s ease}
@keyframes pop{40%{transform:translateY(-8px) scale(1.02)}}
.ch.wide{width:88%}.ch.wide.pc{left:6%}.ch.wide.pl{left:-18%}.ch.wide.pr{right:-18%}
.ch.beast.tiny img{max-height:30%}
#tapStart{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%,#3a1430,#06030a 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .9s}#tapStart.out{opacity:0;pointer-events:none}#tapStart b{font-family:'LXGW WenKai TC',serif;font-size:44px;letter-spacing:10px;color:#fff;text-shadow:0 0 20px #ff6aa8}#tapStart span{color:#ffd6ea;letter-spacing:4px;animation:blink 1.6s infinite}
#hbox{position:fixed;left:50%;top:34%;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#toasts{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}#toasts .toast{position:static;transform:none}

.endc.extra{background:radial-gradient(circle at 50% 35%,#4a1a3a,#0c040a 70%)}.endc.extra .ek{color:#ffb0d8}.endi.got.extra{border-color:#ffb0d8;background:rgba(255,176,216,.08)}
.ch.kid img{max-height:68%}
</style></head>
<body>
<div id="game" class="hide"><div id="stage"><div class="bg" id="bgA"></div><div class="bg" id="bgB"></div><div id="chars"></div><div class="cg" id="cg"></div><div id="fx"></div></div>
<div class="tools"><button id="bLog">紀錄</button><button id="bAuto">自動</button><button id="bSkip">快進</button><button id="bHide">隱藏</button><button id="bMenu">選單</button></div>
<div class="box" id="box"><div id="nm"></div><div id="tx"></div></div><div id="choices"></div></div>
<div id="title"></div><div id="card" class="card"></div><div id="endc" class="endc"></div><div id="toasts"></div>
<script>'use strict';
// ======================================================================
//  逐玉 —— 劇本（依電視劇情節改寫，文字為原創）  序章～第三章
// ======================================================================
const CHAP = [
  { id: 'c0', t: '序章', sub: '雪夜', base: {} },
  { id: 'c1', t: '第一章', sub: '招婿', base: { qing: 3, yong: 1, zhi: 1 } },
  { id: 'c2', t: '第二章', sub: '銀簪', base: { qing: 10, yong: 4, lin: 2, zhi: 2 } },
  { id: 'c3', t: '第三章', sub: '劫獄', base: { qing: 19, yong: 7, lin: 2, zhi: 3 } },
  { id: 'c4', t: '第四章', sub: '除夕', base: { qing: 23, yong: 11, lin: 2, xin: 1, zhi: 6 } },
  { id: 'c5', t: '第五章', sub: '離書', base: { qing: 34, yong: 14, lin: 4, xin: 4, zhi: 8 } },
  { id: 'c6', t: '第六章', sub: '墜崖', base: { qing: 38, yong: 18, lin: 7, xin: 5, zhi: 11 } },
  { id: 'c7', t: '第七章', sub: '孤山', base: { qing: 41, yong: 24, lin: 14, xin: 5, zhi: 11 } },
  { id: 'c8', t: '第八章', sub: '定情', base: { qing: 50, yong: 28, lin: 18, xin: 6, zhi: 14 } },
  { id: 'c9', t: '第九章', sub: '殺豬小分隊', base: { qing: 59, yong: 34, lin: 19, xin: 8, zhi: 19 } },
  { id: 'c10', t: '第十章', sub: '簪花將軍', base: { qing: 60, yong: 38, lin: 21, xin: 10, zhi: 21 } },
  { id: 'c11', t: '第十一章', sub: '登聞鼓', base: { qing: 65, yong: 39, lin: 22, xin: 12, zhi: 23 } },
  { id: 'c12', t: '終章', sub: '永興', base: { qing: 70, yong: 41, lin: 24, xin: 15, zhi: 23 } },
];
const SCRIPT = {};

// ---------------- 序章：雪夜 ----------------
SCRIPT.c0 = `
@title 序章|雪夜
@form cy winter
@name xz ？？
@bg snow
@bgm sad
@amb amb_wind
@fx snow
臨安鎮的冬天，冷得連豬都不肯出圈。
我叫樊長玉，十八歲。是個殺豬的。
爹娘走了還不到三個月。家裡剩下一間肉舖、一口大鍋、一把殺豬刀，還有一個六歲的妹妹。
（還有一屁股的債。）
那天傍晚，我從鄰村收完豬錢回來，雪下得連路都看不清。
@show cy c
（再走快一點。長寧還在家裡等我，她今天還沒喝藥。）
@hide all
走到半山腰的時候，我差點被一樣東西絆倒。
是一個人。
他趴在雪地裡，半個身子都被雪埋住了。身上的白衣服被血染成了深紅色，背上插著一截斷箭。
?雪地裡躺著一個快死的人——
- 二話不說，先把他翻過來看還有沒有氣 => c0a | @set qing +1 | @set yong +1
- 先撿根樹枝戳戳看，萬一是山賊裝死呢 => c0b | @set zhi +1
#c0a
我把他翻過來。他的臉凍得發青，嘴唇一點血色都沒有。
可是那張臉……
（好看得不像話。像畫裡走出來的。）
（呸，樊長玉，人都要死了你在想什麼。）
我把手指伸到他鼻子底下。還有一絲很弱很弱的氣。
@goto c0c
#c0b
我撿了一根樹枝，戳了戳他的肩膀。
他一動也不動。我又戳了一下他的臉。
這次他皺了皺眉，嘴裡吐出一句很輕很輕的話。
xz：……再戳……殺了你……
（還有力氣罵人，那就是還活著。）
@goto c0c
#c0c
@bgm daily
@amb off
@cg xuedi 雪夜
我把他扛了起來。
別看我這樣，我從小就力氣大。兩百斤的豬我都扛得動，一個大男人算什麼。
（就是他身上的血，一路滴在雪地上，滴得我心裡發慌。）
@cgoff
@hide all
@bg home
@fx off
@show zd c
zd：哎喲我的天老爺！長玉，你從哪撿回來一個血人？
（他一直昏迷著，一點動靜都沒有。）
cy：趙大娘，幫我燒熱水！再去請大夫！
zd：請大夫？你哪來的錢請大夫？你家連下個月的米錢都——
cy：我有辦法。
@hide all
我從娘的妝匣底下，拿出了一支銀簪。
那是娘唯一留下來的東西。簪頭刻著一朵小小的梅花，娘以前每天都戴著它。
?握著娘的銀簪——
- 咬著牙，拿去當鋪當了 => c0d | @set qing +2
- 先跟大夫賒帳，簪子實在捨不得 => c0e | @set lin +1
#c0d
（娘，對不起。可是你一定也會這樣做的。）
（你說過，見死不救的人，晚上是會睡不著的。）
當鋪的掌櫃給了我三兩銀子。剛好夠請大夫，再抓三帖藥。
@goto c0f
#c0e
大夫看了看我，又看了看我家空空的灶台，嘆了口氣。
大夫：……算了，先救人。錢的事，你殺豬再還。

    if (cond && !evalCond(cond)) return '';
    return `<button data-o="${k}">${txt.trim()}</button>`;
  }).join('');
  box.classList.add('on');
  box.querySelectorAll('[data-o]').forEach(b => b.onclick = (e) => {
    e.stopPropagation(); se('se_choice');
    const [txt, rest = ''] = opts[+b.dataset.o].split('=>');
    box.classList.remove('on'); box.innerHTML = '';
    logArr.push({ n: '▶', t: txt.trim(), k: 'pick' });
    const parts = rest.replace(/\[.*?\]/, '').split('|').map(x => x.trim()).filter(Boolean);
    let lb = null;
    for (const p of parts) { if (p.startsWith('@set')) doSet(p.slice(4)); else lb = p; }
    if (lb) jump(lb);
    next();
  });
}
function ending(k) {
  const E = ENDS[k]; loopTrack('amb', 'off'); loopTrack('bgm', E.kind === 'sad' || E.kind === 'bad' ? 'sad' : E.kind === 'extra' ? 'romance' : 'hope'); const inMain = CHAP.some(c => c.id === S.ch); P.end[k] = Date.now(); saveP(); if (inMain) localStorage.removeItem('zy_save_0');
  hideCG(); S.show = {}; renderChars(); auto = false; skip = false; updBtns();
  $('box').classList.add('hide');
  const d = $('endc'); d.className = 'endc on ' + (E.kind || '');
  d.innerHTML = `<div class="ek">${E.kind === 'true' ? '真結局' : E.kind === 'sad' ? '悲傷結局' : E.kind === 'bad' ? '壞結局' : E.kind === 'extra' ? '番外・完' : '結局'}</div><h1>${E.n}</h1><p>${E.d}</p><div class="ecount">已收集結局 ${Object.keys(P.end).length} / ${Object.keys(ENDS).length}</div><button class="btn" id="eBack">回到標題</button>`;
  $('eBack').onclick = () => { d.className = 'endc'; title(); };
}

// ---------------- 選單 ----------------
function updBtns() { $('bAuto').classList.toggle('on', auto); $('bSkip').classList.toggle('on', skip); }
function modal(h) { const o = document.createElement('div'); o.className = 'ov'; o.innerHTML = `<div class="panel">${h}</div>`; o.onclick = e => { if (e.target === o) o.remove(); }; document.body.appendChild(o); return o; }
const fmtT = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
function slotsUI(mode) {
  const o = modal(`<h2>${mode === 'save' ? '存檔' : '讀檔'}</h2><div class="slots">${[0, 1, 2, 3].map(n => { const s = loadSlot(n); if (n === 0 && mode === 'save') return ''; return `<button class="slot" data-s="${n}" ${!s && mode === 'load' ? 'disabled' : ''}><b>${n === 0 ? '自動存檔' : '存檔 ' + n}</b><small>${s ? `${chapOf(s.ch).t}・${fmtT(s.t)}` : '空'}</small></button>`; }).join('')}</div><button class="btn ghost" id="sX">關閉</button>`);
  $('sX').onclick = () => o.remove();
  o.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { const n = +b.dataset.s; if (mode === 'save') { saveSlot(n); toast('已存檔'); o.remove(); } else { const s = loadSlot(n); if (s) { o.remove(); resume(s); } } });
}
function logUI() {
  const o = modal(`<h2>對話紀錄</h2><div class="log">${logArr.slice(-120).map(l => `<p class="${l.k || ''}">${l.n ? `<b>${l.n}</b>` : ''}${l.t}</p>`).join('')}</div><button class="btn ghost" id="lX">關閉</button>`);
  $('lX').onclick = () => o.remove(); const lg = o.querySelector('.log'); lg.scrollTop = lg.scrollHeight;
}
function menuUI() {
  const o = modal(`<h2>選單</h2><div class="mgrid"><button class="btn" data-m="save">存檔</button><button class="btn" data-m="load">讀檔</button><button class="btn" data-m="log">對話紀錄</button><button class="btn" data-m="speed">文字速度：${['', '一般', '快', '瞬間'][P.speed]}</button><button class="btn" data-m="skipall">快進：${P.skipAll ? '全部' : '只跳已讀'}</button><button class="btn" data-m="snd">聲音：${['關', '小聲', '中等', '大聲'][Math.round((P.snd ?? 1) * 3)] || '大聲'}</button><button class="btn ghost" data-m="title">回到標題</button></div><button class="btn ghost" id="mX">繼續故事</button>`);
  $('mX').onclick = () => o.remove();
  o.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    const m = b.dataset.m; if (m === 'save' || m === 'load') { o.remove(); slotsUI(m); } else if (m === 'log') { o.remove(); logUI(); }
    else if (m === 'speed') { P.speed = P.speed % 3 + 1; saveP(); o.remove(); menuUI(); }
    else if (m === 'snd') { const lv = [0, 1 / 3, 2 / 3, 1], i = lv.findIndex(x => Math.abs(x - (P.snd ?? 1)) < .01); P.snd = lv[(i + 1) % 4]; saveP(); sndRefresh(); o.remove(); menuUI(); }
    else if (m === 'skipall') { P.skipAll = !P.skipAll; saveP(); o.remove(); menuUI(); }
    else if (m === 'title') { saveSlot(0); o.remove(); title(); }
  });
}

// ---------------- 標題 ----------------
function title() {
  auto = skip = false; updBtns(); clearTimeout(autoT); if (typing) clearInterval(typing);
  $('game').classList.add('hide'); const t = $('title'); t.classList.remove('hide'); loopTrack('amb', 'off'); loopTrack('bgm', 'title');
  const cont = loadSlot(0), ne = Object.keys(P.end).length;
  t.innerHTML = `<div class="tbg"></div><div class="tfx" id="tfx"></div><div class="tin"><div class="tsub">樊長玉篇</div><h1>逐玉</h1><div class="tline">那年雪夜，我撿回了一個人。<br>後來才知道，那是我的整個天下。</div>
  <div class="tbtn">${cont ? `<button class="btn" id="tC">繼續故事<small>${chapOf(cont.ch).t}</small></button>` : ''}<button class="btn ${cont ? 'ghost' : ''}" id="tN">新的故事</button><button class="btn ghost" id="tL">讀取存檔</button><button class="btn ghost" id="tCh">章節回顧</button>${typeof EXTRA !== 'undefined' ? `<button class="btn ghost" id="tX">番外篇${EXTRA.some(x => x.need()) ? '' : '（未解鎖）'}</button>` : ''}<button class="btn ghost" id="tE">結局與回憶（${ne}/${Object.keys(ENDS).length}）</button></div></div>`;
  const tf = $('tfx'); for (let i = 0; i < 24; i++) { const p = document.createElement('i'); p.style.left = Math.random() * 100 + '%'; p.style.animationDelay = (-Math.random() * 10) + 's'; p.style.animationDuration = (7 + Math.random() * 6) + 's'; tf.appendChild(p); }
  if ($('tC')) $('tC').onclick = () => resume(cont);
  $('tN').onclick = () => { if (cont && !confirm('開始新的故事？自動存檔會被覆蓋（手動存檔不受影響）')) return; start(newState()); };
  $('tL').onclick = () => slotsUI('load');
  $('tCh').onclick = () => {
    const o = modal(`<h2>章節回顧</h2><div class="slots">${CHAP.map((c, i) => `<button class="slot" data-c="${c.id}" ${P.chap[c.id] || i === 0 ? '' : 'disabled'}><b>${c.t}</b><small>${P.chap[c.id] || i === 0 ? c.sub : '？？？'}</small></button>`).join('')}</div><p class="note">從章節開頭重看時，心意數值會用「一般」的狀態開始。</p><button class="btn ghost" id="cX">關閉</button>`);
    $('cX').onclick = () => o.remove();
    o.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { o.remove(); const s = newState(b.dataset.c); Object.assign(s.v, chapOf(b.dataset.c).base || {}); start(s); });
  };
  if ($('tX')) $('tX').onclick = () => {
    const o = modal(`<h2>番外篇</h2><div class="slots">${EXTRA.map(x => `<button class="slot" data-x="${x.id}" ${x.need() ? '' : 'disabled'}><b>${x.t}・${x.need() ? x.sub : '？？？'}</b><small>${x.need() ? (P.chap[x.id] ? '已讀過' : '新的故事') : x.hint}</small></button>`).join('')}</div><p class="note">番外篇是正篇之外的故事，不影響存檔。</p><button class="btn ghost" id="xX">關閉</button>`);
    $('xX').onclick = () => o.remove();
    o.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { o.remove(); start(newState(b.dataset.x)); });
  };
  $('tE').onclick = () => {
    const cgs = Object.entries(P.cg);
    const o = modal(`<h2>結局</h2><div class="ends">${Object.entries(ENDS).map(([k, E]) => `<div class="endi ${P.end[k] ? 'got ' + (E.kind || '') : ''}"><b>${P.end[k] ? E.n : '？？？'}</b><small>${P.end[k] ? E.d.replace(/<br>/g, ' ').slice(0, 46) + '…' : E.hint}</small></div>`).join('')}</div><h2 style="margin-top:14px">回憶畫面</h2><div class="cgs">${cgs.length ? cgs.map(([k, t]) => `<button class="cgb" data-cg="${k}" style="background-image:url(${CGD + k}.webp)"><span>${t}</span></button>`).join('') : '<p class="note">劇情中的重要畫面會收集在這裡。</p>'}</div><button class="btn ghost" id="eX">關閉</button>`);
    $('eX').onclick = () => o.remove();
    o.querySelectorAll('[data-cg]').forEach(b => b.onclick = () => { const v = modal(`<div class="cgview" style="background-image:url(${CGD + b.dataset.cg}.webp)"></div><p>${P.cg[b.dataset.cg]}</p>`); v.onclick = () => v.remove(); });
  };
}
function start(s) {
  S = s; applyNames(); logArr = []; $('title').classList.add('hide'); $('game').classList.remove('hide');
  $('chars').innerHTML = ''; hideCG(); fx('off'); $('choices').classList.remove('on');
  $('bgA').classList.remove('on'); $('bgB').classList.remove('on');
  if (S.bg) setBg(S.bg, true);
  next();
}
function resume(s) {
  // 回到存檔那一行（往回找上一句可顯示的台詞重新播放）
  S = s; applyNames(); logArr = []; $('title').classList.add('hide'); $('game').classList.remove('hide');
  $('chars').innerHTML = ''; fx('off'); $('choices').classList.remove('on'); $('bgA').classList.remove('on'); $('bgB').classList.remove('on');
  if (S.bg) setBg(S.bg, true);
  if (S.cg) showCG(S.cg.k, S.cg.title); else hideCG();
  loopTrack('bgm', S.bgm || 'off'); loopTrack('amb', S.amb || 'off');
  renderChars();
  // 往回退到最近一句台詞或選項
  const L = lines(); let i = Math.max(0, S.i - 1);
  while (i > 0) { const t = L[i].trim(); if (t && t[0] !== '@' && t[0] !== '#' && !t.startsWith('- ') && !t.startsWith('//')) break; i--; }
  if (L[i] && L[i].trim().startsWith('- ')) { while (i > 0 && !L[i].trim().startsWith('?')) i--; }
  S.i = i; next();
}

// ---------------- 綁定 ----------------
window.addEventListener('load', () => {
  loadP();
  const tap = document.createElement('div'); tap.id = 'tapStart'; tap.innerHTML = '<b>逐玉</b><span>輕觸畫面開始</span>'; document.body.appendChild(tap);
  tap.onclick = () => { tap.classList.add('out'); setTimeout(() => tap.remove(), 900); tryPlay('bgm'); };
  $('stage').onclick = () => { if ($('choices').classList.contains('on')) return; if (skip) { skip = false; updBtns(); return; } next(); };
  $('box').onclick = $('stage').onclick;
  $('bMenu').onclick = e => { e.stopPropagation(); menuUI(); };
  $('bLog').onclick = e => { e.stopPropagation(); logUI(); };
  $('bAuto').onclick = e => { e.stopPropagation(); auto = !auto; skip = false; updBtns(); if (auto && !typing && !$('choices').classList.contains('on')) next(); };
  $('bSkip').onclick = e => { e.stopPropagation(); skip = !skip; auto = false; updBtns(); if (skip && !$('choices').classList.contains('on')) next(); };
  $('bHide').onclick = e => { e.stopPropagation(); $('game').classList.add('nobox'); setTimeout(() => { const f = () => { $('game').classList.remove('nobox'); document.removeEventListener('click', f, true); }; document.addEventListener('click', f, true); }, 50); };
  title();
});
