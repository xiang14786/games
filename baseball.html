<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="遊戲盒">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>投手轉生記</title>
<style>
  :root { --bg:#0b0e14; --card:#151a24; --card2:#1e2533; --line:#273042; --ink:#eef2f8; --muted:#8e9ab0; --gold:#ffb84d; --red:#ff6b6b; --blue:#5aa9ff; --green:#5fd68a; --tc:#3fa7d6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; font-size:16px; user-select:none; -webkit-user-select:none; overscroll-behavior:none; }
  body { background: radial-gradient(1200px 500px at 50% -200px, color-mix(in srgb, var(--tc) 35%, transparent), transparent 70%), var(--bg); background-attachment: fixed; min-height:100vh; }
  .wrap { max-width:560px; margin:0 auto; padding:calc(32px + env(safe-area-inset-top)) 12px calc(40px + env(safe-area-inset-bottom)); }
  .hide { display:none !important; }
  h1 { text-align:center; font-size:38px; margin:6px 0 2px; background:linear-gradient(90deg,#ffd27a,#ff8a3d); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:900; }
  h2 { margin:4px 0 10px; font-size:22px; font-weight:900; }
  h3 { margin:0 0 8px; font-size:16px; color:#cfd7e6; display:flex; align-items:center; gap:6px; }
  button { font-family:inherit; background:linear-gradient(135deg,#ffc56b,#ff8a3d); color:#2a1300; border:0; border-radius:14px; padding:13px 16px; font-size:17px; font-weight:800; cursor:pointer; box-shadow:0 4px 14px rgba(255,138,61,.25); }
  button.ghost { background:var(--card2); color:var(--ink); border:1px solid var(--line); box-shadow:none; }
  button:disabled { opacity:.35; }
  .col { display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; gap:8px; align-items:center; }
  .card { background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0)) ,var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:12px; box-shadow:0 6px 20px rgba(0,0,0,.25); }
  .muted { color:var(--muted); } .good { color:var(--green); } .bad { color:var(--red); } .gold { color:var(--gold); }
  input { width:100%; font-family:inherit; font-size:19px; padding:12px; border-radius:12px; border:1px solid var(--line); background:#0a0d13; color:var(--ink); }
  .lb { color:var(--muted); font-size:14px; margin:14px 0 6px; display:block; }
  .opt { text-align:left; background:var(--card2); color:var(--ink); border:2px solid transparent; font-weight:700; box-shadow:none; }
  .opt.sel { border-color:var(--gold); background:#2a2416; }
  .opt small { display:block; color:var(--muted); font-weight:400; font-size:13px; margin-top:2px; }
  .art { width:100%; display:block; border-radius:18px; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  td,th { padding:6px 3px; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  td.l, th.l { text-align:left; }
  tr.me td { color:var(--gold); font-weight:800; background:rgba(255,184,77,.06); }
  .scroll-x { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  /* 主角卡 */
  .hero { position:relative; border-radius:22px; padding:16px; overflow:hidden; margin-bottom:12px; border:1px solid rgba(255,255,255,.08); }
  .hero .bg { position:absolute; inset:0; background:linear-gradient(135deg, var(--tc), #0b0e14 75%); opacity:.9; }
  .hero .bg2 { position:absolute; right:-30px; top:-30px; width:200px; height:200px; opacity:.12; }
  .hero .in { position:relative; display:flex; gap:14px; align-items:center; }
  .hero .av svg { width:92px; height:92px; border-radius:20px; box-shadow:0 6px 18px rgba(0,0,0,.4); }
  .hero .nm { font-size:24px; font-weight:900; }
  .hero .sub { font-size:14px; opacity:.85; }
  .badge { width:66px; height:80px; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:900; box-shadow:0 6px 16px rgba(0,0,0,.4); flex:none; }
  .badge b { font-size:30px; line-height:1; } .badge span { font-size:11px; opacity:.85; margin-top:2px; }
  .meters { position:relative; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .meter { background:rgba(0,0,0,.35); border-radius:12px; padding:7px 9px; font-size:12px; }
  .meter .t { display:flex; justify-content:space-between; opacity:.9; }
  .meter .b { height:6px; background:rgba(255,255,255,.12); border-radius:4px; margin-top:5px; overflow:hidden; }
  .meter .b i { display:block; height:100%; border-radius:4px; }
  .tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:4px 0 12px; position:sticky; top:calc(28px + env(safe-area-inset-top)); z-index:5; background:rgba(11,14,20,.85); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); padding:6px 0; }
  .tabs button { padding:9px 2px; font-size:14px; background:var(--card2); color:var(--ink); border:1px solid var(--line); box-shadow:none; }
  .tabs button.on { background:linear-gradient(135deg,#ffc56b,#ff8a3d); color:#2a1300; border-color:transparent; }
  .sub-tabs { display:flex; gap:6px; margin-bottom:10px; overflow-x:auto; }
  .sub-tabs button { padding:7px 12px; font-size:14px; white-space:nowrap; background:var(--card2); color:var(--ink); border:1px solid var(--line); box-shadow:none; border-radius:20px; }
  .sub-tabs button.on { background:#fff; color:#111; }
  .trains { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .tr { display:flex; gap:10px; align-items:center; text-align:left; background:var(--card2); color:var(--ink); border:1px solid var(--line); box-shadow:none; padding:10px; font-size:15px; }
  .tr .ic { font-size:24px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; border-radius:10px; background:rgba(255,255,255,.06); flex:none; }
  .tr small { display:block; font-size:12px; color:var(--muted); font-weight:500; }
  .attr { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:14px; }
  .attr .l { width:38px; color:var(--muted); }
  .attr .bar { flex:1; height:10px; background:#0a0d13; border-radius:6px; overflow:hidden; position:relative; }
  .attr .bar i { display:block; height:100%; border-radius:6px; }
  .attr .bar u { position:absolute; top:0; bottom:0; width:2px; background:rgba(255,255,255,.5); }
  .attr .v { width:28px; text-align:right; font-weight:900; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { background:var(--card2); border:1px solid var(--line); border-radius:20px; padding:4px 10px; font-size:13px; }
  .mini-team { display:flex; align-items:center; gap:8px; }
  .mini-team svg { width:26px; height:26px; flex:none; }
  .scene { position:fixed; inset:0; background:rgba(6,8,12,.97); z-index:20; overflow-y:auto; }
  .scene .inner { max-width:560px; margin:0 auto; padding:calc(32px + env(safe-area-inset-top)) 14px 40px; }
  .story { font-size:17px; line-height:1.8; white-space:pre-wrap; margin-bottom:14px; }
  .choice { text-align:left; background:var(--card2); color:var(--ink); border:1px solid var(--line); box-shadow:none; }
  .choice small { display:block; color:var(--muted); font-weight:400; font-size:13px; margin-top:3px; }
  .vs { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; text-align:center; margin:4px 0 14px; }
  .vs svg { width:64px; height:64px; }
  .vs .t { font-weight:900; font-size:16px; margin-top:4px; } .vs .r { color:var(--muted); font-size:13px; }
  .vs .x { font-size:26px; font-weight:900; color:var(--muted); }
  /* 比賽 */
  #game { position:fixed; inset:0; background:var(--bg); z-index:15; overflow-y:auto; }
  #game .inner { max-width:560px; margin:0 auto; padding:calc(32px + env(safe-area-inset-top)) 10px 24px; }
  .sb { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; border-radius:18px; padding:12px; background:linear-gradient(90deg, color-mix(in srgb, var(--hc) 45%, #151a24), #151a24 45%, #151a24 55%, color-mix(in srgb, var(--ac) 45%, #151a24)); border:1px solid var(--line); }
  .sb .side { display:flex; align-items:center; gap:8px; } .sb .side.r { flex-direction:row-reverse; text-align:right; }
  .sb svg { width:40px; height:40px; }
  .sb .tm { font-size:13px; opacity:.85; } .sb .sc { font-size:36px; font-weight:900; font-variant-numeric:tabular-nums; line-height:1; }
  .sb .mid { text-align:center; padding:0 6px; } .sb .q { font-weight:900; } .sb .clk { color:var(--muted); font-variant-numeric:tabular-nums; font-size:14px; }
  #lead { width:100%; height:80px; display:block; margin:8px 0; background:var(--card); border-radius:14px; border:1px solid var(--line); }
  .myline { display:grid; grid-template-columns:repeat(5,1fr); background:var(--card); border:1px solid var(--line); border-radius:14px; padding:8px 4px; margin-bottom:8px; text-align:center; }
  .myline b { display:block; font-size:22px; } .myline span { font-size:11px; color:var(--muted); }
  .feed { background:#080a0f; border:1px solid var(--line); border-radius:14px; padding:8px; height:250px; overflow-y:auto; font-size:14px; }
  .ev { display:flex; gap:8px; align-items:flex-start; padding:5px 4px; border-bottom:1px solid rgba(255,255,255,.04); }
  .ev .dot { width:8px; height:8px; border-radius:50%; margin-top:6px; flex:none; }
  .ev .tm { color:var(--muted); font-size:12px; width:38px; flex:none; margin-top:1px; font-variant-numeric:tabular-nums; }
  .ev.me { background:rgba(255,184,77,.08); border-radius:8px; } .ev.me .tx { color:var(--gold); font-weight:700; }
  .ev.q .tx { color:var(--blue); font-weight:800; } .ev.big .tx { font-weight:900; }
  .clutch { background:linear-gradient(135deg,#4a2a0a,#151a24); border:2px solid var(--gold); border-radius:18px; padding:12px; margin-top:10px; animation:glow 1.2s infinite; }
  @keyframes glow { 50% { box-shadow:0 0 22px rgba(255,184,77,.5); } }
  .toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:50; background:linear-gradient(135deg,#ffd27a,#ff8a3d); color:#2a1300; border-radius:16px; padding:10px 18px; font-weight:900; box-shadow:0 8px 24px rgba(0,0,0,.5); animation:tin 3.2s forwards; text-align:center; min-width:250px; }
  .toast small { display:block; font-weight:600; font-size:12px; }
  @keyframes tin { 0% { opacity:0; transform:translate(-50%,20px) scale(.9); } 10%,85% { opacity:1; transform:translate(-50%,0) scale(1); } 100% { opacity:0; } }
  .ach { display:flex; gap:12px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); }
  .ach .i { font-size:26px; width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#3a2a10,#1e2533); flex:none; }
  .ach.off { opacity:.3; filter:grayscale(1); }
  .big-score { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; text-align:center; margin:6px 0 12px; }
  .big-score svg { width:56px; height:56px; } .big-score .s { font-size:42px; font-weight:900; }
  .result-tag { text-align:center; font-size:20px; font-weight:900; margin-bottom:10px; }
  .pog { display:flex; gap:10px; align-items:center; background:linear-gradient(135deg,#3a2a10,#151a24); border:1px solid #5a4422; border-radius:16px; padding:10px; margin-bottom:12px; }
  .pog svg { width:52px; height:52px; border-radius:12px; }
  .pick-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .pick-grid .opt { padding:10px; font-size:15px; }
  #field { width:100%; display:block; margin-top:8px; border-radius:14px; border:1px solid var(--line); image-rendering:pixelated; }
  .bso { display:flex; gap:10px; justify-content:center; font-size:13px; color:var(--muted); margin-top:4px; }
  .bso i { display:inline-block; width:10px; height:10px; border-radius:50%; background:#2a3242; margin-left:2px; }
  .bso i.on.o { background:var(--red); }
</style>
</head>
<body>
<div class="wrap">
  <div id="sTitle">
    <div id="titleArt"></div>
    <h1>投手轉生記</h1>
    <div style="text-align:center;color:var(--muted);margin-bottom:18px">投手生涯模擬：從高中打到名人堂</div>
    <div class="col">
      <button id="bNew">⚾ 新的人生</button>
      <button class="ghost hide" id="bCont">▶ 繼續生涯</button>
      <button class="ghost" id="bHall">🏛️ 歷代投手・成就殿堂</button>
    </div>
    <div class="card muted" style="margin-top:16px;line-height:1.8;font-size:15px">
      每週安排訓練，然後觀看比賽：守備站位、打者、跑壘和每一球都會即時播出，兩隊每位球員的數據都會記錄。<br>
      得點圈有人、比賽膠著時，<b class="gold">由你決定怎麼配球</b>。<br>
      整個聯盟的球員都會成長、老化、轉隊和退休。拚最佳投手、MVP、總冠軍，最後進名人堂。
    </div>
  </div>

  <div id="sCreate" class="hide">
    <h2>建立投手</h2>
    <div id="legacy"></div>
    <div class="card row" id="cAvatar"></div>
    <label class="lb">姓名</label>
    <div class="row"><input id="iName" maxlength="6"><button class="ghost" id="bRnd" style="white-space:nowrap">隨機</button></div>
    <label class="lb">背號（0–99）</label>
    <input id="iNum" type="number" inputmode="numeric" min="0" max="99">
    <label class="lb">選兩種實戰變化球（直球必備）</label>
    <div class="pick-grid" id="pPick"></div>
    <label class="lb">再選一種「開發中」球種（練到 40 就能實戰）</label>
    <div class="pick-grid" id="dPick"></div>
    <button class="ghost" id="bLook" style="width:100%;margin-top:10px">換個外型</button>
    <button id="bStart" style="width:100%;margin-top:12px">入學</button>
  </div>

  <div id="sHub" class="hide">
    <div class="hero" id="hero"></div>
    <div class="card hide" id="hNote" style="font-size:15px;line-height:1.6"></div>
    <div class="tabs" id="tabs"><button data-t="week">📅 本週</button><button data-t="me">🧍 投手</button><button data-t="league">🏆 聯盟</button><button data-t="ach">🎖️ 成就</button></div>
    <div id="tWeek"></div><div id="tMe" class="hide"></div><div id="tLeague" class="hide"></div><div id="tAch" class="hide"></div>
  </div>

  <div id="sHall" class="hide">
    <h2>歷代投手</h2>
    <div id="hallList"></div>
    <button class="ghost" id="bHallBack" style="width:100%">返回</button>
  </div>
</div>

<div class="scene hide" id="scene"><div class="inner" id="sceneIn"></div></div>

<div id="game" class="hide"><div class="inner">
  <div class="sb" id="sb"></div>
  <canvas id="field" width="600" height="420"></canvas>
  <div class="myline" id="gMy"></div>
  <div class="feed" id="gFeed"></div>
  <div id="gClutch"></div>
  <div class="muted" style="font-size:11px;text-align:right;margin-top:4px">球員圖：Kenney.nl（CC0）</div>
  <div class="row" style="margin-top:6px"><button class="ghost" id="gSpeed" style="flex:1">⏩ 快轉</button><button class="ghost" id="gSkip" style="flex:1">⏭ 直接看結果</button></div>
</div></div>

<script>
// ===================== 插圖 =====================
function bsr(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }
function bbArt(kind, color = '#f2c14e', seed = 5) {
  const R = bsr(seed * 17 + kind.length); let g = '';
  const crowd = (y0, rows) => { let s = ''; for (let r = 0; r < rows; r++) for (let i = 0; i < 46; i++) s += `<circle cx="${i * 9 + (r % 2) * 4}" cy="${y0 + r * 10}" r="3.2" fill="${pick([color, '#e8edf3', '#e5605a', '#5fa8ff', '#f2c14e', '#3a4350'])}" opacity="${0.35 + R() * 0.6}"/>`; return s; };
  const light = x => `<line x1="${x}" y1="10" x2="${x}" y2="60" stroke="#3a4350" stroke-width="3"/><rect x="${x - 16}" y="4" width="32" height="12" rx="2" fill="#fffbe0"/><polygon points="${x - 16},16 ${x + 16},16 ${x + 70},170 ${x - 70},170" fill="#fffbe0" opacity=".05"/>`;
  const pitcher = (x, y, s, c) => `<g transform="translate(${x},${y}) scale(${s})"><path d="M-6 0 L-10 -24 L10 -24 L6 0Z" fill="#e8edf3"/><path d="M-10 -24 L-8 -44 L8 -44 L10 -24Z" fill="${c}"/><path d="M8 -42 Q24 -60 18 -70" stroke="${c}" stroke-width="5" fill="none"/><circle cx="18" cy="-72" r="3" fill="#fff"/><path d="M-8 -40 Q-22 -30 -18 -20" stroke="${c}" stroke-width="5" fill="none"/><circle cx="0" cy="-50" r="7" fill="#e0ac7e"/><path d="M-8 -52 Q0 -62 8 -52 L12 -52 L12 -50 L-8 -50Z" fill="${c}"/></g>`;
  if (kind === 'stadium' || kind === 'bullpen') {
    g += `<rect width="400" height="170" fill="#0a0d14"/>` + crowd(20, kind === 'stadium' ? 5 : 2) + light(40) + light(360);
    g += `<rect x="0" y="${kind === 'stadium' ? 72 : 52}" width="400" height="8" fill="#1f5a36"/><rect x="0" y="${kind === 'stadium' ? 80 : 60}" width="400" height="90" fill="#2d7a48"/>`;
    for (let i = 0; i < 8; i++) g += `<rect x="${i * 50}" y="${kind === 'stadium' ? 80 : 60}" width="25" height="90" fill="#348a52" opacity=".5"/>`;
    g += `<ellipse cx="200" cy="140" rx="70" ry="16" fill="#a86b3c"/><ellipse cx="200" cy="138" rx="18" ry="4" fill="#c28050"/><rect x="194" y="135" width="12" height="3" fill="#fff"/>` + pitcher(200, 138, 1.1, color);
    if (kind === 'bullpen') g += `<rect x="290" y="90" width="80" height="60" fill="none" stroke="#9aa5b1" stroke-width="1.5"/>` + [...Array(8)].map((_, i) => `<line x1="${290 + i * 10}" y1="90" x2="${290 + i * 10}" y2="150" stroke="#9aa5b1" stroke-width=".6"/>`).join('') + `<rect x="30" y="120" width="40" height="22" fill="#5a3d24"/>` + [0,1,2,3].map(i => `<circle cx="${38 + i * 8}" cy="118" r="4" fill="#fff"/>`).join('');
  } else if (kind === 'school') {
    g += `<defs><linearGradient id="bs${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1f3a"/><stop offset="1" stop-color="#d07a4a"/></linearGradient></defs><rect width="400" height="170" fill="url(#bs${seed})"/>`;
    g += `<rect x="40" y="40" width="200" height="80" fill="#2a2f3a"/>`; for (let r = 0; r < 3; r++) for (let i = 0; i < 6; i++) g += `<rect x="${52 + i * 31}" y="${50 + r * 22}" width="18" height="13" fill="${R() < 0.4 ? '#ffd88a' : '#3c4454'}"/>`;
    g += `<rect x="0" y="120" width="400" height="50" fill="#8a5a36"/><path d="M260 170 L330 120 L400 170Z" fill="#2d7a48"/><rect x="250" y="60" width="140" height="62" fill="none" stroke="#7a8796" stroke-width="1.2"/>` + [...Array(14)].map((_, i) => `<line x1="${250 + i * 10}" y1="60" x2="${250 + i * 10}" y2="122" stroke="#7a8796" stroke-width=".5"/>`).join('') + pitcher(180, 160, 0.9, color);
  } else if (kind === 'draft') {
    g += `<rect width="400" height="170" fill="#07080c"/>`; for (let i = 0; i < 14; i++) g += `<rect x="${i * 30}" y="0" width="22" height="120" fill="#0d1a3a" opacity=".9"/>`;
    g += `<polygon points="185,0 215,0 290,170 110,170" fill="#ffe9b0" opacity=".18"/><rect x="0" y="120" width="400" height="50" fill="#141820"/><rect x="168" y="96" width="64" height="58" rx="4" fill="#242c3a"/><circle cx="200" cy="118" r="11" fill="#fff"/><path d="M193 110 Q197 118 193 126 M207 110 Q203 118 207 126" stroke="#e5605a" stroke-width="1.5" fill="none"/><text x="200" y="40" fill="#f2c14e" font-size="22" text-anchor="middle" font-weight="900">選秀會</text>`;
  } else if (kind === 'trophy') {
    g += `<rect width="400" height="170" fill="#120f08"/>`; for (let i = 0; i < 60; i++) g += `<rect x="${R() * 400}" y="${R() * 170}" width="5" height="9" fill="${pick(['#f2c14e','#5fa8ff','#e5605a','#6fcf8a','#fff'])}" opacity=".85"/>`;

// ===================== 訓練 =====================
function ageF() { const a = C.age; return a <= 18 ? 1.35 : a <= 22 ? 1.25 : a <= 25 ? 1.1 : a <= 28 ? 0.8 : a <= 31 ? 0.5 : 0.25; }
function dimF(v, pot) { let f = v < 50 ? 1.1 : v < 60 ? 0.9 : v < 70 ? 0.7 : v < 80 ? 0.5 : v < 88 ? 0.32 : 0.18; if (v >= pot) f *= 0.04; else if (v >= pot - 6) f *= 0.45; return f; }

  const me = ME(); let mult = ageF() * (0.85 + C.morale / 333);
  if (pitch && has('K15')) mult *= 1.25; if (k === 'sta' && has('SHUTOUT')) mult *= 1.25; if (k === 'velo' && has('SV30')) mult *= 1.25;
  const cur = pitch ? me.pi[pitch] : me.a[k], g = base * mult * dimF(cur, me.pot);

}
function train(k, pitch) {

  else if (k === 'rest') { C.fatigue = Math.max(0, C.fatigue - 45); C.morale = Math.min(100, C.morale + 3); t = '😴 好好休息了一週，士氣 +3。'; }
  else if (k === 'iq') { C.iq = Math.min(100, C.iq + 7); C.fatigue += 4; C.trust = Math.min(100, C.trust + 2); t = '📼 你把對手打者的錄影看了三遍。\n球商 +7（關鍵打席更準）'; }
  else if (k === 'bond') { const add = (has('CHAMP') ? 16 : 10); C.chem = Math.min(100, C.chem + add); C.fatigue += 6; const g = grow('ctrl', 1.5); t = `🧤 你和捕手在牛棚練了一整週的配球。\n捕手默契 +${add}，控球 +${g.toFixed(1)}`; }

    else { const g = grow(k, rnd(4, 6) * tired); if (k === 'velo') grow('sta', g * 0.15); if (k === 'sta') grow('velo', g * 0.1); t = `${TRAIN.find(x => x[0] === k)[1]} ${{ velo:'球速', ctrl:'控球', sta:'體力' }[k]} <span class="good">+${g.toFixed(1)}</span>`; }
    C.fatigue += rnd(8, 11);
    if (tired < 1) t += '\n<span class="muted">太疲勞，效果打折</span>';
    if (ovr() > before) t += `\n\n總評 <b class="gold">${before} → ${ovr()}</b>`;
    if (C.fatigue > 75 && Math.random() < (C.fatigue - 70) * 0.012 * (has('UNDRAFTED') ? 0.65 : 1)) { const w = ri(1, 3); C.injury = w; C.fatigue = 35; t += `\n\n<span class="bad">練太兇，手肘發炎，傷停 ${w} 週（疲勞超過 75）。</span>`; }

// ===================== 每週 =====================
function pairings() { const ts = [...C.teams].sort(() => Math.random() - 0.5), out = []; for (let i = 0; i + 1 < ts.length; i += 2) out.push([ts[i], ts[i + 1]]); return out; }
function playWeek(trainText) {
  let g = 0;
  const next = () => {

    g++;
    const pairs = pairings(), mine = pairs.find(p => p.some(t => t.n === C.team));
    for (const pr of pairs) if (pr !== mine) { const G = newGame(pr[0], pr[1], { watch:false }); simAll(G); finalize(G); }
    const [h, a] = mine[0].n === C.team ? mine : [mine[1], mine[0]];

    const intro = (trainText && g === 1 ? `<div class="card" style="font-size:15px;line-height:1.7;white-space:pre-wrap">${trainText}</div>` : '');
    const rival = C.phase === 'HS' && a.bats.some(id => P(id).name === C.rival);
    const roleTxt = C.injury ? '傷停中，在場邊看球' : myStart ? '<b class="gold">你是今天的先發投手</b>' : C.role === '先發' ? '今天不是你的先發日' : `你在牛棚待命（${C.role}）`;
    $('sceneIn').innerHTML = intro + `<h2>第 ${C.week} 週・第 ${g} 場</h2>` + vsBlock(h, a) + `<div class="muted" style="text-align:center;margin-bottom:12px">${roleTxt}${rival ? `<br><b class="bad">宿敵 ${C.rival} 在對方打線</b>` : ''}</div><div class="col" id="chs"></div>`;
    const go = watch => { $('scene').classList.add('hide'); playGame(h, a, { watch, myStart, onEnd: next }); };

function endWeek() {

}

async function watchLoop(G) {

  fd.txt = { K:'三振！', BB:'保送', '1B':'安打', '2B':'二壘安打！', '3B':'三壘安打！', HR:'全壘打！！', OUT:'出局' }[t]; fd.txtT = 0; fd.big = t === 'HR' || t === 'K';
  // 跑者移到新位置
  const now = G.bases.map((id, i) => id ? [id, i] : null).filter(Boolean);
  const keep = [];
  for (const [id, i] of now) { const r = fd.runners.find(x => x.id === id) || { id, x: HOME[0] - 12, y: HOME[1], fromHome: true }; r.tx = BASE[i][0]; r.ty = BASE[i][1]; keep.push(r); }
  for (const r of fd.runners) if (!keep.includes(r)) { r.tx = HOME[0]; r.ty = HOME[1]; r.gone = 40; keep.push(r); }
  fd.pend = keep;
}
function fieldStep(G) {
  const fd = G.fd, b = fd.ball;
  if (b) {
    b.t = Math.min(1, b.t + 1 / b.dur);
    if (b.t >= 1 && b.stage === 0) { b.stage = 1; b.t = 0; if (fd.pend) { fd.runners = fd.pend; fd.pend = null; } }
    if (b.stage === 1 && !b.to) b.t = 1;
  }
  if (fd.txt) fd.txtT++;
  for (const r of fd.runners) { r.x += (r.tx - r.x) * 0.08; r.y += (r.ty - r.y) * 0.08; if (r.gone) r.gone--; }
  fd.runners = fd.runners.filter(r => !('gone' in r) || r.gone > 0);
}
function sprite(c, col, idx, x, y, flip) {
  const r = SPR_ATLAS[col][idx % 10], s = 1.3, w = r[2] * s, h = r[3] * s;
  if (!sprC.complete || !sprC.naturalWidth) { c.fillStyle = '#fff'; c.fillRect(x - 6, y - 18, 12, 18); return; }
  c.save(); c.translate(x, y); if (flip) c.scale(-1, 1); c.drawImage(sprC, r[0], r[1], r[2], r[3], -w / 2, -h, w, h); c.restore();
}
function fieldDraw(G) {
  const cv = $('field'); if (!cv || !cv.getContext) return; const c = cv.getContext('2d'); if (!c) return;
  c.imageSmoothingEnabled = false;
  const fd = G.fd;
  // 外野草皮
  c.fillStyle = '#1d3b2a'; c.fillRect(0, 0, FW, FH);
  c.save(); c.beginPath(); c.moveTo(HOME[0], HOME[1]); c.lineTo(0, 92); c.quadraticCurveTo(300, -60, 600, 92); c.closePath(); c.clip();
  for (let i = 0; i < 14; i++) { c.fillStyle = i % 2 ? '#3f9d4f' : '#48ab58'; c.beginPath(); c.arc(HOME[0], HOME[1], 420 - i * 30, 0, Math.PI * 2); c.fill(); }
  c.restore();
  // 全壘打牆
  c.strokeStyle = '#f2c14e'; c.lineWidth = 4; c.beginPath(); c.moveTo(0, 92); c.quadraticCurveTo(300, -60, 600, 92); c.stroke();
  // 內野紅土
  c.fillStyle = '#c98a55'; c.beginPath(); c.moveTo(HOME[0], HOME[1] + 18); c.lineTo(BASE[0][0] + 26, BASE[0][1]); c.quadraticCurveTo(300, 130, BASE[2][0] - 26, BASE[2][1]); c.closePath(); c.fill();
  c.fillStyle = '#4fae5c'; c.beginPath(); c.moveTo(HOME[0], HOME[1] - 22); c.lineTo(BASE[0][0] - 24, BASE[0][1]); c.lineTo(BASE[1][0], BASE[1][1] + 24); c.lineTo(BASE[2][0] + 24, BASE[2][1]); c.closePath(); c.fill();
  // 界外線
  c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.moveTo(HOME[0], HOME[1]); c.lineTo(0, 92); c.moveTo(HOME[0], HOME[1]); c.lineTo(600, 92); c.stroke();
  // 投手丘、壘包
  c.fillStyle = '#c98a55'; c.beginPath(); c.ellipse(MOUND[0], MOUND[1], 18, 11, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#fff'; c.fillRect(MOUND[0] - 5, MOUND[1] - 1, 10, 3);
  c.fillStyle = '#c98a55'; c.beginPath(); c.ellipse(HOME[0], HOME[1] + 6, 28, 16, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.moveTo(HOME[0] - 6, HOME[1]); c.lineTo(HOME[0] + 6, HOME[1]); c.lineTo(HOME[0] + 6, HOME[1] + 4); c.lineTo(HOME[0], HOME[1] + 8); c.lineTo(HOME[0] - 6, HOME[1] + 4); c.fill();
  BASE.forEach((p, i) => { c.save(); c.translate(p[0], p[1]); c.rotate(Math.PI / 4); c.fillStyle = G.bases[i] ? '#ffd23f' : '#fff'; c.fillRect(-5, -5, 10, 10); c.restore(); });
  // 守備
  const D = defT(G), O = offT(G), dc = colOf(G, D), oc = colOf(G, O);
  const ds = G[D.n];
  FPOS.forEach((p, i) => { sprite(c, dc, i === 0 ? hashN(ds.pit) : i + 1, p[0], p[1], p[0] > 300); if (i === 0 && ds.pit === 'ME') { c.strokeStyle = '#ffd23f'; c.lineWidth = 2; c.beginPath(); c.ellipse(p[0], p[1], 14, 5, 0, 0, Math.PI * 2); c.stroke(); c.fillStyle = '#ffd23f'; c.font = 'bold 13px sans-serif'; c.textAlign = 'center'; c.fillText('你', p[0], p[1] - 46); } });
  // 打者、跑者
  if (fd.batter) sprite(c, oc, hashN(fd.batter), HOME[0] - 18, HOME[1] + 4, false);
  for (const r of fd.runners) sprite(c, oc, hashN(r.id), r.x, r.y + 4, r.tx < r.x);
  // 球
  const b = fd.ball;
  if (b) {
    let x, y, h = 0;
    if (b.stage === 0) { x = MOUND[0] + (HOME[0] - MOUND[0]) * b.t; y = MOUND[1] - 20 + (HOME[1] - 14 - MOUND[1] + 20) * b.t; }
    else if (b.to) { x = HOME[0] + (b.to[0] - HOME[0]) * b.t; y = HOME[1] - 14 + (b.to[1] - HOME[1] + 14) * b.t; h = Math.sin(b.t * Math.PI) * b.arc; }
    else { x = HOME[0]; y = HOME[1] + 12; }
    c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(x, y + 4, 4, 2, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fff'; c.strokeStyle = '#d33'; c.lineWidth = 1; c.beginPath(); c.arc(x, y - h, 4 + h / 60, 0, Math.PI * 2); c.fill(); c.stroke();
  }
  // 結果文字
  if (fd.txt && b && b.stage === 1 && fd.txtT < 200) {
    c.save(); c.globalAlpha = Math.min(1, (200 - fd.txtT) / 30); c.font = `900 ${fd.big ? 40 : 28}px sans-serif`; c.textAlign = 'center'; c.lineWidth = 6; c.strokeStyle = '#0b0e14'; c.strokeText(fd.txt, 300, 160); c.fillStyle = fd.big ? '#ffd23f' : '#fff'; c.fillText(fd.txt, 300, 160); c.restore();
  }
}
